# Ledger for baseline 2.2.0 -- what changes for a user upgrading from
# the previous minor. Same rule grammar as the other ledgers: `issue`,
# `name_regex` and `fields` are every one of them required. Neither
# narrowing key may stand on its own -- #451 banned a rule with
# `fields` and no regex, #456 banned the reverse -- so a rule here
# narrows by name AND by role, never by just one.
#
# Opened empty the day 2.2.0 shipped (AGENTS.md release step 8), and it
# is opened before it has anything to say because DEFAULT_BASELINE and
# the ledger are coupled: _allowlist_for treats a missing file as a
# hard error, on the reasoning that an absent ledger classifies nothing
# and would make every diff report as unexplained. So the baseline
# could not advance to 2.2.0 without this file.
#
# Do not copy rules across from expected_since_2.1.0.toml: that ledger
# classifies what 2.2 changed on top of 2.1, and a rule copied without
# checking either over-matches -- hiding a real 2.3 regression behind a
# 2.2-era label -- or never fires at all. Where a 2.3 change is visible
# from several baselines the rule may legitimately appear in more than
# one file, but each copy is checked against its own run rather than
# assumed.
#
# tests/v2/test_differential.py permits exactly one empty ledger, the
# one DEFAULT_BASELINE names -- which is this file. That latitude went
# unused: the first entry arrived with fix(#462), the 2.3 cycle's first
# change to move a corpus name at the default order.
#
# tests/v2/test_ledger_guards.py records this file in
# _SPAN_BEARING_RULES with an empty set and in _CORPUS_CLAIMS with the
# one rule below. The empty set still holds: fix(#462)'s regex is a
# letter shape, not a hand copy of _SCRIPT_RANGES. The first rule that
# does copy a script range has to be recorded in the former or the
# sweep fails.
#
# There is deliberately no `change = []` line. TOML forbids appending a
# [[change]] table to a statically defined array, so that line would
# block the first entry.

# #436/#437: the suffix view's entry boundary became the comma the
# writer typed. rules.md#R1: "a run of post-nominals written with
# spaces renders with spaces, and one written with commas keeps
# them" -- true of the comma paths since 1.4.0 and of the NO-COMMA
# path only since 2.3, which is the whole of what these names move.
# Every one goes from a comma-joined render to a space-joined one;
# none goes the other way, and none has a comma in the original
# between the two words. Roles do not move: this rule declares
# `suffix` alone, so a name whose ROLES move here arrives
# UNEXPLAINED, as it should.
#
# FIRST in the file, as in the other three ledgers, and here that is
# uniformity rather than force: measured 2026-09-06, moving this
# rule to the end of THIS file raises no undeclared contest and the
# run still exits 0, because no rule above it declares a strict
# superset of `fields = ["suffix"]` and reaches one of these names.
# It sits first anyway so the four ledgers read the same way, and so
# that a later rule widening into `suffix` finds the narrow one
# already ahead of it rather than making this file the one exception
# (#382, mechanisms.md#LEDGER-RULE-SEPARATION).
#
# An anchored alternation of the names rather than a shape, because
# the shape is "two post-nominals with a space between them" and
# that reaches every listing form in the corpora. The members are a
# list of NAMES and copy no wordlist, which is what
# _NOT_A_VOCABULARY_COPY in tests/v2/test_ledger_guards.py records;
# _CORPUS_CLAIMS pins the reach at 10 with its digest, and
# _MUST_NOT_MATCH pins the five comma and delimiter forms it must
# never claim.
[[change]]
issue = "fix(#436/#437) a space-separated post-nominal run renders with spaces, not commas"
name_regex = "^(?:JOHN DOE PHD MD|John Doe MD PhD|John Smith MD PhD|John Smith Mc V|Kenneth Clarke QC MP|Smith, John PhD I\\.|The Rt Hon Kenneth Clarke QC MP, HMG|Washington Jr\\. MD, Franklin|abdul Smith Jr Ma|abdul Smith Jr V)$"
fields = ["suffix"]

# The four CJK names of #436/#437's class, one rule each. Not one
# alternation: an alternation holding a script-classified member is
# claimed by the honorific pin in tests/v2/test_ledger_guards.py,
# which requires its members to BE the config's CJK honorific
# entries. These are names, so each stands alone, literal-anchored,
# reaching exactly one corpus name (_CORPUS_CLAIMS carries the 1)
# with _MUST_NOT_MATCH probes for the boundary each one has.
# rules.md#R1: "a run of post-nominals written with spaces renders
# with spaces, and one written with commas keeps them" -- the peel
# puts the honorific in `suffix` (rules.md#W2) and the run it lands
# in is spaced, so the render spaces it. At 1.4.0 and 2.0.0 these
# names already diff on `suffix` under the honorific rules and are
# claimed there; only at 2.1.0 and 2.2.0 is the render the whole of
# what moved.
[[change]]
issue = "fix(#436/#437) the glued honorific and the roman numeral are one post-nominal run"
name_regex = "^田中さん II$"
fields = ["suffix"]

[[change]]
issue = "fix(#436/#437) the glued honorific and the polite address are one post-nominal run"
name_regex = "^田中さん 様\\.$"
fields = ["suffix"]

[[change]]
issue = "fix(#436/#437) the spaced doctorate and the honorific after it are one post-nominal run"
name_regex = "^김민준 박사 씨$"
fields = ["suffix"]

[[change]]
issue = "fix(#436/#437) the glued honorific and the generational suffix are one post-nominal run"
name_regex = "^김민준씨 Jr\\.$"
fields = ["suffix"]

[[change]]
issue = "fix(#462) the facade keeps an initial-shaped conjunction letter"
# 'Scott E. Werner', 'Amy E Maid', 'Jose E. Maria Santos':
# HumanName.initials() dropped a dotted or bare-capital E/Y in the
# middle or family group because the 2.0 facade tested conjunction
# membership alone, where 1.4.0's is_conjunction also required "NOT
# is_an_initial". 'S. W.' -> 'S. E. W.', restoring 1.4.0; the core's
# initials() was already right. Fields identical -- the parse never
# read E as a conjunction, only the facade's render did -- so this is
# `_initials` alone (#484). The shape: a bare capital E or Y, or a
# dotted E./Y. of either case, standing as its own word. Lowercase
# bare e/y is the connective and does not move. The regex reaches 18
# corpus names, of which 14 diffed when the rule was written
# (2026-09-02); _CORPUS_CLAIMS in tests/v2/test_ledger_guards.py pins
# that reach as _Claim(18, ...) and fails if it moves, so the REACH
# digit is checked rather than remembered. The 14 is not: it is a
# dated snapshot of what diffed that day and nothing re-runs it.
# The names it reaches and does not move are
# what the gap IS, and the invariant behind it is a GROUP rather than
# a count:
# they carry the E/Y in the GIVEN group, which has always initialed
# every word it holds whatever the vocabulary says, so there was
# nothing for the fix to restore.
name_regex = "(?:^|[\\s,])(?:[EY]|[EeYy]\\.)(?=[\\s,]|$)"
fields = ["_initials"]
orders = ["DEFAULT"]
