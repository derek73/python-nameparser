# Ledger for baseline 2.2.0 -- what changes for a user upgrading from
# the previous minor. Same rule grammar as the other ledgers: `issue`,
# `name_regex` and `fields` are every one of them required. Neither
# narrowing key may stand on its own -- #451 banned a rule with
# `fields` and no regex, #456 banned the reverse -- so a rule here
# narrows by name AND by role, never by just one.
#
# Opened empty the day 2.2.0 shipped (AGENTS.md release step 8), and it
# is opened before it has anything to say because DEFAULT_BASELINE and
# the ledger are coupled: _allowlist_for treats a missing file as a
# hard error, on the reasoning that an absent ledger classifies nothing
# and would make every diff report as unexplained. So the baseline
# could not advance to 2.2.0 without this file.
#
# Do not copy rules across from expected_since_2.1.0.toml: that ledger
# classifies what 2.2 changed on top of 2.1, and a rule copied without
# checking either over-matches -- hiding a real 2.3 regression behind a
# 2.2-era label -- or never fires at all. Where a 2.3 change is visible
# from several baselines the rule may legitimately appear in more than
# one file, but each copy is checked against its own run rather than
# assumed.
#
# tests/v2/test_differential.py permits exactly one empty ledger, the
# one DEFAULT_BASELINE names -- which is this file. That latitude went
# unused: the first entry arrived with fix(#462), the 2.3 cycle's first
# change to move a corpus name at the default order.
#
# tests/v2/test_ledger_guards.py records this file in
# _SPAN_BEARING_RULES with an empty set and in _CORPUS_CLAIMS with the
# one rule below. The empty set still holds: fix(#462)'s regex is a
# letter shape, not a hand copy of _SCRIPT_RANGES. The first rule that
# does copy a script range has to be recorded in the former or the
# sweep fails.
#
# There is deliberately no `change = []` line. TOML forbids appending a
# [[change]] table to a statically defined array, so that line would
# block the first entry.

# #436/#437: the suffix view's entry boundary became the comma the
# writer typed. rules.md#R1: "a run of post-nominals written with
# spaces renders with spaces, and one written with commas keeps
# them" -- true of the comma paths since 1.4.0 and of the NO-COMMA
# path only since 2.3, which is the whole of what these names move.
# Every one goes from a comma-joined render to a space-joined one;
# none goes the other way, and none has a comma in the original
# between the two words. Roles do not move: this rule declares
# `suffix` alone, so a name whose ROLES move here arrives
# UNEXPLAINED, as it should.
#
# FIRST in the file, as in the other three ledgers, and here that is
# uniformity rather than force: measured 2026-09-06, moving this
# rule to the end of THIS file raises no undeclared contest and the
# run still exits 0, because no rule above it declares a strict
# superset of `fields = ["suffix"]` and reaches one of these names.
# It sits first anyway so the four ledgers read the same way, and so
# that a later rule widening into `suffix` finds the narrow one
# already ahead of it rather than making this file the one exception
# (#382, mechanisms.md#LEDGER-RULE-SEPARATION).
#
# An anchored alternation of the names rather than a shape, because
# the shape is "two post-nominals with a space between them" and
# that reaches every listing form in the corpora. The members are a
# list of NAMES and copy no wordlist, which is what
# _NOT_A_VOCABULARY_COPY in tests/v2/test_ledger_guards.py records;
# _CORPUS_CLAIMS pins the reach at 10 with its digest, and
# _MUST_NOT_MATCH pins the five comma and delimiter forms it must
# never claim.
[[change]]
issue = "fix(#436/#437) a space-separated post-nominal run renders with spaces, not commas"
# 2026-09-19, #533: one name joins the alternation and the rule
# does not change. 'Jane Doe nee Smith PhD MA' is a two-word
# credential run this baseline renders 'PhD, MA' and the tree
# renders 'PhD MA' -- the whole of its diff at this baseline, and
# the same diff at 2f57ff21, measured. #533 moves nothing on it:
# the unambiguous PhD already ended the walk, so the clause gave
# the MA up before this change as it does after it. What grew is
# the CORPUS, and the run rendering is what the diff is about.
# 2026-09-20, #397: three names join the alternation and the rule
# does not change. 'Josep Lluis Carod i III' ('i, III' -> 'i III'),
# 'Josep Lluis Carod i V' ('i, V' -> 'i V') and 'Rovira, Josep Carod
# i Jr.' ('i, Jr.' -> 'i Jr.') are two-word generation runs this
# baseline renders with a comma and the tree renders with a space --
# the whole of each one's diff here. #397 moves NOTHING on any of
# them: measured against the parent 46651750 all three parse
# byte-identically before and after this bundle, the link having a
# generation marker and not a name word to its right. What grew is
# the CORPUS -- the three arrived with #397's own case rows -- and
# the run rendering is what the diffs are about.
# 2026-09-20, #397 review: one more name joins the alternation and
# the rule does not change. 'Jane Doe nee Puig i III' is the same
# two-word generation run inside a MAIDEN clause's tail: this
# baseline renders 'i, III' and the tree renders 'i III', which is
# the whole of its diff here. The link fix moves nothing on it --
# measured against the parent 46651750, the parse is byte-identical
# before and after (given 'Jane', family 'Doe', suffix 'i III',
# maiden 'Puig'), the link having a generation and not a name word
# to its right. What grew is the CORPUS.
name_regex = "^(?:JOHN DOE PHD MD|Jane Doe nee Puig i III|Jane Doe nee Smith PhD MA|John Doe MD PhD|John Smith MD PhD|John Smith Mc V|Josep Lluis Carod i III|Josep Lluis Carod i V|Kenneth Clarke QC MP|Rovira, Josep Carod i Jr\\.|Smith, John PhD I\\.|The Rt Hon Kenneth Clarke QC MP, HMG|Washington Jr\\. MD, Franklin|abdul Smith Jr Ma|abdul Smith Jr V)$"
fields = ["suffix"]

# The six #449 rules go SECOND, not first: the rule above
# declares its own first-in-file position with a measurement,
# and `fields = ["suffix"]` and `fields = ["_ambiguities"]`
# are disjoint, so nothing orders the two against each other.
# They DO sit ahead of every rule below whose `fields` is a
# strict superset of `_ambiguities`, which is the narrow-first
# default (#382).
[[change]]
issue = "feat(#449) a lone name word reports given-or-family"
# rules.md#O5's convention, now reported. Twenty-two corpus names, and
# the alternation is a list of NAMES rather than a copy of any
# wordlist -- what selects them is the SHAPE (one name word, and no
# title, maiden name, comma, script order or vocabulary claim deciding
# it), so it is declared in _NOT_A_VOCABULARY_COPY. A suffix beside
# the word does NOT decide it: 'Smith Jr.' and "'Smitty' Jones Jr."
# are the peel taking the suffix and the convention placing what is
# left. `_ambiguities` alone: no role moves anywhere in this change.
# The five CJK-bearing names in the same population ride five rules of
# their own below, because a CJK member in an alternation is claimed
# by the honorific pin, which would demand this be a copy of
# GLUED_HONORIFICS. #322/#323 opened the one escape from that pin --
# a member set declared in _NOT_A_VOCABULARY_COPY -- and nothing here
# declares one, so the five rules stand.
name_regex = "(?i)^(?:'Smitty' Jones Jr\\.|Andrew|Carod i|Dean of Chemistry|Donald mc|Duke of Edinburgh|Duke of Wellington|Garcia|Jack M\\.A\\.|John & Jane|John V|John of the Doe|Juan & Garcia|Juan and Garcia|Mohamad X|Smith|Smith Jr\\.|e and e|part1 of The part2 of the part3 and part4|part1 of and The part2 of the part3 And part4|test|سلمان،)$"
fields = ["_ambiguities"]

[[change]]
issue = "feat(#449) a wholly-katakana name keeps the declared order, so the convention decides it"
# 'マイケル'. rules.md#W4 gives katakana no order of its own -- a
# wholly-katakana name is usually a transcription and keeps whatever
# the caller declared -- so the script rule DECLINES and O5's
# convention is what is left. Literal-anchored on one corpus name, so
# _CORPUS_CLAIMS cannot see a widening and _MUST_NOT_MATCH carries the
# wall.
name_regex = "^マイケル$"
fields = ["_ambiguities"]

[[change]]
issue = "feat(#449) an interpunct transcription declines the script order, so the convention decides it"
# '王·Smith'. rules.md#T3: the 間隔号 marks a transcription and
# suppresses the script_orders lookup whole, so name_order governs and
# the one remaining name word is O5's. Literal-anchored, one corpus
# name.
name_regex = "^王·Smith$"
fields = ["_ambiguities"]

[[change]]
issue = "feat(#449) an ideographic comma leaves one name word, and the convention decides it"
# '田中、太郎'. The comma is inside the token, so the text resolves to
# no single script and the order lookup declines; what is left is one
# name word and O5. A rules.md#W3 shape -- tolerated, read
# best-effort -- and the report says only what the parse actually
# called. Literal-anchored, one corpus name.
name_regex = "^田中、太郎$"
fields = ["_ambiguities"]

[[change]]
issue = "feat(#449) a glued Japanese honorific leaves a Latin name word the script cannot order"
# 'Andersonさん'. rules.md#W2 peels the glued honorific to SUFFIX and
# leaves 'Anderson' -- Latin, so effective_script answers None and no
# script order is resolved at all. One name word, and O5's convention
# places it. Literal-anchored, one corpus name.
#
# `_ambiguities` alone here, where the 2.0.0 ledger's twin also carries
# `given` and `suffix`: #308's peel is already in THIS baseline, so
# the report is the whole diff. The gate's OVER-DECLARED check is what
# forces the two spellings apart -- a rule may not declare a role no
# diff it explains moves.
name_regex = "^Andersonさん$"
fields = ["_ambiguities"]

[[change]]
issue = "feat(#449) a glued Korean honorific leaves a Latin name word the script cannot order"
# 'Anderson선생님'. The Japanese rule's argument, in Hangul: the
# honorific is peeled, the Latin stem resolves to no script, and the
# convention places the one name word left. Literal-anchored, one
# corpus name, and `_ambiguities` alone for the reason given above.
name_regex = "^Anderson선생님$"
fields = ["_ambiguities"]

# The two #491 rules sit beside #449's, same position rule: both
# declare `fields = ["_ambiguities"]`, so they are disjoint from the
# `suffix` rule that owns first place and ahead of every rule below
# whose fields are a strict superset of theirs (#382's narrow-first
# default).
[[change]]
issue = "feat(#491) an all-titles input reports title-or-name for the word the title peel left as the name"
# rules.md#H4. Six corpus names, one alternative each -- a list of
# NAMES, not a copy of TITLES: what selects them is the SHAPE (the
# title peel leaves exactly one name word, and that word is itself
# title vocabulary), and a member copying the wordlist would reach
# 'Dr. Smith', 'Rabbi Cohen' and every other title-plus-surname name,
# none of which moves. Declared in _NOT_A_VOCABULARY_COPY for that
# reason. `_ambiguities` alone: the reading each of these gets is
# unchanged, only the silence about it.
name_regex = "(?i)^(?:Dr\\. King|His Holiness|His Holiness the Dalai Lama|Lord Chancellor|The Right Hon\\. the President of the Queen's Bench Division|The Rt Hon)$"
fields = ["_ambiguities"]

[[change]]
issue = "feat(#491) an all-suffix input reports suffix-or-name for the word it made the name"
# rules.md#H4's suffix half, emitted at assign's bare-suffix
# carve-out. Two corpus names. A list of names, not a copy of
# SUFFIX_WORDS or SUFFIX_ACRONYMS: a member copying either would reach
# 'John Smith MD', 'Smith Jr.' and the rest of the corpus's credential
# names, none of which moves -- what selects these two is that nothing
# was left to be the name.
name_regex = "(?i)^(?:QC MP|Rinpoche)$"
fields = ["_ambiguities"]

[[change]]
issue = "feat(#491) a joined unit carrying title vocabulary reports title-or-name"
# H4's join clause -- the one name unit is a join (P3) and one of the
# words it joins is title vocabulary, so the doubt is whether that
# word is a title rather than which field the unit takes. These two
# arrive because the #518 review round moved the clause out from under
# O5's field-deciding guards: both peel a title in front ('Attorney',
# 'Deputy') and leave the join standing as the last piece, which a
# title cannot be, so H3 never chains it. A list of two names, not a
# copy of TITLES: a member copying the wordlist would reach 'Prince of
# Wales' -- a join LED by a title word, which H3 does chain -- and
# every title-plus-surname name besides. `_ambiguities` alone: the
# reading is unchanged, only the silence about it.
name_regex = "(?i)^(?:Attorney General of Minnesota|Deputy Secretary of State)$"
fields = ["_ambiguities"]

# The four CJK names of #436/#437's class, one rule each. Not one
# alternation: an UNDECLARED alternation holding a script-classified
# member is claimed by the honorific pin in
# tests/v2/test_ledger_guards.py, which requires its members to BE
# the config's CJK honorific entries -- and until #322/#323 opened
# the _NOT_A_VOCABULARY_COPY escape that was every such alternation.
# These are names, so each stands alone, literal-anchored,
# reaching exactly one corpus name (_CORPUS_CLAIMS carries the 1)
# with _MUST_NOT_MATCH probes for the boundary each one has.
# rules.md#R1: "a run of post-nominals written with spaces renders
# with spaces, and one written with commas keeps them" -- the peel
# puts the honorific in `suffix` (rules.md#W2) and the run it lands
# in is spaced, so the render spaces it. At 1.4.0 and 2.0.0 these
# names already diff on `suffix` under the honorific rules and are
# claimed there; only at 2.1.0 and 2.2.0 is the render the whole of
# what moved.
[[change]]
issue = "fix(#436/#437) the glued honorific and the roman numeral are one post-nominal run"
name_regex = "^田中さん II$"
fields = ["suffix"]

[[change]]
issue = "fix(#436/#437) the glued honorific and the polite address are one post-nominal run"
name_regex = "^田中さん 様\\.$"
fields = ["suffix"]

[[change]]
issue = "fix(#436/#437) the spaced doctorate and the honorific after it are one post-nominal run"
name_regex = "^김민준 박사 씨$"
fields = ["suffix"]

[[change]]
issue = "fix(#436/#437) the glued honorific and the generational suffix are one post-nominal run"
name_regex = "^김민준씨 Jr\\.$"
fields = ["suffix"]

# #346: swami, guru, baba and lama moved from the TITLES-only block
# into GIVEN_NAME_TITLES on 2026-09-06. rules.md#H1's Accepted clause
# -- "a given-name title plus one name word leaves the family empty"
# -- now reaches them, so the one name word behind the title is the
# GIVEN name and the family is empty, where every baseline read it as
# the family. Both roles move together and `fields` declares both: a
# name whose TITLE moved would arrive UNEXPLAINED, as it should.
#
# Four corpus names, all from the radar-tier corpus_issues.jsonl and
# all moving the same way. The two- and three-word spellings are the
# boundary and are _MUST_NOT_MATCH probes: 'Swami Vivekananda
# Saraswati' and 'Guru Gobind Singh' keep their family names, because
# H1's fold requires exactly one name word, and a rule reaching them
# would stand ready to explain the very regression that boundary
# exists to catch.
#
# An anchored alternation of the four NAMES rather than a shape,
# under the ledger discipline expected_since_1.4.0.toml's header
# states for all four files: keep each entry's `name_regex` as tight
# as the diff allows. Four names moved, so a four-name list is the
# tightest expression of that diff; anything shape-shaped is wider
# than what was measured. It copies no wordlist either, which is what
# _NOT_A_VOCABULARY_COPY in tests/v2/test_ledger_guards.py records;
# _CORPUS_CLAIMS pins the reach at 4 with its digest.
[[change]]
issue = "fix(#346) a renunciate title and one name word leave the name a given name"
name_regex = "^(?:Baba Ramdev|Guru Nanak|Lama Zopa|Swami Vivekananda)$"
fields = ["family", "given"]

# #519: prince and princess moved from the TITLES-only block into
# GIVEN_NAME_TITLES on 2026-09-10. rules.md#H1's fold now reaches
# them, so the one name word behind the title is the GIVEN name and
# the family is empty, where every baseline read it as the family.
# Both roles move together and `fields` declares both.
#
# Three corpus names: 'Prince Charles' and 'Prince Fielder' from the
# radar-tier corpus_issues.jsonl, and the contract-tier rules.md
# example 'Her Royal Highness Princess Anne' (corpus_rules.jsonl), all
# moving the same way. 'Prince Fielder' moves too and is wrong either
# way -- Prince is his given name, which is #348's collision and not
# this rule's subject. The boundary is pinned by _MUST_NOT_MATCH
# probes: two name words behind the title ('Prince Harry Windsor'),
# the chained run 'Prince of Wales Jr' (addresses by `wales`), the
# trailing 'Robert Prince', 'Lord Byron' (`lord` stays out) and the
# bare 'Prince'.
#
# An anchored alternation of the NAMES rather than a shape, under
# the ledger discipline expected_since_1.4.0.toml's header states:
# keep each entry's `name_regex` as tight as the diff allows. It
# copies no wordlist, which _NOT_A_VOCABULARY_COPY records;
# _CORPUS_CLAIMS pins the reach with its digest.
[[change]]
issue = "fix(#519) prince and princess join the given-name titles"
name_regex = "^(?:Her Royal Highness Princess Anne|Prince Charles|Prince Fielder)$"
fields = ["family", "given"]

[[change]]
issue = "fix(#342) rai and cha left the credential acronyms, so a trailing Rai or CHA is a name word"
# 'rai' and 'cha' left SUFFIX_ACRONYMS on 2026-09-07
# (nameparser/config/suffixes.py). Both arrived in the 2019-12-11
# bulk wikipedia post-nominal import (af5bdab), neither was reviewed
# against a surname collision, and decisions.md#suffix-acronym-collisions
# states the criterion that removed them rather than marking them
# ambiguous: marking is for a short credential in wide use that is
# also a name, removal for a longer one that is tenuous and collides.
#
# Five corpus names, all from the radar-tier corpus_issues.jsonl, in
# THREE diff shapes with one cause -- the word stopped being
# credential vocabulary, so the positional read takes it:
#   'Aishwarya Rai'      {family, suffix}          suffix -> family
#                                                  (2.x only -- parity at 1.4.0)
#   'Lala Lajpat Rai'    {middle, family, suffix}  the family shifts right
#   'John Smith RAI'     {middle, family, suffix}  same
#   'John Smith, RAI'    {given, family, suffix}   an ordinary family comma (C1)
#   'Ahmad Jayadi, CHA'  {given, family, suffix}   same
# The comma pair is why `fields` declares four roles rather than the
# two the pre-2.3 fix(#342) rule declared: with no credential after
# the comma, C1 reads the pre-comma run as the family and the
# post-comma word as the GIVEN name, so `given` moves where it did
# not before. The declaration is the exact union of the five, which
# is what the OVER-DECLARED check recomputes at the end of every run.
#
# 'Aishwarya Rai' is in this rule at 2.0.0/2.1.0/2.2.0 and NOT
# explained by it at 1.4.0, where the name now reaches PARITY: 1.4.0
# read family 'Rai' too, which is what the deleted
# `fix(#342) NOT WANTED` rule existed to classify. The regex is the
# same in all four files anyway -- reach is not explanation, and a
# per-ledger regex would say a name left the corpus.
#
# An anchored alternation of the five NAMES rather than a shape. The
# shape is "a trailing word that used to be an acronym entry", which
# would be a copy of SUFFIX_ACRONYMS and would stand ready to explain
# every future trailing-acronym regression. The members are a list of
# names and copy no wordlist, which is what _NOT_A_VOCABULARY_COPY in
# tests/v2/test_ledger_guards.py records; _CORPUS_CLAIMS pins the
# reach at 5 with its digest, and _MUST_NOT_MATCH carries the
# boundaries the paragraph above argues.
name_regex = "^(?:Ahmad Jayadi, CHA|Aishwarya Rai|John Smith RAI|John Smith, RAI|Lala Lajpat Rai)$"
fields = ["family", "given", "middle", "suffix"]

[[change]]
issue = "fix(#462) the facade keeps an initial-shaped conjunction letter"
# 'Scott E. Werner', 'Amy E Maid', 'Jose E. Maria Santos':
# HumanName.initials() dropped a dotted or bare-capital E/Y in the
# middle or family group because the 2.0 facade tested conjunction
# membership alone, where 1.4.0's is_conjunction also required "NOT
# is_an_initial". 'S. W.' -> 'S. E. W.', restoring 1.4.0; the core's
# initials() was already right. Fields identical -- the parse never
# read E as a conjunction, only the facade's render did -- so this is
# `_initials` alone (#484). The shape: a bare capital E or Y, or a
# dotted E./Y. of either case, standing as its own word. Lowercase
# bare e/y is the connective and does not move. The regex reaches 22
# corpus names -- 18 until #383/#479's case rows and rules.md#P3
# examples arrived on 2026-09-13 -- of which 14 diffed when the rule
# was written (2026-09-02); _CORPUS_CLAIMS in
# tests/v2/test_ledger_guards.py pins that reach as _Claim(22, ...)
# and fails if it moves, so the REACH digit is checked rather than
# remembered. The 14 is not: it is a
# dated snapshot of what diffed that day and nothing re-runs it.
# The names it reaches and does not move are
# what the gap IS, and the invariant behind it is a GROUP rather than
# a count:
# they carry the E/Y in the GIVEN group, which has always initialed
# every word it holds whatever the vocabulary says, so there was
# nothing for the fix to restore.
#
# 2026-09-13, #383/#479 then #528: 'JUAN Y GARCIA' diffed here for
# TWO reasons at once that morning -- the facade's, which is this
# rule's own, and the core's, which was new -- and #528 closed the
# facade's half the same day, the facade now reading the parse's tags
# and agreeing with this baseline's 'J. G.' again. The core's half
# remains and this rule still explains it, one `_initials` move.
# expected_since_2.0.0.toml's copy of this rule carries the account;
# it is the same at all three baselines.
#
# 2026-09-20, #461: THE SURFACE FLIPPED AND THE RULE DID NOT. At
# this baseline the wheel gives facade 'J. G.' and core 'J. Y. G.'
# for 'JUAN Y GARCIA' (measured 2026-09-20 from the 2.2.0 wheel).
# Before this change only the CORE moved, 'J. Y. G.' -> 'J. G.', a
# connective contributing no initial; after it only the FACADE moves,
# 'J. G.' -> 'J. Y. G.', and the core agrees with the baseline word
# for word -- the 'Y' holds its part alone, so it initials again on
# both surfaces and the tree gives 'J. Y. G.' from each. `_initials`
# is one pseudo-field, so this rule still explains the name; what
# changed is WHICH HALF of the disagreement it is explaining, which
# is why the paragraph above reads backwards without this one.
# rules.md#R3, decisions.md#R3.
#
# The name stops diffing at 1.4.0 and at 2.3.0 under the same move,
# and the rule written for it in each of those ledgers goes: the
# 2.3.0 `fix(#383/#479) a bare capital connective in an all-upper
# name stops initialing` is deleted outright, and 1.4.0's
# `fix(#528) ...` keeps its other three names and drops this one from
# its alternation.
name_regex = "(?:^|[\\s,])(?:[EY]|[EeYy]\\.)(?=[\\s,]|$)"
fields = ["_initials"]
orders = ["DEFAULT"]

# ---------------------------------------------------------------
# THE 2.3 TITLE-RUN BUNDLE: #489 (a title run addresses by its last
# title), #316 (a trailing period-marked title word reads as a
# title), the leading peel's name-word floor, and the `esq` acronym
# drop that shipped beside them. Five rules, four of them one per
# ARGUMENT rather
# than one per name, plus a fifth that is #316's argument again on
# the one name a script-classified alternation cannot hold. Over
# twenty-four corpus names.
#
# LAST in the file, and that is narrow-first rather than a
# preference: every rule already here that REACHES one of the
# twenty-four declares `fields` that are a strict subset of the bundle
# rule claiming that name, and a wide rule sitting AHEAD of a
# narrower one it shares a corpus name with is an order-decided
# contest the run refuses (#382). Measured 2026-09-08, all four
# ledgers: at 1.4.0 fix(#296)'s trailing `dr` reaches 'John Smith
# Dr.' and 'John Smith Prof. Dr.', the two comma routings reach
# 'Smith, John Prof.', and the two-token `jr` rule reaches 'Dr Jr'
# and 'Sir Jr'; at 2.0.0 and 2.1.0 only fix(#296) reaches any of
# them; at 2.2.0 none does. Not one of those rules ADMITS the diff
# it reaches -- every shape is outside its field list, measured --
# so nothing below takes a name off a rule that was explaining it,
# and no [[change.precedes_narrower]] block is needed anywhere.
#
# `_initials` appears in none of the four field lists although the
# initials of several of the twenty-four do move. The derived view
# enters a diff only where every ROLE and every ambiguity kind
# agrees (compare.py's _RULE_FIELDS, main()'s roles-identical
# guard), and all twenty-four move roles -- so no run can produce a
# shape here carrying it, and validate_rules refuses it beside
# another field in any case.
# ---------------------------------------------------------------

[[change]]
issue = "fix(#489) a title run addresses by its last title"
# 'Her Majesty Queen Elizabeth' and 'Dr. Sir John': the
# given_name_titles lookup was keyed on the WHOLE run, and 'her
# majesty queen' is in no vocabulary and never could be, so the one
# name word behind the run stayed the family. Both sites that ask --
# rules.md#H1's retag and rules.md#P5's licence -- now test the whole
# run's key OR the last word's, and 'queen' and 'sir' are
# GIVEN_NAME_TITLES entries. The name word behind the run becomes the
# GIVEN name and the family empties, which is H1's Accepted outcome.
# Both roles move together and `fields` declares both. `title` is
# deliberately OUT: the run itself is unchanged, only what it
# addresses as, so a name whose TITLE moved arrives UNEXPLAINED, as
# it should.
#
# 'Reverend Mother Teresa', 'Mr Sir John', 'Xyz. Sir John' and 'Sir
# Sheikh abdul rahman' move the same way and are NOT members: none of
# them is in any corpus file, so a member for one would be a rule
# reaching nothing.
#
# An anchored alternation of the two NAMES rather than a shape. What
# selects them is a SHAPE -- a multi-word title run whose LAST word
# is a given-name title -- and a member copying GIVEN_NAME_TITLES
# would reach 'Sir John Smith' and 'Dr. Smith', which do not move.
# The members are a list of names and copy no wordlist, which is what
# _NOT_A_VOCABULARY_COPY in tests/v2/test_ledger_guards.py records;
# _CORPUS_CLAIMS pins the reach at 2 with its digest, and
# _MUST_NOT_MATCH carries three boundaries: a ONE-word run ('Sir John
# Smith'), and two runs whose last word is title vocabulary that is
# not given-name vocabulary ('His Excellency Lord Duncan', 'Her Royal
# Highness Princess Anne' -- the open vocabulary question, #519). One
# set, identical in all four ledgers.
name_regex = "^(?:Dr\\. Sir John|Her Majesty Queen Elizabeth)$"
fields = ["family", "given"]

[[change]]
issue = "change(suffix-acronym-collisions) esq leaves the acronym set"
# 'John Smith E.S.Q.': 'esq' left SUFFIX_ACRONYMS, where the 2019 bulk
# post-nominal import put it (af5bdab, #93) -- esquire is a
# contraction, not an initialism -- so the multi-dot spelling stops
# being credential vocabulary and falls to the positional read: given
# 'John', middle 'Smith', family 'E.S.Q.', where every release since
# 1.4.0 read family 'Smith', suffix 'E.S.Q.'.
#
# A BEHAVIOR CHANGE rather than a fix, which is what the `change` tag
# says: this is a deliberate parity break at all four baselines, and
# the entry that argues it is decisions.md#suffix-acronym-collisions
# -- there is no issue number to cite, and the release-log bullet
# carries none either. It is not NOT WANTED: that spelling is for a
# reading nobody wants, and this reading is the one the decision
# chose.
#
# 2026-09-18 (#516): this rule stopped explaining anything, and the
# reason is not a revert. The by-shape credential class reads a word
# of two or more period-separated chunks that no vocabulary claims by
# POSITION (rules.md#S3), so 'John Smith E.S.Q.' is a credential again
# with no wordlist entry behind it at all -- the reading this baseline
# has, recovered by a different route than the acronym entry gave it.
# The vocabulary decision the `change` tag records still stands and is
# still the history of that entry; what is gone is its ROLE diff. The
# name still diffs here, on the `suffix-or-name` report the positional
# reading brings with it -- `_ambiguities` is a compared surface from
# 2.0 on -- and fix(#516) classifies that, which is why this rule is
# dormant rather than explaining anything: `dormant` means "explained
# no diff", not "the name stopped moving". Only the 1.4.0 copy can say
# the diff is gone outright, that baseline comparing no ambiguities.
# Declared
# `dormant` rather than deleted, so the harness says so out loud if a
# future change takes the positional reading away again.
#
# Literal, no alternation, and exactly as wide as the diff: 'esq'
# keeps its SUFFIX_WORDS membership, so the acronym entry's only
# unique coverage was this one spelling and this one corpus name.
# _MUST_NOT_MATCH carries the three spellings that did NOT move --
# 'John Smith Esq' (the word list still reads it), 'Esq. Smith'
# (rules.md#H2's leading inference) and 'Smith, Esq.' (the lone
# post-comma credential).
dormant = "'John Smith E.S.Q.' no longer moves any role this rule declares: #516's by-shape credential class reads the multi-dot spelling as a credential by position, with no wordlist entry, which is the reading this baseline already had. Its remaining diff here is the `suffix-or-name` report, which fix(#516) classifies. Kept because the vocabulary change it records is real history and the rule wakes if that reading is lost again"
name_regex = "^John Smith E\\.S\\.Q\\.$"
fields = ["family", "middle", "suffix"]

[[change]]
issue = "fix(#489) the title peel leaves a name word a suffix cannot be"
# 'Dr King Jr', 'Dr. King MD', 'Dr Jr' and 'Sir Jr': the leading title
# peel's only floor was "leave one piece", so it peeled 'Dr King'
# whole and left the post-nominal to be the name -- title 'Dr King',
# family 'Jr', no suffix at all. leading_titles now also refuses to
# leave a word that is nothing but suffix vocabulary standing as the
# name and gives the run's last word back (rules.md#H3,
# decisions.md#H3), so 'Dr King Jr' reads title 'Dr', family 'King',
# suffix 'Jr' -- what the comma spelling 'King, Dr Jr' always read.
#
# FOUR roles, and no single name moves all four. The two three-word
# names move `title`, `family` and `suffix`; 'Dr Jr' and 'Sir Jr'
# move `given` as well, or instead of `family`, the word given back
# standing alone with the credential peeled off it. At the 2.x
# baselines `_ambiguities` joins the list -- with the title given
# back there is no title left to make the reading H1's, so all four
# report title-or-name through rules.md#H4 -- and it is absent at
# 1.4.0, which has no ambiguity surface to compare (compare.py's
# _RULE_FIELDS).
#
# An anchored alternation of the four NAMES rather than a shape. What
# selects them is a SHAPE -- a title run with nothing but post-nominal
# pieces behind it, whose own last word is not one of those -- and a
# member copying TITLES or SUFFIX_WORDS would reach 'MD DDS', 'Jr.
# Ph. D.' and 'Marquess of Bath', every one of which the floor
# declines and every one of which is a _MUST_NOT_MATCH probe, with
# 'Dr Smith Jr' beside them for the ordinary titled name the floor
# never sees. The members are a list of names and copy no wordlist,
# which is what _NOT_A_VOCABULARY_COPY records. THREE of the four are
# corpus names, not four: 'Sir Jr' left corpus_rules.jsonl on
# 2026-09-09, when the rules.md example pinning it was dropped as a
# duplicate of 'Dr Jr' (decisions.md#H5), and it stays in the
# alternation because a name_regex names INPUTS rather than corpus
# rows. _CORPUS_CLAIMS pins the reach at 3 with its digest. One set,
# identical in all four ledgers; only the `fields` differ, as the
# paragraph above says.
name_regex = "^(?:Dr Jr|Dr King Jr|Dr\\. King MD|Sir Jr)$"
fields = ["_ambiguities", "family", "given", "suffix", "title"]

[[change]]
issue = "fix(#316) a trailing period-marked title word reads as a title"
# 'John Smith Prof.' and thirteen more: a trailing run of period-marked
# LISTED title words is peeled as a title, so the surname behind it
# stops being lost -- title 'Prof.', given 'John', family 'Smith',
# where every baseline read middle 'Smith', family 'Prof.'. A RUN,
# mirroring the leading peel: 'John Smith Prof. Dr.' gives title
# 'Prof. Dr.' and 'Dr. John Smith Prof.' gives 'Dr. Prof.' in input
# order. The family-comma segment takes the same walk, so 'Smith,
# John Prof.' agrees with the bare spelling at last. And the trailing
# title is TRANSPARENT to the post-nominal peel that follows it:
# 'John Smith Jr. Prof.' keeps suffix 'Jr.' rather than promoting the
# generational suffix to the family name, and 'John Prof. MA' reads
# family 'MA' by rules.md#S2's reserve.
#
# 2026-09-18 (#289): the last clause is retracted. S2's reserve is no
# longer what decides 'John Prof. MA': written capitals in a
# mixed-case name lean credential with nothing to spare, so the name
# reads title 'Prof.', family 'John', suffix 'MA' -- the transparency
# this rule is about is unchanged and now shows a DIFFERENT reading
# through it, which is the point of transparency. This rule keeps the
# name at every baseline where it already had it; the fix(#289) rule
# at the bottom of each file carries the names whose reading moved and
# that nothing else claims.
#
# Five roles, the union of what the sixteen move; no name moves all
# five (four is the most, 'John Smith Jr. Prof.'), and two move only
# two at every baseline -- 'Smith, John Prof.' {title, middle} and
# 'Smith Sir.' {title, family} -- with 'Mary Jane King.' moving three.
# A third joins them at 1.4.0, 2.0.0 and 2.1.0, 'John Smith Dr.'
# {title, suffix}, which moves {title, middle, family} at 2.2.0
# instead: 'dr' was suffix vocabulary until 2.2, so the role it
# vacates differs by baseline (measured 2026-09-09 against all four
# wheels). `_ambiguities` is not among the five, and it is not
# because no name reports one: 'John Prof. MA' reports
# `suffix-or-name`, which is S2's bare-acronym reserve and not this
# rule. None of the sixteen reports `title-or-name` -- the walk
# leaves a title standing, so H4's title half never fires -- and the
# derived view cannot enter a diff here in any case, every one of the
# sixteen moving roles (compare.py's _RULE_FIELDS).
#
# TWO of the sixteen end in ' Dr.' and are also reached by
# fix(#296)'s trailing-`dr` rule above -- 'John Smith Dr.', which
# that rule used to explain, and 'John Smith Prof. Dr.'. That rule
# declares {middle, family, suffix} and neither diff fits it now, so
# both fall through to here; its comment records the handover, and
# narrow-first placement is what keeps the pair out of contest. The
# BARE trailing spelling stays with fix(#296): 'Smith Dr' and the 'dr
# ... dr' names wear no abbreviation period and the walk never sees
# them (#316(b), left open).
#
# The last two members arrived with the 2026-09-09 review of the
# docs commit, which added two rules.md examples: 'Mary Jane King.',
# the H5 Accepted clause's collision example (title 'King.', given
# 'Mary', family 'Jane', where every baseline read family 'King.'
# behind middle 'Jane'), and 'Smith Sir.', which is an H1 example.
# 'Smith Sir.' is HERE and not on the fix(#489) run rule above
# because the DIFF decides: it moves {title, family}, the walk
# taking 'Sir.' out of the name, while its given/family reading is
# what every baseline already gave ('Smith' stays the given name on
# both sides). The #489 rule declares {family, given} and does not
# reach a title role at all, so it could not claim the diff even
# placed ahead of this one.
#
# An anchored alternation of the sixteen NAMES rather than a shape.
# What selects them is a SHAPE -- period-marked, listed, trailing --
# and a member copying TITLES would reach the BARE 'Mary Jane King'
# and 'John Smith Sir', which do not move; the period-marked
# 'Mary Jane King.' is a member precisely because it does, which is
# the line the period draws and the whole of what it draws. A member
# spelled as the shape (a trailing dotted word) would reach 'John
# Smith Xyz.', which is the boundary the leading slot's H2 inference
# is deliberately NOT given here. Those three and 'Smith, Prof.' --
# the comma shape whose segment holds no name word and which reads
# by a different gate -- are the _MUST_NOT_MATCH probes. The members
# are a list of names and copy no wordlist, which is what
# _NOT_A_VOCABULARY_COPY records; _CORPUS_CLAIMS pins the reach at
# 14 with its digest.
#
# 'Andrew Perkins (Mgr.)' is spelled with \\x28 and \\x29 rather than
# the \\( and \\) the paren-bearing rules above use. Escaped or not, a
# literal parenthesis inside an alternation body hides the WHOLE
# group from test_ledger_guards._alternations -- its member pattern
# excludes '(' and ')' -- and a sixteen-member alternation should not
# be invisible to the discovery pass that demands every alternation
# declare what it copies. The two spellings match the same string.
# One set, identical in all four ledgers.
#
# 2026-09-18 (#289/#516): a SEVENTEENTH member, 'JOHN PROF. MA'. It
# arrived in the rules corpus as rules.md#H5's one-case witness that
# the suffix reading is taken over what STANDS once the title chain
# has run, not over what stood -- the reading the mixed-case spelling
# stopped demonstrating when the caps lean started deciding it. The
# name is wholly one case, so no lean fires and nothing about it is
# this arc's: what moves is exactly this rule's trailing-title chain
# ({title, family, suffix}, inside the five roles already declared),
# and it stops diffing at 2.3.0 for the same reason its sixteen
# siblings do.
name_regex = "^(?:Andrew Perkins \\x28Mgr\\.\\x29|Dr\\. John Smith Prof\\.|Dr\\. Smith Sir\\.|JOHN PROF\\. MA|John Prof\\. MA|John Smith Dr\\.|John Smith Jr\\. Prof\\.|John Smith Mr\\.|John Smith Prof\\.|John Smith Prof\\. Dr\\.|John Smith Prof\\. Jr\\.|John Smith Rev\\.|Mary Jane King\\.|Sir John Prof\\.|Smith Prof\\.|Smith Sir\\.|Smith, John Prof\\.)$"
fields = ["family", "given", "middle", "suffix", "title"]

[[change]]
issue = "fix(#316) a trailing Latin title on a native-script name is a title"
# '毛 泽东 Dr.': the rule above's walk, on the one corpus name it
# reaches that is not Latin-only. The walk runs BEFORE the positional
# read, so the pieces the script test sees are all Han and the
# family-first order stands -- this is '毛 泽东' plus a title, and
# it reads title 'Dr.', given '泽东', family '毛'. A Latin title at
# the back of a wholly-Han name is the one piece that would make the
# piece set look mixed-script, which is what the ordering of the two
# buys.
#
# ITS OWN rule rather than a seventeenth alternative above, and not by
# preference: an UNDECLARED alternation holding a script-classified
# member is claimed by the honorific pin in
# tests/v2/test_ledger_guards.py, which requires such an
# alternation's members to BE the config's CJK honorific entries --
# and until #322/#323 taught that pin to ask whether the members FOLD
# into that vocabulary, that was every such alternation. So this
# stands alone, literal-anchored,
# reaching exactly one corpus name (_CORPUS_CLAIMS carries the 1)
# with _MUST_NOT_MATCH probes for the boundary -- the same shape the
# four #436/#437 CJK rules above take, and for the same reason.
#
# Classified 2026-09-09, in the review round that fixed which title
# run H1 addresses by; the reading itself is untouched by that fix.
# The name is RADAR tier (corpus_cjk_tolerated.jsonl, tolerated since
# the 2026-09-01 CJK demotion) and it had been printing UNCLASSIFIED
# at all four gates since the trailing walk landed. Radar never
# blocks, so nothing failed -- and this bundle's convention is that
# every gate line reads `radar unclassified: 0`, which is the whole
# reason the row is here rather than left to print.
#
# FOUR roles here, and NOT the same four at every baseline, which is
# why this is the one bundle rule whose `fields` differ per ledger.
# 2.2.0 took `dr` out of the post-nominal vocabulary, so 'Dr.' became
# a name word: first '毛', middle '泽东', last 'Dr.', the mixed-script
# piece set declining the Han order it had had since 2.1.0. `title`,
# `given`, `middle` and `family` move; `suffix` is empty on both sides.
#
# Literal and anchored, so the reach cannot widen into the other
# forty-six tolerated CJK names (twenty-nine until this bundle's
# seventeen rows joined the file). _MUST_NOT_MATCH carries three of
# them as probes: '王先生, V.' (a Latin post-nominal behind a
# comma, which the trailing walk never sees), '田中さん, Dr.' (the
# comma spelling of this very shape, routed by the segment gate) and
# '田中さん II' (a spaced Latin post-nominal that is not title
# vocabulary).
name_regex = "^毛 泽东 Dr\\.$"
fields = ["family", "given", "middle", "title"]

# #322/#323, LAST in the file. The parser knew ONE full stop --
# the ASCII period -- and knew it at ONE site, the lexicon's edge
# strip. It now reads four: the ASCII period, the fullwidth '．',
# the ideographic '。' and its halfwidth '｡'. A full stop glued
# AFTER a script-written word is punctuation and not part of the
# word -- invisible to the script reading and to the vocabulary,
# and left in the text on the word it arrived with -- because no
# East Asian script writes an initial or an abbreviation with a
# period. A leading stop folds away for the vocabulary lookup,
# which reads both edges; the classification fold that feeds the
# surname site reads the TRAILING edge only, so a word wearing a
# leading stop is given no script and never becomes a surname
# site: '.김민준' stays one whole word, given. The honorific peel
# is not gated by that fold -- the tail alone licenses it -- so a
# leading stop does not stop it: '.김민준씨' peels to '.김민준'
# and '씨' (rules.md's W Background, decisions.md#cjk-full-stops).
#
# SEVENTEEN members, the same set and the same regex as
# expected_since_2.1.0.toml: nothing between 2.1.0 and 2.2.0 touched
# any of these readings, so the two ledgers report the same diffs --
# twelve CJK, the katakana 'マイケル.' (a #323 mover added 2026-09-10
# in the whole-branch review), the three stop-bearing FAMILY_COMMA
# rows and the bracketed '(김민준.) John Smith', all four from the
# review round after it. The 1.4.0 and 2.0.0 ledgers carry eleven,
# those baselines predating the hangul segmentation that puts
# '김. 민준', '양 지훈.' and '양. 지훈' in this bundle's hands rather
# than the native-script rule's, and answering the three comma rows
# with no diff (2.0.0) or with their own broad comma rules
# (1.4.0).
#
# No earlier rule in this file reaches any of the seventeen, so LAST
# is uniformity with the other three ledgers rather than a
# narrow-first ordering (#382) against anything: order_contests
# reports no pair here in either arrangement.
#
# An anchored alternation of the NAMES rather than a shape, and the
# two criteria a shape could be written on both reach names this
# rule must not claim. "An edge full stop on a word carrying a
# classified character" reaches 22 corpus names, measured
# 2026-09-10: the bundle's seventeen movers and FIVE that do not
# move ('田中さん 様.', '田中さん, 様.', '김민준 씨.', '김민준 양.',
# '김민준, 씨.'). Measured with the TOKENIZER and not a whitespace
# split -- two of the movers wear their stop before a comma
# ('김민준씨.,', '田中さん.,'), which a whitespace split does not
# see -- plus the bracketed '(김민준.) John Smith' by hand, its stop
# sitting inside the clause until rules.md#S1 unwraps it; an 18
# recorded earlier the same day came from the split, over a corpus
# four names smaller. A character class of the four stops would be a hand
# copy of nameparser._lexicon.FULL_STOPS besides, and would reach
# the looser population of "an ASCII period anywhere in a CJK-
# bearing name" -- 20 distinct names on 21 corpus rows before this
# bundle ('Dr 김민준씨, Jr.' being the name on two of them), wider
# because it sweeps in periods sitting on LATIN tokens inside a CJK
# name ('毛 泽东 Dr.', '田中さん, V.'). None of the five or the
# twenty is moved BY THIS BUNDLE, so a shape spelling would
# reach names whose diffs belong to other rules (most of them
# do diff against the older baselines -- 19 of the twenty at
# 1.4.0) or to no rule at all; decisions.md#cjk-full-stops
# carries both counts and the recompute. The members copy no wordlist,
# which the honorific pin in tests/v2/test_ledger_guards.py DERIVES
# rather than taking on trust -- no member of this alternation folds
# into the CJK honorific vocabulary, bare or wearing a full stop;
# _CORPUS_CLAIMS pins the reach at 17 with its digest, and
# _MUST_NOT_MATCH pins the four readings the bundle left alone.
#
# Script-classified members inside an ALTERNATION are new here --
# every other CJK rule in the four ledgers is a lone literal, and
# the only classified alternations are the honorific rules' hand
# copies of GLUED_HONORIFICS and SUFFIX_WORDS, which the honorific
# pin owns. That pin passes over this one on a MEASUREMENT rather
# than a declaration: no member of it folds into the honorific
# vocabulary, bare or wearing a full stop.
# The _SPAN_BEARING_RULES note in this file's header still holds
# either way: the members are literal names, not a hand copy of
# _SCRIPT_RANGES, so the empty set stands.
[[change]]
issue = "fix(#322/#323) a full stop on a CJK token is read as punctuation and stays on its token"
name_regex = "^(?:\\x28김민준\\.\\x29 John Smith|マイケル\\.|田中\\.|田中\\. 太郎|田中さん\\.|田中さん\\., V\\.|김\\. 민준|김민준 씨。|김민준 씨．|김민준 씨｡|김민준\\.|김민준\\. 지훈|김민준씨\\.|김민준씨\\., J\\.씨|양 지훈\\.|양\\. 지훈|이, J\\.씨\\.)$"
fields = ["_ambiguities", "family", "given", "middle", "suffix", "title"]

# ---------------------------------------------------------------
# #383/#479: A SINGLE-LETTER CONNECTIVE JOINS ONLY ON CASE EVIDENCE.
# Two rules where 1.4.0 needs one, and the split is the pseudo-field
# rule (#484) rather than two behaviors: from 2.0 on the v2 surface
# is compared, so the new CONJUNCTION_OR_INITIAL report enters the
# diff -- on one of the two names whose roles move ('JUAN GARCIA Y
# LOPEZ' reports nothing, nothing about 'y' having been in doubt)
# and on six more whose roles do not -- and a role move and a
# report can co-occur while a role move and `_initials` cannot.
#
# The derived view is deliberately absent from both rules. The core's
# initials() DOES move for 'john e smith', 'john e jones' and
# 'jones, john e' ('j. j.' -> 'j. e. j.'), but `_initials` enters a
# diff only where every role AND every ambiguity kind agrees (#484,
# compare.py main()), and the report moved on each of them -- so at
# this baseline those names classify on the report alone. 'JUAN Y
# GARCIA' is the one name of the population whose view moves with no
# report beside it, and at this baseline it is already claimed:
# fix(#462) reaches it and admits `_initials`. That rule's comment
# records what moved and when: the FACADE's view moved there too on
# the morning #383/#479 landed, the 2.3 facade fix not having shipped
# at 2.2.0, and #528 closed the facade's half the same day
# (2026-09-13), leaving the core's as the whole diff. A competing
# rule here would be an equal-`fields` contest decided by file order,
# which is what _CROSS_RULE_WINNERS exists to stop rather than to
# create. It is classified on its own at 2.3.0, where BOTH surfaces
# now move, and the same way.
#
# LAST in the file: every diff these two claim reported UNEXPLAINED
# on the run that preceded them (measured 2026-09-13), so no rule
# above already claims one.
# ---------------------------------------------------------------

[[change]]
issue = "fix(#383/#479) a single-letter connective joins only on case evidence"
# The 2.x view of the 1.4.0 rule of the same name: 'jose e maria
# santos' reads given 'jose', middle 'e maria' where 2.2.0 joined,
# and 'JUAN GARCIA Y LOPEZ' reads family 'GARCIA Y LOPEZ' where
# 2.2.0's bare-Latin-capital veto gave middle 'GARCIA Y'. A name
# written wholly in one case carries no case evidence about any
# letter in it, so the vocabulary decides: 'e' is marked as reading
# both ways and reads as an initial, 'y' is not and joins. Both are
# rules.md#P3 examples; see the 2026-09-13 entry of decisions.md#P3.
#
# `_ambiguities` is in the fields here and cannot be at 1.4.0 -- the
# report is a v2 surface -- and only ONE of the two names carries it:
# 'jose e maria santos' reports conjunction-or-initial, 'JUAN GARCIA
# Y LOPEZ' reports nothing, because nothing about 'y' was ever in
# doubt. The declaration is the union of the two diffs and #452's
# over-declaration check recomputes it every run.
#
# Literal-anchored to the two names, as at 1.4.0: the class is every
# one-case name carrying a cased single-letter connective, seventeen
# corpus names, and fifteen of them do not move a role.
# _MUST_NOT_MATCH carries the mixed-case probes.
name_regex = "^(?:jose e maria santos|JUAN GARCIA Y LOPEZ)$"
fields = ["given", "middle", "family", "_ambiguities"]
orders = ["DEFAULT"]

[[change]]
issue = "fix(#383/#479) a marked connective letter in a one-case name is reported"
# 'JOSE E MARIA SANTOS', 'JOHN E SMITH', 'john e smith', 'john e
# jones', 'jones, john e', 'e j smith': every role is identical --
# the letter was already read as an initial, or rules.md#P3's
# three-word carve-out keeps it a name word either way -- and what is
# new is that the CALL is reported as conjunction-or-initial, because
# a one-case name gives the reader nothing to decide it by.
#
# The initials of 'john e smith' ('j. s.' -> 'j. e. s.'), 'john e
# jones' and 'jones, john e' (both 'j. j.' -> 'j. e. j.') move as
# well, and the view is deliberately not in the fields: see the
# section comment above for why no run can produce it here.
#
# 'e and e' is NOT in the alternation although it is in the same
# population and its report moves too (it LOSES given-or-family and
# gains conjunction-or-initial, both inside `_ambiguities`). At this
# baseline `feat(#449) a lone name word reports given-or-family`
# names it literally and admits the diff, so adding it here would
# create an equal-`fields` contest that only file order decides --
# the class `precedes_narrower` cannot express and _CROSS_RULE_WINNERS
# has to pin. The name is radar tier, so nothing is hidden by leaving
# it where it is; 2.3.0's copy of this rule does claim it, that
# ledger carrying no #449 rule.
name_regex = "^(?:JOSE E MARIA SANTOS|JOHN E SMITH|john e smith|john e jones|jones, john e|e j smith)$"
fields = ["_ambiguities"]
orders = ["DEFAULT"]

[[change]]
issue = "fix(#289) a written case contrast decides a bare ambiguous acronym"
# A member of suffix_acronyms_ambiguous written in CAPITALS inside a
# mixed-case name is written the way a credential is written, and is
# taken as one with nothing to spare ('Jack MA' -> given 'Jack',
# suffix 'MA'); one written in any other cased form is written the way
# a surname is written and stays one even with words to spare ('John
# Smith Ma' -> middle 'Smith', family 'Ma'). The same lean reaches the
# post-comma given slot ('Smith, MA' -> family 'Smith', suffix 'MA';
# 'Smith, Ma' keeps its given), and the comma form's words-to-spare
# test becomes a count of NAME words, which is case-blind -- so
# 'John Smith, MA', 'John Smith, Ed', 'JOHN SMITH, MA' and
# 'john smith, ma' all read the credential where the token count read
# a given name. See rules.md#S2, rules.md#C1 and rules.md#P2.
#
# A name written wholly in one case carries no contrast and does not
# move on the LEAN at all -- 'JOHN SMITH MA', 'ANH DO', 'anh van do'
# and 'Jack Ma' are _MUST_NOT_MATCH probes in
# tests/v2/test_ledger_guards.py. The one-case comma forms in the list
# above are here on the NAME-word count instead, which asks nothing
# about case; that is why they sit beside the lean's own names rather
# than in a rule of their own.
#
# Accepted costs, both recorded rather than repaired: the walk stops
# at a declined pick instead of continuing past it, so a genuine
# suffix standing in front of a name-leaning acronym is never reached
# ('abdul Smith Jr Ma' reads middle 'Jr'), and the lean ends P2's
# particle chain with no words to spare where the count would not
# ('Freiherr von Berg MA', whose own rule further up this file carries
# the reading at 1.4.0).
#
# The Title-case half is witnessed at the comma by two minimal pairs
# rather than argued: 'John Smith, MA'/'John Smith, Ma' both read the
# credential, because two NAME words before the comma decide before
# the case is looked at, and 'Smith Jr., MA'/'Smith Jr., Ma' split,
# because one name word leaves the case to decide and Title-case
# declines. 'Smith Jr., Ma' diffs here for a reading this change did
# NOT move -- the pre-comma restructure v2 has done since 2.0, at
# 1.4.0, and the fork's new report at the 2.x baselines -- while
# 'John Smith, Ma' moves on the COUNT, as its all-caps twin does, and
# has no 1.4.0 diff at all, v1 having read the credential there too.
# Both sit on this rule because the rule is what states which way
# each member of a pair goes.
#
# 2026-09-19, #531: three names join, all of them lone post-comma
# credentials this rule's own second sentence already describes.
# 'Doe, MA' and 'Doe, MA PhD' are 'Smith, MA's family-word twins and
# 'Doe, Dr. MA' is the same slot behind a title; each reads family
# 'Doe' with the credential run in `suffix` -- 'MA', and 'MA PhD'
# on the one that has a run -- where the baseline read given 'MA'.
# They
# entered the corpora with #531's control rows and are NOT #531's
# doing -- verified byte-identical at cc78c960, the #530 merge
# (2026-09-19). No role joined the field list: the three move
# {given, suffix} and, on two of them, `_ambiguities`.
#
# 2026-09-19, #531 review round: 'Doe, Mr. MA PhD' joins them. It is
# 'Doe, Dr. MA' with a credential run behind the member -- the gate
# reads the segment whole, so the member joins the run rather than
# taking the given slot -- and it moves {given, suffix}, both already
# in the field list. It entered the corpora with that round's control
# rows and is NOT its doing: byte-identical at cc78c960 (measured
# 2026-09-19).
#
# Literal-anchored to the measured movers, and ONE SET FOR THE FOUR
# 2.x LEDGERS so the rule says the same thing at each of them. The
# 1.4.0 copy differs by FOUR members now. It holds 'John Prof. MA'
# out: 1.4.0 read a trailing period-marked title as a title itself,
# so that name's diff there belongs to fix(#316)'s rule and not to
# this one. "One set for all five" was written before that carve-out
# existed and was false in these four copies from the day it did
# (2026-09-18). And it holds the three names above out for a
# different reason: at 1.4.0 their diff is already claimed by
# `fix(comma-family) lone post-comma piece routes to suffix/title,
# not first`, which stands far earlier in that file, so adding them
# there would reach a name without explaining it and would put two
# rules on one diff with nothing to arbitrate between them
# (2026-09-19). The set is literal because the class is
# wide (every mixed-case name whose trailing piece is a listed
# ambiguous acronym, plus every comma form with two name words before
# the comma) and a regex for the class would claim the one-case
# spellings that do not move. A name here that does not diff at a
# given baseline is simply one the reading already agreed with there.
# `fields` is per-baseline, the union the run at THAT baseline
# measures (#452).
name_regex = "^(?:Davis Royce, Ed|Doe, Dr\\. MA|Doe, MA|Doe, MA PhD|Doe, Mr\\. MA PhD|Freiherr von Berg MA|JOHN SMITH, MA|Jack MA|Jack MA\\.|Jack Wei Ma|John Prof\\. MA|John Smith Ma|John Smith, Ed|John Smith, MA|John Smith, Ma|John de Ma|John van der Berg Ma|Smith Jr\\., MA|Smith Jr\\., Ma|Smith, MA|abdul Smith Berg Ma|abdul Smith Jr Ma|abdul Smith Ma|john smith, ma)$"
fields = ["family", "given", "middle", "suffix", "_ambiguities"]
orders = ["DEFAULT"]

[[change]]
issue = "fix(#516) an unlisted dotted acronym is read by position"
# A token of two or more period-separated chunks that no vocabulary
# claims joins the ambiguous credential class by SHAPE and is read by
# POSITION, exactly as a bare listed acronym is: a credential where
# the name has words to spare, a name word where it does not, either
# reading reported (rules.md#S3). Case says nothing here -- the
# periods are the evidence -- which is why 'john smith x.y.z.' moves
# with 'John Smith X.Y.Z.'. The same admission reaches the comma form,
# where the NAME-word count decides ('John Smith, A.B.' -> suffix
# 'A.B.'; 'Smith, A.B.' keeps its given and only reports).
#
# Two names here restore a reading a PRIOR bundle's vocabulary change
# took away, by a different route than it lost it: 'John Smith E.S.Q.'
# and 'John Smith C.H.A.' fell to a bare positional read when 'esq'
# and 'cha' left SUFFIX_ACRONYMS
# (decisions.md#suffix-acronym-collisions), and the shape class reads
# them as the credentials they always were with no wordlist entry.
# At the baselines where
# that restoration lands on the baseline's own reading, only the new
# report is left and `fields` says so.
#
# The narrow half of the same change: a chunk match no longer makes a
# dotted token a suffix where EVERY matched chunk is a single ASCII
# character, which reaches only the roman numerals -- 'Jack X.Y.I.'
# moves to family for that reason and not for the shape one.
#
# The shapes the vocabulary settles are untouched and are
# _MUST_NOT_MATCH probes in tests/v2/test_ledger_guards.py: a
# whole-token match ('Jack M.A.', 'John Smith Ph.D.', 'Smith,
# A.B.C.'), a surviving chunk claim ('Doe, John Msc.Ed.'), a leading
# dotted run ('X.Y.Z. Smith', 'J.R.R. Tolkien', 'A.B. Vajpayee'), the
# single trailing period that is no shape at all ('John Smith Xyz.'),
# and a digit chunk, which the alphabetic gate refuses ('Bridge (1.4)').
#
# Literal-anchored to the measured movers, one set for all five
# ledgers, for the reason the fix(#289) rule above gives: the class is
# a SHAPE, and a regex for the shape would claim every dotted token
# the vocabulary already answers for.
name_regex = "^(?:Jack X\\.Y\\.I\\.|John Smith B\\.Tech\\.|John Smith C\\.H\\.A\\.|John Smith E\\.S\\.Q\\.|John Smith Q\\.W\\.E\\.R\\.T\\.|John Smith X\\.Y\\.Z\\.|John Smith, A\\.B\\.|Smith, E\\.S\\.Q\\.|john smith x\\.y\\.z\\.)$"
fields = ["family", "given", "middle", "suffix", "_ambiguities"]
orders = ["DEFAULT"]

[[change]]
issue = "fix(#289/#516) the ambiguous credential class reports at slots that were silent"
# Every decision at the trailing suffix slot, the post-comma given
# slot and a tail segment now reports the EXISTING SUFFIX_OR_NAME --
# no new kind, and the report tracks the FORK BEING CONSULTED rather
# than which way it went, as the trailing slot always has. These names
# gain it with no role moving at any baseline: the fork was there all
# along and was called silently. It is the first time the comma's
# OWN decision is reported (rules.md#C1); P6's attachment fork has
# reported on a family-comma path since 2.3 ('Berg, Jan vd'). C2's
# structural flag was already the first comma-path report of a shape.
#
# 'Steven Hardman, MD, DO, DDS' goes the other way and LOSES its
# comma-structure flag: its third segment now reads as the credential
# run it is, because 'DO' leans credential in a mixed-case name. That
# is the one place this arc quiets a report rather than adding one.
#
# 2026-09-19, #531 review round: 'Doe, MA Smith' joins, and it is the
# post-comma given slot with a NAME WORD behind the member: no role
# moves at any baseline -- the member is the given name here as it
# always was -- and what is new is only the report that emitter makes.
# Its silent twin 'Doe, Dr. MA Smith' puts a title in that first piece
# instead, which the emitter reads rather than the member, and agrees
# with every baseline on every field, so it is in no ledger at all.
#
# `_ambiguities` alone, which keeps `_initials` out of these rows as
# always (#484), and the rule cannot absorb a role diff on any of
# these names for the same reason. Literal-anchored, one set for all
# the 2.x ledgers; the 1.4.0 ledger has no twin, `_ambiguities` being
# a v2 surface that cannot enter a diff below baseline 2.0.
name_regex = "^(?:Doe, MA Smith|J\\.A\\. K\\.D\\.|Jack X\\.Y\\.Z\\.|John Smith J\\.u\\.n\\.i\\.o\\.r\\.|John Smith R\\.A\\.I\\.|Royce, Ed|Smith Jr\\., A\\.B\\.|Smith, A\\.B\\.|Smith, Ma|Steven Hardman, MD, DO, DDS)$"
fields = ["_ambiguities"]
orders = ["DEFAULT"]

[[change]]
issue = "fix(#289/#516) the glued CJK honorific peel reads the case lean"
# The suffix-run predicate the peel uses to decline a post-comma run
# (rules.md#W3, asking C1's own vocabulary question) now reads the
# same written-case evidence rule S2 reads, because `one_case` is
# passed to it. Before, one name written with two credentials divided
# two ways: a Kim-prefixed 김민준씨 input peeled its honorific when the
# credential was 'PhD' and did not when it was 'MA', the only
# difference being that 'MA' is an ambiguous acronym whose case lean
# the predicate was not given.
#
# Every name here is a COMPOSED form -- a Latin wrapper and a family
# comma around a CJK name -- which no East Asian writing system
# produces, so all three are `tolerated` case rows on the radar tier
# (decisions.md#cjk-comma-demotion). They are classified all the same:
# a radar diff this arc INTENDED is one a release note may be written
# from, and an unclassified one is not.
#
# `title` is in `fields` because 'Dr. 김민준씨, MA' had the whole
# string for its family at these baselines, the title included; at
# 2.0.0 and 2.1.0 'Jo김민준씨, DO' moves `title` instead of `given`,
# and the union is what a per-baseline `fields` records (#452).
name_regex = "^(?:Dr\\. 김민준씨, MA|Jo김민준씨, DO|Kim김민준씨, MA)$"
fields = ["title", "given", "family", "suffix", "_ambiguities"]
orders = ["DEFAULT"]

# ---------------------------------------------------------------
# #531: THE GIVEN PART'S TRAILING SLOT. Four rules -- the thirteen
# the credential reading takes, the four the writing declines and that
# gain a REPORT alone, the one `do` spelling the capitals take from
# P6, and the two caseless comma forms on the radar tier. The decision is
# decisions.md#S2's 2026-09-18 pair; rules.md#S2, #S3, #C1 and #P6
# carry the statements.
# ---------------------------------------------------------------

[[change]]
issue = "fix(#531) a credential ending the given part of a family-comma listing reads as a credential"
# After a family comma, a word of the ambiguous credential class
# ending the given part is now read by the same rule the comma-less
# spelling uses for a word ending the name. The comma has already
# named the family and the first word after it is the given name, so
# the words to spare are there by construction and the count says
# nothing: the word reads as the credential unless its WRITING says
# otherwise. rules.md#S2 states it, rules.md#S3 carries the by-shape
# spelling, and decisions.md#S2 records the decision.
#
# Thirteen names, and they are the class read from every side the
# corpora reach it: the bare member ('Doe, John MA', 'Doe, John BA');
# its one-case spellings, where the lean is inert and the POSITIONAL
# reading is not ('DOE, JOHN MA', 'doe, john ma', 'DOE, MARY JO MA');
# the slot behind a title ('Doe, Dr. John MA') and behind an initial
# ('Doe, J. MA'); a run of two members, where the credential the
# member joins was already a suffix so `suffix` GROWS rather than
# filling ('Doe, John MA JD', 'Doe, John MA PhD', 'Doe, John PhD MA',
# 'Doe, John MA Jr'); the slot reached past a middle initial, which
# keeps its own middle ('Doe, John Q. MA', 'DOE, MARY JO MA'); and the
# by-shape member, whose lean is always None so the positional reading
# takes it outright ('Doe, John X.Y.Z.').
#
# Do not read "thirteen role movers" off that list at every baseline:
# `fields` is the union the run at THIS baseline measures (#452), and
# a name here whose roles the baseline already agreed with contributes
# only its report. 'Doe, John BA' is that name at 2.1.0 and 2.2.0, and
# 'Doe, John MA JD' is the other end of the range, gaining TWO reports
# for its two members.
#
# `_ambiguities` is in the fields because every one of the thirteen
# gains the existing SUFFIX_OR_NAME -- no new kind, and the report
# tracks the FORK CONSULTED rather than which way it went, which is
# the rule fix(#289/#516) above already states for the other slots.
# #452's over-declaration check recomputes the union on every run.
#
# Literal-anchored for the reason the two rules above give, and it is
# sharper here: the class is a SLOT, so a regex for it would claim
# every family-comma name whose given part ends in an ambiguous
# acronym -- including the four the WRITING declines, which keep their
# name reading and have the rule below, and 'Doe, John MA Smith',
# where a name word behind the member ends the run so nothing moves
# and nothing reports. _MUST_NOT_MATCH carries both, with the `do`
# spellings P6 keeps and the third-comma-part name #144's restriction
# still owns.
# 2026-09-19, #533: TWO names join the alternation and the rule does
# not change. 'Doe, J. ba' and 'Smith nee Jones, Jane MA' are this
# slot read exactly as the thirteen above are -- a lower-case member
# ending the given part after an initial, and the same member behind
# a maiden clause that sits in the FAMILY segment, where no trailing
# rule reads the clause's own tail and the given part's slot is
# reached as usual. Both read the same way at 2f57ff21, before #533,
# measured name by name: what grew is the CORPUS, not the rule, and
# a `fix(#533)` rule for them would attribute a #531 reading to the
# wrong change.
name_regex = "^(?:DOE, JOHN MA|DOE, MARY JO MA|Doe, Dr\\. John MA|Doe, J\\. MA|Doe, J\\. ba|Doe, John BA|Doe, John MA|Doe, John MA JD|Doe, John MA Jr|Doe, John MA PhD|Doe, John PhD MA|Doe, John Q\\. MA|Doe, John X\\.Y\\.Z\\.|Smith nee Jones, Jane MA|doe, john ma)$"
fields = ["_ambiguities", "middle", "suffix"]
orders = ["DEFAULT"]

[[change]]
issue = "fix(#531) a member the writing declines keeps its name reading and reports the fork"
# The other direction of the same fork, and the whole of what these
# four names do: no role moves at any 2.x baseline and the decision
# starts being REPORTED. 'Doe, John Ma', 'Doe, John Ed' and
# 'Doe, Mary Jo Ma' carry a Title-cased member in a mixed-case name,
# which is written the way a name is written, so the member stays a
# middle name; 'Doe, John MA Ma' is a two-member run whose last member
# is Title-cased, so the walk declines there and the run stays middle
# text whole.
#
# Reporting a DECLINED fork is #530's stated rule -- the report tracks
# the fork consulted, not the lean -- and rules.md#A1's "a kind is
# worth adding only if a reader would hesitate too" is the standing
# objection it answers. It is also the only part of #531 that adds a
# report without moving a field, which is why it is a rule of its own
# rather than a widening of the one above: `fields` is
# `_ambiguities` alone, so this rule cannot absorb a role diff on any
# of the four.
#
# At 1.4.0 these same four DO move roles -- v1 read all four members
# as post-nominals -- and that divergence is carried there by
# fix(given-part-trailing-slot), whose comment records that #531
# changed which names it holds rather than retiring it.
#
# Literal-anchored: the class is the slot's declining half, and a
# regex for it would claim the thirteen movers above.
name_regex = "^(?:Doe, John Ed|Doe, John MA Ma|Doe, John Ma|Doe, Mary Jo Ma)$"
fields = ["_ambiguities"]
orders = ["DEFAULT"]

[[change]]
issue = "fix(#531) capitals take the do collision from the family-comma particle attachment"
# 'Doe, John DO', alone, because the word is alone in the class: `do`
# is the one ambiguous credential that is also particle vocabulary, so
# this slot and P6's attachment (rules.md#P6) want the same word.
# Derek's decision, recorded at decisions.md#S2: CAPITALS DECIDE, AND
# THE PARTICLE RULE KEEPS EVERY OTHER SPELLING. An all-caps member in
# a name written in more than one case carries a positive credential
# lean, so the credential reading wins and P6 stands down; every other
# spelling attaches exactly as it did, with P6's own
# `particle-or-given` and no second report.
#
# THE PAIRING IS THE ARGUMENT and the accepted cost is half of it. In
# ONE CASE the rule cannot tell 'NASCIMENTO, EDSON ARANTES DO' from
# 'SMITH, JOHN DO' and reads both as the particle -- right about the
# Brazilian record, wrong about the osteopath. Those two, and
# 'Doe, John Do', 'DOE, JOHN DO', 'doe, john do' and
# 'Nascimento, Edson Arantes do', are _MUST_NOT_MATCH probes: this
# rule has no business claiming a single one of them, and each is a
# name #531 measured to be byte-identical before and after.
#
# `fields` is per-baseline and the two halves of this file's set
# differ by which role the particle came OUT of, which is P6's own
# history: {middle, suffix} at 2.0.0 and 2.1.0, where the
# baseline read middle 'DO' because P6's family-comma attachment had
# not shipped, and {family, suffix} at 2.2.0 and 2.3.0, where it had
# and the baseline reads family 'DO Doe'.
name_regex = "^Doe, John DO$"
fields = ["_ambiguities", "family", "suffix"]
orders = ["DEFAULT"]

[[change]]
issue = "fix(#531) the trailing slot's positional reading reaches a caseless script"
# '田中, 太郎 MA' and '김, 민준 MA': middle 'MA' -> suffix 'MA', one
# report each. A caseless script answers True to the one-case test, so
# the lean is None -- and at this slot a None lean is not inert,
# because the POSITIONAL reading the lean would have overridden is
# itself the credential. "Caseless is inert" holds for the LEAN and
# not for the outcome, which is the sentence tests/v2/cases.py's two
# rows carry.
#
# Both are COMPOSED forms -- a family comma between a CJK family and a
# CJK given name, which no East Asian writing system produces -- so
# both are `tolerated` case rows on the radar tier
# (decisions.md#cjk-comma-demotion), and their diffs print under
# UNCLASSIFIED (radar) rather than blocking. They are classified all
# the same, on fix(#289/#516)'s stated ground: a radar diff an arc
# INTENDED is one a release note may be written from, and an
# unclassified one is not.
#
# Literal-anchored, and the probes are the CJK comma names that do NOT
# move at this slot: '田中 太郎, MA', '毛泽东, MA' and '마틴 킹, MA' put
# their member in the FIRST post-comma piece, which is #289's slot and
# not this one.
name_regex = "^(?:田中, 太郎 MA|김, 민준 MA)$"
fields = ["_ambiguities", "middle", "suffix"]
orders = ["DEFAULT"]

[[change]]
issue = "fix(#533) a credential ending a maiden clause reads as a credential"
# The PR review added one: 'Jane Doe nee Smith V MA', where a
# trailing roman numeral stands between the clause and the member.
# Both stops read the TRAILING word, so the numeral is not the word
# either fork asks about -- the acronym fork stops at 'MA' and the
# 'V' stays maiden text behind it.
# The words a maiden marker takes now end where a trailing credential
# begins, where the rule that reads the name left standing reads the
# word as one -- both as the name is written and as the take would
# leave it (rules.md#M2, decisions.md#M2). `suffix` fills as `maiden`
# shortens, and the fork is reported: the end of a maiden clause was
# the last trailing position in the library where a member of the
# ambiguous credential class was read in silence.
#
# Seventeen names, and they are the class read from every side the
# corpora reach it: the bare member ('Jane Doe nee Smith MA',
# 'Doe, Jane nee Smith MA'); its one-case spellings, where the lean is
# inert and the POSITIONAL reading is not ('JANE DOE NEE SMITH MA',
# 'JANE DOE NEE YO-YO MA', 'jane doe nee smith ma', 'Doe, Jane nee
# Smith ma'); the other markers, the German abbreviation and the
# Polish PHRASE the walk reads no differently for its being three
# words ('Jane Doe geb. Smith MA', 'Maria Kowalska z domu Nowak MA');
# a member beside another credential, where `suffix` GROWS rather than
# filling ('Jane Doe nee Smith MA JD', 'Jane Doe nee Smith MA PhD',
# 'Jane Doe nee Smith Ma JD' -- whose Title-cased Ma stays in the
# clause while the JD behind it leaves); past a trailing title, which
# the peel steps over ('Jane Doe nee Smith Prof. MA'); the slot
# reached past a middle initial ('Doe, Jane Q. nee Smith MA'); the
# `do` collision, where the capitals decide ('Doe, Jane nee Smith DO'
# beside 'Jane Doe nee Smith do', whose comma-less spelling P6 never
# reaches); the clause that leaves ONE name word, which rules.md#M4
# makes the family ('John née Jones Smith MA'); and the CLAMP, where
# the member is the only word the marker would otherwise leave and
# only what stands BEHIND it is given up ('Doe, J. nee MA ba' keeps
# maiden 'MA' and reads suffix 'ba').
#
# Literal-anchored for the reason fix(#531)'s rules give, and it is
# the same reason here: the subject is a SLOT, so a regex for it
# would claim the names whose WRITING declines the word -- which keep
# their maiden reading and have the rule below -- as readily as the
# ones it takes. _MUST_NOT_MATCH carries both directions.
name_regex = "^(?:Doe, J\\. nee MA ba|Doe, Jane Q\\. nee Smith MA|Doe, Jane nee Smith DO|Doe, Jane nee Smith MA|Doe, Jane nee Smith ma|JANE DOE NEE SMITH MA|JANE DOE NEE YO-YO MA|Jane Doe geb\\. Smith MA|Jane Doe nee Smith MA|Jane Doe nee Smith MA JD|Jane Doe nee Smith MA PhD|Jane Doe nee Smith Ma JD|Jane Doe nee Smith Prof\\. MA|Jane Doe nee Smith V MA|Jane Doe nee Smith do|John née Jones Smith MA|Maria Kowalska z domu Nowak MA|jane doe nee smith ma)$"
fields = ["_ambiguities", "maiden", "suffix"]

