# Every rule needs `issue` and `name_regex`; `fields` narrows further
# and is optional. Since #451 validate_rules REJECTS a rule carrying
# `fields` and no `name_regex`, as it already rejected one with
# neither. An unexplained diff is a release blocker until classified
# (tools/differential/README.md). The citation here used to name a
# gitignored spec requirement, and passed the armed legacy-citation
# guard only because the line wrapped between the two words.
# Rules were seeded from the 2.0 rewrite's working notes
# and the `classification="fix(...)"` rows in tests/v2/cases.py; keep
# each entry's `name_regex`/`fields` as tight as the diff allows.
# FILE ORDER IS LOAD-BEARING: every rule carries a `name_regex`, so
# they all sit in one tier, _sorted_rules is stable, and file order
# decides every tie. Write the narrower rule first, and see the note
# above the four fix(suffix-routing) rules at the end of this file.

[[change]]
issue = "fix(#271/#272/#298) native-script CJK: family-first order, hangul segmentation, the kana license and the dots"
# '毛 泽东', '김민준': script_orders flips first/last for a name written
# wholly in Han or Hangul, and the Korean surnames that now ship as
# default vocabulary additionally split an unspaced hangul token into
# last + first. '高橋 みなみ', 'マイケル・ジャクソン': #272 extends the
# same order table to kana-bearing Japanese names and makes the
# katakana middle dot a token separator, which moves pieces between the
# same three fields. Seeded from the fix(#271) and fix(#272) rows in
# tests/v2/cases.py.
#
# One rule, not two, because it is one diff shape: both issues move
# name pieces between first/middle/last on native-script CJK input, and
# splitting the class by issue would need a rule per script with no
# gain in tightness (the fields list is already the narrow half).
#
# Scoped by script, which is exactly the scope of the behavior --
# nothing here can touch a name with no CJK character in it. Han's
# astral block (U+20000-U+323AF) is deliberately left out of the class:
# no name in either corpus reaches it, and a rule should be no wider
# than the diffs it has to explain. Extend it -- and the sync pin in
# tests/v2/test_ledger_guards.py, which fails if the two disagree -- if
# one ever does. The kana spans are BMP-only for a different reason:
# supplementary-plane kana is hentaigana and other archaic forms no
# modern name uses, so _SCRIPT_RANGES does not list it either.
#
# U+FF65 is the one span here that _SCRIPT_RANGES does NOT have, and
# it is deliberate. The halfwidth middle dot separates tokens like
# its fullwidth twin, so 'ﾏｲｹﾙ･ｼﾞｬｸｿﾝ' splits where 1.4 left one
# token, but halfwidth kana is excluded from CLASSIFICATION on
# purpose (a separate normalization problem). The rest of the
# halfwidth block (U+FF66-U+FF9F) is left out for the usual tightness
# reason, and it was measured rather than assumed: a dotless
# halfwidth name such as 'ﾏｲｹﾙ ｼﾞｬｸｿﾝ' is byte-identical on both
# sides, so covering the block would pre-excuse a future regression
# on a shape that is parity today. U+00B7, the context-sensitive
# 间隔号 (#298), deliberately gets NO span even though it too changes
# parses: its flank guard divides only between classified-script
# characters, so every name it can change already matches this class
# through a flanking character -- and a B7 span's only actual effect
# would be letting this rule claim first/middle/last diffs on
# punt-volat Latin names ('Gal·la Marcet'), pre-excusing a regression
# on exactly the input class the guard exists to protect.
#
# corpus_cjk.jsonl (#295) exists so this rule fires in every real
# run: build_cjk_corpus.py harvests every CJK-bearing text in
# tests/v2/cases.py -- the fix(#271)/fix(#272)/fix(shime-mark) rows
# AND the parity rows, whose value here is pinning NON-diffs (マイケル
# must not change against 1.4) -- closing the blind spot the other
# two corpora have by construction: v1's banks had no reason to test
# CJK, and build_issues_corpus.py requires an internal space, which
# unspaced names never have.
name_regex = "[\\u3005-\\u3006\\u3040-\\u309F\\u30A0-\\u30FF\\u3400-\\u4DBF\\u4E00-\\u9FFF\\uF900-\\uFAFF\\uAC00-\\uD7A3\\uFF65-\\uFF65]"
fields = ["given", "middle", "family"]

[[change]]
issue = "fix(#274) maiden markers consumed"
# The alternation is a hand copy of MAIDEN_MARKERS, pinned by
# tests/v2/test_ledger_guards.py: every alternative must match at least
# one entry the config ships, and none may match ordinary name text.
#
# Its members reach 3 of the 17 entries -- geb, nee, née -- which is
# not the same set as the markers the corpora contain (geb, nee, née,
# z domu and 旧姓; the first three are covered here). Fourteen entries
# go unreached, and the carve-outs in that arithmetic are
# load-bearing: TWO of the fourteen do appear in the corpora and each
# is classified somewhere other than this alternation. 旧姓 is one,
# and it has fix(cjk-maiden-marker) of its own below rather than an
# alternative here. z domu is the other, and it cannot be an
# alternative here at all: this is a per-WORD regex over a name, and
# the words of a phrase entry are an ordinary Polish preposition and
# an ordinary noun -- an alternative matching either would claim names
# carrying no marker, which is the one thing the pin above forbids.
# Its two names are classified by the fix(#434) rules, keyed on the
# literal. Growing this rule toward the other TWELVE buys nothing:
# none of them appears as a token in any corpus, so there is no diff
# for them to classify. The roz alternative was
# dropped in 2.2 with the vocabulary entry it copied (see
# maiden_markers.py's Deliberately absent note): no corpus name
# contains the string in any case or position, so it classified
# nothing and its removal moved no name.
#
# 旧姓 is a different case, and it has been got wrong three times, so
# state it precisely. Widening this rule to cover it changes no corpus
# classification -- every 旧姓 name in the corpora leaves a wholly Han
# residual, which reads family-first (#271), so its diff includes
# `given`, and classify() requires the diff's fields to be a subset of
# the rule's. That is a fact about the CORPUS, not about the rules: a
# 旧姓 name with a Latin residual would diff without `given`, and since
# this rule sorts ahead of fix(cjk-maiden-marker) in the same tier it
# would take that name from it. Inert today, shadowing in principle.
# Widen deliberately, and record the new coverage in
# _LATIN_ALTERNATION_SOURCES.
#
# 'born' was an alternative here from the harness's first commit and
# was removed in #350. It is not in MAIDEN_MARKERS and never was, in
# v1 or v2, so it could not correspond to a real #274 change. What it
# could do is claim any name containing "born" -- with fields
# maiden/middle/family -- and absorb a genuine regression. No corpus
# name contains it, so removing it changed no classification.
#
# Supporting 'born' would mean shipping it as vocabulary first, and it
# is not free: 'Bertha Born Smith' loses its family name to the marker.
# Note the vocabulary is not missing English -- 'nee' is there, and
# tests/v2/cases.py calls it the spelling English writes most often.
# See maiden_markers.py's own "Deliberately absent" note for what has
# actually been considered and declined.
#
# The lookarounds and the two context tests are not decoration. corpus_rules.jsonl (#414)
# brought in 'Jane Smith (Nee)' and 'Jane Smith (Nee) (Jones)', which
# are M1's examples of a one-word clause keeping a word that may
# itself be a surname. Under the DEFAULT facade -- which is what the
# differential parses with -- no maiden delimiter is configured, so
# the parenthesized word is a NICKNAME and no marker is active at all.
# Without the lookarounds this rule matched the word anyway and stood
# ready to explain a `maiden` diff on a name that has no marker in it,
# which is absorption waiting to happen. The vocabulary-presence guard
# in test_ledger_guards.py is what caught it.
#
# The same corpus addition also put M2's BOUNDARY examples in reach --
# 'Jones nee', 'nee Jones', 'Jane van der Berg nee', 'Muller geb.' --
# names M2 states as unchanged, because a marker with nothing before
# or after it is just a word. Nothing guards that: those names really
# do carry marker vocabulary, so the presence guard is satisfied.
# Hence the two context tests, which say what this rule has always
# meant: a marker with a name word BEFORE it and one AFTER it. Reach
# 16 -> 11 when they were added, and every name it explained then was
# inside the eleven -- figures from that measurement rather than from
# today's corpus, which has grown since. Today it explains 12
# (measured 2026-08-27, after #445).
#
# Five claimed names still do not move, recorded rather than
# excluded: 'Jane Smith, née Jones' (post-comma, M2's remaining
# Accepted limit), 'Jane van der Berg née PhD' and 'Jane Smith née V'
# (only a suffix follows, so the consumer declines), and
# 'Jane née Jr y Jones' and 'Jane van der Berg née Jr Jones' (the
# connective and bound-given joins, #412). Each would need the regex
# to ask a vocabulary question -- suffix or connective membership --
# a second alternation this rule cannot spend. The count said four
# until the review round re-measured it: the corpus grew and the
# sentence did not, which is this file's standing hazard and the
# reason every count in it carries the date it was taken. Measured
# 2026-08-27 against the 1.4.0 wheel, name by name over all 31 the
# regex claims.
#
# #445 landed 2026-08-27, and the prediction this note used to carry
# was wrong in a way worth keeping on the record. It reasoned that a
# "keep the family" fix would leave these diffs a subset of {maiden,
# middle, family}, so this rule would go on explaining them and would
# absorb the change in silence. The rule #445 actually chose MOVES
# the one name word rather than adding one: `given` empties as
# `family` fills, so every name that moved left this rule's fields
# and arrived UNEXPLAINED -- loud, at all three baselines. The note
# earned its keep all the same, and that is why it is corrected here
# rather than deleted: it named the right rule, the right field and
# the right eight names, and re-measuring its checklist is what
# showed its own reasoning wrong.
#
# Six of the eight moved: five by the fix(#445) rule at the end of
# this file, and 'John née Jones Smith Ma' by the fix(#424/#445)
# acronym rule above it, its diff carrying the suffix v1 read as
# well. The other two are rules.md#M4's own carve-outs, and their
# diffs are unchanged to the field, which is what makes them a
# boundary rather than an oversight. 'abd née Jones' -- whose word
# the bound-given vocabulary has claimed -- is still this rule's.
# 'J. née Jones Smith V' -- whose word is an initial -- is NOT, and
# never was: its 1.4.0 diff carries `suffix`, which these three
# fields cannot hold, so 'fix(#424) accepted: the maiden walk keeps
# the numeral an initial before the marker vetoes' is what explains
# it (asked of classify directly, 2026-08-27, rather than read off
# the regexes). The safety argument holds through that rule instead:
# it declares no `given` either, so a `given` move on either
# carve-out lands UNEXPLAINED rather than absorbed.
#
# The two other fix(#445) names,
# 'Smith née Jones' and 'Smith née Jones PhD', are corpus rows M4's
# own example lines added.
name_regex = "(?i)(?<![(（])(?<=\\S\\s)\\b(n[ée]e|geb)\\.?(?![)）])(?=\\s+\\S)"
fields = ["maiden", "middle", "family"]

[[change]]
issue = "fix(cjk-maiden-marker) maiden marker consumed, compounding with the CJK order flip"
# Its own rule rather than a widening of fix(#274) above: that rule's
# fields stop at maiden/middle/family because a Latin marker moves
# only those, while a Han one also flips `given` -- the name left after
# the marker is consumed is wholly Han, so it reads family-first
# (#271). Adding `given` to #274's list would make it broader than its
# prose and let it absorb diffs that have nothing to do with markers
# (#328). The regex is the marker itself, so this rule can claim
# nothing else.
name_regex = "旧姓"
fields = ["given", "middle", "family", "maiden"]

[[change]]
issue = "fix(credential-pair-order) a split credential and a suffix render in written order"
# 'John Smith, Jr. Ph. D.': 1.4 rendered the pair as 'Ph. D., Jr.',
# 2.x renders 'Jr. Ph. D.' -- the order the name was written in.
# tests/v2/cases.py carries the same input under this classification.
#
# The trailing-Ph. D. exclusion refused this name until #413's harvest
# brought it into a corpus. That is the arrival the entry predicted in
# writing and told its reader to narrow for, so the entry was narrowed
# and the name reads here. Only `suffix` moves -- the given and family
# names are untouched by the order the credentials render in.
#
# POSITION is load-bearing. fix(comma-family) below matches this name
# too, and its ["given","title","suffix"] is a superset of the {suffix}
# moved here, so whichever is written first wins -- both carry a
# name_regex, and _sorted_rules is stable within that tier. Written
# after it, this rule explains nothing and the name files under "lone
# post-comma piece routes to suffix/title".
name_regex = "(?i)^[\\u0000-\\u024f]*,\\s*jr\\.?\\s+ph\\.?\\s*d\\.?\\s*$"
fields = ["suffix"]

[[change]]
issue = "fix(A2) content-free input names nobody, so every role empties"
# '(' / '.,': v1 kept a punctuation-only string as a name -- parse('.')
# read first='.' -- and 2.0 empties input with no name content in it.
# decisions.md#A2. Five corpus names are content-free ('', '()', ',',
# '(', '.,'); two of them diff at this baseline and the other three
# were already empty on both sides.
#
# Written ABOVE `fix(comma-family) lone post-comma piece routes to
# suffix/title, not first` deliberately -- that rule, well down the
# file, and NOT the comma-family rule sitting immediately below this
# one, which is anchored to a literal name and cannot reach '.,' at
# all. Both carry a name_regex so they share a tier, where
# _sorted_rules' stable sort leaves file order deciding, and that
# rule's Latin-range comma regex reaches '.,' -- which is how a comma
# rule came to explain an emptying that has nothing to do with commas.
# (Its regex was a bare ',' until #372; the Latin anchoring it has
# now reaches '.,' just the same. That rule's own comment owns the
# story of what the anchoring keeps off it, and the count with it --
# restating either here is how one copy goes stale while the other
# does not.) _CROSS_RULE_WINNERS pins the reassignment.
#
# `\W` rather than a punctuation class, because it IS A2's own
# predicate: _assemble.py decides the emptying with `not
# any(c.isalnum() ...)`, and across all of Unicode `\w` and isalnum
# diverge on exactly one codepoint -- U+005F, which A2 empties and
# this rule does not claim. So the rule is a strict SUBSET of the
# behavior it names, by construction rather than by measurement: it
# cannot claim a name A2 leaves alone. Being Unicode-aware, it also
# puts any name carrying a letter or digit in any script outside
# itself, which is why it matches none of validate_rules' sentinels.
name_regex = "^\\W*$"
fields = ["given"]

[[change]]
issue = "fix(comma-family) a comma followed only by titles keeps the given/family split"
# 'Bob Jones, author' / 'Bob Jones, compositeur': the comma is followed
# by nothing but a title word, which said nothing about where the
# family name ends, so the pre-comma name keeps its positional read --
# first 'Bob Jones' -> given 'Bob', family 'Jones', the title staying
# where it was (the post-comma word is a title on both sides). 2.0 had
# merged the pre-comma run into the family (the comma-precomma-family
# rule below, whose fields would absorb this move -- written ahead of
# it so the name files here and that rule's count tells).
name_regex = "(?i)^bob\\s+jones,\\s*[a-z]+$"
fields = ["given", "family"]

[[change]]
issue = "fix(comma-family) a comma followed only by titles keeps the given/family split, the C1 example"
# 'John Smith, Mr.' and 'John Smith, Mr. Jr.': the rules.md#C1 examples
# of the rule above (first 'John Smith' -> given 'John', family
# 'Smith'; the title stays where it was; with the postnominal, v1's
# first 'Jr.' is the suffix). Without this rule the second landed on
# the fields-only fix(suffix-routing) catch-all, back when that
# catch-all declared `given` as well; once #451 narrowed it to
# {family, suffix} a {given, family, suffix} diff stopped being a
# subset of it, and #451 has now deleted it outright. Measured both
# before and after that deletion: with this rule removed the diff is
# UNEXPLAINED. Its own literal rather than an alternation with 'Bob
# Jones', which would be no vocabulary.
name_regex = "(?i)^john\\s+smith,\\s*mr\\.?(\\s+jr\\.?)?$"
fields = ["given", "family", "suffix"]

[[change]]
issue = "fix(#296) a dropped prenominal takes the name position it occupies"
# 'Do Quang Minh': 'do' left TITLES -- a postnominal (D.O.) and a
# Vietnamese surname, never a prenominal -- so a leading 'Do' is no
# longer peeled as a title and falls through to the positional read:
# title 'Do', first 'Quang' -> given 'Do', middle 'Quang'. The
# 2026-07-30 audit table's disposition; 'phd', 'jr', 'junior' and
# 'se' left with it, and no corpus name leads with a bare one (the
# three that lead with 'Jr.' are read by the period inference and do
# not move). The rule's second name is 'MD, DO, DDS': title 'DO' ->
# given 'DO', the comma anchor's one corpus hit. `family`
# is deliberately OUT of the field list: the family name must not
# move on this rule, so a regression there stays loud. The anchors
# are the two openings a name has (start, or after a family comma).
name_regex = "(?i)(^|,\\s*)do\\b"
fields = ["title", "given", "middle"]

[[change]]
issue = "fix(#296) dr is not postnominal vocabulary, so a trailing Dr. is a name word"
# 'John Smith Dr.' and 'dr Vincent van Gogh dr' with its #100 siblings
# (and, at 2.x only, 'Smith Dr', which 1.4.0 already read as the
# family): 'dr' left SUFFIX_WORDS, where it was v1
# residue -- 'Dr.' is not a postnominal in any tradition -- so a
# trailing bare 'Dr' is no longer suffix vocabulary and falls to the
# positional read, taking the family name with it. NOT a new class:
# no trailing title-only word routes to title on the no-comma path
# ('John Smith Prof.' reads family 'Prof.' at every baseline), and
# the suffix entry was the only thing making 'dr' the exception. #316
# is the open question for the class.
name_regex = "(?i)\\sdr\\.?$"
fields = ["middle", "family", "suffix"]

[[change]]
issue = "fix(#296) a credential-only comma string reads a name and its postnominal"
# 'Jr., PhD' / 'MD, PHD': a string that is nothing BUT credentials.
# v1 read the trailing one as a title and the leading one as a first
# name; with 'phd' out of TITLES the comma structure reads it as a
# one-word name plus a postnominal -- a reading of a string nobody
# writes as a name, and the honest one for it.
name_regex = "(?i)^[a-z]{2,3}\\.?,\\s*phd$"
fields = ["title", "given", "family", "suffix"]

[[change]]
issue = "fix(#325) a split credential followed by another suffix after a one-word family comma reads as suffixes"
# 'Smith, Ph. D. Jr.' and the #325 rows it leads ('Smith, Ph. D. MD',
# 'Smith, Ph. D. III', 'Smith, Ph. D. Jr. MD', 'Smith, Ph.D. Jr.', and
# 'Smith, PhD Jr.', which the regex reaches too -- title 'PhD' at
# every baseline, suffix 'PhD, Jr.' now):
# with one word before the comma the name is the listing form, and
# the space-split 'Ph. D.' followed by another suffix was no longer
# the LONE post-comma piece, so it fell through to the given name --
# a 1.4.0 regression (v1 read suffix 'Ph. D.', title 'Jr.'). The
# whole run is suffixes now. Literal rather than the shape: a shape
# regex absorbed 'Smith, Dr. Jr.', which is the comma-family rule's
# (the comment review).
name_regex = "(?i)^smith,\\s*ph\\.?\\s?d\\.?\\s"
fields = ["title", "given", "suffix"]

[[change]]
issue = "fix(#325) a credential run across a second comma reads as suffixes"
# 'Smith, Jr., PhD': title 'Jr.', suffix 'PhD' -> suffix 'Jr., PhD';
# segments 2+ compose with the run.
name_regex = "(?i)^smith,\\s*jr\\.?,\\s*phd$"
fields = ["title", "suffix"]

[[change]]
issue = "fix(comma-family) lone post-comma piece routes to suffix/title, not first"
# 'Smith, Dr.' / 'Andrews, M.D.': v1 put the lone strict-suffix-or-title
# post-comma piece in `first`; 2.0 routes it to `suffix`/`title` instead
# (family/`last` is unchanged either way -- "pre-comma is definitionally
# family").
#
# LATIN-ANCHORED, and that is what keeps this rule describing what it
# claims. The regex was a bare comma until #372, which reaches every
# comma in every script -- so seven CJK glued-honorific names landed
# here, on a rule whose prose has nothing to do with CJK. They diff as
# {given, suffix} (민준씨->민준/씨, 太郎さん->太郎/さん), which is a
# subset of this rule's fields, and classify() takes the first rule
# whose regex matches and whose fields are a superset. Both this rule
# and fix(cjk-comma-compound) carry a name_regex, so they share a tier
# and file order broke the tie -- in favour of the one written first,
# which was this one.
#
# Measured, narrowing it: corpus reach 236 -> 215, and this rule now
# claims exactly one name, 'Andrews, M.D.', which is the shape named
# above. All seven moved to fix(cjk-comma-compound), which grew 10 ->
# 17 and is the rule named for that shape. The gate is unmoved at 108
# intentional / 0 unexplained -- nothing became unexplained, so no name
# lost an explanation, it only changed which rule gave it.
#
# The cut is at U+0250, the threshold _is_latin_only uses in
# compare.py, matching the trailing-'Ph. D.' exclusion. Anchored at
# both ends because a name is Latin or it is not: an unanchored class
# would match the Latin part of a mixed name and take it back.
#
# One row nearby is not here and never was: '田中さん, 太郎' agrees
# with 1.4.0, so it never reaches classify() at all. It is the pinned
# guard for the case a naive #312 fix breaks (the peel site is 太郎, so
# nothing peels).
#
# '田中さん, V.' is NOT that case, though this comment said it was
# until #372 checked. It diffs {family, suffix} and lands on
# fix(cjk-comma-compound) below, before and after this change. It
# reads as parity only under Policy(lenient_comma_suffixes=False) --
# the knob tests/v2/cases.py exercises in
# ja_honorific_glued_family_comma_strict_knob -- and the corpora run
# under the default policy, so here it is a real diff.
name_regex = "^[\\u0000-\\u024f]*,[\\u0000-\\u024f]*$"
fields = ["given", "title", "suffix"]

[[change]]
issue = "fix(comma-precomma-family) pre-comma run reads as family, not given"
# 'Bob Jones, author' / 'MD, PHD': the post-comma piece is a title on
# BOTH sides -- it does not move, and no suffix moves either. What
# changes is the pre-comma run: 1.4 read it as `first`, 2.x reads it
# as `last`, because pre-comma is definitionally family. Diff is
# exactly {given, family}.
#
# Its own rule because these have nothing to do with suffix routing:
# they were falling to the fields-only fix(suffix-routing) catch-all
# (deleted in #451), on a rule whose every other name moves a trailing
# token into `suffix`, while these move no suffix at all (#372).
#
# Distinct from fix(comma-family) above by fields, not by order: that
# rule is the lone post-comma piece moving into suffix/title and its
# fields exclude `family`, which every name here moves. Latin-anchored
# for the same reason it is -- a bare comma reaches every script.
name_regex = "^[\\u0000-\\u024f]*,[\\u0000-\\u024f]*$"
fields = ["given", "family"]

[[change]]
issue = "fix(#296) a lone post-comma credential is a suffix"
# 'Smith, Jr.' / 'Kim, Jr.' / 'Smith, PhD': rules.md#C1 -- the listing
# form holds with one word before the comma, and the word after it is
# the credential run. v1 put the family in `first` and the credential
# in `title`; 2.0 routed the pre-comma word to the family (the
# comma-family rule below) but the title peel still claimed the
# credential -- 'jr' and 'phd' were title vocabulary, and the
# period-abbreviation inference reads 'Jr.' as a title regardless --
# so the postnominal position is read first now: a post-comma run
# that is nothing but suffix pieces is suffixes. A one-word name, a
# comma, one short word: the reach is pinned by the guards, and the
# rule sits BEHIND the two comma-family rules above so that a name
# whose only move is the pre-comma word going given -> family
# ('Smith, Dr.', 'Smith, Prof.') or a lone piece going given ->
# suffix ('Smith, Abd') keeps the rule written for it (the comment
# review found this rule absorbing all three). 'Smith, Ms.' is
# here too: the dual's postnominal reading, title at 1.4.0.
name_regex = "(?i)^[a-z]+,\\s*[a-z]{2,6}\\.?$"
fields = ["title", "given", "family", "suffix"]

[[change]]
issue = "fix(#400/#274) bound-given join and maiden consumption in one name"
# 'abd Allah Smith nee Jones': two behaviours meeting in one name, so
# neither single-cause rule claims it -- fix(#400) moves {given,
# middle} and fix(#274) moves {maiden, middle, family}, and this moves
# all four at once. The join takes 'abd Allah' as the given name AND
# the marker takes 'Jones' as the maiden name, which between them
# leave 'Smith' as the family where 1.4 read family 'Jones'.
#
# Requires TWO words between 'abd' and the marker, which is what makes
# it the combination shape: with one word the join declines (P5's
# reserve, once the maiden words stop counting -- see fix(#411)) and
# the diff is fix(#274)'s alone. 'abd Berg nee Jones' is that name and
# this rule must not claim it.
name_regex = "(?i)^abd(\\s+\\S+){2}\\s+n[eé]e\\s"
fields = ["given", "middle", "family", "maiden"]

[[change]]
issue = "fix(#411/S2) a declining bound-given join leaves the suffix reading after a family comma"
# 'Berg, abd nee Jones': `abd` is the one shipped word in BOTH the
# bound-given and the suffix vocabulary. With #411's join declining --
# it will not absorb a marker -- what is left in the given slot after a
# family comma is S2's suffix reading, which rules.md#P5 already states
# wins there. So the name has no given name at all, exactly as
# 'Berg, abd' alone has always parsed.
#
# Four fields move, which is why neither fix(#411) nor fix(#274)
# claims it: the extra `suffix` breaks their subset test. That is the
# gate behaving correctly -- the name arrived UNEXPLAINED and is read
# once here.
#
# `abd` and not an alternation: no other shipped bound-given word is
# also suffix vocabulary, so no other word reaches this reading.
name_regex = "(?i),\\s*abd\\s+n[eé]e\\b"
fields = ["given", "middle", "suffix", "maiden"]

[[change]]
issue = "fix(#411) the bound-given reserve stops counting words the maiden name takes"
# 'van der Berg, abdul nee Jones': P5 reserves a name word so the join
# always leaves a family name behind, but the reserve was counted while
# the marker and the maiden name were still pieces -- group's marker
# pass runs later in the same stage. Counting words that were about to
# leave answered the question about a name that would not exist.
#
# The fields here are the SIDE EFFECT rather than the defect. #411's
# own shape is an emptied family ('abdul Berg nee Jones' read given
# 'abdul Berg', family ''), and no BASELINE shows it -- every released
# version already reads the corpus names carrying that shape the way
# the fix does, so none of them can produce a #411 diff to classify.
# ('abd Berg nee Jones' IS in corpus_rules.jsonl, and goes unexplained
# at all three baselines if the fix is reverted, which is the guard
# working.)
#
# What this corpus
# name shows is the other half: with the reserve counted correctly the
# join declines, so the marker is never merged into 'abdul nee' and
# M2's bound sees a lone marker piece for the first time. That closes
# one of the two join-swallows #412 tracks; P3's connective join is
# the one that survives.
#
# `abdul` is a LITERAL, not an alternation over BOUND_GIVEN_NAMES, and
# the words are NOT interchangeable here. 'abd' is the one shipped word
# in both the bound-given and the suffix vocabulary, so after a family
# comma a declining join leaves the S2 suffix reading instead: 'van der
# Berg, abd nee Jones' moves {given, middle, suffix, maiden}, and the
# extra field breaks the subset test, so it would arrive UNEXPLAINED --
# correct, but not what an alternation over the vocabulary would lead
# an author to expect. 'abdel', 'abdal' and the Arabic spelling do
# behave like 'abdul'; only this name is in the corpora.
name_regex = "(?i),\\s*abdul\\s+n[eé]e\\b"
fields = ["given", "middle", "maiden"]

[[change]]
issue = "fix(#400) abd joins the word after it as one given name"
# 'abd Allah Smith' and 'Salam, abd Allah'. `abd` joined
# BOUND_GIVEN_NAMES in 2.2 so the spellings that write the article as
# its own word join like `abdul`, `abdel` and `abdal` already did.
# v1 had no bound given-name join for it either, so the diff is the
# same shape at every baseline; the 2.0 and 2.1 ledgers carry the same
# rule.
#
# `abd` is also the postnominal ABD and stays in SUFFIX_ACRONYMS --
# position tells the two readings apart -- so the anchors are what
# keeps a trailing 'Jane Smith ABD' out of this rule.
#
# A third corpus name is claimed and does NOT move: a bare 'abd Allah',
# which has no third word for the join to leave as a family name, so
# P5's reserve declines and it reads given 'abd', family 'Allah' at
# every baseline. Same behaviour family as the two that move, so the
# claim is defensible -- recorded so it is not mistaken for coverage.
name_regex = "(?i)(?:^|,\\s*)abd\\s+\\S+"
fields = ["given", "middle"]

[[change]]
issue = "fix(#272/#308) nakaguro division and a glued hangul honorific in one name"
# '马丁·路德·金씨': two behaviours meeting in one name, which is why the
# single-cause CJK rules do not claim it. The nakaguro divides the
# name into given/middle/family and the glued 씨 peels off into
# `suffix`, so all four roles move at once. Literals rather than an
# alternation over the honorific vocabulary, because the rule is about
# the COMBINATION rather than about the vocabulary; it claims exactly
# the one corpus name.
name_regex = "^\\S*\u00b7\\S*\uc528$"
fields = ["given", "middle", "family", "suffix"]

[[change]]
issue = "fix(emoji-boundary) an emoji inside a token divides it"
# 'John😀Smith': 1.4 dropped the emoji and read one token
# (first='JohnSmith'); 2.x treats it as a division, so the name reads
# given 'John', family 'Smith'. rules.md#T1 documents both this and the
# keep-emoji policy reading.
#
# The emoji must stand BETWEEN two non-space characters, which is the
# behavior: it divides a token. A bare character class was the first
# draft and is rejected -- measured, it reaches four corpus names, and
# the three it adds carry a spaced or trailing emoji, are byte-identical
# on both sides today, and would be pre-excused by a rule that claims
# them. Pre-claiming shapes it has never seen is the #372 failure mode
# the fix(#379) comment names.
#
# The class is the ASTRAL HALF of _tokenize.py's _EMOJI_RANGES, hand
# copied and pinned by test_the_emoji_boundary_rule_copies_the_dividing_ranges.
# A single \U0001F300-\U0001FAFF span was the first draft and is wrong
# in the dangerous direction: it covers U+1F650-U+1F67F and
# U+1F700-U+1FAFF, where the parser does NOT divide, so the rule's own
# prose is false for about a thousand codepoints it would claim.
# 'John\U0001FA70Smith' reads given 'John\U0001FA70Smith' with no family --
# a future {given, family} diff on such a name, with some other cause,
# would classify here as intended. That is the same #372 shape this
# comment invokes against the bare class.
#
# The BMP half (U+2600-U+26FF, U+2700-U+27BF) is deliberately left out
# rather than copied: no corpus name reaches it once the token anchor
# is on, and a rule should be no wider than the diffs it must explain.
# A name that needs it will arrive unclassified and be read once. That
# omission also leaves the pattern free of \uXXXX-\uXXXX span text.
# That is a CONSEQUENCE, not a safeguard, and the #453 review was
# right to say so: _SPAN reads the 4-hex spelling only, so the class
# below rides past _unrecognized_class_content whatever it contains.
# What actually bounds it is the guard named above, which probes every
# codepoint in Unicode against _EMOJI_RANGES, plus _CORPUS_CLAIMS'
# reach and digest.
name_regex = "\\S[\\U0001F300-\\U0001F64F\\U0001F680-\\U0001F6FF]\\S"
fields = ["given", "family"]

[[change]]
issue = "fix(nickname-typographic-pairs) two typographic quote spans read as one nickname set"
# 'Hans „Erster“ und “Zweiter” Müller': 2.0 extracts typographically
# quoted nicknames, which v1 did not, and this name carries TWO spans
# in different pairs joined by a conjunction. Both come out as
# `nickname` 'Erster Zweiter', and what is left rejoins as a name --
# so `given`, `middle` and `family` all move as well.
#
# Deliberately narrower than "any typographic quote": the corpora hold
# four such names and the single-span ones ('Hans „Hansi“ Müller',
# 'John “Jack” Kennedy') are already accounted for elsewhere. The
# pattern asks for two spans of DIFFERENT pairs with a word between
# them, which is the shape that moves all four roles at once. A
# single-span regression must not be absorbed here. The fourth is
# 'Jane „JD Smith', an UNCLOSED span, which is neither category -- it
# does not diff at any baseline and no rule here claims it.
name_regex = "\u201e[^\u201c]+\u201c\\s+\\S+\\s+\u201c[^\u201d]+\u201d"
fields = ["given", "middle", "family", "nickname"]

[[change]]
issue = "fix(#379) a tussenvoegsel after a family comma attaches to the family"
# 'Vega, Juan de la': the Dutch alphabetized listing moves the
# tussenvoegsel behind the given name -- "Beethoven, Ludwig van" is how
# "Ludwig van Beethoven" is filed -- and 1.4 read the trailing particle
# run as a middle name. 2.2 attaches it to the family already named by
# the comma and renders it before the base, so `middle` empties and
# `family` grows. rules.md#P6 states it; the derived views move with it
# (family_particles 'de la', family_base 'Vega').
#
# Fields are {middle, family}: the given name does not move. `suffix`
# is deliberately NOT here, though the #380 half of the change does
# move a token out of it ('Berg, Jan vd' was suffix 'vd' at every
# baseline and is now family 'vd Berg'). Adding `suffix` to claim it
# costs three shapes this rule has no business explaining --
# {family,suffix} taken from fix(#380) below, and {middle,suffix}
# and {middle,family,suffix} taken from UNEXPLAINED, the last two
# being diffs in which `family` does not move at all. A rule that
# pre-claims shapes it has never seen is the #372 failure mode.
# The first name read fix(suffix-routing) until #451 deleted that
# catch-all, and it was already the wrong name by then: measured, a
# {family, suffix} diff on 'Berg, Jan vd' goes to fix(#380), which
# sits BELOW this rule, so claiming `suffix` here would take it from
# there. On a name this regex reaches that fix(#380)'s does not --
# 'Vega, Juan de la' -- the same diff went to the catch-all and
# arrives UNEXPLAINED now. Either way the decision below stands; only
# the rule the shape would be taken FROM has changed.
#
# 'Berg, Jan vd' entered corpus_issues.jsonl and corpus_rules.jsonl
# after this was written, and it did NOT arrive unexplained -- the
# fields-only catch-all took it, and _CROSS_RULE_WINNERS recorded the
# absorption rather than closing it. It has fix(#380)'s own rule now
# (#451, below). The declining was right; what was missing was the
# rule beside it.
#
# Latin-anchored over the WHOLE name, not just the trailing word: with
# a leading .* this absorbed non-Latin comma names whose diff has
# another cause -- a Cyrillic 'Smith, de la' moves {family} because the
# particle's RENDERING ORDER inside the family changed, which no rule
# in this ledger names, and it classified here. (No such name is in
# any corpus, so this is what WOULD happen. It would now arrive
# UNEXPLAINED and block the gate until someone read it, which is the
# right outcome: this ledger has no fields-only rule to absorb it any
# more. The claim that it "falls to the fields-only catch-all" was
# true until #451 deleted that rule, and this file now says what its
# 2.0.0 and 2.1.0 copies have said since 8237b54.) The class is the
# neighbours' and compare.py's own: U+0000-U+024F, which stops at
# Latin Extended-B, so a diacritic-bearing 'Nguyen, Van de la' in NFD
# or Latin Extended Additional is outside it.
#
# What the rule still over-claims is vocabulary, not script: any Latin
# comma name ending in an alternation member is claimed whatever the
# naming tradition, so a future {middle,family} regression on
# 'Nguyen, Van' -- one of the two corpus names it reaches, and the one
# that does NOT move -- would classify as intended.
name_regex = "(?i)^[\\u0000-\\u024f]*,[\\u0000-\\u024f]*\\s(de|del|den|der|di|do|dos|du|la|le|los|mc|van|vd|von|zu)(\\s+(de|del|den|der|di|do|dos|du|la|le|los|mc|van|vd|von|zu))*\\s*$"
fields = ["middle", "family"]

[[change]]
issue = "fix(#380) a trailing vd after a family comma is the tussenvoegsel, not a post-nominal"
# 'Berg, Jan vd': the tree reads it given 'Jan', family 'vd Berg',
# suffix '' -- the trailing 'vd' attaches to the family the comma
# already named, the same P6 precedence fix(#379) states above for the
# leading-particle shapes. Whether 1.4 itself read the trailing word
# as `suffix` is outside what this ledger's worker can check directly
# (tools/differential/README.md's warning against reading a v1 release
# from a cached environment); the diff this rule explains at this
# baseline moves exactly {family, suffix}, which is consistent with
# that reading and is what the fields below claim.
#
# decisions.md#vocabulary-collisions C-ii records the word itself:
# "vd is the live case: never-given particle AND credential acronym
# (the British Volunteer Decoration), neither of them a name.
# Decision: the Dutch van der reading, as the more common." #380 is
# named there as the trailing-orphan half that decision unblocks.
#
# The {family, suffix} companion to fix(#379) above, which claims
# {middle, family} and deliberately declined `suffix` -- that
# comment's own accounting of what claiming it would have cost stands
# as written; this rule is the piece it left out, not a widening of
# it.
#
# Ported verbatim from expected_since_2.0.0.toml, issue text and regex
# included, so the _MUST_NOT_MATCH "fix(#380)" key that already guards
# the 2.x copies guards this one too. Latin-anchored over the whole
# name for fix(#379)'s reason: with a leading .* it would absorb
# non-Latin comma names whose diff has another cause.
#
# The regex also reaches 'Berg, abdul vd', which fix(comma-precomma-family)
# above claims on {family, given} -- a different diff shape, so this
# rule's {family, suffix} fields never match it and it is not claimed
# here. That reach is real, so 'Berg, abdul vd' is NOT a
# _MUST_NOT_MATCH probe for this rule: that roster tests the regex,
# not classify().
name_regex = "(?i)^[\\u0000-\\u024f]*,[\\u0000-\\u024f]*\\svd\\s*$"
fields = ["family", "suffix"]

[[change]]
issue = "fix(#342) NOT WANTED: a bare trailing 'Rai' is read as a post-nominal suffix and the family is lost"
# 'Aishwarya Rai': the tree reads given 'Aishwarya', family '', suffix
# 'Rai'. 'rai' is a bare entry in SUFFIX_ACRONYMS
# (nameparser/config/suffixes.py -- not SUFFIX_ACRONYMS_AMBIGUOUS,
# not SUFFIX_WORDS), so the credential reading outranks the surname
# reading with nothing to arbitrate them.
# #342 (OPEN, milestone v2.2, bug) reports this: Rai, in the issue's
# own words, is "a common surname across Hindi- and Bengali-speaking
# regions," and the bulk 2019-12-11 wikipedia post-nominal import
# (af5bdab) that added it was never reviewed against that collision.
#
# Whether 1.4 itself read the trailing word as `family` is outside
# what this ledger's worker can check directly
# (tools/differential/README.md's warning against reading a v1 release
# from a cached environment); the diff this rule explains at this
# baseline moves exactly {family, suffix}, which is consistent with
# that reading and is what the fields below claim.
#
# Classified because the cause is known and recorded, NOT because the
# reading is wanted -- decisions.md#P5's 2026-08-22 #369 entry
# attributes that exact wording, quoted verbatim, to the previous
# fix(#369) ledger rules (since rewritten, because #369 itself was
# fixed). A [[never]] exclusion was considered and rejected: an
# excluded name reports UNEXPLAINED and exits non-zero, which would
# redden the 1.4.0 gate and block every release until #342 lands --
# and #342 lists two candidate fixes that trade different corpus
# names against each other, so which one lands is not yet decided.
#
# DELETE THIS RULE when #342 lands. The gate then reports it as
# 'EXPLAINED NOTHING', which is the reminder.
#
# Literal-anchored to the one corpus name that reaches this shape. A
# rule keyed on the SUFFIX_ACRONYMS collision itself, rather than the
# literal name, would claim every trailing acronym-shaped surname and
# pre-excuse regressions on names nobody has looked at.
name_regex = "(?i)^aishwarya\\s+rai$"
fields = ["family", "suffix"]

[[change]]
issue = "fix(#397) NOT WANTED: a trailing Catalan/Polish linking 'i' is read as a generation marker and the family is lost"
# 'Carod i': the tree reads given 'Carod', family '', suffix 'i'. 'i'
# is a bare entry in SUFFIX_WORDS (nameparser/config/suffixes.py --
# the Roman-numeral generation markers i/ii/iii/iv/v, not
# SUFFIX_ACRONYMS), so a two-word name ending in it reads as a
# name plus a trailing generation rather than a two-word family link.
# #397 (OPEN, milestone v2.2, enhancement) reports that Catalan and
# Polish link two surnames with 'i' functioning as a conjunction, the
# way Spanish already links them with 'y' ("Juan Garcia y Lopez" reads
# family 'Garcia y Lopez'); nameparser's CONJUNCTIONS vocabulary does
# not include 'i', so nothing there joins the link, and SUFFIX_WORDS'
# numeral reading is what actually claims the trailing word instead.
#
# Whether 1.4 itself read the trailing word as `family` is outside
# what this ledger's worker can check directly
# (tools/differential/README.md's warning against reading a v1 release
# from a cached environment); the diff this rule explains at this
# baseline moves exactly {family, suffix}, which is consistent with
# that reading and is what the fields below claim.
#
# Classified because the cause is known and recorded, NOT because the
# reading is wanted -- the same standing fix(#342) above claims, from
# decisions.md#P5's 2026-08-22 #369 entry. A [[never]] exclusion was
# considered and rejected for the same reason as fix(#342) above: an
# excluded name reports UNEXPLAINED and exits non-zero, and #397's own
# "What needs deciding" section leaves open both whether 'i' joins
# CONJUNCTIONS at all and how the join's rootname carve-out should
# treat a word that is both a conjunction and suffix vocabulary --
# unresolved, so the fix is not yet in hand.
#
# DELETE THIS RULE when #397 lands. The gate then reports it as
# 'EXPLAINED NOTHING', which is the reminder.
#
# Literal-anchored to the one corpus name that reaches this shape, for
# fix(#342) above's reason: a rule keyed on "two-word name, trailing
# single letter" would pre-excuse every generation-marker regression,
# not just this one. Measured, the four longer corpus names in the
# same family produce no diff at this baseline at all, so none of them
# reaches classify() and none needs a rule here: 'Carod i Rovira',
# 'Josep Carod i Rovira' and 'Josep Lluis Carod i Rovira' read 'i' into
# `middle` with `family` already the tail word ('Rovira'), and 'Lluis
# Carod i' reads it into `suffix` with `family` already populated
# ('Carod') -- unlike 'Carod i' above, none of the four has an empty
# `family`, and all four read this way at every baseline this ledger's
# worker can reach. That is #397's open enhancement (the family link
# is still one word short of what a Catalan reader wants), not a
# 1.4-to-2.x regression, so it is out of scope for a ledger that only
# records diffs FROM 1.4.0.
name_regex = "(?i)^carod\\s+i$"
fields = ["family", "suffix"]

[[change]]
issue = "fix(suffix-delimiter-rendering) no-space delimiter core token kept whole"
# Only fires when a custom suffix delimiter is configured (Policy /
# Constants.suffix_delimiters); the corpus runs with default policy, so
# this rule is expected to match nothing here. Kept for documentation
# parity with tests/v2/cases.py's 'suffix_delimiter_no_space_core' row
# (anti-#100; mechanisms.md#SPANS).
dormant = "the no-space delimiter rendering fires only under a non-default Policy, and the corpora run under the default one, so no corpus name can reach this rule. Kept because the behavior family is real and documented in tests/v2/cases.py: the rule is ready the moment a matching string is added"
name_regex = "/"
fields = ["suffix"]

[[change]]
issue = "ambiguous-surname-acronym data change: parenthesized (MA)/(DO) now stays nickname"
# suffix_acronyms_ambiguous gained 'ma'/'do' so bare 'Jack Ma' keeps its
# surname (v1 parity restored); side effect: parenthesized/quoted "MA"
# or "DO" no longer escape to suffix (v1 did, since v1 treated them as
# unambiguous there) -- they now fall through to nickname parsing.
# Not expected to fire against this corpus (no such strings survived
# into the v1 banks); kept for documentation completeness.
# The members are the entries themselves, undotted. They carried
# optional periods until corpus_rules.jsonl (#414) brought in 'John
# Smith M.A.': the member `m\.?a\.?` reaches the fragment 'M.A.' in
# that name, and a fragment a member matches has to BE a vocabulary
# entry -- 'M.A.' is not one. The bracket class around the alternation
# meant the RULE never claimed that name, but the member-level guard
# is the one that holds here, because a rule can widen at depth 0
# later and leave a broad member governing it. A parenthesized dotted
# '(M.A.)' should now arrive UNEXPLAINED and be read once, which is
# the same discipline the rest of this file states.
dormant = "no corpus contains a parenthesized (MA) or (DO), so this data change has no diff to explain here. Kept so the rule is ready the moment such a name is harvested"
name_regex = "(?i)[(\"'](ma|do)[)\"']"
fields = ["suffix", "nickname"]

[[change]]
issue = "feat(#269) Arabic بن prefix chains onto family (non-Latin new-recognition)"
# '‏محمد بن سلمان‏': #269 adds the native-script Arabic
# patronymic particle بن ("bin"/"son of") to PARTICLES/
# NON_GIVEN_NAME_PARTICLES. v1 had no such entry, so it left بن a plain
# middle-name token ('سلمان' alone as last); 2.0 now chains it onto the
# family the same way 'von'/'bin' (Latin) do, giving family 'بن سلمان'.
# This is new-recognition on non-Latin input -- the exact behavior
# #269 exists to add -- not a Latin-corpus regression, so it is
# classified rather than reverted.
# Word-bounded: a bare "بن" would also match the substring inside e.g.
# لبنان ("Lebanon") and silently absorb unrelated middle/last diffs.
name_regex = "\\bبن\\b"
fields = ["middle", "family"]

[[change]]
issue = "feat(#273) typographic nickname delimiters recognized by default"
# 'John “Jack” Kennedy', 'Hans „Hansi“ Müller', 'Jean «Petit» Dupont':
# v1 knew only straight quotes and parentheses, so a smart-quoted or
# guillemet-wrapped nickname leaked into `middle` as literal text.
# Matches only when such a delimiter is actually present. A nickname
# diff on the ASCII pairs would be a regression; the ASCII-pairs
# [[never]] entry at the end of this file is what refuses it, not this
# rule's silence (#328), in any position the pair can take. See that
# entry for why the delimiter's position turned out not to be the
# thing worth narrowing on.
name_regex = "[“”„«»「」『』（）]"
fields = ["middle", "nickname"]

[[change]]
issue = "fix(cjk-delimited-nickname) delimiter recognition compounds with the CJK order flip"
# '山田「タロ」太郎', '山田 太郎 (マイケル・ジャクソン)': one name, two
# intended changes at once -- the corner-bracket/nakaguro handling
# (2.0's typographic delimiters; 2.1's dot separator rendering the
# nickname join with a space) changes `nickname`, while the same
# name's wholly-CJK remainder takes the 2.1 family-first flip in
# first/last. Neither single-change rule may claim the union (the
# delimiter rule's fields exclude first/last, the CJK rule's exclude
# nickname -- each on purpose, so a lone regression in the other's
# fields stays loud). Both lookaheads are required: the delimiters
# alone would match 'John 「Jack」 Kennedy' -- the brackets sit in CJK
# Symbols and Punctuation, OUTSIDE every classified span, so a Latin
# name can carry them -- and would then absorb a bare first/last
# regression on it. Requiring a classified codepoint too confines the
# rule to names the order flip can actually reach. The second
# lookahead's class is the same hand copy of _SCRIPT_RANGES the rule
# above carries, pinned by the same sync test. One absorption is
# inherent and accepted: a nickname-ONLY diff on a nakaguro name
# ('マイケル・ジャクソン') classifies here, because subset-matching
# cannot REQUIRE a field to have changed. Positional note: this rule
# overlaps the CJK rule above and the delimiter rule below; within
# the name_regex tier file order decides which label a diff reports
# under, so it sits after the tighter single-change rules on purpose.
# The slug is free-form. It used to avoid the literal #271/#272
# strings, because a pin selected the canonical CJK rule by those
# substrings and asserted uniqueness; that pin is gone (#333) and the
# span sweep finds rules by their character class instead.
name_regex = "(?s)(?=.*[「」『』・･])(?=.*[\\u3005-\\u3006\\u3040-\\u309F\\u30A0-\\u30FF\\u3400-\\u4DBF\\u4E00-\\u9FFF\\uF900-\\uFAFF\\uAC00-\\uD7A3\\uFF65-\\uFF65])"
fields = ["given", "family", "nickname"]

[[change]]
issue = "fix(cjk-fullwidth-paren-nickname) fullwidth-parenthesis recognition compounds with the CJK order flip"
# '山田 花子（旧姓 佐藤）', which reached the corpus from the #329 case
# table via build_cjk_corpus.py. It is NOT a #329 diff: that change is
# gated on a non-empty Policy.maiden_delimiters and the harness runs
# the default policy, where （） is a #273 NICKNAME delimiter. So the
# same two intended changes as the rule above, with a different
# delimiter pair -- 1.4 knew no fullwidth pair and read the brackets as
# name text (first 山田 / middle '花子（旧姓' / last '佐藤）'), while 2.0
# extracts the clause to `nickname` and the wholly-Han remainder left
# behind takes the family-first flip.
#
# Its own rule rather than a widening of fix(cjk-delimited-nickname),
# on both halves. That rule's `fields` deliberately exclude `middle`,
# and this diff has one: the fullwidth clause is written flush against
# the token before it, so 1.4's tokenizer left '花子（旧姓' as a single
# middle-name word -- a spaced corner-bracket name never does that.
# Adding `middle` there would pre-excuse a bare middle regression on
# '山田「タロ」太郎'. Its delimiter set is separately pinned in
# tests/v2/test_ledger_guards.py as "its own decision surface", so
# widening it is a deliberate act with a test to update, and there is
# nothing to gain by making it here.
#
# Both lookaheads are required for the reason given on the rule above:
# （） lives in Halfwidth and Fullwidth Forms, outside every classified
# span, so a Latin name can carry it ('John （Jack） Kennedy') and the
# delimiter alone would let this rule absorb a first/last regression on
# one. The span class is the same hand copy of _SCRIPT_RANGES the rules
# above carry, pinned by the same auto-discovering test. The slug is
# free-form; the #271/#272 substrings it avoids were a constraint of a
# selector retired in #333.
#
# DORMANT since 2.2, and the reason is a migration rather than a
# revert. Its one name moved to fix(cjk-maiden-marker) above: under
# rules.md#M3 the fullwidth clause is read on the strength of the 旧姓
# inside it, so the clause lands in `maiden` and `nickname` no longer
# diffs at all -- 1.4 read the brackets as name text and had no
# nickname here either. The diff is now {given, middle, family,
# maiden}, which is a subset of that rule's fields and not of this
# one's, so classify() hands the name over. That is the right home:
# what the name demonstrates today IS a marker consumption, and the
# fullwidth pair is only what makes the marker a separate token.
#
# Kept rather than deleted because the reasoning below is about the
# `fields` boundary between this rule and fix(cjk-delimited-nickname),
# which nothing else records, and because the declaration is load
# bearing in reverse: if a fullwidth-bracketed CJK NICKNAME diff ever
# appears again, this rule wakes and the harness says the dormant
# reason has gone false.
dormant = "its one name, '山田 花子（旧姓 佐藤）', diffs in `maiden` rather than `nickname` since rules.md#M3 and is claimed by fix(cjk-maiden-marker); no other corpus name pairs a fullwidth bracket with a CJK script"
name_regex = "(?s)(?=.*[（）])(?=.*[\\u3005-\\u3006\\u3040-\\u309F\\u30A0-\\u30FF\\u3400-\\u4DBF\\u4E00-\\u9FFF\\uF900-\\uFAFF\\uAC00-\\uD7A3\\uFF65-\\uFF65])"
fields = ["given", "middle", "family", "nickname"]

[[change]]
issue = "fix(cjk-comma-honorific-peel) glued honorific peels off a post-comma given name"
# '김, 민준씨' / '田中, 太郎さん': the comma already fixes family/given
# order on both sides, so NO order flip happens -- `family` is
# byte-identical. The only change is #312's peel: the honorific glued
# to the post-comma given name comes off into `suffix` (민준씨 ->
# 민준/씨, 太郎さん -> 太郎/さん). Diff is exactly {given, suffix} on
# all seven names this rule claims.
#
# Its own rule because neither neighbour describes it, and #372 is
# about rules explaining what they describe. fix(comma-family) above
# is the Latin lone-post-comma-piece routing and is now anchored to
# Latin, so it cannot reach these at all. fix(cjk-comma-compound)
# below is for the UNION -- comma routing AND the family-first flip
# together -- which is why its fields include `family`; these names
# move no family, so claiming them there would be the same field-shape
# coincidence #372 was filed over, relocated rather than fixed.
#
# `fields` is what separates the two, not file order. The union rows
# ('Dr 김민준씨, V.', '田中さん, PhD') diff with `family` in the mix,
# which is outside this rule's [given, suffix], so they cannot match
# here however early it sits and still fall through to the compound
# rule. Written above it anyway, so the narrower rule is also the
# earlier one and the tie never has to be reasoned about.
#
# The regex is the same comma-plus-classified-codepoint pair the
# compound rule carries, hand-copied from _SCRIPT_RANGES and pinned by
# the same sync test -- a comma alone matches every Latin 'Smith, Jr.'
# in the corpus.
name_regex = "(?s)(?=.*,)(?=.*[\\u3005-\\u3006\\u3040-\\u309F\\u30A0-\\u30FF\\u3400-\\u4DBF\\u4E00-\\u9FFF\\uF900-\\uFAFF\\uAC00-\\uD7A3\\uFF65-\\uFF65])"
fields = ["given", "suffix"]

[[change]]
issue = "fix(cjk-comma-compound) comma routing compounds with the CJK order flip"
# '威廉·莎士比亚, PhD': one name, two intended changes at once -- the
# post-comma lone-piece routing (fix(comma-family): v1 read PhD as
# title; 2.x routes it to suffix) and the CJK source-order/family-
# first movement in first/middle/last on the pre-comma name. Neither
# single-change rule may claim the union: comma-family's fields
# exclude last, the CJK rule's exclude title/suffix -- each on
# purpose, so a lone regression in the other's fields stays loud.
# Both lookaheads are required, by the same reasoning as the
# delimiter compound above: a comma alone matches every Latin
# 'Smith, Jr.' in the corpus, and the classified-codepoint lookahead
# confines the rule to names the CJK behaviors can actually reach.
# The class is the same hand copy of _SCRIPT_RANGES the rules above
# carry, pinned by the same sync test. The slug is free-form; the
# #271/#272 substrings it avoids were a constraint of a selector
# retired in #333.
#
# #312 sends only the glued-honorific comma rows whose diff includes
# `family` here ('Dr 김민준씨, V.', '田中さん, PhD') -- the union this
# rule is for. The rows whose diff is only {given, suffix} peel
# without any order flip and belong to fix(cjk-comma-honorific-peel)
# above, which names that shape and whose fields exclude `family` so
# the two cannot compete. Until #372 they landed on fix(comma-family)
# instead, on nothing but file order.
name_regex = "(?s)(?=.*,)(?=.*[\\u3005-\\u3006\\u3040-\\u309F\\u30A0-\\u30FF\\u3400-\\u4DBF\\u4E00-\\u9FFF\\uF900-\\uFAFF\\uAC00-\\uD7A3\\uFF65-\\uFF65])"
fields = ["given", "middle", "family", "title", "suffix"]

[[change]]
issue = "fix(cjk-glued-honorific-peel) glued honorific peels into suffix"
# '김민준씨' -> 김/민준/씨, '田中さん' -> 田中/さん, 'Andersonさん' ->
# Anderson/さん: #312's peel, on a name with no space before the
# honorific and no comma anywhere. 17 corpus names, which fell to the
# fields-only fix(suffix-routing) catch-all (deleted in #451) until
# #372 gave them a rule that names them.
#
# The regex is this file's first hand copy of GLUED_HONORIFICS rather
# than SUFFIX_WORDS, and that narrower vocabulary is the whole reason
# this rule can exist. '김민준씨' and the given name '김지양' are the
# same string shape -- hangul ending in a character the spaced list
# calls an honorific -- so a rule keyed on SUFFIX_WORDS could not tell
# them apart, and unanchoring the spaced rule below to reach the glued
# forms would let a future suffix regression on '김지양' classify as a
# recognized honorific. GLUED_HONORIFICS settles it in the config
# instead: 양, 군, 氏, 殿 and 博士 are deliberately absent from it,
# because a glued match on those collides with real given names. Same
# copy, same pin (_HONORIFIC_SOURCES) as the 2.0 ledger's twin, whose
# regex this is verbatim.
#
# `\.?(?=$|[ ,])` rather than `$`: the honorific ends a TOKEN, not
# necessarily the string. '田中さん II' and '김민준씨 Jr.' carry a
# Latin suffix after it, '김민준씨 (Jimmy)' a nickname.
#
# One spaced name lands here and is left that way, exactly as the 2.0
# twin records: '김민준 박사님' matches on its 님, glued to 사 inside
# 박사님. The label stays true of it -- the peel is what routes it to
# `suffix` -- and closing the overlap needs a lookbehind asserting the
# match is not interior to a longer listed honorific, which is more
# machinery than a correct label is worth.
name_regex = "(?<=[^\\s,])(?:박사님|선생님|교수님|박사|씨|님|先生|女士|小姐|教授|様|さん|さま|くん|ちゃん)\\.?(?=$|[ ,])"
fields = ["given", "family", "suffix"]

[[change]]
issue = "fix(cjk-honorific-suffix) postnominal honorifics recognized, compounding with the CJK order flip"
# '王小明 先生', '김민준 씨', '田中 太郎 様': #307 ships the spaced CJK
# honorifics as suffix vocabulary, so a trailing 先生/씨/様 moves to
# `suffix` where 1.4 read it as a name part -- and the remaining
# wholly-CJK name simultaneously takes the family-first flip, so a
# three-token name moves `middle` too, which is what carried it past
# the fields-only suffix-routing rule while that rule existed (#451
# deleted it). Keyed on the honorific alternation itself
# (the maiden-marker rule's pattern): the trigger tokens are wholly
# CJK characters, so the rule matches only a name whose TRAILING
# token is a listed honorific -- a mostly-Latin name with one
# ('Wang Xiaoming 先生') is inside its shadow, accepted because the
# recognized honorific is the diff's cause there too, and the
# alternation is a hand copy of SUFFIX_WORDS' CJK entries --
# pinned by tests/v2/test_ledger_guards.py, which derives the expected
# set from the config by script membership. Anchored to a WHOLE
# trailing token ((?:^| )...$), judged on the NAME STRING: without
# it, any name string merely ENDING in 양/군 -- the glued given name
# 김지양, the spaced 김 지양 -- would match and could have a real
# regression absorbed as intentional (the case table pins the
# parser-side twin: suffix matching is whole-token, never endswith).
# GLUED diffs (田中さん, 김민준씨, and the 김씨 that segmentation
# already reached) never match this rule -- the anchor is judged on
# the name STRING, and a glued form has no space before its
# honorific. They fell to the fields-only suffix-routing rule by
# their {first, last, suffix} shape (v1 held the whole token in
# first, so last moves too) -- field-honest, even though that rule's
# prose described the two-token Latin case. Verified by the
# 2026-07-30 run, not assumed: #308's peel put a dozen glued names
# in the corpus (Latin+glued like Andersonさん included) and every
# one classified there -- none carried a middle-field diff. They have
# fix(cjk-glued-honorific-peel) above since #372, and the catch-all
# they were falling to is gone (#451), so the sentence is history:
# nothing absorbs a glued diff this rule declines any more.
name_regex = "(?:^| )(?:씨|박사|박사님|선생님|교수님|군|양|님|先生|女士|小姐|博士|教授|様|氏|殿|さん|さま|くん|ちゃん)\\.?$"
fields = ["given", "middle", "family", "suffix"]

[[change]]
issue = "feat(#269) non-Latin titles/conjunctions recognized"
# 'г-н Иван Петров' (Cyrillic title), 'Хосе И Мария Сантос' (Cyrillic
# conjunction И joining two given names). v1 shipped Latin-only
# vocabulary, so these were plain name tokens and everything shifted
# one position. New recognition on non-Latin input -- the point of
# #269 -- not a Latin-corpus regression.
#
# Cyrillic only, and only the three fields the shift can touch. The
# first draft allowed five fields across four scripts, which put every
# Arabic name in the corpus -- including ones that are currently
# PARITY -- into its shadow, and pre-excused Greek and Hebrew, against
# which nothing has ever been compared. A leading title or an absorbed
# conjunction moves a word from `first` to `title`, or from `middle`
# into `first`; it cannot reach `last` or `suffix`. Widen this only
# with a name that demonstrates the need, and prefer a new rule per
# script over loosening this one -- the \bبن\b rule below is the
# model.
name_regex = "[\\u0400-\\u04FF]"
fields = ["title", "given", "middle"]


[[change]]
issue = "fix(leading-credential) a split 'Ph. D.' before the name stays one unit"
# 'Ph. D. John Smith'. v1 healed the adjacent 'Ph.'/'D.' pair only when
# it TRAILED; leading, it split them -- title 'Ph.', given 'D.', and
# the real given name pushed to middle. 2.0 keeps the credential whole
# and routes it to `suffix`, which is the post-nominal field, so a
# leading credential lands there rather than in `title`. Slightly odd
# positionally, and still strictly better than manufacturing a given
# name out of 'D.'.
#
# Anchored to the START on purpose. Trailing 'Ph. D.' is PARITY and
# stays unclassified below; widening this regex would mask a
# regression in the shape that is the whole reason fix_phd exists.
#
# `family` joined the roles when #413's harvest brought three names
# into this rule's reach, two of which move it: a bare 'Ph. D.' (1.4
# read family 'D.', now suffix) and 'Ph. D. Van Johnson' (1.4 read
# family 'Van Johnson', now given). Both move `family` for the same reason the other roles
# move -- the credential stops being split into a title and a given
# name, and everything behind it shifts one place. The REGEX is
# untouched; only the roles the same shape was always going to move
# are now recorded.
name_regex = "^Ph\\. ?D\\."
fields = ["title", "given", "middle", "family", "suffix"]

# Deliberately NOT a [[change]] rule: TRAILING 'Ph. D.' split-token
# healing ('John Ph. D.', 'John Smith, Ph. D.') is PARITY, not a 2.0
# behavior change -- v1's fix_phd healing of the adjacent 'Ph.'/'D.'
# pair into one suffix unit is replicated exactly by 2.0's 'joined'
# vocab tag (tests/v2/cases.py classification="parity" on both
# 'phd_split' and 'suffix_comma_split_phd'; verified empirically, zero
# diff against the 1.4 worker). Adding a suppression rule for it would
# risk masking a real regression in this exact shape, so the
# trailing-'Ph. D.' [[never]] entry below refuses it instead: any diff here
# reports UNEXPLAINED (#328). (The leading case above is a separate
# shape, which is why it needed its own anchored rule rather than a
# widened one.)
#
# The scope of what is parity still has to be read narrowly. Parity is
# the two inputs named above, where the pair LEADS its run. A trailing
# pair after another suffix diffs on ORDER -- 'John Smith, Jr. Ph. D.'
# is 1.4.0 suffix 'Ph. D., Jr.' against 2.0's 'Jr. Ph. D.', because
# fix_phd extracted the credential pre-parse and re-appended it while
# 2.0 renders the tail as written (tests/v2/cases.py
# 'suffix_comma_split_phd_after_another_suffix',
# classification="fix(credential-pair-order)"). That input is in the
# case table and in no corpus, so nothing is reported on it either
# way; note that the trailing-'Ph. D.' [[never]] entry's anchor
# captures it too, and would call its intended order diff a regression
# if a corpus ever gained it. Reconciling them then means a narrower
# `name_regex`, and only that: the two renderings differ in the ORDER
# of one suffix string and in nothing else, so the diff is `suffix`
# alone -- the one field the parity promise is about. Any `fields`
# list permissive enough to let the order diff classify would abandon
# the promise. Not a question to settle now, on a name the harness
# never sees.
#
# No ordering question arises here: exclusions are consulted before
# any rule, so this is independent of where it sits in the file.
#
# Before the [[never]] entry existed this shape was ABSORBED rather
# than refused: fix(comma-family) below matches on a bare comma and
# lists `suffix`, so a probe corpus carrying the name came out
# unexplained 0. That is one of the instances filed as #372. It is
# no longer what happens here -- exclusions are consulted first, so
# the name is refused before any rule sees it -- and #372 tracks the
# general problem, which this entry does not solve.

[[change]]
issue = "fix(#369) a given-name title licenses the bound given-name join with one word to spare"
# 'Sheik abdul salam': rules.md#P5 -- "or after a given-name title,
# which asserts that a given name follows (H1): there the two words
# join and the name has no family". Given 'abdul', family 'salam'
# becomes given 'abdul salam', family '' -- the empty family H1
# accepts for "Sir John". The 'Sheik abdul salam Jr' rules example
# is the same move with the suffix standing; 'Sheik abdul Jr Smith'
# is in reach and does not move -- the licence takes a name word,
# not a suffix.
#
# 'Sheik Abu Bakar', the #367 regression this issue was filed for,
# reads given 'Abu Bakar' again with every field byte-identical to
# this baseline, so no rule names its fields: restored, not moved.
#
# Without this rule the name landed on the fields-only
# fix(suffix-routing) catch-all, which moved no suffix here. #451
# deleted that catch-all, so this ledger has no fields-only rule left
# to absorb anything.
name_regex = "(?i)^sheik\\s+abdul\\b"
fields = ["given", "family"]

[[change]]
issue = "fix(#401) the bound-given reserve counts the trailing numeral assign reads as the suffix"
# 'abdul Smith V', 'abdul Smith Jr V': rules.md#P5 -- "a trailing
# roman numeral that assign reads as the suffix (S2) is no word to
# spare, and is not joined". first 'abdul Smith', last 'V' -> given
# 'abdul', family 'Smith', suffix 'V'; at this baseline the V was not
# read as a suffix, so all three fields move here where the 2.x
# ledgers list two. Both are rules.md examples; no differential corpus
# name has the shape. The 'abdul Smith V Ph. D.' spelling stays out
# of the corpus: a trailing split credential is this ledger's
# [[never]] shape, and its v1 reading carries the same family loss
# that entry would then refuse to explain.
#
# A rule with fewer fields than this diff silently handed the name to
# the fields-only fix(suffix-routing) catch-all, which is how this fix
# was first recorded as "1.4.0 parity": the catch-all's printout was
# capped, and EXPLAINED NOTHING is not byte-identical. #451 deleted
# that catch-all, so a narrowed rule here now costs the name its
# explanation outright instead of hiding it -- louder, and the reason
# the lesson is worth keeping written down.
name_regex = "(?i)^abdul\\s+smith\\s+(jr\\s+)?v$"
fields = ["given", "family", "suffix"]

[[change]]
issue = "fix(#421) the bound-given join never absorbs a suffix piece"
# 'abdul Jr Smith Berg': rules.md#P5 -- "the join never absorbs a
# marker standing as a word of its own -- a marker is not a name word
# (M2) -- nor a word of the unambiguous suffix vocabulary (S2),
# wherever position will then place it". given 'abdul Jr', middle
# 'Smith' -> given 'abdul', middle 'Jr Smith'. Parity with this
# baseline until now; a
# rules.md example, since no differential corpus name has the shape.
name_regex = "(?i)^abdul\\s+jr\\s+smith\\s+berg$"
fields = ["given", "middle"]

[[change]]
issue = "fix(#421) the bound-given join never absorbs a split credential"
# 'abdul Ph. D. Smith Berg': the rule above, on the split credential.
# At this baseline v1's fix_phd extracted the credential before
# parsing, so: first 'abdul Smith', suffix 'Ph. D.' -> given 'abdul',
# middle 'Smith', suffix 'Ph. D.' -- the suffix field unchanged here,
# the given deliberately not restored (decisions.md#P5), so this
# ledger lists two fields where the 2.x ledgers list three. A rules.md
# example; no differential corpus name has the shape.
name_regex = "(?i)^abdul\\s+ph\\.\\s+d\\.\\s+smith\\s+berg$"
fields = ["given", "middle"]

[[change]]
issue = "fix(#425) accepted: a bare ambiguous acronym the peel does not take joins as a name word"
# 'abdul Ma Smith': rules.md#P5 -- "a bare ambiguous acronym is a name
# word wherever the peel does not take it". first 'abdul', middle
# 'Ma' -> given 'abdul Ma': v1's join counted the acronym out as
# suffix vocabulary and declined; since 2.0 the join takes it, as
# assign reads it (a middle name, not a credential, with a family
# behind it). A 2.0 reading, byte-identical at 2.0.0 and 2.1.0, first
# witnessed here -- P5 records it as Accepted, and the example exists
# to carry the shape into this corpus.
name_regex = "(?i)^abdul\\s+ma\\s+smith$"
fields = ["given", "middle"]

[[change]]
issue = "fix(#424) an unlisted abbreviation is as transparent as a listed title to the leading particle, the P4 example"
# 'Xyz. van Johnson': the rules.md#P4 example of the 'Esq. van Gogh'
# rule of this change (beside the fix(#367) rules, further down),
# same reading and fields. Separate rather than an alternation, per
# the guards' one-alternation-per-rule roster.
name_regex = "(?i)^xyz\\.\\s+van\\s+johnson$"
fields = ["given", "family"]

[[change]]
issue = "fix(#424) accepted: the maiden walk keeps the numeral an initial before the marker vetoes"
# 'J. née Jones Smith V': rules.md#M2 -- the numeral is taken "read as
# the take would leave the name, the word before the numeral being
# then the word before the marker". 1.4.0 has no maiden support and
# read middle 'née Jones', last 'Smith', suffix 'V'; 2.x reads maiden
# 'Jones Smith V' with the J. before the marker vetoing the fork, as
# 'J. V' reads the V as a name. The fix(#274) rule's fields omit
# the suffix v1 read, so this accepted reading names its own.
name_regex = "(?i)^j\\.\\s+n[ée]e\\s+jones\\s+smith\\s+v$"
fields = ["middle", "family", "suffix", "maiden"]

[[change]]
issue = "fix(#424) accepted: the chain keeps an acronym assign will not peel behind a title-and-particle word"
# 'Freiherr von Berg MA': rules.md#P2 -- the trailing suffix is read
# "over the pieces the chain leaves". #367 stops the leading-particle
# scan at a title-and-particle word, so the chain takes 'von Berg',
# and the acronym the fork counted with three pieces meets assign
# with two; the chain asks the peel again and takes it. first 'von
# Berg', last 'MA' -> family 'von Berg MA' (master's reading since
# 2.0). A rules.md example. Without this rule the name landed on the
# fields-only fix(suffix-routing) catch-all -- the count was the tell.
# #451 deleted that catch-all, so this ledger has no fields-only rule
# left to absorb anything.
name_regex = "(?i)^freiherr\\s+von\\s+berg\\s+ma$"
fields = ["given", "family"]

[[change]]
issue = "fix(#424) a title-led chain before the numeral is the one name piece"
# 'Freiherr von Richthofen V': rules.md#P2 boundary -- the chain stops
# before the numeral, and the chain is then the one name piece, which
# reads as 'Dr. Smith V' reads. v1 read last 'von Richthofen V'; #424
# split the numeral off, and #410 then moved the one name piece behind
# the title out of `given`, so today it is family 'von Richthofen',
# suffix 'V' -- 'Dr. Smith V' moved the same way, so the comparison
# still holds. A rules.md example.
#
# The diff was {given, family, suffix} before #410 and is {family,
# suffix} after it. `fields` declared all three until this round, and
# that width is exactly why the movement never surfaced: the subset
# test kept matching as the diff shrank, so a real change of reading
# passed through a green run unnamed. The declaration is narrowed to
# what the diff actually is, which is what makes a future `given`
# regression on this name loud instead of absorbed. A `fields` list
# wider than the diff it explains is a silent absorber.
name_regex = "(?i)^freiherr\\s+von\\s+richthofen\\s+v$"
fields = ["family", "suffix"]

[[change]]
issue = "fix(#424) accepted: a particle of the suffix vocabulary opening the trailing run is a suffix piece"
# 'John Smith Mc V': rules.md#P2 Accepted -- "where it opens the
# trailing run the chain stops before it as before any suffix word,
# and the peel takes it". middle 'Smith', last 'Mc V' -> family
# 'Smith', suffix 'Mc, V'. A rules.md example; the class was found
# unrecorded by the second docs review of #424.
name_regex = "(?i)^john\\s+smith\\s+mc\\s+v$"
fields = ["middle", "family", "suffix"]

[[change]]
issue = "fix(#424) the particle chain stops before the trailing numeral"
# 'John van der Berg V': rules.md#P2 -- "a trailing suffix begins --
# read as assign will read it (S2): a trailing roman numeral, or a
# bare acronym with words to spare, ends the chain as a suffix word
# does". last 'van der Berg V' -> family 'van der Berg', suffix 'V',
# as 'John Smith V' reads. Shipped since 1.x: the chain's stop asked
# with the suffix-piece test, whose initial veto does not see a bare
# V. A rules.md example; no differential corpus name has the shape.
# Without this rule the name landed on the fields-only
# fix(suffix-routing) catch-all -- the count was the tell. #451
# deleted that catch-all, so this ledger has no fields-only rule left
# to absorb anything.
name_regex = "(?i)^john\\s+van\\s+der\\s+berg\\s+v$"
fields = ["family", "suffix"]

[[change]]
issue = "fix(#424/#445) accepted: the maiden walk keeps a bare acronym, and the lone name word is the family"
# 'John née Jones Smith Ma': rules.md#M2 -- "a bare acronym the peel
# would take with words to spare is maiden text all the same". middle
# 'née Jones', family 'Smith', suffix 'Ma' -> maiden 'Jones Smith Ma':
# v1 had no maiden support; 2.0 has read the name so since #274, and
# the walk deliberately leaves the acronym fork to assign (the count
# it needs includes the words the marker removes). The fix(#274) rule
# cannot carry it: its fields omit the suffix v1 read. A rules.md
# Accepted example, first witnessed here.
#
# Renamed for #445 (2026-08-27) rather than widened in place, because
# the diff now has two causes and one rule has to explain the whole
# of it. What the walk leaves is a single name word, and rules.md#M4
# makes that word the family: given 'John' -> family 'John', so
# `given` joins the four fields above. Attributing that to #424 alone
# would have been false, and leaving this rule at four fields would
# have made it explain nothing while the name went UNEXPLAINED --
# which is exactly how the gate reported it before this edit. The
# name is #445's only mover whose diff is not the shape the fix(#445)
# rule below carries, the suffix v1 read being the difference.
name_regex = "(?i)^john\\s+n[ée]e\\s+jones\\s+smith\\s+ma$"
fields = ["given", "middle", "family", "suffix", "maiden"]

[[change]]
issue = "fix(#360) ste moved into the never-given particles with mc"
# 'Ste Marie': the second word of the vocabulary move, which the
# fix(#360) comment in the 2.x ledgers names as a name that should
# arrive UNEXPLAINED and be read once. It has. Without this rule it
# landed on the fields-only catch-all, whose prose described a trailing
# credential rather than a leading particle folding into the family;
# #451 deleted that catch-all, so removing this rule now costs the
# name its explanation outright (measured through classify()).
name_regex = "(?i)^ste\\s+\\S+$"
fields = ["given", "family"]

[[change]]
issue = "fix(#360) mc moved into the never-given particles, so it folds into the family"
# 'Mc Donald': mc became a never-given particle, so the leading token
# stops being read as the given name and folds into the family instead
# ('Mc' + 'Donald' -> family 'Mc Donald'). The twin of the ste rule
# above, and written beside it for that reason.
#
# In `(?i)^mc\s+\S+$` the `mc` is a LITERAL anchored at the start,
# followed by whitespace and then exactly one token to the string's
# end. `\S+$`, not a `\b`, is what closes it: the pattern carries no
# word boundary at all. 'McDonald, Ronald' and 'Mcintyre Smith Jr.'
# fail on the whitespace, having none after 'mc'; 'Ste Marie' and
# 'Los Santos' fail earlier still, opening with neither letter. None
# of the four is this rule's to claim, whatever else explains it --
# and if one ever needs explaining, it needs a rule of its own. Do
# not widen this one to reach it: a rule claiming names its prose
# does not describe is what #451 is retiring.
#
# Ported verbatim from expected_since_2.0.0.toml, minus `_ambiguities`:
# below baseline 2.0 there is no v2 surface, so no diff can carry that
# pseudo-field and naming it would narrow by something unreachable.
# Until this port the name fell to the fields-only catch-all, which
# _CROSS_RULE_WINNERS recorded rather than closed (#451).
name_regex = "(?i)^mc\\s+\\S+$"
fields = ["given", "family"]

[[change]]
issue = "fix(#367) a title no longer displaces a leading never-given particle"
# 'Sir de Mesnil': the title stops pushing the particle out of the
# leading position, so the particle run reads as the family rather
# than the given name. The `de` sibling of the two #367 `van` rules
# below.
#
# `(?i)^sir\s+de\b` is anchored at the start, and its `\b` is real
# work rather than decoration: it is what keeps 'Sir Denis Smith' and
# 'Sir del Rio' out. The roster's own probes fail earlier -- 'John Sir
# de Mesnil' and 'Smith, Sir de Vaux' on the anchor, 'sir' opening
# neither string, and 'Sir Smith' on the literal 'de'. None of the
# three is this rule's to claim, whatever else explains it, and a name
# of that shape that ever needs explaining wants its own rule rather
# than a widening of this one (#451).
#
# Ported verbatim from expected_since_2.0.0.toml, whose copy already
# reads fields = ["given", "family"] and carries nothing to drop --
# unlike the #360 rule above, this one never claimed `_ambiguities`.
name_regex = "(?i)^sir\\s+de\\b"
fields = ["given", "family"]

[[change]]
issue = "fix(#424) an unlisted abbreviation is as transparent as a listed title to the leading particle"
# 'Esq. van Gogh' (corpus_issues): rules.md#P4 -- "An unlisted
# abbreviation before the particle is as transparent as a listed
# title, since assign reads it as one (H2)". title 'Esq.', last 'van
# Gogh' -> given 'van', family 'Gogh', as 'Dr. van Gogh' reads since
# #367 (whose rule below records v1's titled-particle reading). #367 keyed the leading-particle exception on the
# first piece of the name by group's title test, which does not see
# H2's abbreviations; the scan asks assign's test now. Literal for the
# reason the #367 rule gives: a regex cannot ask whether a word is a
# title, and this one cannot ask whether it is unlisted.
# Without this rule the name landed on the fields-only
# fix(suffix-routing) catch-all -- the count was the tell. #451
# deleted that catch-all, so this ledger has no fields-only rule left
# to absorb anything.
name_regex = "(?i)^esq\\.\\s+van\\s+gogh$"
fields = ["given", "family"]

[[change]]
issue = "fix(#367) a title no longer displaces a leading particle out of the leading position"
# 'Mr. Van Nguyen': a leading particle deliberately does not chain --
# that is what makes 'Van Nguyen' read as given Van, family Nguyen.
# Through 2.1 the exception was keyed on piece index 0, so a TITLE
# displaced the particle and the chain fired, giving family
# 'Van Nguyen' (v1's reading, which is why this name is parity with
# 1.4.0 until now). 2.2 keys it on the first piece of the NAME, so a
# titled name reads as the same text reads untitled.
#
# The wider class is any title followed by a particle -- 'Dr. Van
# Johnson', 'Sir de Mesnil', 'Sheik Abu Bakar' all move (the last restored
# by #369) -- and this
# regex names one title and one particle because 'Mr. Van Nguyen' is
# the one name in the corpora that moves. Deliberately narrower than
# the class: a corpus name that joins it later should arrive
# UNEXPLAINED and be read once, not be absorbed silently. Widen the
# literals then, and record the new count.
#
# Three joined through #413's backtick harvest: 'Dr. Van Johnson',
# 'Sir Van Johnson', 'Jr. Van Johnson'. Widened here as well as in the
# 2.0 and 2.1 copies -- widening only those left these three landing on
# the fields-only fix(suffix-routing) catch-all (deleted in #451),
# which is the very absorption this comment describes two paragraphs
# up. None of them is a two-token name and none moves a suffix.
#
# The title slot copies TITLES: all four spellings are in it. `jr` is
# also suffix vocabulary and reads as a title here simply because it
# is in TITLES and leads -- 1.4.0 already gives title 'Jr.' for
# 'Jr. Van Johnson', so that reading predates #367 entirely.
#
# The title slot is a LITERAL for that reason and not by accident.
# Nothing in a regex over the raw string can ask whether a word is a
# title, so the `(?i)^\S+\.?\s+van\b` this rule shipped with matched
# ANY first word: it reached 11 corpus names and explained 1. The
# other ten include 'Vincent van Gogh', 'VINCENT VAN GOGH' and
# 'Alex van Johnson' -- the "Van Johnson" family AGENTS.md names as a
# standard regression canary. name_regex rules sort ahead of
# fields-only ones and `fields` matches by subset, so a future
# regression on any of those would have been labelled fix(#367) and
# exited 0 -- a strict loss at this baseline, whose ledger was empty
# before. (`\.?` was inert into the bargain: `\S+` is greedy, so it
# had already taken the period.)
#
# `fields` is what carries the rest of the tightness -- and it is narrower
# than the change rather than a description of it. The change moves
# `title` as well: a word in BOTH vocabularies stops the transparency
# scan and stays a title piece instead of being chained onto the name,
# so 'Dr. St John Smith' goes from title 'Dr.', family 'St John Smith'
# to title 'Dr. St', given 'John', family 'Smith'. It moves `maiden`
# as well: un-chaining lets a marker standing behind the particle be
# seen at all, so 'Mr. Van Johnson nee Brown' goes from family
# 'Van Johnson nee Brown' with no maiden name to given 'Van', family
# 'Johnson', maiden 'Brown'. `suffix` and `nickname` are the two that
# genuinely never move. Naming three roles anyway is deliberate, for
# the reason the regex names only `van`: a corpus name that moves
# `title` or `maiden` should arrive UNEXPLAINED and be read once,
# rather than be absorbed here.
#
# This rule has to exist even though the run already exited 0 without
# it. The diff was being classified by fix(suffix-routing), a
# fields-only rule whose ["given", "family", "suffix"] was a superset
# of this diff's ["given", "family"] -- a rule about a trailing
# credential absorbing a leading-particle change, which is the
# mis-classification the README warns about. A name_regex rule
# outranks every fields-only one, so this claimed it back; #451 has
# since deleted the catch-all, and no ledger has a fields-only rule
# for anything to be claimed back from.
name_regex = "(?i)^(mr|dr|sir)\\.?\\s+van\\b"
fields = ["given", "middle", "family"]

[[change]]
issue = "fix(#367) an inferred title no longer displaces a leading particle either"
# 'Jr. Van Johnson': the same change as the rule above, for a leading
# piece the period-abbreviation inference reads as a title (H2). It
# sat in that rule's alternation as 'jr' while 'jr' was title
# vocabulary; #296's audit took it out (a postnominal only), so the
# member would now reach a word the vocabulary does not ship, and the
# shape gets its literal. The reading is unchanged: 'Jr.' is still a
# title by shape, and Van is still the leading name piece.
name_regex = "(?i)^jr\\.\\s+van\\b"
fields = ["given", "middle", "family"]

# Shapes that must never be explained. A [[change]] rule says "this
# diff is intended, and here is what changed"; there was no rule
# meaning "whatever happens here is a regression", so the two promises
# below could only be written as prose -- and both were false as
# written from the day they were written (the first shipped with the
# harness itself, the second three days later) until #328 found them.
#
# The two are not false alike, and the difference matters now that
# this file scopes the second promise to one reading. Both said
# "unclassified", unqualified, and both were claimed on SOME reading
# from day one. But only the Ph. D. promise was claimed on the reading
# it now protects; no rule has ever claimed the ASCII pairs' NICKNAME
# reading, then or today. That entry is a tripwire under no present
# tension, which is the point of setting it before the tension exists.
#
# classify() consults these before any rule, so a matching name
# reports UNEXPLAINED however many rules would claim it.
#
# `examples` is not decoration. A protected shape need not appear in
# any corpus -- 'John "Jack" Kennedy' does not -- so the entry carries
# its own test data, which tests/v2/test_ledger_guards.py runs against
# every non-empty subset of the fields a rule may name: the seven
# roles and the `_ambiguities` pseudo-field. An entry carrying
# `fields` is asked only about the subsets those cover -- 3 for the
# ASCII pairs, not 255 -- which is where the 387 in that file comes
# from.

[[never]]
why = "trailing 'Ph. D.' split-token healing is PARITY, not a 2.0 change: v1 healed the adjacent pair too, so a diff here is a regression"
# Anchored to the END, and that is the whole design. The promise names
# two forms -- 'John Ph. D.' and 'John Smith, Ph. D.' -- so an
# exclusion keyed on the comma protects half of it while looking
# complete. The anchor also keeps clear of 'Ph. D. John Smith', the
# LEADING shape, which has its own fix(leading-credential) rule that
# this must not silence. No `fields`: any diff on this shape is a
# regression, which is what omitting the key means.
#
# One shape this deliberately over-reaches: 'John Smith, Jr. Ph. D.'
# still matches, and its ORDER diff (1.4's 'Ph. D., Jr.' against 2.x's
# 'Jr. Ph. D.') is an INTENDED change -- cases.py classifies it
# fix(credential-pair-order). No corpus contains it, so nothing is
# silenced today. Erring toward refusal is the safe direction: an
# UNEXPLAINED diff blocks a release for scrutiny, where a wrongly
# classified one passes silently. If a corpus ever gains a
# <suffix> Ph. D. name, narrow this entry rather than widening a rule
# to claim it.
#
# One did, through #413's backtick harvest, and this is that
# narrowing. It is written as the ORIGINAL broad refusal minus three
# named exceptions, not as a positive description of the two promised
# shapes. The first attempt did the latter -- "a name then the
# credential, or two words, a comma, then the credential" -- and cut
# far more than the three: 'Smith, John Ph. D.', the ordinary
# family-first listing, and every multi-comma or mid-title form
# ('Smith, John, Ph. D.', 'Smith, Dr. John Ph. D.') stopped being
# refused. All of those are dead-parity today, so the gate stayed
# green while the tripwire was gone -- and a healing regression on
# them would then have classified under fix(comma-family) and exited
# 0, which is the outcome this entry's own `why` exists to prevent.
#
# The three exceptions, each diffing for a cause this ledger names
# elsewhere: a leading credential with no name before it
# (fix(leading-credential)), one word before the comma
# (fix(comma-precomma-family)), and a suffix word between the name and
# the credential (fix(credential-pair-order), its own rule below).
# Refusing those was the entry over-reaching; refusing anything else
# is the entry doing its job.
#
# Latin-anchored: an unrestricted trailing anchor also caught
# '田中さん, Ph. D.', whose diff is a real fix(cjk-comma-compound)
# classification -- measured, it took the gate to unexplained: 1. The
# cut is at U+0250, the same threshold _is_latin_only uses in
# compare.py, so it covers Latin-1 and Latin Extended-A and -B rather
# than bare ASCII: the split-token healing is script-independent, and
# 'José Smith, Ph. D.' is as much the protected shape as 'Jose Smith,
# Ph. D.' is. An ASCII-only class protected one and not the other.
name_regex = "(?i)^(?!\\s*ph\\.)(?![^\\s,]+\\s*,\\s*ph\\.\\s*d\\.\\s*$)(?![\\u0000-\\u024f]*\\b(?:jr|sr|ii|iii|iv)\\.?\\s+ph\\.\\s*d\\.\\s*$)[\\u0000-\\u024f]*\\bph\\.\\s*d\\.\\s*$"
examples = ["John Ph. D.", "John Smith Ph. D.", "John Smith, Ph. D."]

[[never]]
why = "feat(#273) recognizes TYPOGRAPHIC nickname delimiters; the ASCII pairs were already recognized in 1.4, so a NICKNAME diff on them is a regression"
# Narrowed by ROLE, not by shape, and the reason is measured.
#
# By shape this covers a delimited run anywhere: leading
# ('"Rick" Edmonds'), medial ('John (Jack) Kennedy') or trailing
# ('Franklin, Benjamin (Ben)'), with a word character or a period as
# the inner flank so a middle initial counts ('Cherice J. (Johnson)
# Williams'). 51 corpus names (recounted 2026-08-26). The figure is
# the one test_ledger_guards.py pins as this entry's `captures`, so it
# is not merely stale when it drifts, it contradicts a machine-checked
# constant: read it there rather than trusting this line, and grep
# _EXCLUSION_EFFECT for the pattern. It was 46 for three rounds and
# moved twice in one delta, once per rules-corpus row added.
#
# It was medial-only for three rounds, on the theory that the trailing
# position is where credentials live and that widening would silence
# 21 legitimate classifications. Both halves were wrong, and 1.4.0
# says so directly:
#
#   'Andrew Perkins (JD)'      1.4 nickname 'JD'   2.x nickname 'JD'
#   'Andrew Perkins (MBA)'     1.4 suffix   'MBA'  2.x suffix   'MBA'
#   'Franklin, Benjamin (Ben)' 1.4 nickname 'Ben'  2.x nickname 'Ben'
#
# 1.4 read a trailing '(JD)' as a NICKNAME, exactly as it read
# '(Ben)'. So the promise -- ASCII pairs were already recognized, a
# nickname diff on them is a regression -- covers the trailing
# credentials too, and refusing them is the promise being kept rather
# than over-reach. Where 1.4 did read the parens as a credential it
# put them in `suffix` ('MBA' is in the suffix vocabulary), so the
# diff lands outside this entry's `fields` and the exclusion never
# fires. The PARSER discriminates by vocabulary, which is the
# discrimination no delimiter regex can make.
#
# Cost of the widening, measured against the 1.4.0 wheel: of the 21
# names it adds, only 3 diff at all, and none of those diffs is a
# subset of {nickname, middle} -- '山田 太郎 (マイケル・ジャクソン)'
# moves {first,last,nickname}, '김, 민준씨 (Jimmy)' {first,suffix},
# '김민준씨 (Jimmy)' {first,last,suffix}. Zero classifications lost.
#
# A bare [("'] class is still wrong, for the reason the role
# narrowing cannot fix: it reaches names whose only match is an
# apostrophe that is part of the word ("Brian O'connor",
# "Harietta Keopuolani Nahi'ena'ena"), which is not a delimited run at
# all. Both figures moved twice in the #335 delta and are the class
# this file keeps getting wrong, so recount rather than adjust -- the
# body sits flush left because `python -c` compiles it as a module:
#
# uv run python -c "
# import glob, json, re
# names = {json.loads(l) for f in glob.glob('tools/differential/corpus*.jsonl')
#          for l in open(f, encoding='utf-8') if l.strip()}
# hit = [n for n in names if re.search(r'[(\"\']', n)]
# only = [n for n in hit if not re.search(r'[(\"]', n)
#         and not re.search(r'(^|\\s)\'', n) and re.search(r'\\w\'', n)]
# print(len(hit), len(only))"
#
# By role: ASCII parens mark nicknames, maiden names, suffixes and
# credentials alike, and no regex tells them apart. The shape reaches
# 'Jenny (Johnson) Baker' and 'Lon (Jr.) Williams', whose parens are a
# maiden name and a suffix -- both areas under active development
# (#335, suffix in parens). `fields` names the two roles a nickname
# regression moves a token BETWEEN, so those names stay classifiable
# on the five it does not name. It does not leave them wholly alone:
# 'Lon (Jr.) Williams' parses its suffix into `middle` today, so a
# middle-only diff on it is silenced. That is the price of protecting
# the reading at all, since a nickname regression is exactly a
# middle/nickname move.
#
# feat(#273)'s own rule needs no shape narrowing of this kind -- a
# typographic delimiter is not a credential marker -- which is why its
# regex is a bare character class. It does carry `fields`, for the
# separate reason recorded there.
name_regex = "(^|[\\w.]\\s+)[(\"'][^)\"']+[)\"'](\\s+\\w|\\s*$)"
fields = ["nickname", "middle"]
examples = ["John \"Jack\" Kennedy", "John (Jack) Kennedy",
            "\"Rick\" Edmonds", "Franklin, Benjamin (Ben)"]

[[change]]
issue = "fix(#418) the connective carve-out counts the name the maiden clause leaves behind"
# 'Juan y Garcia née Jones': rules.md#P3's three-word carve-out
# counted the marker and the maiden name, so 'y' joined and the
# family was empty once the clause left. fix(#274) above cannot
# classify this one: it moves `given` as well, since the joined
# 'Juan y Garcia' comes apart. `maiden` is in the fields because 1.4
# has no maiden field at all, the same reason every marker name is a
# diff at this baseline. Checked against this baseline's own run; the
# expected_since_2.1.0.toml copy carries the fuller account.
name_regex = "(?i)^\\S+\\s+[ye]\\s+\\S+\\s+n[eé]e\\s+\\S+$"
fields = ["given", "middle", "family", "maiden"]

[[change]]
issue = "fix(#432) a dotted numeral behind a name is a middle initial, not the generation"
# 'Smith, John V.': v1 read suffix 'V.'. Behind a NAME word the period
# is decisive -- it marks an abbreviation, and an abbreviation is name
# material -- so the numeral is the middle initial it looks like, as
# 'Smith, John B.' always was. The BARE form is the boundary and is
# v1 parity either way: 'Smith, John V' stays suffix 'V' (#144), and it
# is a corpus name, so the gate asserts that half rather than this
# entry's silence.
#
# The #430 half needs no entry at this baseline: 'Smith, PSM I' is
# already claimed by "fix(comma-family) lone post-comma piece routes to
# suffix/title, not first", whose fields cover the move. A second rule
# would be dormant, which the gate reports as EXPLAINED NOTHING.
name_regex = "(?i)^smith,\\s*john\\s+v\\.$"
fields = ["middle", "suffix"]

[[change]]
issue = "fix(#410) a title and one name word name the family, whatever annotation stands beside it"
# rules.md#H1 reads a title plus exactly one name word as the family
# ('Mr. Johnson' -> family 'Johnson'). The guard implementing it also
# declined whenever ANY token carried a suffix, nickname or maiden
# role, so the very same name with an annotation beside it kept the
# word in `given` and reported no family at all. None of the three is
# a name word, so the term went and these names move `given` ->
# `family`, reading as their un-annotated twins already did.
#
# Keyed on the names by literal rather than by shape. The shape is "a
# title, one name word, and an annotation" -- a parse tree, not a
# string -- and a fields-only rule standing in for it would classify
# every future given/family swap in this corpus.
#
# Its own rule because these have nothing to do with suffix routing:
# they were falling to the fields-only fix(suffix-routing) catch-all
# (deleted in #451), on a rule whose every other name moves a trailing
# token into `suffix`, while these move no suffix at all. Same surgery
# #372 did on the same catch-all, whose heading returned to 14 once
# this rule took them.
#
# THREE names here, where the 2.0.0 and 2.1.0 ledgers classify four:
# at this baseline 'Dr. Smith née Jones' also moves `middle` and
# `maiden`, because 1.4.0 has no maiden support and read the marker as
# a middle name. It gets the separate rule below rather than widening
# `fields` here, which would let these three move a maiden name
# unnoticed.
#
# Four classified across the two rules, out of FIVE names that change
# reading. The fifth is 'Freiherr von Richthofen V' -- a title, one
# name word and a suffix, so this same shape -- and the fix(#424) rule
# further down has always claimed it. #410 only narrows its diff, from
# {given, family, suffix} to {family, suffix}, and that rule declares
# all three, so the gate stayed green and never named it. It is not
# moved here; the classification was right and the count was not.
name_regex = "(?i)^(?:Senator \"Rick\" Edmonds|Xyz\\. \\(Bud\\) Smith|'Smitty' Dr\\. Jones)$"
fields = ["given", "family"]

[[change]]
issue = "fix(#410) the maiden flavor, where 1.4.0 read the marker as a middle name"
# 'Dr. Smith née Jones': the same H1 widening as the rule above, but
# against a baseline with no maiden support, so the diff is four
# fields rather than two. 1.4.0 had nowhere to put a birth surname --
# no default marker vocabulary routes to `maiden` -- so it read first
# 'Smith', middle 'née', last 'Jones'. 2.x extracts the clause
# (`middle` and `maiden`), and #410 is what moves 'Smith' from `given`
# to `family` on top of that.
#
# Separate from the rule above because `fields` is the union of two
# different changes here, and a single rule carrying all four would
# let the three names up there move a `middle` or a `maiden` without
# anything noticing. This is the one name in the corpus where the
# marker extraction and the H1 fix land together.
name_regex = "(?i)^Dr\\. Smith n[ée]e Jones$"
fields = ["given", "middle", "family", "maiden"]

[[change]]
issue = "fix(#434) a multi-word maiden marker takes the maiden name"
# 'Maria Kowalska z domu Nowak': maiden_markers gained PHRASE entries
# and the Polish "z domu" is the first one any shipped set holds, so
# rules.md#M2's take fires on a marker that spans two tokens. Every
# earlier version read the marker as name text -- middle 'Kowalska z
# domu', family 'Nowak' -- because neither z nor domu is a marker
# alone and nothing looked at the pair.
#
# `fields` is the three the diff moves and no more. The marker leaves
# the name, so `middle` empties and `family` moves back one word,
# which is why this cannot share a rule with the bracketed name below:
# there the clause changes role and the name words around it do not
# move at all. One rule over both would have to declare the union and
# would pre-excuse a middle/family regression on the bracketed
# spelling -- the #444 failure the fix(#335) rules above spell out.
#
# Keyed on the literal, like those rules and for their reason: the
# shape is "a marker phrase inside a name", a question about the
# parse, and a fields-only rule standing in for it would pre-excuse
# every future middle/family/maiden confusion in the corpus.
name_regex = "(?i)^Maria Kowalska z domu Nowak$"
fields = ["middle", "family", "maiden"]

[[change]]
issue = "fix(#434) a multi-word marker leads a bracketed clause to the maiden name"
# 'Maria Kowalska (z domu Nowak)': the same vocabulary change at the
# other site. rules.md#M3 reads a marker-led clause as the maiden name
# whatever pair encloses it, and #335 gave it that reach in 2.2 -- but
# the reach alone leaves this name a nickname, since M3 asks whether
# the content opens with a recognized marker and through 2.1 no
# vocabulary answered yes here. The phrase entry is what moves it, so
# it is #434's diff and not #335's, and it is deliberately NOT a
# seventh alternative in that rule's six literals.
#
# `fields` is the pair that moves. The clause changes role; the name
# words keep their readings, so a `given`, `middle` or `family`
# movement here is a regression and stays loud.
name_regex = "(?i)^Maria Kowalska \\(z domu Nowak\\)$"
fields = ["nickname", "maiden"]

[[change]]
issue = "fix(#335) a marker-led bracketed clause reads as the maiden name whatever pair encloses it"
# 'Jane Smith (née Jones)', 'Jane (née Jones) Smith', 'Jane Smith
# (née V)', 'Anna Müller (geb. Schmidt)', 'Ursula von der Leyen
# (geb. Albrecht)': rules.md#M3 reads a bracketed clause whose content
# opens with a marker word and carries a word after it as the maiden
# name. 1.4 extracted the same five clauses as NICKNAMES -- v1 knew
# the parenthesis pair and had no maiden reading to give an
# undeclared one -- so the diff is the role and only the role.
#
# `fields` is exactly the pair that moves. Five names, two fields,
# measured; the union with what these names move against 2.0.0 would
# be wider, and declaring a field a diff does not move is what let a
# real given/family movement hide behind fix(#424) until PR #444.
#
# The CJK name is NOT here, unlike in the two 2.x ledgers. Against
# 1.4 it diffs in {given, middle, family, maiden}: v1 read the
# fullwidth brackets as name text, so there is no nickname on either
# side to change hands, and fix(cjk-maiden-marker) above already
# describes exactly that diff. See the dormancy note on
# fix(cjk-fullwidth-paren-nickname), which is the rule that used to
# hold it.
name_regex = "(?i)^(?:Jane Smith \\(n[ée]e Jones\\)|Jane \\(n[ée]e Jones\\) Smith|Jane Smith \\(n[ée]e V\\)|Anna Müller \\(geb\\. Schmidt\\)|Ursula von der Leyen \\(geb\\. Albrecht\\))$"
fields = ["nickname", "maiden"]

[[change]]
issue = "fix(#335) a marker-led clause leaves the one name word its bare reading"
# 'Smith (née Jones)', which rules.md#N3 carries as an Accepted line.
# N3 reads a name that is only a nickname plus one name word as "that
# word is the family name", and a marker-led clause is not a nickname
# clause, so N3 no longer reaches this shape: the word keeps the
# reading the bare "Smith née Jones" gives it.
#
# Its own rule rather than a sixth alternative in the fix(#335) rule
# above, for the reason that rule states: one rule holding both would
# have to declare the union of two different diffs and would
# pre-excuse whatever else landed inside it.
#
# The revisit note this block carried was answered on 2026-08-27, and
# the answer is the opposite of what it feared. It expected #445 to
# widen this diff and be absorbed here; #445 SHRANK it. The bare
# reading the word keeps is now `family` (rules.md#M4), and 1.4.0
# read this name family 'Smith', nickname 'née Jones' -- so `given`
# and `family` agree with the baseline again and only the clause
# changes hands. The declaration is narrowed to the two fields that
# still move, which is what the note asked for: a `given` or `family`
# move on this name is UNEXPLAINED from here on rather than absorbed.
# Measured, not reasoned -- and the first pass got the 2.x half of
# that sentence wrong, saying those baselines read `given` when they
# read family 'Smith', nickname 'née Jones' like this one. Both are
# narrowed to two fields now (2026-08-27 review round). This name is
# the one shape in #445's class the gates do NOT report, which is
# why nothing but reading the ledger could catch it.
#
# What the narrowing buys was said here to differ by ledger, and it
# did not. The sentence claimed the fields-only fix(suffix-routing)
# rule that then stood below "still matches every name with {given,
# family, suffix} and would take it"; that stopped being true when the
# same #451 bundle narrowed the catch-all to {family, suffix}, since a
# {given, family} diff is not a subset of those two. Measured against the
# ledger as it stood then, this name's {given, family} diff was
# already UNEXPLAINED at THIS baseline, exactly as at 2.0.0 and
# 2.1.0. #451 has since deleted the catch-all outright, and the
# measurement is unchanged.
name_regex = "(?i)^Smith \\(n[ée]e Jones\\)$"
fields = ["nickname", "maiden"]

[[change]]
issue = "fix(#445) a maiden marker makes the lone name word the family"
# rules.md#M4 -- "a maiden name standing beside exactly one name word
# makes that word the family name". A maiden name is a FORMER family
# name, which only means something beside a current one, so the word
# left standing beside it is the surname the bearer uses now. Seven
# names, one field set: 'Smith née Jones'
# read first 'Smith', middle 'née', last 'Jones' on 1.4.0 and reads
# family 'Smith', maiden 'Jones' here.
#
# Three of the four fields are #274's marker consumption -- v1 had no
# maiden support, so the marker sat in the name as a middle word and
# the last word was the family -- and the fix(#274) rule above
# carried these names until #445 added `given` to their diffs and
# they left its declaration. Only `given` is new; the rule declares
# all four because a rule explains a name's whole diff.
#
# Anchored, and spelled out one name per alternative, for the reason
# M4 itself gives. The shape regex a reader would write first -- one
# word, then a marker -- also matches M4's two carve-outs
# ('abd née Jones', 'J. née Jones Smith V'), and a rule declaring
# `given` over those two would stand ready to explain the very
# given -> family move the carve-outs exist to prevent. They stay
# with fix(#274), whose fields do not include it.
#
# 'Smith née Jones' and 'Smith née Jones PhD' are corpus rows this
# change itself added, being M4's own example lines; the other five
# were already here, and were five of the eight the fix(#274) note
# above listed as the checklist to re-measure.
name_regex = "(?i)^(?:Janey n[ée]e Jones|Jane n[ée]e Jones J\\. V|Jane n[ée]e Jones Smith|Jane n[ée]e and Jones Smith|John n[ée]e Jones Smith V|Smith n[ée]e Jones|Smith n[ée]e Jones PhD)$"
fields = ["given", "middle", "family", "maiden"]

[[change]]
issue = "fix(N3) a nickname-led name with a trailing suffix keeps the suffix in `suffix`"
# "'Smitty' Jones Jr.": the diff against 1.4.0 moves exactly {family,
# suffix} -- `given` is 'Jones' at both baselines, and it is `given`
# BECAUSE N3 declines: N3's one-piece count does not set a trailing
# suffix aside, so the suffix disqualifies the rule and the positional
# read applies. Set the suffix aside and N3 does fire --
# "'Smitty' Jones" reads family 'Jones' (rules.md#N3's own example).
# Whether 1.4 itself read the trailing word as
# `family` is outside what this ledger's worker can check directly
# (tools/differential/README.md's warning against reading a v1
# release from a cached environment); the diff shape is consistent
# with that reading, and 2.x reads this name given 'Jones', family
# '', suffix 'Jr.'. decisions.md#N3.
#
# Its own rule because it is three tokens -- a quoted nickname, one
# bare name word, one suffix word -- and #451 retired the fields-only
# fix(suffix-routing) catch-all by giving its names narrower
# rules; this name was one of that catch-all's nine when that work
# started. The two-token suffix rules #451 owed are now the four
# below, and this shape -- three tokens, a leading nickname -- fits
# none of them, which is why it kept a rule of its own.
#
# Note what is NOT settled here: decisions.md#H1 records that N3 and
# H1 count a trailing suffix in opposite directions. H1 IGNORES one --
# rules.md#H1 makes the lone word the family "whatever suffix,
# nickname or maiden name stands beside it", so 'Dr. Smith Jr.' reads
# family 'Smith' (the declining term was there until #410 took it
# out, which is what that entry is recording). N3 counts one, and so
# declines: "N3 counts a suffix the other way (`'Smitty' Jones Jr.`
# reads given 'Jones', family '')" -- and H1 states plainly that
# "which of the two readings is right for a nickname-led name is not
# decided here". This rule classifies only the 1.4-to-2.x movement
# measured above; it does not endorse either reading.
name_regex = "(?i)^['\"‘“][^'\"’”]+['\"’”]\\s+\\S+\\s+(jr|sr|ii|iii|iv|v)\\.?$"
fields = ["family", "suffix"]

# The four rules below are what is left of the fields-only
# fix(suffix-routing) catch-all, which stood between fix(#380) and
# fix(#342) above until #451 deleted it. It was the only rule in any
# ledger with no name_regex, so it sorted after every other rule and
# took whatever nothing narrower named -- 25 names when #372 first cut
# it back, six by the time this task began. Those six are the six the
# four rules below explain, one behaviour family each. The numeral and
# jr rules reach more corpus names than they explain -- the surplus is
# claimed by rules above, or does not diff at all, and each of those
# two comments names its own. _CORPUS_CLAIMS holds the reaches; do not
# restate them here, because nothing recomputes a number in a comment.
#
# They sit at the END of the file on purpose. The catch-all sorted last
# because it had no name_regex; with regexes these join the regex tier,
# where _sorted_rules is STABLE and FILE ORDER decides ties. Placing
# them last reproduces the catch-all's position exactly: every rule
# above keeps every contest it already won. The numeral rule's regex
# reaches 'Carod i' and '田中さん II', and _CROSS_RULE_WINNERS pins
# both -- but only the first is a real contest: measured by moving the
# numeral rule to the front of the file, 'Carod i' changes hands and
# '田中さん II' does not, because its diff moves {given, suffix} and
# these four declare {family, suffix}. File order decides one, the
# subset test the other, and the roster does not care which.

[[change]]
issue = "fix(suffix-routing) a two-token name ending in a roman numeral keeps it in `suffix`"
# 'John V' and 'Mohamad X': v1 routed a lone trailing suffix to
# family/first (no comma is present in either), and 2.x reads the
# trailing numeral as the suffix. Whether 1.4 itself read that token as
# `family` is outside what this ledger's worker can check directly
# (tools/differential/README.md's warning against reading a v1 release
# from a cached environment); the diff this rule explains at this
# baseline moves exactly {family, suffix}, which is consistent with
# that reading and is what the fields below claim.
#
# The numeral does not reach `suffix` through a wordlist. It reaches it
# through _vocab.is_trailing_numeral_suffix -- "assign's roman-numeral
# fork, shared with group's bound-given reserve (#401): a FINAL
# single-token piece that is a roman numeral reads as the suffix when
# the piece before it does not look like part of an initial run". That
# is a PATTERN test plus a layout test, and no vocabulary lookup at
# all: 'x' is in none of SUFFIX_WORDS, SUFFIX_ACRONYMS or their
# ambiguous subsets, and 'Mohamad X' moves anyway. Which is why this
# alternation is declared in _NOT_A_VOCABULARY_COPY rather than in
# _LATIN_ALTERNATION_SOURCES -- there is no vocabulary here to drift
# from.
#
# The alternation is _ROMAN's own body, r"^(X|IX|IV|V?I{0,3})$" in
# nameparser/_pipeline/_vocab.py, with the EMPTY alternative removed:
# I{0,3} becomes I{1,3}, and the bare V that change would lose is
# spelled out beside it. Measured over every string of length 0 to 4
# drawn from IVXivx -- length 0 included on purpose, since the empty
# string is the whole difference -- the two accept exactly the same
# strings but that one, which _ROMAN takes and this does not. Dropping
# it is a latent widening removed: with the `^\S+\s+` prefix the empty
# alternative would match a name ending in whitespace, which no corpus
# name is today. Dropping it is deliberate: behind "^\S+\s+" and before "$" an
# empty alternative would match a name ending in whitespace. No corpus
# name does, so this is a latent widening removed rather than a bug
# fixed -- and it is the reason the two patterns are NOT byte-identical
# copies of one another, which a reader comparing them should know
# before "fixing" the difference.
#
# 'v' is in SUFFIX_WORDS as well, and the jr rule below deliberately
# does not spell it: the numeral fork is what actually moves it, and
# two rules claiming one token would leave file order to decide which
# explains it.
#
# The regex also reaches two corpus names this rule does not explain.
# 'Carod i' is fix(#397)'s NOT-WANTED rule above -- a real contest,
# same fields and both regexes matching, decided by nothing but file
# order -- and '田中さん II' is fix(cjk-glued-honorific-peel)'s, where
# the diff moves {given, suffix} and this rule's `fields` cannot admit
# it whatever the order. _CROSS_RULE_WINNERS pins both. That reach is
# real, so neither is a _MUST_NOT_MATCH probe here: that roster tests
# the regex, not classify().
name_regex = "(?i)^\\S+\\s+(X|IX|IV|V?I{1,3}|V)$"
fields = ["family", "suffix"]

[[change]]
issue = "fix(suffix-routing) a two-token name ending in the suffix word jr keeps it in `suffix`"
# 'Smith Jr.': v1 routed a lone trailing suffix to family/first (no
# comma present) and 2.x keeps a recognized suffix WORD in `suffix`.
# Whether 1.4 itself read that token as `family` is outside what this
# ledger's worker can check directly (tools/differential/README.md's
# warning against reading a v1 release from a cached environment); the
# diff this rule explains at this baseline moves exactly {family,
# suffix}, which is consistent with that reading and is what the fields
# below claim.
#
# 'jr' is an entry in SUFFIX_WORDS (nameparser/config/suffixes.py), so
# unlike the numeral above this one really is a vocabulary claim. It is
# written as a single LITERAL rather than as a one-member alternation,
# which is what keeps it off _LATIN_ALTERNATION_SOURCES: that roster is
# discovered from alternation syntax, and a rule with no alternation
# owes it nothing. A second suffix word needing this shape should
# become an alternation and be enrolled against SUFFIX_WORDS then, not
# be smuggled in as another literal.
#
# The regex also reaches four corpus names this rule does not explain.
# 'Kim, Jr.' and 'Smith, Jr.' are fix(#296)'s lone post-comma
# credential and '김민준씨 Jr.' is fix(cjk-glued-honorific-peel)'s.
# Three names, two rules, and both sit above this one and win on file
# order, which is the
# whole reason these four rules were appended at the end. The fourth,
# 'Doe,, Jr.', does not diff against this baseline at all, so it has no
# winner to lose. That reach is real either way, so none of the four is
# a _MUST_NOT_MATCH probe here: that roster tests the regex, not
# classify().
name_regex = "(?i)^\\S+\\s+jr\\.?$"
fields = ["family", "suffix"]

[[change]]
issue = "fix(suffix-routing) a two-token name ending in a credential acronym keeps it in `suffix`"
# 'Donald mc' and 'QC MP': v1 read the trailing token as a name part
# and 2.x reads it as the postnominal it is -- 'QC MP' is two
# credentials and no name at all. Whether 1.4 itself read that token as
# `family` is outside what this ledger's worker can check directly
# (tools/differential/README.md's warning against reading a v1 release
# from a cached environment); the diff this rule explains at this
# baseline moves exactly {family, suffix}, which is consistent with
# that reading and is what the fields below claim.
#
# Both members are entries in SUFFIX_ACRONYMS, which is a DIFFERENT
# vocabulary from the jr rule's SUFFIX_WORDS above, and that is why
# these are two rules rather than one. _LatinCopy carries exactly one
# `vocabulary`, and
# test_latin_alternations_mean_something_the_vocabulary_ships asserts
# exactly one roster key per alternation, so an alternation spanning
# both sources could not be pinned against either. The split is forced
# by the guard, not chosen for taste.
#
# 'mc' deserves its own paragraph, because it is in SUFFIX_ACRONYMS and
# in PARTICLES both -- the collision decisions.md#vocabulary-collisions
# C-ii settled for 'vd' ("the Dutch van der reading, as the more
# common"), and which its own C-ii note records that 'do' and 'mc'
# inherit "without being weighed". That decision reaches a written name
# only through P6's attachment, which is scoped to the comma form --
# decisions.md#P6: "the COMMA form only, deliberately. [...] Without
# the comma the written shape is not settled [...] Those keep their
# positional reading and are not tracked as deviations." 'Donald mc'
# has no comma, so P6 never reaches it.
#
# What stands instead is rules.md#S2: "an unambiguous suffix is
# consumed even when that leaves no family name at all". That is the
# authority here, and NOT P6's scope note, which does not support it:
# P6 promises the comma-less shapes keep their POSITIONAL reading, and
# for the words that are both particle and suffix vocabulary it does
# not hold. Measured, 'Jong de' and 'Smith do' keep theirs (family
# 'de', family 'do') while 'Donald mc' and 'Smith vd' lose the family
# entirely to `suffix`. decisions.md#P6's own arc entry records that as
# a rules.md defect rather than a ledger one; this rule classifies the
# movement on S2's statement and settles nothing about P6.
#
# The two neighbouring shapes both already have rules above, and the
# contrast is the point: 'Mc Donald' has the particle LEADING and folds
# into the family (fix(#360), #360), and 'Berg, Jan vd' has it trailing
# WITH a comma, so P6 attaches it to the family (fix(#380), #380).
# Trailing and comma-less is the third corner, and it is this one.
name_regex = "(?i)^\\S+\\s+(mc|mp)$"
fields = ["family", "suffix"]

[[change]]
issue = "fix(suffix-routing) the dotted M.A. spelling reads as a credential (ma-do)"
# 'Jack M.A.': v1 read the trailing token as a name part and 2.x reads
# it as a credential. Whether 1.4 itself read that token as `family` is
# outside what this ledger's worker can check directly
# (tools/differential/README.md's warning against reading a v1 release
# from a cached environment); the diff this rule explains at this
# baseline moves exactly {family, suffix}, which is consistent with
# that reading and is what the fields below claim.
#
# This is a DECIDED reading, unlike the fix(#342) and fix(#397) rules
# above, which classify a diff because its cause is known and not
# because the reading is wanted. decisions.md#ma-do decides it: "ma and
# do joined the ambiguous acronym set because both are common surnames;
# the two-word 'Jack Ma' is kept intact by S2's words-to-spare guard,
# while the periods gate governs the dotted spellings ('M.A.' counts
# unambiguously)". The bare and dotted spellings of one name therefore
# read differently ON PURPOSE, which is why both spellings of the bare
# one are _MUST_NOT_MATCH probes here.
#
# Literal-anchored, and it could not be anything else. Measured: the
# member `m\.?a\.?` matches the fragment 'M.A.' in the corpus, and
# _normalize leaves that as 'm.a', which is not a SUFFIX_ACRONYMS entry
# -- so test_latin_alternations_mean_something_the_vocabulary_ships
# rejects it as an alternation member -- its helper
# _reaches_non_vocabulary puts the rule as "every fragment a member
# matches must BE an entry". The ambiguous-surname-acronym rule above
# records the same finding and answers it the same way: keep the
# periods out of the members. There is no alternation here at all, so
# nothing is owed to _LATIN_ALTERNATION_SOURCES.
#
# Anchored on 'jack' as well as on the spelling: 'John Smith M.A.' is
# also a corpus name (it arrived with corpus_rules.jsonl, #414), it is
# three tokens rather than two, and it does not diff against this
# baseline at all -- so a rule keyed on the dotted spelling alone would
# stand ready to explain a future regression on it. It is a
# _MUST_NOT_MATCH probe for that reason.
name_regex = "(?i)^jack\\s+m\\.a\\.$"
fields = ["family", "suffix"]
