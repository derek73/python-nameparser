[[change]]
issue = "fix(comma-family) lone post-comma piece routes to suffix/title, not first"
# 'Smith, Dr.' / 'Andrews, M.D.': v1 put the lone strict-suffix-or-title
# post-comma piece in `first`; 2.0 routes it to `suffix`/`title` instead
# (family/`last` is unchanged either way -- "pre-comma is definitionally
# family").
#
# LATIN-ANCHORED, and that is what keeps this rule describing what it
# claims. The regex was a bare comma until #372, which reaches every
# comma in every script -- so seven CJK glued-honorific names landed
# here, on a rule whose prose has nothing to do with CJK. They diff as
# {given, suffix} (민준씨->민준/씨, 太郎さん->太郎/さん), which is a
# subset of this rule's fields, and classify() takes the first rule
# whose regex matches and whose fields are a superset. Both this rule
# and fix(cjk-comma-compound) carry a name_regex, so they share a tier
# and file order broke the tie -- in favour of the one written first,
# which was this one.
#
# Measured at the narrowing: corpus reach 236 -> 215, and all seven
# CJK names moved to fix(cjk-comma-compound), which grew 10 -> 17 and
# is the rule named for that shape. The gate was unmoved at 108
# intentional / 0 unexplained -- nothing became unexplained, so no name
# lost an explanation, it only changed which rule gave it.
#
# Those are that narrowing's figures and none of them is today's. What
# the narrowing pinned is the SCRIPT bound, not a count: this rule goes
# on claiming the Latin comma-names, and their number grows with the
# corpus. The sentence that stood here said the rule "now claims
# exactly one name, 'Andrews, M.D.'"; re-measured 2026-09-03 it
# explained eight, 'Andrews, M.D.' among them. For today's, read the
# `## fix(comma-family) lone post-comma piece routes to suffix/title,
# not first (N)` heading off `compare.py --baseline 1.4.0`.
#
# The cut is at U+0250, the threshold _is_latin_only uses in
# compare.py, matching the trailing-'Ph. D.' exclusion. Anchored at
# both ends because a name is Latin or it is not: an unanchored class
# would match the Latin part of a mixed name and take it back.
#
# One row nearby is not here and never was: '田中さん, 太郎' agrees
# with 1.4.0, so it never reaches classify() at all. It is the pinned
# guard for the case a naive #312 fix breaks (the peel site is 太郎, so
# nothing peels).
#
# '田中さん, V.' is NOT that case, though this comment said it was
# until #372 checked. It diffs {family, suffix} and lands on
# fix(cjk-comma-compound) below, before and after this change. It
# reads as parity only under Policy(lenient_comma_suffixes=False) --
# the knob tests/v2/cases.py exercises in
# ja_honorific_glued_family_comma_strict_knob -- and the corpora run
# under the default policy, so here it is a real diff.
name_regex = "^[\\u0000-\\u024f]*,[\\u0000-\\u024f]*$"
fields = ["given", "title", "suffix"]

[[change]]
issue = "fix(comma-precomma-family) pre-comma run reads as family, not given"
# 'Smith, Dr.' / 'Smith, Prof.': the post-comma piece is a title on
# BOTH sides -- it does not move, and no suffix moves either. What
# changes is the pre-comma run: 1.4 read it as `first`, 2.x reads it
# as `last`, because pre-comma is definitionally family. Diff is
# exactly {given, family}.
#
# This comment opened on 'Bob Jones, author' / 'MD, PHD' until #382's
# sweep, and the rule explains neither any more. Since #296's audit
# 'Bob Jones, author' KEEPS its pre-comma split (first 'Bob Jones' ->
# 'Bob', last '' -> 'Jones') and goes to `fix(comma-family) a comma
# followed only by titles keeps the given/family split`, and 'MD, PHD'
# reads as a one-word name plus a postnominal -- a four-field diff
# this rule's fields cannot admit -- and goes to `fix(#296) a
# credential-only comma string reads a name and its postnominal`. Both
# handovers are pinned in _CROSS_RULE_WINNERS and both winners are
# written above this rule, so nothing about this rule changed; only
# the example did. Nothing recomputes a name in a comment, which is
# how this one stayed wrong through two audits.
#
# The seven it does explain are not all the pure shape, and `fields`
# is what the rule actually claims. 'Smith, Ph. D.' and 'Ph. D., Jr.'
# are the pure move; 'Dr. Do Van Johnson, MD' has its pre-comma run
# SPLIT into given/family rather than move whole; 'Berg, abdul vd'
# hands a trailing particle to the family; 'Smith, de Mesnil Jean'
# re-orders the family run with `first` empty on both sides. Measured,
# all seven move `family` and six move `given` with it; the seventh is
# 'Smith, de Mesnil Jean', which moves `family` ALONE -- `first` is
# empty on both sides, so there is no given name for it to move. No
# title and no suffix moves in any of the seven. So the fields below
# are the boundary and the title above names the majority reading.
#
# Its own rule because these have nothing to do with suffix routing:
# they were falling to the fields-only fix(suffix-routing) catch-all
# (deleted in #451), on a rule whose every other name moves a trailing
# token into `suffix`, while these move no suffix at all (#372).
#
# Distinct from fix(comma-family) above by fields, not by order: that
# rule is the lone post-comma piece moving into suffix/title and its
# fields exclude `family`, which every name here moves. Latin-anchored
# for the same reason it is -- a bare comma reaches every script.
name_regex = "^[\\u0000-\\u024f]*,[\\u0000-\\u024f]*$"
fields = ["given", "family"]

[[change]]
issue = "fix(#296) a lone post-comma credential is a suffix"
# 'Smith, Jr.' / 'Kim, Jr.' / 'Smith, PhD': rules.md#C1 -- the listing
# form holds with one word before the comma, and the word after it is
# the credential run. v1 put the family in `first` and the credential
# in `title`; 2.0 routed the pre-comma word to the family (the
# comma-family rule below) but the title peel still claimed the
# credential -- 'jr' and 'phd' were title vocabulary, and the
# period-abbreviation inference reads 'Jr.' as a title regardless --
# so the postnominal position is read first now: a post-comma run
# that is nothing but suffix pieces is suffixes. A one-word name, a
# comma, one short word: the reach is pinned by the guards, and the
# rule sits BEHIND the two comma-family rules above so that a name
# whose only move is the pre-comma word going given -> family
# ('Smith, Dr.', 'Smith, Prof.') or a lone piece going given ->
# suffix ('Smith, Abd') keeps the rule written for it (the comment
# review found this rule absorbing all three). 'Smith, Ms.' is
# here too: the dual's postnominal reading, title at 1.4.0.
name_regex = "(?i)^[a-z]+,\\s*[a-z]{2,6}\\.?$"
fields = ["title", "given", "family", "suffix"]

[[change.precedes_narrower]]
issue = "fix(suffix-routing) a two-token name ending in the suffix word jr keeps it in `suffix`"
why = """
a REGEX ACCIDENT, not two descriptions competing. The jr rule asks for
a leading run of non-space characters, and that run swallows the
trailing comma of 'Smith,' -- which is the only way a comma name ever
reaches a rule whose prose scopes it to the comma-LESS two-token name.
Nothing that rule says is true of 'Smith, Jr.' or 'Kim, Jr.'.

LATENT as well: both move {title, given, family, suffix} against the
jr rule's {family, suffix}. The jr rule's OWN comment already argues
this from the other side and names these two names -- "what keeps them
there is `fields`, not file order... Order is the second line of
defence, not the first". This entry is that second line written down:
a widening of the jr rule's `fields` would spend the fields argument
and leave nothing but the accident holding the names, and an accident
is a worse reason to hold a name than a description is.
_CROSS_RULE_WINNERS pins both names to this rule."""

[[change]]
issue = "fix(#400/#274) bound-given join and maiden consumption in one name"
# 'abd Allah Smith nee Jones': two behaviours meeting in one name, so
# neither single-cause rule claims it -- fix(#400) moves {given,
# middle} and fix(#274) moves {maiden, middle, family}, and this moves
# all four at once. The join takes 'abd Allah' as the given name AND
# the marker takes 'Jones' as the maiden name, which between them
# leave 'Smith' as the family where 1.4 read family 'Jones'.
#
# Requires TWO words between 'abd' and the marker, which is what makes
# it the combination shape: with one word the join declines (P5's
# reserve, once the maiden words stop counting -- see fix(#411)) and
# the diff is fix(#274)'s alone. 'abd Berg nee Jones' is that name and
# this rule must not claim it.
name_regex = "(?i)^abd(\\s+\\S+){2}\\s+n[eé]e\\s"
fields = ["given", "middle", "family", "maiden"]

[[change.precedes_narrower]]
issue = "fix(#400) abd joins the word after it as one given name"
why = """
the canonical compound-versus-component shape. fix(#400) describes the
join alone -- 'abd' plus the word after it, with a family name left
behind -- and says nothing about a maiden marker, which is where the
other two roles in this name come from.

LATENT: the measured diff is {given, middle, family, maiden}, and
`family` and `maiden` are outside fix(#400)'s {given, middle} at any
position, so the join rule cannot take this name wherever it sits.
The declaration is therefore about a future widening rather than
about today: teach fix(#400) anything about markers and it would
quietly absorb a four-role change and label it a bound-given join.
No _CROSS_RULE_WINNERS row for this name; the reason rests on the two
rules' own prose, which is unambiguous here -- one names two
behaviours meeting, the other one behaviour."""

[[change]]
issue = "fix(#411/S2) a declining bound-given join leaves the suffix reading after a family comma"
# 'Berg, abd nee Jones': `abd` is the one shipped word in BOTH the
# bound-given and the suffix vocabulary. With #411's join declining --
# it will not absorb a marker -- what is left in the given slot after a
# family comma is S2's suffix reading, which rules.md#P5 already states
# wins there. So the name has no given name at all, exactly as
# 'Berg, abd' alone has always parsed.
#
# Four fields move, which is why neither fix(#411) nor fix(#274)
# claims it: the extra `suffix` breaks their subset test. That is the
# gate behaving correctly -- the name arrived UNEXPLAINED and is read
# once here.
#
# `abd` and not an alternation: no other shipped bound-given word is
# also suffix vocabulary, so no other word reaches this reading.
name_regex = "(?i),\\s*abd\\s+n[eé]e\\b"
fields = ["given", "middle", "suffix", "maiden"]

[[change.precedes_narrower]]
issue = "fix(#400) abd joins the word after it as one given name"
why = """
this rule describes the join DECLINING, which is the negation of what
fix(#400) describes, and then describes what a declining join leaves
in the given slot after a family comma: S2's suffix reading, with
'abd' ending up in `suffix` and the name having no given name at all.
Two rules cannot both be right about the same word, and the one
asserting that it joins is not the one to explain a name where it did
not.

LATENT: {given, middle, suffix, maiden} is two roles wider than
fix(#400)'s {given, middle}, so the subset test excludes it at any
position -- this rule's comment already reads the same arithmetic as
why neither fix(#411) nor fix(#274) claims the name. No
_CROSS_RULE_WINNERS row; the prose carries it."""

[[change]]
issue = "fix(#411) the bound-given reserve stops counting words the maiden name takes"
# 'van der Berg, abdul nee Jones': P5 reserves a name word so the join
# always leaves a family name behind, but the reserve was counted while
# the marker and the maiden name were still pieces -- group's marker
# pass runs later in the same stage. Counting words that were about to
# leave answered the question about a name that would not exist.
#
# The fields here are the SIDE EFFECT rather than the defect. #411's
# own shape is an emptied family ('abdul Berg nee Jones' read given
# 'abdul Berg', family ''), and no BASELINE shows it -- every released
# version already reads the corpus names carrying that shape the way
# the fix does, so none of them can produce a #411 diff to classify.
# ('abd Berg nee Jones' IS in corpus_rules.jsonl, and goes unexplained
# at all three baselines if the fix is reverted, which is the guard
# working.)
#
# What this corpus
# name shows is the other half: with the reserve counted correctly the
# join declines, so the marker is never merged into 'abdul nee' and
# M2's bound sees a lone marker piece for the first time. That closes
# one of the two join-swallows #412 tracks; P3's connective join is
# the one that survives.
#
# `abdul` is a LITERAL, not an alternation over BOUND_GIVEN_NAMES, and
# the words are NOT interchangeable here. 'abd' is the one shipped word
# in both the bound-given and the suffix vocabulary, so after a family
# comma a declining join leaves the S2 suffix reading instead: 'van der
# Berg, abd nee Jones' moves {given, middle, suffix, maiden}, and the
# extra field breaks the subset test, so it would arrive UNEXPLAINED --
# correct, but not what an alternation over the vocabulary would lead
# an author to expect. 'abdel', 'abdal' and the Arabic spelling do
# behave like 'abdul'; only this name is in the corpora.
name_regex = "(?i),\\s*abdul\\s+n[eé]e\\b"
fields = ["given", "middle", "maiden"]

[[change]]
issue = "fix(#400) abd joins the word after it as one given name"
# 'abd Allah Smith' and 'Salam, abd Allah'. `abd` joined
# BOUND_GIVEN_NAMES in 2.2 so the spellings that write the article as
# its own word join like `abdul`, `abdel` and `abdal` already did.
# v1 had no bound given-name join for it either, so the diff is the
# same shape at every baseline; the 2.0 and 2.1 ledgers carry the same
# rule.
#
# `abd` is also the postnominal ABD and stays in SUFFIX_ACRONYMS --
# position tells the two readings apart -- so the anchors are what
# keeps a trailing 'Jane Smith ABD' out of this rule.
#
# A third corpus name is claimed and does NOT move: a bare 'abd Allah',
# which has no third word for the join to leave as a family name, so
# P5's reserve declines and it reads given 'abd', family 'Allah' at
# every baseline. Same behaviour family as the two that move, so the
# claim is defensible -- recorded so it is not mistaken for coverage.
name_regex = "(?i)(?:^|,\\s*)abd\\s+\\S+"
fields = ["given", "middle"]

[[change]]
issue = "fix(#272/#308) nakaguro division and a glued hangul honorific in one name"
# '马丁·路德·金씨': two behaviours meeting in one name, which is why the
# single-cause CJK rules do not claim it. The nakaguro divides the
# name into given/middle/family and the glued 씨 peels off into
# `suffix`, so all four roles move at once. Literals rather than an
# alternation over the honorific vocabulary, because the rule is about
# the COMBINATION rather than about the vocabulary; it claims exactly
# the one corpus name.
name_regex = "^\\S*\u00b7\\S*\uc528$"
fields = ["given", "middle", "family", "suffix"]

[[change.precedes_narrower]]
issue = "fix(cjk-glued-honorific-peel) glued honorific peels into suffix"
why = """
`middle` is the discriminator and the nakaguro is where it comes from.
This name divides into given/middle/family AND peels its glued \uc528, and
this rule is the one describing both; the peel rule describes the peel
and scopes itself to a name with no comma anywhere and no space before
the honorific, saying nothing about a division. Claiming the name
there would be a rule claiming a diff it does not describe (#372).

LATENT: {given, middle, family, suffix} is outside the peel rule's
{family, given, suffix} at any position, so what is declared is the
hazard of that rule acquiring `middle` -- which is exactly the role
the CJK order flip hands it, so the widening is a plausible one.
Contract tier (corpus_rules.jsonl), and not in _CROSS_RULE_WINNERS:
the roster never had this name added."""

[[change]]
issue = "fix(emoji-boundary) an emoji inside a token divides it"
# 'John😀Smith': 1.4 dropped the emoji and read one token
# (first='JohnSmith'); 2.x treats it as a division, so the name reads
# given 'John', family 'Smith'. rules.md#T1 documents both this and the
# keep-emoji policy reading.
#
# The emoji must stand BETWEEN two non-space characters, which is the
# behavior: it divides a token. A bare character class was the first
# draft and is rejected -- measured, it reaches past 'John😀Smith' to
# corpus names carrying a spaced or trailing emoji, which are
# byte-identical on both sides today and would be pre-excused by a rule
# that claims them. How many such names the corpus holds is not the
# argument and grows with the corpus; that the draft admits the class
# at all is. Pre-claiming shapes it has never seen is the #372 failure
# mode the fix(#379) comment names.
#
# The class is the ASTRAL HALF of _tokenize.py's _EMOJI_RANGES, hand
# copied and pinned by test_the_emoji_boundary_rule_copies_the_dividing_ranges.
# A single \U0001F300-\U0001FAFF span was the first draft and is wrong
# in the dangerous direction: it covers U+1F650-U+1F67F and
# U+1F700-U+1FAFF, where the parser does NOT divide, so the rule's own
# prose is false for about a thousand codepoints it would claim.
# 'John\U0001FA70Smith' reads given 'John\U0001FA70Smith' with no family --
# a future {given, family} diff on such a name, with some other cause,
# would classify here as intended. That is the same #372 shape this
# comment invokes against the bare class.
#
# The BMP half (U+2600-U+26FF, U+2700-U+27BF) is deliberately left out
# rather than copied: no corpus name reaches it once the token anchor
# is on, and a rule should be no wider than the diffs it must explain.
# A name that needs it will arrive unclassified and be read once. That
# omission also leaves the pattern free of \uXXXX-\uXXXX span text.
# That is a CONSEQUENCE, not a safeguard, and the #453 review was
# right to say so: _SPAN reads the 4-hex spelling only, so the class
# below rides past _unrecognized_class_content whatever it contains.
# What actually bounds it is the guard named above, which probes every
# codepoint in Unicode against _EMOJI_RANGES, plus _CORPUS_CLAIMS'
# reach and digest.
name_regex = "\\S[\\U0001F300-\\U0001F64F\\U0001F680-\\U0001F6FF]\\S"
fields = ["given", "family"]

[[change]]
issue = "fix(nickname-typographic-pairs) two typographic quote spans read as one nickname set"
# 'Hans „Erster“ und “Zweiter” Müller': 2.0 extracts typographically
# quoted nicknames, which v1 did not, and this name carries TWO spans
# in different pairs joined by a conjunction. Both come out as
# `nickname` 'Erster Zweiter', and what is left rejoins as a name --
# so `given`, `middle` and `family` all move as well.
#
# Deliberately narrower than "any typographic quote": the corpora hold
# four such names and the single-span ones ('Hans „Hansi“ Müller',
# 'John “Jack” Kennedy') are already accounted for elsewhere. The
# pattern asks for two spans of DIFFERENT pairs with a word between
# them, which is the shape that moves all four roles at once. A
# single-span regression must not be absorbed here. The fourth is
# 'Jane „JD Smith', an UNCLOSED span, which is neither category -- it
# does not diff at any baseline and no rule here claims it.
name_regex = "\u201e[^\u201c]+\u201c\\s+\\S+\\s+\u201c[^\u201d]+\u201d"
fields = ["given", "middle", "family", "nickname"]

[[change.precedes_narrower]]
issue = "feat(#273) typographic nickname delimiters recognized by default"
why = """
feat(#273) is single-span RECOGNITION: a smart-quoted nickname stops
leaking into `middle` as literal text, which is the {middle, nickname}
diff its own names carry ('Hans \u201eHansi\u201c M\u00fcller', 'John \u201cJack\u201d
Kennedy'). This name has two spans of different pairs, and the reason
it needs a rule of its own is the REMAINDER REJOINING as a name once
both come out -- that is what moves `given` and `family`, and #273's
prose has nothing to say about it.

LATENT: {given, middle, family, nickname} is outside {middle,
nickname} at any position. The hazard declared is #273 being widened
toward the multi-span shape, which this rule's own comment already
guards from the other side ("A single-span regression must not be
absorbed here") -- this declaration is that guard read backwards. No
_CROSS_RULE_WINNERS row."""

[[change]]
issue = "fix(#379) a tussenvoegsel after a family comma attaches to the family"
# 'Vega, Juan de la': the Dutch alphabetized listing moves the
# tussenvoegsel behind the given name -- "Beethoven, Ludwig van" is how
# "Ludwig van Beethoven" is filed -- and 1.4 read the trailing particle
# run as a middle name. 2.2 attaches it to the family already named by
# the comma and renders it before the base, so `middle` empties and
# `family` grows. rules.md#P6 states it; the derived views move with it
# (family_particles 'de la', family_base 'Vega').
#
# Fields are {middle, family}: the given name does not move. `suffix`
# is deliberately NOT here, though the #380 half of the change does
# move a token out of it ('Berg, Jan vd' was suffix 'vd' at every
# baseline and is now family 'vd Berg'). Adding `suffix` to claim it
# costs three shapes this rule has no business explaining --
# {family,suffix} taken from fix(#380) below, and {middle,suffix}
# and {middle,family,suffix} taken from UNEXPLAINED, the last two
# being diffs in which `family` does not move at all. A rule that
# pre-claims shapes it has never seen is the #372 failure mode.
# The first name read fix(suffix-routing) until #451 deleted that
# catch-all, and it was already the wrong name by then: measured, a
# {family, suffix} diff on 'Berg, Jan vd' goes to fix(#380), which
# sits BELOW this rule, so claiming `suffix` here would take it from
# there. On a name this regex reaches that fix(#380)'s does not --
# 'Vega, Juan de la' -- the same diff went to the catch-all and
# arrives UNEXPLAINED now. Either way the decision below stands; only
# the rule the shape would be taken FROM has changed.
#
# 'Berg, Jan vd' entered corpus_issues.jsonl and corpus_rules.jsonl
# after this was written, and it did NOT arrive unexplained -- the
# fields-only catch-all took it, and _CROSS_RULE_WINNERS recorded the
# absorption rather than closing it. It has fix(#380)'s own rule now
# (#451, below). The declining was right; what was missing was the
# rule beside it.
#
# Latin-anchored over the WHOLE name, not just the trailing word: with
# a leading .* this absorbed non-Latin comma names whose diff has
# another cause -- a Cyrillic 'Smith, de la' moves {family} because the
# particle's RENDERING ORDER inside the family changed, which no rule
# in this ledger names, and it classified here. (No such name is in
# any corpus, so this is what WOULD happen. It would now arrive
# UNEXPLAINED and block the gate until someone read it, which is the
# right outcome: this ledger has no fields-only rule to absorb it any
# more. The claim that it "falls to the fields-only catch-all" was
# true until #451 deleted that rule, and this file now says what its
# 2.0.0 and 2.1.0 copies have said since 8237b54.) The class is the
# neighbours' and compare.py's own: U+0000-U+024F, which stops at
# Latin Extended-B, so a diacritic-bearing 'Nguyen, Van de la' in NFD
# or Latin Extended Additional is outside it.
#
# What the rule still over-claims is vocabulary, not script: any Latin
# comma name ending in an alternation member is claimed whatever the
# naming tradition, so a future {middle,family} regression on
# 'Nguyen, Van' -- one of the two corpus names it reaches, and the one
# that does NOT move -- would classify as intended.
name_regex = "(?i)^[\\u0000-\\u024f]*,[\\u0000-\\u024f]*\\s(de|del|den|der|di|do|dos|du|la|le|los|mc|van|vd|von|zu)(\\s+(de|del|den|der|di|do|dos|du|la|le|los|mc|van|vd|von|zu))*\\s*$"
fields = ["middle", "family"]

[[change]]
issue = "fix(#380) a trailing vd after a family comma is the tussenvoegsel, not a post-nominal"
# 'Berg, Jan vd': the tree reads it given 'Jan', family 'vd Berg',
# suffix '' -- the trailing 'vd' attaches to the family the comma
# already named, the same P6 precedence fix(#379) states above for the
# leading-particle shapes. Whether 1.4 itself read the trailing word
# as `suffix` is outside what this ledger's worker can check directly
# (tools/differential/README.md's warning against reading a v1 release
# from a cached environment); the diff this rule explains at this
# baseline moves exactly {family, suffix}, which is consistent with
# that reading and is what the fields below claim.
#
# decisions.md#vocabulary-collisions C-ii records the word itself:
# "vd is the live case: never-given particle AND credential acronym
# (the British Volunteer Decoration), neither of them a name.
# Decision: the Dutch van der reading, as the more common." #380 is
# named there as the trailing-orphan half that decision unblocks.
#
# The {family, suffix} companion to fix(#379) above, which claims
# {middle, family} and deliberately declined `suffix` -- that
# comment's own accounting of what claiming it would have cost stands
# as written; this rule is the piece it left out, not a widening of
# it.
#
# Ported verbatim from expected_since_2.0.0.toml, issue text and regex
# included, so the _MUST_NOT_MATCH "fix(#380)" key that already guards
# the 2.x copies guards this one too. Latin-anchored over the whole
# name for fix(#379)'s reason: with a leading .* it would absorb
# non-Latin comma names whose diff has another cause.
#
# The regex also reaches 'Berg, abdul vd', which fix(comma-precomma-family)
# above claims on {family, given} -- a different diff shape, so this
# rule's {family, suffix} fields never match it and it is not claimed
# here. That reach is real, so 'Berg, abdul vd' is NOT a
# _MUST_NOT_MATCH probe for this rule: that roster tests the regex,
# not classify().
name_regex = "(?i)^[\\u0000-\\u024f]*,[\\u0000-\\u024f]*\\svd\\s*$"
fields = ["family", "suffix"]

[[change]]
issue = "fix(#342) NOT WANTED: a bare trailing 'Rai' is read as a post-nominal suffix and the family is lost"
# 'Aishwarya Rai': the tree reads given 'Aishwarya', family '', suffix
# 'Rai'. 'rai' is a bare entry in SUFFIX_ACRONYMS
# (nameparser/config/suffixes.py -- not SUFFIX_ACRONYMS_AMBIGUOUS,
# not SUFFIX_WORDS), so the credential reading outranks the surname
# reading with nothing to arbitrate them.
# #342 (OPEN, milestone v2.2, bug) reports this: Rai, in the issue's
# own words, is "a common surname across Hindi- and Bengali-speaking
# regions," and the bulk 2019-12-11 wikipedia post-nominal import
# (af5bdab) that added it was never reviewed against that collision.
#
# Whether 1.4 itself read the trailing word as `family` is outside
# what this ledger's worker can check directly
# (tools/differential/README.md's warning against reading a v1 release
# from a cached environment); the diff this rule explains at this
# baseline moves exactly {family, suffix}, which is consistent with
# that reading and is what the fields below claim.
#
# Classified because the cause is known and recorded, NOT because the
# reading is wanted -- decisions.md#P5's 2026-08-22 #369 entry
# attributes that exact wording, quoted verbatim, to the previous
# fix(#369) ledger rules (since rewritten, because #369 itself was
# fixed). A [[never]] exclusion was considered and rejected: an
# excluded name reports UNEXPLAINED and exits non-zero, which would
# redden the 1.4.0 gate and block every release until #342 lands --
# and #342 lists two candidate fixes that trade different corpus
# names against each other, so which one lands is not yet decided.
#
# DELETE THIS RULE when #342 lands. The gate then reports it as
# 'EXPLAINED NOTHING', which is the reminder.
#
# Literal-anchored to the one corpus name that reaches this shape. A
# rule keyed on the SUFFIX_ACRONYMS collision itself, rather than the
# literal name, would claim every trailing acronym-shaped surname and
# pre-excuse regressions on names nobody has looked at.
name_regex = "(?i)^aishwarya\\s+rai$"
fields = ["family", "suffix"]

[[change]]
issue = "fix(#397) NOT WANTED: a trailing Catalan/Polish linking 'i' is read as a generation marker and the family is lost"
# 'Carod i': the tree reads given 'Carod', family '', suffix 'i'. 'i'
# is a bare entry in SUFFIX_WORDS (nameparser/config/suffixes.py --
# the Roman-numeral generation markers i/ii/iii/iv/v, not
# SUFFIX_ACRONYMS), so a two-word name ending in it reads as a
# name plus a trailing generation rather than a two-word family link.
# #397 (OPEN, milestone v2.2, enhancement) reports that Catalan and
# Polish link two surnames with 'i' functioning as a conjunction, the
# way Spanish already links them with 'y' ("Juan Garcia y Lopez" reads
# family 'Garcia y Lopez'); nameparser's CONJUNCTIONS vocabulary does
# not include 'i', so nothing there joins the link, and SUFFIX_WORDS'
# numeral reading is what actually claims the trailing word instead.
#
# Whether 1.4 itself read the trailing word as `family` is outside
# what this ledger's worker can check directly
# (tools/differential/README.md's warning against reading a v1 release
# from a cached environment); the diff this rule explains at this
# baseline moves exactly {family, suffix}, which is consistent with
# that reading and is what the fields below claim.
#
# Classified because the cause is known and recorded, NOT because the
# reading is wanted -- the same standing fix(#342) above claims, from
# decisions.md#P5's 2026-08-22 #369 entry. A [[never]] exclusion was
# considered and rejected for the same reason as fix(#342) above: an
# excluded name reports UNEXPLAINED and exits non-zero, and #397's own
# "What needs deciding" section leaves open both whether 'i' joins
# CONJUNCTIONS at all and how the join's rootname carve-out should
# treat a word that is both a conjunction and suffix vocabulary --
# unresolved, so the fix is not yet in hand.
#
# DELETE THIS RULE when #397 lands. The gate then reports it as
# 'EXPLAINED NOTHING', which is the reminder.
#
# Literal-anchored to the one corpus name that reaches this shape, for
# fix(#342) above's reason: a rule keyed on "two-word name, trailing
# single letter" would pre-excuse every generation-marker regression,
# not just this one. Measured, the four longer corpus names in the
# same family produce no diff at this baseline at all, so none of them
# reaches classify() and none needs a rule here: 'Carod i Rovira',
# 'Josep Carod i Rovira' and 'Josep Lluis Carod i Rovira' read 'i' into
# `middle` with `family` already the tail word ('Rovira'), and 'Lluis
# Carod i' reads it into `suffix` with `family` already populated
# ('Carod') -- unlike 'Carod i' above, none of the four has an empty
# `family`, and all four read this way at every baseline this ledger's
# worker can reach. That is #397's open enhancement (the family link
# is still one word short of what a Catalan reader wants), not a
# 1.4-to-2.x regression, so it is out of scope for a ledger that only
# records diffs FROM 1.4.0.
name_regex = "(?i)^carod\\s+i$"
fields = ["family", "suffix"]

[[change]]
issue = "fix(suffix-delimiter-rendering) no-space delimiter core token kept whole"
# Only fires when a custom suffix delimiter is configured (Policy /
# Constants.suffix_delimiters); the corpus runs with default policy, so
# this rule is expected to match nothing here. Kept for documentation
# parity with tests/v2/cases.py's 'suffix_delimiter_no_space_core' row
# (anti-#100; mechanisms.md#SPANS).
dormant = "the no-space delimiter rendering fires only under a non-default Policy, and the corpora run under the default one, so no corpus name can reach this rule. Kept because the behavior family is real and documented in tests/v2/cases.py: the rule is ready the moment a matching string is added"
name_regex = "/"
fields = ["suffix"]

[[change]]
issue = "ambiguous-surname-acronym data change: parenthesized (MA)/(DO) now stays nickname"
# suffix_acronyms_ambiguous gained 'ma'/'do' so bare 'Jack Ma' keeps its
# surname (v1 parity restored); side effect: parenthesized/quoted "MA"
# or "DO" no longer escape to suffix (v1 did, since v1 treated them as
# unambiguous there) -- they now fall through to nickname parsing.
# Not expected to fire against this corpus (no such strings survived
# into the v1 banks); kept for documentation completeness.
# The members are the entries themselves, undotted. They carried
# optional periods until corpus_rules.jsonl (#414) brought in 'John
# Smith M.A.': the member `m\.?a\.?` reaches the fragment 'M.A.' in
# that name, and a fragment a member matches has to BE a vocabulary
# entry -- 'M.A.' is not one. The bracket class around the alternation
# meant the RULE never claimed that name, but the member-level guard
# is the one that holds here, because a rule can widen at depth 0
# later and leave a broad member governing it. A parenthesized dotted
# '(M.A.)' should now arrive UNEXPLAINED and be read once, which is
# the same discipline the rest of this file states.
dormant = "no corpus contains a parenthesized (MA) or (DO), so this data change has no diff to explain here. Kept so the rule is ready the moment such a name is harvested"
name_regex = "(?i)[(\"'](ma|do)[)\"']"
fields = ["suffix", "nickname"]

[[change]]
issue = "feat(#269) Arabic بن prefix chains onto family (non-Latin new-recognition)"
# '‏محمد بن سلمان‏': #269 adds the native-script Arabic
# patronymic particle بن ("bin"/"son of") to PARTICLES/
# NON_GIVEN_NAME_PARTICLES. v1 had no such entry, so it left بن a plain
# middle-name token ('سلمان' alone as last); 2.0 now chains it onto the
# family the same way 'von'/'bin' (Latin) do, giving family 'بن سلمان'.
# This is new-recognition on non-Latin input -- the exact behavior
# #269 exists to add -- not a Latin-corpus regression, so it is
# classified rather than reverted.
# Word-bounded: a bare "بن" would also match the substring inside e.g.
# لبنان ("Lebanon") and silently absorb unrelated middle/last diffs.
name_regex = "\\bبن\\b"
fields = ["middle", "family"]

[[change]]
issue = "feat(#273) typographic nickname delimiters recognized by default"
# 'John “Jack” Kennedy', 'Hans „Hansi“ Müller', 'Jean «Petit» Dupont':
# v1 knew only straight quotes and parentheses, so a smart-quoted or
# guillemet-wrapped nickname leaked into `middle` as literal text.
# Matches only when such a delimiter is actually present. A nickname
# diff on the ASCII pairs would be a regression; the ASCII-pairs
# [[never]] entry at the end of this file is what refuses it, not this
# rule's silence (#328), in any position the pair can take. See that
# entry for why the delimiter's position turned out not to be the
# thing worth narrowing on.
name_regex = "[“”„«»「」『』（）]"
fields = ["middle", "nickname"]

[[change]]
issue = "fix(cjk-delimited-nickname) delimiter recognition compounds with the CJK order flip"
# '山田「タロ」太郎', '山田 太郎 (マイケル・ジャクソン)': one name, two
# intended changes at once -- the corner-bracket/nakaguro handling
# (2.0's typographic delimiters; 2.1's dot separator rendering the
# nickname join with a space) changes `nickname`, while the same
# name's wholly-CJK remainder takes the 2.1 family-first flip in
# first/last. Neither single-change rule may claim the union (the
# delimiter rule's fields exclude first/last, the CJK rule's exclude
# nickname -- each on purpose, so a lone regression in the other's
# fields stays loud). Both lookaheads are required: the delimiters
# alone would match 'John 「Jack」 Kennedy' -- the brackets sit in CJK
# Symbols and Punctuation, OUTSIDE every classified span, so a Latin
# name can carry them -- and would then absorb a bare first/last
# regression on it. Requiring a classified codepoint too confines the
# rule to names the order flip can actually reach. The second
# lookahead's class is the same hand copy of _SCRIPT_RANGES the rule
# above carries, pinned by the same sync test. One absorption is
# inherent and accepted: a nickname-ONLY diff on a nakaguro name
# ('マイケル・ジャクソン') classifies here, because subset-matching
# cannot REQUIRE a field to have changed. Positional note: this rule
# overlaps the CJK rule above and the delimiter rule below; within
# the name_regex tier file order decides which label a diff reports
# under, so it sits after the tighter single-change rules on purpose.
# The slug is free-form. It used to avoid the literal #271/#272
# strings, because a pin selected the canonical CJK rule by those
# substrings and asserted uniqueness; that pin is gone (#333) and the
# span sweep finds rules by their character class instead.
name_regex = "(?s)(?=.*[「」『』・･])(?=.*[\\u3005-\\u3006\\u3040-\\u309F\\u30A0-\\u30FF\\u3400-\\u4DBF\\u4E00-\\u9FFF\\uF900-\\uFAFF\\uAC00-\\uD7A3\\uFF65-\\uFF65])"
fields = ["given", "family", "nickname"]

[[change]]
issue = "fix(cjk-fullwidth-paren-nickname) fullwidth-parenthesis recognition compounds with the CJK order flip"
# '山田 花子（旧姓 佐藤）', which reached the corpus from the #329 case
# table via build_cjk_corpus.py. It is NOT a #329 diff: that change is
# gated on a non-empty Policy.maiden_delimiters and the harness runs
# the default policy, where （） is a #273 NICKNAME delimiter. So the
# same two intended changes as the rule above, with a different
# delimiter pair -- 1.4 knew no fullwidth pair and read the brackets as
# name text (first 山田 / middle '花子（旧姓' / last '佐藤）'), while 2.0
# extracts the clause to `nickname` and the wholly-Han remainder left
# behind takes the family-first flip.
#
# Its own rule rather than a widening of fix(cjk-delimited-nickname),
# on both halves. That rule's `fields` deliberately exclude `middle`,
# and this diff has one: the fullwidth clause is written flush against
# the token before it, so 1.4's tokenizer left '花子（旧姓' as a single
# middle-name word -- a spaced corner-bracket name never does that.
# Adding `middle` there would pre-excuse a bare middle regression on
# '山田「タロ」太郎'. Its delimiter set is separately pinned in
# tests/v2/test_ledger_guards.py as "its own decision surface", so
# widening it is a deliberate act with a test to update, and there is
# nothing to gain by making it here.
#
# Both lookaheads are required for the reason given on the rule above:
# （） lives in Halfwidth and Fullwidth Forms, outside every classified
# span, so a Latin name can carry it ('John （Jack） Kennedy') and the
# delimiter alone would let this rule absorb a first/last regression on
# one. The span class is the same hand copy of _SCRIPT_RANGES the rules
# above carry, pinned by the same auto-discovering test. The slug is
# free-form; the #271/#272 substrings it avoids were a constraint of a
# selector retired in #333.
#
# DORMANT since 2.2, and the reason is a migration rather than a
# revert. Its one name moved to fix(cjk-maiden-marker) above: under
# rules.md#M3 the fullwidth clause is read on the strength of the 旧姓
# inside it, so the clause lands in `maiden` and `nickname` no longer
# diffs at all -- 1.4 read the brackets as name text and had no
# nickname here either. The diff is now {given, middle, family,
# maiden}, which is a subset of that rule's fields and not of this
# one's, so classify() hands the name over. That is the right home:
# what the name demonstrates today IS a marker consumption, and the
# fullwidth pair is only what makes the marker a separate token.
#
# Kept rather than deleted because the reasoning below is about the
# `fields` boundary between this rule and fix(cjk-delimited-nickname),
# which nothing else records, and because the declaration is load
# bearing in reverse: if a fullwidth-bracketed CJK NICKNAME diff ever
# appears again, this rule wakes and the harness says the dormant
# reason has gone false.
dormant = "its one name, '山田 花子（旧姓 佐藤）', diffs in `maiden` rather than `nickname` since rules.md#M3 and is claimed by fix(cjk-maiden-marker); no other corpus name pairs a fullwidth bracket with a CJK script"
name_regex = "(?s)(?=.*[（）])(?=.*[\\u3005-\\u3006\\u3040-\\u309F\\u30A0-\\u30FF\\u3400-\\u4DBF\\u4E00-\\u9FFF\\uF900-\\uFAFF\\uAC00-\\uD7A3\\uFF65-\\uFF65])"
fields = ["given", "middle", "family", "nickname"]

[[change]]
issue = "fix(cjk-comma-honorific-peel) glued honorific peels off a post-comma given name"
# '김, 민준씨' / '田中, 太郎さん': the comma already fixes family/given
# order on both sides, so NO order flip happens -- `family` is
# byte-identical. The only change is #312's peel: the honorific glued
# to the post-comma given name comes off into `suffix` (민준씨 ->
# 민준/씨, 太郎さん -> 太郎/さん). Diff is exactly {given, suffix} on
# all seven names this rule claims.
#
# Its own rule because neither neighbour describes it, and #372 is
# about rules explaining what they describe. fix(comma-family) above
# is the Latin lone-post-comma-piece routing and is now anchored to
# Latin, so it cannot reach these at all. fix(cjk-comma-compound)
# below is for the UNION -- comma routing AND the family-first flip
# together -- which is why its fields include `family`; these names
# move no family, so claiming them there would be the same field-shape
# coincidence #372 was filed over, relocated rather than fixed.
#
# `fields` separates the two for the UNION rows ONLY, and file order
# decides the rest -- do not read the first half as the whole. The
# union rows ('Dr 김민준씨, V.', '田中さん, PhD') diff with `family` in
# the mix, which is outside this rule's [given, suffix], so they
# cannot match here however early it sits and still fall through to
# the compound rule. But the seven names this rule EXPLAINS diff
# exactly {given, suffix}, which both rules' `fields` admit, and the
# two regexes are byte-identical -- so file order alone holds them
# here, and swapping the two rules reattributes all seven (measured
# 2026-09-02; docs/design/decisions.md#differential-ledger's Declined
# entry on #382 option 1 carries the measurement and why narrowing
# the regex cannot change it). This rule is narrow-first, the
# declaration-free default, so the pair is no `order_contests`
# contest and owes no [[change.precedes_narrower]] block -- which is
# not the same as order deciding nothing. What pins the seven is
# _CROSS_RULE_WINNERS, by name.
#
# The regex is the same comma-plus-classified-codepoint pair the
# compound rule carries, hand-copied from _SCRIPT_RANGES and pinned by
# the same sync test -- a comma alone matches every Latin 'Smith, Jr.'
# in the corpus.
name_regex = "(?s)(?=.*,)(?=.*[\\u3005-\\u3006\\u3040-\\u309F\\u30A0-\\u30FF\\u3400-\\u4DBF\\u4E00-\\u9FFF\\uF900-\\uFAFF\\uAC00-\\uD7A3\\uFF65-\\uFF65])"
fields = ["given", "suffix"]

[[change]]
issue = "fix(cjk-comma-compound) comma routing compounds with the CJK order flip"
# '威廉·莎士比亚, PhD': one name, two intended changes at once -- the
# post-comma lone-piece routing (fix(comma-family): v1 read PhD as
# title; 2.x routes it to suffix) and the CJK source-order/family-
# first movement in first/middle/last on the pre-comma name. Neither
# single-change rule may claim the union: comma-family's fields
# exclude last, the CJK rule's exclude title/suffix -- each on
# purpose, so a lone regression in the other's fields stays loud.
# Both lookaheads are required, by the same reasoning as the
# delimiter compound above: a comma alone matches every Latin
# 'Smith, Jr.' in the corpus, and the classified-codepoint lookahead
# confines the rule to names the CJK behaviors can actually reach.
# The class is the same hand copy of _SCRIPT_RANGES the rules above
# carry, pinned by the same sync test. The slug is free-form; the
# #271/#272 substrings it avoids were a constraint of a selector
# retired in #333.
#
# #312 sends only the glued-honorific comma rows whose diff includes
# `family` here ('Dr 김민준씨, V.', '田中さん, PhD') -- the union this
# rule is for. The rows whose diff is only {given, suffix} peel
# without any order flip and belong to fix(cjk-comma-honorific-peel)
# above, which names that shape and whose fields exclude `family` so
# the two cannot compete. Until #372 they landed on fix(comma-family)
# instead, on nothing but file order.
#
# `middle` was in that fields list too, on the strength of the
# mechanism paragraph above -- the CJK order flip CAN move a middle
# name for a three-token pre-comma run. None of the 11 names this
# rule actually explains has one: ten have a single-token post-comma
# tail, and the eleventh, '田中さん, Ph. D.', has two ('Ph.' and
# 'D.') but fix_phd merges them into one suffix unit before v1's
# comma split can turn the second token into `middle` the way an
# untreated two-token tail does at 1.4.0 ('Smith, John Middle' reads
# first 'John', middle 'Middle'). So no diff this rule claims has
# ever moved `middle`, for that reason rather than pre-comma token
# count.
#
# classify() admits by subset, so leaving `middle` out is not
# passive: a future diff that grows to include it alongside `title`
# or `suffix` -- the two roles this rule's comma-routing half
# actually claims -- now falls out of this rule instead of being
# silently absorbed, and should arrive UNEXPLAINED and be read once
# rather than get a widened rule pre-built for it (#452). That
# promise does not cover every shape, and the exceptions are per
# SHAPE and per NAME rather than per role -- measured with classify()
# over the 23 names this regex reaches, not reasoned from which role
# grew:
#
#   {given, middle, family}  all 23  -> fix(#271/#272/#298), the order
#                                      flip with no comma routing, whose
#                                      bare CJK regex sits ahead of this
#                                      rule and whose fields were never
#                                      narrowed
#   {middle, suffix}         4 of 23 -> '田中さん, Dr.' to fix(#296), and
#                                      '田中さん, 様.', '김민준, 씨',
#                                      '김민준, 씨.' to
#                                      fix(cjk-honorific-suffix)
#   {middle, title}          none    -> unclassified
#   {middle, suffix, title}  none    -> unclassified
#
# So what #452 buys here is narrower than "middle alongside title or
# suffix": it is the shapes in the last two rows, plus {middle, suffix}
# on the nineteen names the honorific rules do not reach. An earlier
# draft of this paragraph claimed the whole `title`-or-`suffix`
# combination and was falsified by driving classify() over the reach --
# the method decisions.md#differential-ledger names as the only one
# that answers this question.
name_regex = "(?s)(?=.*,)(?=.*[\\u3005-\\u3006\\u3040-\\u309F\\u30A0-\\u30FF\\u3400-\\u4DBF\\u4E00-\\u9FFF\\uF900-\\uFAFF\\uAC00-\\uD7A3\\uFF65-\\uFF65])"
fields = ["given", "family", "title", "suffix"]

[[change.precedes_narrower]]
issue = "fix(cjk-glued-honorific-peel) glued honorific peels into suffix"
why = """
LIVE, and the least comfortable of the declarations in this file.
Seventeen names reach both regexes and FIFTEEN have a diff the peel
rule's {family, given, suffix} admits -- but six of those fifteen are
taken by rules written above both, and so are not this pair's to
decide: '田中, 太郎さん', '김, 민준씨', '김, 민준씨 (Jimmy)',
'선생님, J.씨' and '이, J.씨' go to fix(cjk-comma-honorific-peel), and
'田中さん, Dr.' to fix(#271/#272/#298). That leaves NINE this rule
holds and the peel rule could take, and position alone is what keeps
those nine here. Of the two names outside the fifteen, '田中さん, PhD'
lands here as well but moves `title` too, so the peel rule is
ineligible for it wherever it sits, and '田中さん, 太郎' does not diff
at all. All three counts are classify() over the seventeen, recomputed
rather than carried over.

The order stays because the peel rule scopes itself
to a name with NO COMMA ANYWHERE, and promoting it would put that
label on '田中さん, 様.' and '김민준씨, J.씨', which do route a
post-comma piece and are the comma compound this rule is named for.

What must NOT be claimed is that all nine are compounds. Measured
against the wheel, '王先生, V.', '田中さん, V.' and '김민준씨, V.' show
no comma routing and no order flip at all: 'V.' is the given name on
both sides, the pre-comma family is one unsegmented run, and the whole
diff is the glued peel. They arrive here because this rule's criterion
is "the diff includes `family`", and `family` moves only because the
peel took the honorific off it -- so for those three the rule's own
label is wider than the name is. The rule that would describe them,
fix(cjk-comma-honorific-peel) above, covers this shape for a
POST-comma given name and has no family-side twin. Writing one was
weighed as #496 and DECLINED on one reason alone: the three are radar
(the paragraph below), so no gate can demand the rule, and a rule
nothing can demand is not one to add. #495 asked the converse --
whether the radar-only rules ALREADY here still earn their place --
and closed as not planned, so they stay. That answer leaves the #496
decline exactly where it was: it turns on nothing being able to demand
a NEW rule, which is not what #495 settled. So holding them here is
the least wrong of the readings available, and this is the entry that
says so out loud rather than letting the rule name imply otherwise.

All seventeen contested names are radar tier, by two warrants and
not one: sixteen sit in corpus_cjk_tolerated.jsonl, demoted there by
#488, and the seventeenth, 'Dr 田中さん, V.', is in corpus_issues.jsonl
alone -- harvested, append-only, and radar since #468. So nothing
fatal turns on who wins this particular contest: no rule here can be
demanded on their account, because an unmatched diff on a radar name
is reported rather than failed for want of a rule. Not never-fatal
unconditionally, though -- a [[never]] exclusion outranks the tier
(see _CORPUS_TIERS) and none refuses these. That is a fact about the
NAMES and it does not carry to the rules. Measured by deleting each
rule and re-classifying the corpus -- without fix(cjk-comma-compound)
the run still reports 0 unexplained, so it really is radar-only and it
was the candidate #495 weighed; without the peel rule TWELVE
contract-tier names go UNEXPLAINED ('Andersonさん', '王先生' and
'김민준씨' among them) and the run fails. TWELVE remains the figure
after the 2026-09-05 narrowing of the peel rule, re-measured: the one
name that narrowing moved goes to fix(cjk-honorific-suffix) with the
peel rule present and without it alike. Twelve of the SIXTEEN names the
peel rule explains are contract (measured 2026-09-05; #495 read
fourteen of seventeen, one of which the period-class demotion took to
radar and one of which the narrowing took to another rule), which is
why #495 recorded it as a rule to keep rather than a deletion
candidate. #495 closed as
not planned, so the compound rule keeps its place as well -- and the
reason is this contest read from the other side: measured, deleting
the compound rule does not leave its eleven diffs UNCLASSIFIED, it
hands NINE of them to the peel rule, whose comment is about a
different shape. Two are left unclassified."""

[[change]]
issue = "fix(cjk-glued-honorific-peel) glued honorific peels into suffix"
# '김민준씨' -> 김/민준/씨, '田中さん' -> 田中/さん, 'Andersonさん' ->
# Anderson/さん: #312's peel, on a name with no space before the
# honorific and no comma anywhere. 16 corpus names, which fell to the
# fields-only fix(suffix-routing) catch-all (deleted in #451) until
# #372 gave them a rule that names them. 17 until the 2026-09-05
# narrowing below, which is not one of them leaving the corpus: the
# name it lost was never glued.
#
# The regex is this file's first hand copy of GLUED_HONORIFICS rather
# than SUFFIX_WORDS, and that narrower vocabulary is the whole reason
# this rule can exist. '김민준씨' and the given name '김지양' are the
# same string shape -- hangul ending in a character the spaced list
# calls an honorific -- so a rule keyed on SUFFIX_WORDS could not tell
# them apart, and unanchoring the spaced rule below to reach the glued
# forms would let a future suffix regression on '김지양' classify as a
# recognized honorific. GLUED_HONORIFICS settles it in the config
# instead: 양, 군, 氏, 殿 and 博士 are deliberately absent from it,
# because a glued match on those collides with real given names. Same
# copy, same pin (_HONORIFIC_SOURCES) as the 2.0 ledger's twin, whose
# regex this is verbatim.
#
# `\.?(?=$|[ ,])` rather than `$`: the honorific ends a TOKEN, not
# necessarily the string. '田中さん II' and '김민준씨 Jr.' carry a
# Latin suffix after it, '김민준씨 (Jimmy)' a nickname.
#
# The three negative lookbehinds are the 2026-09-05 narrowing, and the
# 2.0 twin's comment carries the argument for them in full. 박사님,
# 선생님 and 교수님 are the only entries of this alternation containing
# another entry of it, so a match on the interior 님 was the one way a
# SPACED honorific could reach a rule whose title says a glued one was
# peeled off the name. It reached two: '김민준 박사님', where nothing is
# peeled at all -- rules.md#W2's second sentence, whose witness line for
# this string is suffix="박사님", the honorific whole and its own word --
# and '선생님', where `suffix` moves nowhere and the order rule claims
# the diff regardless. The lookbehinds refuse the interior position
# only, so a glued '김민준박사님' still matches on 박사님 itself.
#
# Measured consequence here, 2026-09-05: exactly one name changes hands
# and it is '김민준 박사님', which fix(cjk-honorific-suffix) below takes.
# Summary lines byte-identical, no pin in this file moves,
# order_contests unchanged, recorded reach 37 -> 35.
name_regex = "(?<=[^\\s,])(?<!박사)(?<!선생)(?<!교수)(?:박사님|선생님|교수님|박사|씨|님|先生|女士|小姐|教授|様|さん|さま|くん|ちゃん)\\.?(?=$|[ ,])"
fields = ["given", "family", "suffix"]

[[change.precedes_narrower]]
issue = "fix(suffix-routing) a two-token name ending in a roman numeral keeps it in `suffix`"
why = """
a regex accident, and a script-blind one: the numeral rule opens on a
run of non-space characters, which matches kana as readily as Latin,
while its prose is about a two-token LATIN name with a trailing
numeral and no comma in it. This rule's own pattern already names
'田中さん II' -- it closes on a token-boundary lookahead rather than an
end anchor precisely because a Latin suffix can follow the honorific.

LATENT: measured, the diff is {family, given, suffix} (1.4 read first
'田中さん', last 'II'; 2.x reads last '田中', suffix 'さん, II'), and
`given` is outside the numeral rule's {family, suffix} at any
position. _CROSS_RULE_WINNERS pins the name here. '田中さん II' is
radar tier since #488, so nothing in the gate turns on this contest.
The demotion candidate #495 weighed was the NUMERAL rule -- measured,
both names it explains ('John V', 'Mohamad X') are radar -- and not
this one, which explains twelve contract-tier names (measured
2026-09-05; fourteen when #495 read it). #495 closed as
not planned, so the numeral rule stays; the measurement stands as the
statement about its reach that it always was."""

[[change.precedes_narrower]]
issue = "fix(suffix-routing) a two-token name ending in the suffix word jr keeps it in `suffix`"
why = """
the same script-blindness one rule further down: the jr rule's leading
non-space run matches hangul as readily as Latin, while the rule is
written for 'Smith Jr.' -- one Latin name word, one suffix word, no
comma. The trailing 'Jr.' does move here -- 1.4 read it as the family,
the tree reads suffix '씨, Jr.' -- and that half of the diff is the
{family, suffix} the jr rule is named for. What that rule cannot
describe is the OTHER token: the glued 씨 peels off '김민준씨' and
segments what is left into given '민준', family '김'. `given` is that
segmentation, it is this rule's subject, and it is where the diff
leaves the jr rule's reach.

LATENT, the diff being {family, given, suffix} against the jr rule's
{family, suffix}. _CROSS_RULE_WINNERS pins the name here, on a shape
measured against the wheel -- the corroboration its structural twin
'田中さん II' did not have until #382 re-measured it. The NAME is radar
tier since #488, so nothing fatal turns on it, but neither RULE was a
#495 candidate: the jr rule explains the contract-tier 'Smith Jr.',
and this one twelve contract names (measured 2026-09-05; fourteen when
#495 read it). #495 closed as not planned, so
nothing radar-only is being deleted either, and this pair outlives the
question from both directions."""

[[change]]
issue = "fix(cjk-honorific-suffix) postnominal honorifics recognized, compounding with the CJK order flip"
# '王小明 先生', '김민준 씨', '田中 太郎 様': #307 ships the spaced CJK
# honorifics as suffix vocabulary, so a trailing 先生/씨/様 moves to
# `suffix` where 1.4 read it as a name part -- and the remaining
# wholly-CJK name simultaneously takes the family-first flip, so a
# three-token name moves `middle` too, which is what carried it past
# the fields-only suffix-routing rule while that rule existed (#451
# deleted it). Keyed on the honorific alternation itself
# (the maiden-marker rule's pattern): the trigger tokens are wholly
# CJK characters, so the rule matches only a name whose TRAILING
# token is a listed honorific -- a mostly-Latin name with one
# ('Wang Xiaoming 先生') is inside its shadow, accepted because the
# recognized honorific is the diff's cause there too, and the
# alternation is a hand copy of SUFFIX_WORDS' CJK entries --
# pinned by tests/v2/test_ledger_guards.py, which derives the expected
# set from the config by script membership. Anchored to a WHOLE
# trailing token ((?:^| )...$), judged on the NAME STRING: without
# it, any name string merely ENDING in 양/군 -- the glued given name
# 김지양, the spaced 김 지양 -- would match and could have a real
# regression absorbed as intentional (the case table pins the
# parser-side twin: suffix matching is whole-token, never endswith).
# GLUED diffs (田中さん, 김민준씨, and the 김씨 that segmentation
# already reached) never match this rule -- the anchor is judged on
# the name STRING, and a glued form has no space before its
# honorific. They fell to the fields-only suffix-routing rule by
# their {first, last, suffix} shape (v1 held the whole token in
# first, so last moves too) -- field-honest, even though that rule's
# prose described the two-token Latin case. Verified by the
# 2026-07-30 run, not assumed: #308's peel put a dozen glued names
# in the corpus (Latin+glued like Andersonさん included) and every
# one classified there -- none carried a middle-field diff. They have
# fix(cjk-glued-honorific-peel) above since #372, and the catch-all
# they were falling to is gone (#451), so the sentence is history:
# nothing absorbs a glued diff this rule declines any more.
name_regex = "(?:^| )(?:씨|박사|박사님|선생님|교수님|군|양|님|先生|女士|小姐|博士|教授|様|氏|殿|さん|さま|くん|ちゃん)\\.?$"
fields = ["given", "middle", "family", "suffix"]

[[change]]
issue = "feat(#269) non-Latin titles/conjunctions recognized"
# 'г-н Иван Петров' (Cyrillic title), 'Хосе И Мария Сантос' (Cyrillic
# conjunction И joining two given names). v1 shipped Latin-only
# vocabulary, so these were plain name tokens and everything shifted
# one position. New recognition on non-Latin input -- the point of
# #269 -- not a Latin-corpus regression.
#
# Cyrillic only, and only the three fields the shift can touch. The
# first draft allowed five fields across four scripts, which put every
# Arabic name in the corpus -- including ones that are currently
# PARITY -- into its shadow, and pre-excused Greek and Hebrew, against
# which nothing has ever been compared. A leading title or an absorbed
# conjunction moves a word from `first` to `title`, or from `middle`
# into `first`; it cannot reach `last` or `suffix`. Widen this only
# with a name that demonstrates the need, and prefer a new rule per
# script over loosening this one -- the \bبن\b rule below is the
# model.
name_regex = "[\\u0400-\\u04FF]"
fields = ["title", "given", "middle"]


# The fix(leading-credential) rule that stood here is GONE, and its
# absence is the record: it explained 2.0 routing a leading split
# 'Ph. D.' to `suffix` where v1 read title 'Ph.' and given 'D.'. #371
# restored v1 on all four names of that shape, so the rule explained
# nothing, and the gate reported it SHADOWED -- `fix(comma-precomma-
# family)` above claims the one name still diffing here, which is the
# #426 precedent for dropping rather than keeping a shadowed rule.
# Read the diagnosis, not just the error: compare.py separates
# `reverted` (matches no diffing name) from `shadowed` (an earlier
# rule claimed every diff it would have) precisely because the fixes
# differ. Three of this rule's four names became parity; the fourth,
# 'Ph. D., Jr.', still diverges and rides under that earlier rule.
#
# What v1 did -- never heal the pair at the HEAD of the string,
# because its regex `\s(ph\.?\s+d\.?)` required a preceding space,
# while healing it anywhere else, mid-name as readily as trailing --
# is what the parser does again; rules.md#S2 now states it as a rule
# rather than a regex accident.


# Deliberately NOT a [[change]] rule: TRAILING 'Ph. D.' split-token
# healing ('John Ph. D.', 'John Smith, Ph. D.') is PARITY, not a 2.0
# behavior change -- v1's fix_phd healing of the adjacent 'Ph.'/'D.'
# pair into one suffix unit is replicated exactly by 2.0's 'joined'
# vocab tag (tests/v2/cases.py classification="parity" on both
# 'phd_split' and 'suffix_comma_split_phd'; verified empirically, zero
# diff against the 1.4 worker). Adding a suppression rule for it would
# risk masking a real regression in this exact shape, so the
# trailing-'Ph. D.' [[never]] entry below refuses it instead: any diff here
# reports UNEXPLAINED (#328). (The leading case above is a separate
# shape, which is why it needed its own anchored rule rather than a
# widened one.)
#
# The scope of what is parity still has to be read narrowly. Parity is
# the two inputs named above, where the pair LEADS its run. A trailing
# pair after another suffix diffs on ORDER -- 'John Smith, Jr. Ph. D.'
# is 1.4.0 suffix 'Ph. D., Jr.' against 2.0's 'Jr. Ph. D.', because
# fix_phd extracted the credential pre-parse and re-appended it while
# 2.0 renders the tail as written (tests/v2/cases.py
# 'suffix_comma_split_phd_after_another_suffix',
# classification="fix(credential-pair-order)"). That input is in the
# case table and in no corpus, so nothing is reported on it either
# way; note that the trailing-'Ph. D.' [[never]] entry's anchor
# captures it too, and would call its intended order diff a regression
# if a corpus ever gained it. Reconciling them then means a narrower
# `name_regex`, and only that: the two renderings differ in the ORDER
# of one suffix string and in nothing else, so the diff is `suffix`
# alone -- the one field the parity promise is about. Any `fields`
# list permissive enough to let the order diff classify would abandon
# the promise. Not a question to settle now, on a name the harness
# never sees.
#
# No ordering question arises here: exclusions are consulted before
# any rule, so this is independent of where it sits in the file.
#
# Before the [[never]] entry existed this shape was ABSORBED rather
# than refused: fix(comma-family) below matches on a bare comma and
# lists `suffix`, so a probe corpus carrying the name came out
# unexplained 0. That is one of the instances filed as #372. It is
# no longer what happens here -- exclusions are consulted first, so
# the name is refused before any rule sees it -- and #372 tracks the
# general problem, which this entry does not solve.

[[change]]
issue = "fix(#369) a given-name title licenses the bound given-name join with one word to spare"
# 'Sheik abdul salam': rules.md#P5 -- "or after a given-name title,
# which asserts that a given name follows (H1): there the two words
# join and the name has no family". Given 'abdul', family 'salam'
# becomes given 'abdul salam', family '' -- the empty family H1
# accepts for "Sir John". The 'Sheik abdul salam Jr' rules example
# is the same move with the suffix standing; 'Sheik abdul Jr Smith'
# is in reach and does not move -- the licence takes a name word,
# not a suffix.
#
# 'Sheik Abu Bakar', the #367 regression this issue was filed for,
# reads given 'Abu Bakar' again with every field byte-identical to
# this baseline, so no rule names its fields: restored, not moved.
#
# Without this rule the name landed on the fields-only
# fix(suffix-routing) catch-all, which moved no suffix here. #451
# deleted that catch-all, so this ledger has no fields-only rule left
# to absorb anything.
name_regex = "(?i)^sheik\\s+abdul\\b"
fields = ["given", "family"]

[[change]]
issue = "fix(#401) the bound-given reserve counts the trailing numeral assign reads as the suffix"
# 'abdul Smith V', 'abdul Smith Jr V': rules.md#P5 -- "a trailing
# roman numeral that assign reads as the suffix (S2) is no word to
# spare, and is not joined". first 'abdul Smith', last 'V' -> given
# 'abdul', family 'Smith', suffix 'V'; at this baseline the V was not
# read as a suffix, so all three fields move here where the 2.x
# ledgers list two. Both are rules.md examples; no differential corpus
# name has the shape. The 'abdul Smith V Ph. D.' spelling stays out
# of the corpus: a trailing split credential is this ledger's
# [[never]] shape, and its v1 reading carries the same family loss
# that entry would then refuse to explain.
#
# A rule with fewer fields than this diff silently handed the name to
# the fields-only fix(suffix-routing) catch-all, which is how this fix
# was first recorded as "1.4.0 parity": the catch-all's printout was
# capped, and EXPLAINED NOTHING is not byte-identical. #451 deleted
# that catch-all, so a narrowed rule here now costs the name its
# explanation outright instead of hiding it -- louder, and the reason
# the lesson is worth keeping written down.
name_regex = "(?i)^abdul\\s+smith\\s+(jr\\s+)?v$"
fields = ["given", "family", "suffix"]

[[change]]
issue = "fix(#421) the bound-given join never absorbs a suffix piece"
# 'abdul Jr Smith Berg': rules.md#P5 -- "the join never absorbs a
# marker standing as a word of its own -- a marker is not a name word
# (M2) -- nor a word of the unambiguous suffix vocabulary (S2),
# wherever position will then place it". given 'abdul Jr', middle
# 'Smith' -> given 'abdul', middle 'Jr Smith'. Parity with this
# baseline until now; a
# rules.md example, since no differential corpus name has the shape.
name_regex = "(?i)^abdul\\s+jr\\s+smith\\s+berg$"
fields = ["given", "middle"]

[[change]]
issue = "fix(#421) the bound-given join never absorbs a split credential"
# 'abdul Ph. D. Smith Berg': the rule above, on the split credential.
# At this baseline v1's fix_phd extracted the credential before
# parsing, so: first 'abdul Smith', suffix 'Ph. D.' -> given 'abdul',
# middle 'Smith', suffix 'Ph. D.' -- the suffix field unchanged here,
# the given deliberately not restored (decisions.md#P5), so this
# ledger lists two fields where the 2.x ledgers list three. A rules.md
# example; no differential corpus name has the shape.
name_regex = "(?i)^abdul\\s+ph\\.\\s+d\\.\\s+smith\\s+berg$"
fields = ["given", "middle"]

[[change]]
issue = "fix(#425) accepted: a bare ambiguous acronym the peel does not take joins as a name word"
# 'abdul Ma Smith': rules.md#P5 -- "a bare ambiguous acronym is a name
# word wherever the peel does not take it". first 'abdul', middle
# 'Ma' -> given 'abdul Ma': v1's join counted the acronym out as
# suffix vocabulary and declined; since 2.0 the join takes it, as
# assign reads it (a middle name, not a credential, with a family
# behind it). A 2.0 reading, byte-identical at 2.0.0 and 2.1.0, first
# witnessed here -- P5 records it as Accepted, and the example exists
# to carry the shape into this corpus.
name_regex = "(?i)^abdul\\s+ma\\s+smith$"
fields = ["given", "middle"]

[[change]]
issue = "fix(#424) an unlisted abbreviation is as transparent as a listed title to the leading particle, the P4 example"
# 'Xyz. van Johnson': the rules.md#P4 example of the 'Esq. van Gogh'
# rule of this change (beside the fix(#367) rules, further down),
# same reading and fields. Separate rather than an alternation, per
