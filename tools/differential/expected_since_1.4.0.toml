# Every rule needs all three of `issue`, `name_regex` and `fields`.
# `fields` stopped being optional on 2026-08-29: validate_rules had
# refused a rule carrying `fields` and no `name_regex` since #451, and
# #456 closed the mirror shape, so a half-declared rule is now a
# startup error whichever key is the missing one. An unexplained diff
# is a release blocker until classified
# (tools/differential/README.md). The citation here used to name a
# gitignored spec requirement, and passed the armed legacy-citation
# guard only because the line wrapped between the two words.
# Rules were seeded from the 2.0 rewrite's working notes
# and the `classification="fix(...)"` rows in tests/v2/cases.py; keep
# each entry's `name_regex`/`fields` as tight as the diff allows.
# FILE ORDER IS LOAD-BEARING: every rule carries a `name_regex`, so
# they all sit in one tier, _sorted_rules is stable, and file order
# decides every tie. Write the narrower rule first -- that is the
# DEFAULT and not a law: a wider rule that describes a compound
# behavior its component rule does not is the better classifier and
# stays where it is, saying so in a [[change.precedes_narrower]] block
# naming the rule it outranks (#382; eleven rules below carry one, and
# tools/differential/README.md's "Declaring a wide-first pair" owns
# the mechanics). Do NOT reorder to satisfy the check -- that moves
# which rule classifies a name and breaks _CROSS_RULE_WINNERS. See
# also the note above the four fix(suffix-routing) rules at the end of
# this file.
#
# RECOMPUTE, once for all eleven. Those `why` texts quote counts that
# drift -- "explains N names", the contract/radar splits inside them,
# the 17/15/9/6 breakdown on the compound/peel pair, and how many
# contract names go UNEXPLAINED if a rule is deleted. NONE is pinned
# by a test, so re-measure before editing any of them rather than
# copying the neighbouring digits (docs/design/AGENTS.md: a count
# that drifts carries its recompute; a stale one here has already
# reached a filed issue once).
#   1. `uv run python tools/differential/compare.py --baseline 1.4.0`
#      prints `## <issue> (N)` per rule. N IS the explains-count; the
#      roster under it truncates at ten names, the heading does not.
#   2. For a tier split, take each explained name's corpus file from
#      the tools/differential/corpus*.jsonl glob and its tier from
#      compare.py's _CORPUS_TIERS -- read that map, never rebuild it
#      from a file's name or size. corpus.jsonl is the LARGEST corpus
#      and it is RADAR; a name in both tiers reads contract, the
#      dedup loading contract files first.
#   3. For "N names this pair is contested over", call
#      order_contests(rules, names) with `names` the union of
#      _load_entries over that same glob.
#   4. For "deleting the rule sends N contract names to UNEXPLAINED",
#      delete the rule and re-run step 1.
# Do NOT substitute driving classify() over a rule's regex reach at
# its declared `fields`: that answers what the rule COULD claim, not
# what it explains. Measured 2026-09-02 over the rules named in the
# eleven exemptions, reach runs from equal to the explained count up
# to forty times it -- 288 against 8 for the lone post-comma routing
# rule, which is the rule a wrong count reached a filed issue on.

# #436/#437: the suffix view's entry boundary became the comma the
# writer typed. rules.md#R1: "a run of post-nominals written with
# spaces renders with spaces, and one written with commas keeps
# them" -- true of the comma paths since 1.4.0 and of the NO-COMMA
# path only since 2.3, which is the whole of what these names move.
# Every one goes from a comma-joined render to a space-joined one;
# none goes the other way, and none has a comma in the original
# between the two words. Roles do not move: this rule declares
# `suffix` alone, so a name whose ROLES move here arrives
# UNEXPLAINED, as it should.
#
# FIRST in the file, and that is narrow-first rather than a
# preference: `fields = ["suffix"]` is a strict subset of several
# rules below, and any of them sitting earlier while both regexes
# reach one corpus name is an undeclared order-decided contest the
# run refuses (#382). Measured 2026-09-06 by moving this rule to
# the end of a scratch copy of this file and re-running the gate,
# which raises 3 such contests here.
#
# An anchored alternation of the names rather than a shape, because
# the shape is "two post-nominals with a space between them" and
# that reaches every listing form in the corpora. The members are a
# list of NAMES and copy no wordlist, which is what
# _NOT_A_VOCABULARY_COPY in tests/v2/test_ledger_guards.py records;
# _CORPUS_CLAIMS pins the reach at 10 with its digest, and
# _MUST_NOT_MATCH pins the five comma and delimiter forms it must
# never claim.
[[change]]
issue = "fix(#436/#437) a space-separated post-nominal run renders with spaces, not commas"
# 2026-09-20, #397: one name joins the alternation and the rule does
# not change. 'Josep Lluis Carod i III' is a two-word generation run
# this baseline renders 'i, III' and the tree renders 'i III' -- the
# whole of its diff here. #397 moves NOTHING on it: measured against
# the parent 46651750 the parse is byte-identical before and after
# this bundle (given 'Josep', middle 'Lluis', family 'Carod', suffix
# 'i III'), the link having no name word to its right. What grew is
# the CORPUS -- the name arrived with #397's own case rows -- and the
# run rendering is what the diff is about.
name_regex = "^(?:JOHN DOE PHD MD|John Doe MD PhD|John Smith MD PhD|John Smith Mc V|Josep Lluis Carod i III|Kenneth Clarke QC MP|Smith, John PhD I\\.|The Rt Hon Kenneth Clarke QC MP, HMG|Washington Jr\\. MD, Franklin|abdul Smith Jr Ma|abdul Smith Jr V)$"
fields = ["suffix"]

# #346: swami, guru, baba and lama moved from the TITLES-only block
# into GIVEN_NAME_TITLES on 2026-09-06. rules.md#H1's Accepted clause
# -- "a given-name title plus one name word leaves the family empty"
# -- now reaches them, so the one name word behind the title is the
# GIVEN name and the family is empty, where every baseline read it as
# the family. Both roles move together and `fields` declares both: a
# name whose TITLE moved would arrive UNEXPLAINED, as it should.
#
# Four corpus names, all from the radar-tier corpus_issues.jsonl and
# all moving the same way. The two- and three-word spellings are the
# boundary and are _MUST_NOT_MATCH probes: 'Swami Vivekananda
# Saraswati' and 'Guru Gobind Singh' keep their family names, because
# H1's fold requires exactly one name word, and a rule reaching them
# would stand ready to explain the very regression that boundary
# exists to catch.
#
# An anchored alternation of the four NAMES rather than a shape,
# under the ledger discipline expected_since_1.4.0.toml's header
# states for all four files: keep each entry's `name_regex` as tight
# as the diff allows. Four names moved, so a four-name list is the
# tightest expression of that diff; anything shape-shaped is wider
# than what was measured. It copies no wordlist either, which is what
# _NOT_A_VOCABULARY_COPY in tests/v2/test_ledger_guards.py records;
# _CORPUS_CLAIMS pins the reach at 4 with its digest.
[[change]]
issue = "fix(#346) a renunciate title and one name word leave the name a given name"
name_regex = "^(?:Baba Ramdev|Guru Nanak|Lama Zopa|Swami Vivekananda)$"
fields = ["family", "given"]

# #519: prince and princess moved from the TITLES-only block into
# GIVEN_NAME_TITLES on 2026-09-10. rules.md#H1's fold now reaches
# them, so the one name word behind the title is the GIVEN name and
# the family is empty, where every baseline read it as the family.
# Both roles move together and `fields` declares both.
#
# Three corpus names: 'Prince Charles' and 'Prince Fielder' from the
# radar-tier corpus_issues.jsonl, and the contract-tier rules.md
# example 'Her Royal Highness Princess Anne' (corpus_rules.jsonl), all
# moving the same way. 'Prince Fielder' moves too and is wrong either
# way -- Prince is his given name, which is #348's collision and not
# this rule's subject. The boundary is pinned by _MUST_NOT_MATCH
# probes: two name words behind the title ('Prince Harry Windsor'),
# the chained run 'Prince of Wales Jr' (addresses by `wales`), the
# trailing 'Robert Prince', 'Lord Byron' (`lord` stays out) and the
# bare 'Prince'.
#
# An anchored alternation of the NAMES rather than a shape, under
# the ledger discipline expected_since_1.4.0.toml's header states:
# keep each entry's `name_regex` as tight as the diff allows. It
# copies no wordlist, which _NOT_A_VOCABULARY_COPY records;
# _CORPUS_CLAIMS pins the reach with its digest.
[[change]]
issue = "fix(#519) prince and princess join the given-name titles"
name_regex = "^(?:Her Royal Highness Princess Anne|Prince Charles|Prince Fielder)$"
fields = ["family", "given"]

[[change]]
issue = "fix(#271/#272/#298) native-script CJK: family-first order, hangul segmentation, the kana license and the dots"
# '毛 泽东', '김민준': script_orders flips first/last for a name written
# wholly in Han or Hangul, and the Korean surnames that now ship as
# default vocabulary additionally split an unspaced hangul token into
# last + first. '高橋 みなみ', 'マイケル・ジャクソン': #272 extends the
# same order table to kana-bearing Japanese names and makes the
# katakana middle dot a token separator, which moves pieces between the
# same three fields. Seeded from the fix(#271) and fix(#272) rows in
# tests/v2/cases.py.
#
# One rule, not two, because it is one diff shape: both issues move
# name pieces between first/middle/last on native-script CJK input, and
# splitting the class by issue would need a rule per script with no
# gain in tightness (the fields list is already the narrow half).
#
# Scoped by script, which is exactly the scope of the behavior --
# nothing here can touch a name with no CJK character in it. Han's
# astral block (U+20000-U+323AF) is deliberately left out of the class:
# no name in either corpus reaches it, and a rule should be no wider
# than the diffs it has to explain. Extend it -- and the sync pin in
# tests/v2/test_ledger_guards.py, which fails if the two disagree -- if
# one ever does. The kana spans are BMP-only for a different reason:
# supplementary-plane kana is hentaigana and other archaic forms no
# modern name uses, so _SCRIPT_RANGES does not list it either.
#
# U+FF65 is the one span here that _SCRIPT_RANGES does NOT have, and
# it is deliberate. The halfwidth middle dot separates tokens like
# its fullwidth twin, so 'ﾏｲｹﾙ･ｼﾞｬｸｿﾝ' splits where 1.4 left one
# token, but halfwidth kana is excluded from CLASSIFICATION on
# purpose (a separate normalization problem). The rest of the
# halfwidth block (U+FF66-U+FF9F) is left out for the usual tightness
# reason, and it was measured rather than assumed: a dotless
# halfwidth name such as 'ﾏｲｹﾙ ｼﾞｬｸｿﾝ' is byte-identical on both
# sides, so covering the block would pre-excuse a future regression
# on a shape that is parity today. U+00B7, the context-sensitive
# 间隔号 (#298), deliberately gets NO span even though it too changes
# parses: its flank guard divides only between classified-script
# characters, so every name it can change already matches this class
# through a flanking character -- and a B7 span's only actual effect
# would be letting this rule claim first/middle/last diffs on
# punt-volat Latin names ('Gal·la Marcet'), pre-excusing a regression
# on exactly the input class the guard exists to protect.
#
# corpus_cjk.jsonl (#295) exists so this rule fires in every real
# run: build_cjk_corpus.py harvests every CJK-bearing text in
# tests/v2/cases.py -- the fix(#271)/fix(#272)/fix(shime-mark) rows
# AND the parity rows, whose value here is pinning NON-diffs (マイケル
# must not change against 1.4) -- closing the blind spot the other
# two corpora have by construction: v1's banks had no reason to test
# CJK, and build_issues_corpus.py requires an internal space, which
# unspaced names never have.
#
# Since 2026-09-01 that one harvest writes TWO files, not one: rows
# carrying `tolerated` go to corpus_cjk_tolerated.jsonl and the rest
# to corpus_cjk.jsonl. The never-dormant conclusion above survives
# the split unchanged, because both files load in every real run --
# what the split changed is the TIER (corpus_cjk_tolerated.jsonl is
# radar, so an unmatched diff on one of its names reports instead of
# failing), and a rule fires on names it is given regardless of what
# an unmatched diff would then cost.
name_regex = "[\\u3005-\\u3006\\u3040-\\u309F\\u30A0-\\u30FF\\u3400-\\u4DBF\\u4E00-\\u9FFF\\uF900-\\uFAFF\\uAC00-\\uD7A3\\uFF65-\\uFF65]"
fields = ["given", "middle", "family"]

[[change]]
issue = "fix(#274) maiden markers consumed"
# The alternation is a hand copy of MAIDEN_MARKERS, pinned by
# tests/v2/test_ledger_guards.py: every alternative must match at least
# one entry the config ships, and none may match ordinary name text.
#
# Its members reach 3 of the 17 entries -- geb, nee, née -- which is
# not the same set as the markers the corpora contain (geb, nee, née,
# z domu and 旧姓; the first three are covered here). Fourteen entries
# go unreached, and the carve-outs in that arithmetic are
# load-bearing: TWO of the fourteen do appear in the corpora and each
# is classified somewhere other than this alternation. 旧姓 is one,
# and it has fix(cjk-maiden-marker) of its own below rather than an
# alternative here. z domu is the other, and it cannot be an
# alternative here at all: this is a per-WORD regex over a name, and
# the words of a phrase entry are an ordinary Polish preposition and
# an ordinary noun -- an alternative matching either would claim names
# carrying no marker, which is the one thing the pin above forbids.
# Its two names are classified by the fix(#434) rules, keyed on the
# literal. Growing this rule toward the other TWELVE buys nothing:
# none of them appears as a token in any corpus, so there is no diff
# for them to classify. The roz alternative was
# dropped in 2.2 with the vocabulary entry it copied (see
# maiden_markers.py's Deliberately absent note): no corpus name
# contains the string in any case or position, so it classified
# nothing and its removal moved no name.
#
# 旧姓 is a different case, and it has been got wrong three times, so
# state it precisely. Widening this rule to cover it changes no corpus
# classification -- every 旧姓 name in the corpora leaves a wholly Han
# residual, which reads family-first (#271), so its diff includes
# `given`, and classify() requires the diff's fields to be a subset of
# the rule's. That is a fact about the CORPUS, not about the rules: a
# 旧姓 name with a Latin residual would diff without `given`, and since
# this rule sorts ahead of fix(cjk-maiden-marker) in the same tier it
# would take that name from it. Inert today, shadowing in principle.
# Widen deliberately, and record the new coverage in
# _LATIN_ALTERNATION_SOURCES.
#
# 'born' was an alternative here from the harness's first commit and
# was removed in #350. It is not in MAIDEN_MARKERS and never was, in
# v1 or v2, so it could not correspond to a real #274 change. What it
# could do is claim any name containing "born" -- with fields
# maiden/middle/family -- and absorb a genuine regression. No corpus
# name contains it, so removing it changed no classification.
#
# Supporting 'born' would mean shipping it as vocabulary first, and it
# is not free: 'Bertha Born Smith' loses its family name to the marker.
# Note the vocabulary is not missing English -- 'nee' is there, and
# tests/v2/cases.py calls it the spelling English writes most often.
# See maiden_markers.py's own "Deliberately absent" note for what has
# actually been considered and declined.
#
# The lookarounds and the two context tests are not decoration. corpus_rules.jsonl (#414)
# brought in 'Jane Smith (Nee)' and 'Jane Smith (Nee) (Jones)', which
# are M1's examples of a one-word clause keeping a word that may
# itself be a surname. Under the DEFAULT facade -- which is what the
# differential parses with -- no maiden delimiter is configured, so
# the parenthesized word is a NICKNAME and no marker is active at all.
# Without the lookarounds this rule matched the word anyway and stood
# ready to explain a `maiden` diff on a name that has no marker in it,
# which is absorption waiting to happen. The vocabulary-presence guard
# in test_ledger_guards.py is what caught it.
#
# The same corpus addition also put M2's BOUNDARY examples in reach --
# 'Jones nee', 'nee Jones', 'Jane van der Berg nee', 'Muller geb.' --
# names M2 states as unchanged, because a marker with nothing before
# or after it is just a word. Nothing guards that: those names really
# do carry marker vocabulary, so the presence guard is satisfied.
# Hence the two context tests, which say what this rule has always
# meant: a marker with a name word BEFORE it and one AFTER it. Reach
# 16 -> 11 when they were added, and every name it explained then was
# inside the eleven -- figures from that measurement rather than from
# today's corpus, which has grown since and keeps growing. For today's,
# read the `## fix(#274) maiden markers consumed (N)` heading off
# `compare.py --baseline 1.4.0`; a number written here instead would
# only be that heading's value on the day someone typed it.
#
# These claimed names still do not move, recorded rather than
# excluded: 'Jane Smith, née Jones' (post-comma, M2's remaining
# Accepted limit), 'Jane van der Berg née PhD' and 'Jane Smith née V'
# (only a suffix follows, so the consumer declines), and
# 'Jane née Jr y Jones' and 'Jane van der Berg née Jr Jones' (the
# connective and bound-given joins, #412). Each would need the regex
# to ask a vocabulary question -- suffix or connective membership --
# a second alternation this rule cannot spend. A count stood at the
# head of that list and said four until a review round re-measured
# it: the corpus grew and the sentence did not, which is this file's
# standing hazard. The list is the count now, and it is self-checking
# where a digit was not. Measured 2026-08-27 against the 1.4.0 wheel,
# name by name over everything the regex claims rather than over a
# sample of it -- a walk whose length is whatever `_claimed()` returns
# that day.
#
# #445 landed 2026-08-27, and the prediction this note used to carry
# was wrong in a way worth keeping on the record. It reasoned that a
# "keep the family" fix would leave these diffs a subset of {maiden,
# middle, family}, so this rule would go on explaining them and would
# absorb the change in silence. The rule #445 actually chose MOVES
# the one name word rather than adding one: `given` empties as
# `family` fills, so every name that moved left this rule's fields
# and arrived UNEXPLAINED -- loud, at all three baselines. The note
# earned its keep all the same, and that is why it is corrected here
# rather than deleted: it named the right rule, the right field and
# the right eight names, and re-measuring its checklist is what
# showed its own reasoning wrong.
#
# Six of the eight moved: five by the fix(#445) rule at the end of
# this file, and 'John née Jones Smith Ma' by the fix(#424/#445)
# acronym rule above it, its diff carrying the suffix v1 read as
# well. The other two are rules.md#M4's own carve-outs, and their
# diffs are unchanged to the field, which is what makes them a
# boundary rather than an oversight. 'abd née Jones' -- whose word
# the bound-given vocabulary has claimed -- is still this rule's.
# 'J. née Jones Smith V' -- whose word is an initial -- is NOT, and
# never was: its 1.4.0 diff carries `suffix`, which these three
# fields cannot hold, so 'fix(#424) accepted: the maiden walk keeps
# the numeral an initial before the marker vetoes' is what explains
# it (asked of classify directly, 2026-08-27, rather than read off
# the regexes). The safety argument holds through that rule instead:
# it declares no `given` either, so a `given` move on either
# carve-out lands UNEXPLAINED rather than absorbed.
#
# The two other fix(#445) names,
# 'Smith née Jones' and 'Smith née Jones PhD', are corpus rows M4's
# own example lines added.
name_regex = "(?i)(?<![(（])(?<=\\S\\s)\\b(n[ée]e|geb)\\.?(?![)）])(?=\\s+\\S)"
fields = ["maiden", "middle", "family"]

[[change.precedes_narrower]]
issue = "fix(#379) a tussenvoegsel after a family comma attaches to the family"
why = """
LIVE, and new with #533's corpus rows. Three names carry a maiden
marker AND a trailing tussenvoegsel after a family comma -- 'Doe, Jane
nee Smith do', its capital spelling, and 'Doe, Jane nee Smith MA do'.
Both regexes reach all three and the tussenvoegsel rule's fields are a
strict subset of these, so nothing but file order keeps them here.

The discriminator is WHICH MOVE the diff is. What 1.4.0 read as
middle 'nee Smith' plus a trailing post-nominal, the tree reads as a
maiden name: the marker leaving the name and taking words with it is
what every one of the three diffs is ABOUT, and the tussenvoegsel
rule cannot say that -- it describes a particle joining a family the
comma already named, which is a reading these three share with 1.4.0
rather than one that moved. Read the other way round the narrower
rule would stand ready to explain a maiden/middle regression on every
comma name ending in a particle, which is the absorption this file's
wide-first discipline exists to prevent.

Not "the whole of the diff", which an earlier draft of this block
said and which two of the three names falsify: 'Doe, Jane nee Smith
do' and 'Doe, Jane nee Smith MA do' also empty the `suffix` v1 read,
and `suffix` is in neither rule's fields, so neither classifies them
at all -- they are below, under 'fix(#274/#424) accepted: a maiden
clause keeps a trailing credential v1 read as a post-nominal'. The
contest is over the names both regexes REACH, not the ones either
explains, which is what keeps it live with only 'Doe, Jane nee Smith
DO' actually landing here.
"""

[[change]]
issue = "fix(#274/#533) the clause keeps the credential a join or a missing reader would have taken"
# Five names where the marker's clause takes words v1 read as a
# middle name and a suffix, and KEEPS the credential at the end of
# them. Against 1.4.0 the visible diff is #274's consumption -- v1
# had no maiden reading at all, so `given`/`middle`/`family`/`suffix`
# empty as `maiden` fills -- and #533's half is that the last word
# goes INTO `maiden` rather than staying the suffix v1 read.
#
# Each is a route by which rules.md#M2's invariant declines the stop,
# and an earlier round of this branch took all five:
#   'Doe, Dr. nee Smith MA' -- the take would leave 'Dr. MA', a
#     segment with no name word for a given part's trailing slot to
#     be the end of, so nothing there reads the word as a credential
#   'Berg, abdul nee Jones MA' -- P5's lenient post-comma join would
#     swallow the released word into the bound-given pair
#   'Berg, Jane van der nee Smith DO' -- the particle chain the
#     marker just bounded would take it back into the family
#   'Jane Doe nee MA PhD' -- the FIRST-WORD FLOOR spares the member
#     standing straight after the marker; only the unambiguous
#     'PhD' behind it leaves, which is why `suffix` narrows rather
#     than empties here
#   'Doe, Jane nee Smith Do' -- #531's lean declines a Title-cased
#     member after a comma
# The first three read as 2f57ff21 read them; the last two are
# #533's own clamp and lean.
#
# `_ambiguities` is NOT declared and cannot be at this baseline: the
# v1 surface has no such field, and the reports these names now
# carry are recorded in the 2.x ledgers where the comparison can see
# them.
name_regex = "^(?:Berg, Jane van der nee Smith DO|Berg, abdul nee Jones MA|Doe, Dr\\. nee Smith MA|Doe, Jane nee Smith Do|Jane Doe nee MA PhD)$"
fields = ["family", "given", "maiden", "middle", "suffix"]

[[change.precedes_narrower]]
issue = "fix(comma-precomma-family) pre-comma run reads as family, not given"
why = """
LIVE, and new with the #533 review's corpus rows. Four of the five
names here have a family comma, so the pre-comma rule's {given,
family} is a strict subset of these fields and nothing but file order
keeps them here.

The discriminator is WHAT MOVED the given name. The precomma rule
describes 2.x splitting a pre-comma run that 1.4 read as one first
name; on these four the pre-comma run is a single word 1.4 and the
tree both read as the family, and what empties `given` is the MARKER
leaving with the word after it -- 'Doe, Dr. nee Smith MA' reads given
'nee' at 1.4.0 because v1 had no marker reading at all. Classified by
the precomma rule instead, each would be attributed to a comma
behavior none of them exercises.
"""

[[change.precedes_narrower]]
issue = "fix(#411) the bound-given reserve stops counting words the maiden name takes"
why = """
LIVE, and new with the #533 review's corpus rows. 'Berg, abdul nee
Jones MA' is reached by both and #411's fields are a strict subset.

The discriminator is that #411's rule is about the RESERVE and this
name's diff is about the CREDENTIAL: the reserve half is real and is
why `given` reads 'abdul' rather than 'abdul nee', but the `suffix`
1.4.0 read is emptied by the clause KEEPING the 'MA', which #411 has
nothing to say about and whose field it does not declare. The review
round is what settled that reading -- an earlier round released the
word into P5's join and read given 'abdul MA' -- so a rule naming
#411 alone would attribute this change's decline to the reserve.
"""

[[change.precedes_narrower]]
issue = "fix(#379) a tussenvoegsel after a family comma attaches to the family"
why = """
LIVE, and new with the #533 review's corpus rows. 'Berg, Jane van der
nee Smith DO' and 'Doe, Jane nee Smith Do' each carry a maiden marker
AND a tussenvoegsel-shaped word after a family comma, and the
tussenvoegsel rule's fields are a strict subset of these.

The discriminator is the one fix(#274)'s own block above this file
gives for the same pair: what 1.4.0 read as middle text plus a
trailing post-nominal, the tree reads as a maiden name, and the
marker leaving with its words is what every field of these diffs is
about. On 'Berg, Jane van der nee Smith DO' the tussenvoegsel is not
even the moved word -- 'van der' attaches to the family either way,
and the 'DO' the clause KEEPS is what empties `suffix`.
"""

[[change]]
issue = "fix(#335/#533) a marker-led bracketed clause is the maiden name whatever its last word is"
# 'Jane Doe (nee Smith MA)', 'Jane Doe (nee Smith Ma)', 'Jane Doe
# (nee Smith) MA'. The role move is fix(#335)'s, above: 1.4 knew the
# parenthesis pair and had no maiden reading to give the clause, so
# it came back a nickname.
#
# Recorded as their own rule because what #533 does to them is
# NOTHING, and that is worth a row. The delimiters outrank every
# reading inside the span, so the whole span is the maiden name
# whatever its last word is and no fork is called at all
# (decisions.md#M2, rules.md#M2) -- 'Smith MA' and 'Smith Ma' read
# alike where the undelimited spellings do not. 'Jane Doe (nee
# Smith) MA' is the control: the member the writer left OUTSIDE the
# span is an ordinary trailing credential, which v1 also read as a
# suffix, so only the clause's role moves.
name_regex = "^(?:Jane Doe \\(nee Smith MA\\)|Jane Doe \\(nee Smith Ma\\)|Jane Doe \\(nee Smith\\) MA)$"
fields = ["maiden", "nickname"]

[[change]]
issue = "fix(cjk-maiden-marker) maiden marker consumed, compounding with the CJK order flip"
# Its own rule rather than a widening of fix(#274) above: that rule's
# fields stop at maiden/middle/family because a Latin marker moves
# only those, while a Han one also flips `given` -- the name left after
# the marker is consumed is wholly Han, so it reads family-first
# (#271). Adding `given` to #274's list would make it broader than its
# prose and let it absorb diffs that have nothing to do with markers
# (#328). The regex is the marker itself, so this rule can claim
# nothing else.
name_regex = "旧姓"
fields = ["given", "middle", "family", "maiden"]

[[change]]
issue = "fix(credential-pair-order) a split credential and a suffix render in written order"
# 'John Smith, Jr. Ph. D.': 1.4 rendered the pair as 'Ph. D., Jr.',
# 2.x renders 'Jr. Ph. D.' -- the order the name was written in.
# tests/v2/cases.py carries the same input under this classification.
#
# The trailing-Ph. D. exclusion refused this name until #413's harvest
# brought it into a corpus. That is the arrival the entry predicted in
# writing and told its reader to narrow for, so the entry was narrowed
# and the name reads here. Only `suffix` moves -- the given and family
# names are untouched by the order the credentials render in.
#
# POSITION is load-bearing. fix(comma-family) below matches this name
# too, and its ["given","title","suffix"] is a superset of the {suffix}
# moved here, so whichever is written first wins -- both carry a
# name_regex, and _sorted_rules is stable within that tier. Written
# after it, this rule explains nothing and the name files under "lone
# post-comma piece routes to suffix/title".
name_regex = "(?i)^[\\u0000-\\u024f]*,\\s*jr\\.?\\s+ph\\.?\\s*d\\.?\\s*$"
fields = ["suffix"]

[[change]]
issue = "fix(A2) content-free input names nobody, so every role empties"
# '(' / '.,': v1 kept a punctuation-only string as a name -- parse('.')
# read first='.' -- and 2.0 empties input with no name content in it.
# decisions.md#A2. Five corpus names are content-free ('', '()', ',',
# '(', '.,'); two of them diff at this baseline and the other three
# were already empty on both sides.
#
# Written ABOVE `fix(comma-family) lone post-comma piece routes to
# suffix/title, not first` deliberately -- that rule, well down the
# file, and NOT the comma-family rule sitting immediately below this
# one, which is anchored to a literal name and cannot reach '.,' at
# all. Both carry a name_regex so they share a tier, where
# _sorted_rules' stable sort leaves file order deciding, and that
# rule's Latin-range comma regex reaches '.,' -- which is how a comma
# rule came to explain an emptying that has nothing to do with commas.
# (Its regex was a bare ',' until #372; the Latin anchoring it has
# now reaches '.,' just the same. That rule's own comment owns the
# story of what the anchoring keeps off it, and the count with it --
# restating either here is how one copy goes stale while the other
# does not.) _CROSS_RULE_WINNERS pins the reassignment.
#
# `\W` rather than a punctuation class, because it IS A2's own
# predicate: _assemble.py decides the emptying with `not
# any(c.isalnum() ...)`, and across all of Unicode `\w` and isalnum
# diverge on exactly one codepoint -- U+005F, which A2 empties and
# this rule does not claim. So the rule is a strict SUBSET of the
# behavior it names, by construction rather than by measurement: it
# cannot claim a name A2 leaves alone. Being Unicode-aware, it also
# puts any name carrying a letter or digit in any script outside
# itself, which is why it matches none of validate_rules' sentinels.
name_regex = "^\\W*$"
fields = ["given"]

[[change]]
issue = "fix(comma-family) a comma followed only by titles keeps the given/family split"
# 'Bob Jones, author' / 'Bob Jones, compositeur': the comma is followed
# by nothing but a title word, which said nothing about where the
# family name ends, so the pre-comma name keeps its positional read --
# first 'Bob Jones' -> given 'Bob', family 'Jones', the title staying
# where it was (the post-comma word is a title on both sides). 2.0 had
# merged the pre-comma run into the family (the comma-precomma-family
# rule below, whose fields would absorb this move -- written ahead of
# it so the name files here and that rule's count tells).
name_regex = "(?i)^bob\\s+jones,\\s*[a-z]+$"
fields = ["given", "family"]

[[change]]
issue = "fix(comma-family) a comma followed only by titles keeps the given/family split, the C1 example"
# 'John Smith, Mr.' and 'John Smith, Mr. Jr.': the rules.md#C1 examples
# of the rule above (first 'John Smith' -> given 'John', family
# 'Smith'; the title stays where it was; with the postnominal, v1's
# first 'Jr.' is the suffix). Without this rule the second landed on
# the fields-only fix(suffix-routing) catch-all, back when that
# catch-all declared `given` as well; once #451 narrowed it to
# {family, suffix} a {given, family, suffix} diff stopped being a
# subset of it, and #451 has now deleted it outright. Measured both
# before and after that deletion: with this rule removed the diff is
# UNEXPLAINED. Its own literal rather than an alternation with 'Bob
# Jones', which would be no vocabulary.
name_regex = "(?i)^john\\s+smith,\\s*mr\\.?(\\s+jr\\.?)?$"
fields = ["given", "family", "suffix"]

[[change.precedes_narrower]]
issue = "fix(comma-precomma-family) pre-comma run reads as family, not given"
why = """
LIVE -- one of the two live pairs in this file, and the one where the
narrower rule would be actively WRONG rather than merely partial.
'John Smith, Mr.' diffs {given, family}, which the precomma rule
admits, so nothing but file order keeps it here.

The discriminator is what becomes of the pre-comma run. Measured, 2.x
CREATES a split across it where 1.4 had none: 1.4 read first 'John
Smith' with no family at all, and the tree reads given 'John', family
'Smith'. So the precomma rule's stated behaviour -- the pre-comma run
reads as family -- is half true of this name and no more: 'Smith'
becomes the family, 'John' does not. This rule describes the split;
that one describes the whole run moving, which is not what happens
here.

That claim is about THIS name and is deliberately not generalised to
the precomma rule's other names. 'Dr. Do Van Johnson, MD' is one of
its seven and its pre-comma run splits too, so "that rule only ever
explains whole-run moves" would be false -- which is the shape of
argument to distrust here, since nothing recomputes a claim about
another rule's names.

'John Smith, Mr. Jr.' sits beside it latently: {given, family,
suffix} is outside the precomma rule's fields at any position.
_CROSS_RULE_WINNERS has no row for either name. It pins the sibling
decision instead -- ('Bob Jones, author', ('family','given')) to the
unsuffixed C1 rule above, on the note that "the rule written for that
shape is ahead of the precomma merge in the file" -- and this rule is
that rule's suffixed twin."""

[[change]]
issue = "fix(#296) a dropped prenominal takes the name position it occupies"
# 'Do Quang Minh': 'do' left TITLES -- a postnominal (D.O.) and a
# Vietnamese surname, never a prenominal -- so a leading 'Do' is no
# longer peeled as a title and falls through to the positional read:
# title 'Do', first 'Quang' -> given 'Do', middle 'Quang'. The
# 2026-07-30 audit table's disposition; 'phd', 'jr', 'junior' and
# 'se' left with it, and no corpus name leads with a bare one (the
# three that lead with 'Jr.' are read by the period inference and do
# not move). The rule's second name is 'MD, DO, DDS': title 'DO' ->
# given 'DO', the comma anchor's one corpus hit. `family`
# is deliberately OUT of the field list: the family name must not
# move on this rule, so a regression there stays loud. The anchors
# are the two openings a name has (start, or after a family comma).
name_regex = "(?i)(^|,\\s*)do\\b"
fields = ["title", "given", "middle"]

[[change]]
issue = "fix(#296) dr is not postnominal vocabulary, so a trailing Dr. is a name word"
# 'dr Vincent van Gogh dr' with its #100 siblings (and, at 2.x only,
# 'Smith Dr', which 1.4.0 already read as the family): 'dr' left
# SUFFIX_WORDS, where it was v1 residue -- 'Dr.' is not a postnominal
# in any tradition -- so a trailing bare 'Dr' is no longer suffix
# vocabulary and falls to the positional read, taking the family name
# with it.
#
# 2026-09-08: 'John Smith Dr.' has LEFT this rule, and the sentence
# that used to close this comment has been retracted with it. It read
# "NOT a new class: no trailing title-only word routes to title on
# the no-comma path ('John Smith Prof.' reads family 'Prof.' at every
# baseline) ... #316 is the open question for the class". #316 is
# answered: a trailing PERIOD-MARKED listed title word now routes to
# title, so 'John Smith Dr.' moves {title, suffix} against this
# baseline and {title, middle, family} against 2.2.0, neither of them
# a subset of the three roles below, and the bundle rule `fix(#316) a
# trailing period-marked title word reads as a title` at the end of
# this file claims it. What stays here is the BARE spelling, which
# #316(b) leaves open: 'Smith Dr' and the 'dr ... dr' names wear no
# abbreviation period and the trailing walk never sees them. This
# rule is narrower than that one and stands first, so the DIFF
# decides which of the two claims a name, not file order.
#
# `middle` left the field list in the same edit: it was there for
# 'John Smith Dr.', whose middle name moved, and the three names the
# rule still explains move `family` and `suffix` alone. The gate said
# so itself -- OVER-DECLARED, "classify() matches by SUBSET, so the
# excess is not inert" (#452).
name_regex = "(?i)\\sdr\\.?$"
fields = ["family", "suffix"]

[[change]]
issue = "fix(#296) a credential-only comma string reads a name and its postnominal"
# 'Jr., PhD' / 'MD, PHD': a string that is nothing BUT credentials.
# v1 read the trailing one as a title and the leading one as a first
# name; with 'phd' out of TITLES the comma structure reads it as a
# one-word name plus a postnominal -- a reading of a string nobody
# writes as a name, and the honest one for it.
name_regex = "(?i)^[a-z]{2,3}\\.?,\\s*phd$"
fields = ["title", "given", "family", "suffix"]

[[change.precedes_narrower]]
issue = "fix(comma-family) lone post-comma piece routes to suffix/title, not first"
why = """
LATENT. Both names move {title, given, family, suffix}, and the
routing rule declares no `family`, so it is ineligible for them
wherever it sits -- file order decides nothing here today. What the
declaration records is the hazard that wakes if that rule's `fields`
ever grow `family`, and its own comment disclaims precisely that
growth ("family/`last` is unchanged either way -- pre-comma is
definitionally family") while the family move is the whole of the
credential reading here: 'MD' stops being a first name and becomes the
one-word name. This rule is the routing rule PLUS the pre-comma merge
on a single string, so a widened routing rule would take the union and
report only half of it. _CROSS_RULE_WINNERS pins 'MD, PHD' here,
keyed by the name alone since #497, and the shape it is adjudicated
at -- ('family','given','suffix','title') -- is the one
compare._RECORDED_DIFFS records for the name. Both names sit in
corpus_issues.jsonl alone -- radar since #468's tier split, and
untouched by #488, which created corpus_cjk_tolerated.jsonl and holds
neither name -- so neither can demand a rule any more and nothing
fatal turns on this pair. The tier reaches the NAMES, not both rules:
measured, this rule explains two names and both are radar, which made
it a candidate for #495; the routing rule explains eight of which FIVE
are contract, and was not one. (Six shipped here in #499 and is what
tiering by FILE MEMBERSHIP gives, with a correct _CORPUS_TIERS: it
counts 'John Smith, Dr.' contract because corpus_shapes.jsonl holds a
copy. The dedup is on (name, order), and that copy carries shape 4,
whose FAMILY_FIRST order makes it a SECOND entry rather than the
dedup winner -- verified at baseline 2.0.0, where the run compares
both -- and shape 4's min_baseline of 2.0.0 puts it among the seven
this baseline skips. So the only entry a 1.4.0 run compares for that
string is the radar one from corpus_issues.jsonl. Tier here is a
property of the ENTRY the run compared, not of the files the string
sits in.) #495 is now closed as not planned and
the radar-only rules keep their place, so both halves of that
measurement are facts about REACH and no longer a question about
either rule's life -- docs/design/decisions.md#differential-ledger's
Declined entry on #495 has the population and why deleting one
mislabels rather than merely loses."""

[[change.precedes_narrower]]
issue = "fix(comma-precomma-family) pre-comma run reads as family, not given"
why = """
LATENT by the same arithmetic and for a different reason: a four-field
diff cannot fit {given, family} at any position, so the precomma rule
is ineligible for these two wherever it sits. The hazard here is a
rule that is this one's PRE-COMMA HALF alone. 'MD' going given ->
family really is its shape, so a reader widening it would have a
plausible-looking case -- and it would then explain a credential-only
string as a name with a listing comma, losing the postnominal reading
that moves the title and the suffix in the same breath. A string that
is nothing but credentials is not a name plus a comma. Radar tier
since #468 on both names -- corpus_issues.jsonl, which #488 did not
touch -- so this pair is watched rather than enforced, and again only
the wider rule was ever #495's business.
Measured, the precomma rule explains seven names of which three are
contract ('Berg, abdul vd', 'Smith, Dr.', 'Smith, de Mesnil Jean'), so
it outlives the radar tier by itself. #495 is closed as not planned,
so the wider rule outlives it too: nothing radar-only is being
deleted, and this declaration turns on neither answer."""

[[change]]
issue = "fix(#325) a split credential followed by another suffix after a one-word family comma reads as suffixes"
# 'Smith, Ph. D. Jr.' and the #325 rows it leads ('Smith, Ph. D. MD',
# 'Smith, Ph. D. III', 'Smith, Ph. D. Jr. MD', 'Smith, Ph.D. Jr.', and
# 'Smith, PhD Jr.', which the regex reaches too -- title 'PhD' at
# every baseline, suffix 'PhD Jr.' now; this line read
# 'PhD, Jr.' and had been stale since #429 made the run one
# entry, corrected 2026-09-06):
# with one word before the comma the name is the listing form, and
# the space-split 'Ph. D.' followed by another suffix was no longer
# the LONE post-comma piece, so it fell through to the given name --
# a 1.4.0 regression (v1 read suffix 'Ph. D.', title 'Jr.'). The
# whole run is suffixes now. Literal rather than the shape: a shape
# regex absorbed 'Smith, Dr. Jr.', which is the comma-family rule's
# (the comment review).
name_regex = "(?i)^smith,\\s*ph\\.?\\s?d\\.?\\s"
fields = ["title", "given", "suffix"]

[[change]]
issue = "fix(#325) a credential run across a second comma reads as suffixes"
# 'Smith, Jr., PhD': title 'Jr.', suffix 'PhD' -> suffix 'Jr., PhD';
# segments 2+ compose with the run.
name_regex = "(?i)^smith,\\s*jr\\.?,\\s*phd$"
fields = ["title", "suffix"]

[[change]]
issue = "fix(comma-family) lone post-comma piece routes to suffix/title, not first"
# 'Smith, Dr.' / 'Andrews, M.D.': v1 put the lone strict-suffix-or-title
# post-comma piece in `first`; 2.0 routes it to `suffix`/`title` instead
# (family/`last` is unchanged either way -- "pre-comma is definitionally
# family").
#
# LATIN-ANCHORED, and that is what keeps this rule describing what it
# claims. The regex was a bare comma until #372, which reaches every
# comma in every script -- so seven CJK glued-honorific names landed
# here, on a rule whose prose has nothing to do with CJK. They diff as
# {given, suffix} (민준씨->민준/씨, 太郎さん->太郎/さん), which is a
# subset of this rule's fields, and classify() takes the first rule
# whose regex matches and whose fields are a superset. Both this rule
# and fix(cjk-comma-compound) carry a name_regex, so they share a tier
# and file order broke the tie -- in favour of the one written first,
# which was this one.
#
# Measured at the narrowing: corpus reach 236 -> 215, and all seven
# CJK names moved to fix(cjk-comma-compound), which grew 10 -> 17 and
# is the rule named for that shape. The gate was unmoved at 108
# intentional / 0 unexplained -- nothing became unexplained, so no name
# lost an explanation, it only changed which rule gave it.
#
# Those are that narrowing's figures and none of them is today's. What
# the narrowing pinned is the SCRIPT bound, not a count: this rule goes
# on claiming the Latin comma-names, and their number grows with the
# corpus. The sentence that stood here said the rule "now claims
# exactly one name, 'Andrews, M.D.'"; re-measured 2026-09-03 it
# explained eight, 'Andrews, M.D.' among them. For today's, read the
# `## fix(comma-family) lone post-comma piece routes to suffix/title,
# not first (N)` heading off `compare.py --baseline 1.4.0`.
#
# The cut is at U+0250, the threshold _is_latin_only uses in
# compare.py, matching the trailing-'Ph. D.' exclusion. Anchored at
# both ends because a name is Latin or it is not: an unanchored class
# would match the Latin part of a mixed name and take it back.
#
# One row nearby is not here and never was: '田中さん, 太郎' agrees
# with 1.4.0, so it never reaches classify() at all. It is the pinned
# guard for the case a naive #312 fix breaks (the peel site is 太郎, so
# nothing peels).
#
# '田中さん, V.' is NOT that case, though this comment said it was
# until #372 checked. It diffs {family, suffix} and lands on
# fix(cjk-comma-compound) below, before and after this change. It
# reads as parity only under Policy(lenient_comma_suffixes=False) --
# the knob tests/v2/cases.py exercises in
# ja_honorific_glued_family_comma_strict_knob -- and the corpora run
# under the default policy, so here it is a real diff.
name_regex = "^[\\u0000-\\u024f]*,[\\u0000-\\u024f]*$"
fields = ["given", "title", "suffix"]

[[change]]
issue = "fix(comma-precomma-family) pre-comma run reads as family, not given"
# 'Smith, Dr.' / 'Smith, Prof.': the post-comma piece is a title on
# BOTH sides -- it does not move, and no suffix moves either. What
# changes is the pre-comma run: 1.4 read it as `first`, 2.x reads it
# as `last`, because pre-comma is definitionally family. Diff is
# exactly {given, family}.
#
# This comment opened on 'Bob Jones, author' / 'MD, PHD' until #382's
# sweep, and the rule explains neither any more. Since #296's audit
# 'Bob Jones, author' KEEPS its pre-comma split (first 'Bob Jones' ->
# 'Bob', last '' -> 'Jones') and goes to `fix(comma-family) a comma
# followed only by titles keeps the given/family split`, and 'MD, PHD'
# reads as a one-word name plus a postnominal -- a four-field diff
# this rule's fields cannot admit -- and goes to `fix(#296) a
# credential-only comma string reads a name and its postnominal`. Both
# handovers are pinned in _CROSS_RULE_WINNERS and both winners are
# written above this rule, so nothing about this rule changed; only
# the example did. Nothing recomputes a name in a comment, which is
# how this one stayed wrong through two audits.
#
# The seven it does explain are not all the pure shape, and `fields`
# is what the rule actually claims. 'Smith, Ph. D.' and 'Ph. D., Jr.'
# are the pure move; 'Dr. Do Van Johnson, MD' has its pre-comma run
# SPLIT into given/family rather than move whole; 'Berg, abdul vd'
# hands a trailing particle to the family; 'Smith, de Mesnil Jean'
# re-orders the family run with `first` empty on both sides. Measured,
# all seven move `family` and six move `given` with it; the seventh is
# 'Smith, de Mesnil Jean', which moves `family` ALONE -- `first` is
# empty on both sides, so there is no given name for it to move. No
# title and no suffix moves in any of the seven. So the fields below
# are the boundary and the title above names the majority reading.
#
# Its own rule because these have nothing to do with suffix routing:
# they were falling to the fields-only fix(suffix-routing) catch-all
# (deleted in #451), on a rule whose every other name moves a trailing
# token into `suffix`, while these move no suffix at all (#372).
#
# Distinct from fix(comma-family) above by fields, not by order: that
# rule is the lone post-comma piece moving into suffix/title and its
# fields exclude `family`, which every name here moves. Latin-anchored
# for the same reason it is -- a bare comma reaches every script.
name_regex = "^[\\u0000-\\u024f]*,[\\u0000-\\u024f]*$"
fields = ["given", "family"]

[[change]]
issue = "fix(#296) a lone post-comma credential is a suffix"
# 'Smith, Jr.' / 'Kim, Jr.' / 'Smith, PhD': rules.md#C1 -- the listing
# form holds with one word before the comma, and the word after it is
# the credential run. v1 put the family in `first` and the credential
# in `title`; 2.0 routed the pre-comma word to the family (the
# comma-family rule below) but the title peel still claimed the
# credential -- 'jr' and 'phd' were title vocabulary, and the
# period-abbreviation inference reads 'Jr.' as a title regardless --
# so the postnominal position is read first now: a post-comma run
# that is nothing but suffix pieces is suffixes. A one-word name, a
# comma, one short word: the reach is pinned by the guards, and the
# rule sits BEHIND the two comma-family rules above so that a name
# whose only move is the pre-comma word going given -> family
# ('Smith, Dr.', 'Smith, Prof.') or a lone piece going given ->
# suffix ('Smith, Abd') keeps the rule written for it (the comment
# review found this rule absorbing all three). 'Smith, Ms.' is
# here too: the dual's postnominal reading, title at 1.4.0.
name_regex = "(?i)^[a-z]+,\\s*[a-z]{2,6}\\.?$"
fields = ["title", "given", "family", "suffix"]

[[change.precedes_narrower]]
issue = "fix(suffix-routing) a two-token name ending in the suffix word jr keeps it in `suffix`"
why = """
a REGEX ACCIDENT, not two descriptions competing. The jr rule asks for
a leading run of non-space characters, and that run swallows the
trailing comma of 'Smith,' -- which is the only way a comma name ever
reaches a rule whose prose scopes it to the comma-LESS two-token name.
Nothing that rule says is true of 'Smith, Jr.' or 'Kim, Jr.'.

LATENT as well: both move {title, given, family, suffix} against the
jr rule's {family, suffix}. The jr rule's OWN comment already argues
this from the other side and names these two names -- "what keeps them
there is `fields`, not file order... Order is the second line of
defence, not the first". This entry is that second line written down:
a widening of the jr rule's `fields` would spend the fields argument
and leave nothing but the accident holding the names, and an accident
is a worse reason to hold a name than a description is.
_CROSS_RULE_WINNERS pins both names to this rule."""

[[change]]
issue = "fix(#400/#274) bound-given join and maiden consumption in one name"
# 'abd Allah Smith nee Jones': two behaviours meeting in one name, so
# neither single-cause rule claims it -- fix(#400) moves {given,
# middle} and fix(#274) moves {maiden, middle, family}, and this moves
# all four at once. The join takes 'abd Allah' as the given name AND
# the marker takes 'Jones' as the maiden name, which between them
# leave 'Smith' as the family where 1.4 read family 'Jones'.
#
# Requires TWO words between 'abd' and the marker, which is what makes
# it the combination shape: with one word the join declines (P5's
# reserve, once the maiden words stop counting -- see fix(#411)) and
# the diff is fix(#274)'s alone. 'abd Berg nee Jones' is that name and
# this rule must not claim it.
name_regex = "(?i)^abd(\\s+\\S+){2}\\s+n[eé]e\\s"
fields = ["given", "middle", "family", "maiden"]

[[change.precedes_narrower]]
issue = "fix(#400) abd joins the word after it as one given name"
why = """
the canonical compound-versus-component shape. fix(#400) describes the
join alone -- 'abd' plus the word after it, with a family name left
behind -- and says nothing about a maiden marker, which is where the
other two roles in this name come from.

LATENT: the measured diff is {given, middle, family, maiden}, and
`family` and `maiden` are outside fix(#400)'s {given, middle} at any
position, so the join rule cannot take this name wherever it sits.
The declaration is therefore about a future widening rather than
about today: teach fix(#400) anything about markers and it would
quietly absorb a four-role change and label it a bound-given join.
No _CROSS_RULE_WINNERS row for this name; the reason rests on the two
rules' own prose, which is unambiguous here -- one names two
behaviours meeting, the other one behaviour."""

[[change]]
issue = "fix(#411/S2) a declining bound-given join leaves the suffix reading after a family comma"
# 'Berg, abd nee Jones': `abd` is the one shipped word in BOTH the
# bound-given and the suffix vocabulary. With #411's join declining --
# it will not absorb a marker -- what is left in the given slot after a
# family comma is S2's suffix reading, which rules.md#P5 already states
# wins there. So the name has no given name at all, exactly as
# 'Berg, abd' alone has always parsed.
#
# Four fields move, which is why neither fix(#411) nor fix(#274)
# claims it: the extra `suffix` breaks their subset test. That is the
# gate behaving correctly -- the name arrived UNEXPLAINED and is read
# once here.
#
# `abd` and not an alternation: no other shipped bound-given word is
# also suffix vocabulary, so no other word reaches this reading.
name_regex = "(?i),\\s*abd\\s+n[eé]e\\b"
fields = ["given", "middle", "suffix", "maiden"]

[[change.precedes_narrower]]
issue = "fix(#400) abd joins the word after it as one given name"
why = """
this rule describes the join DECLINING, which is the negation of what
fix(#400) describes, and then describes what a declining join leaves
in the given slot after a family comma: S2's suffix reading, with
'abd' ending up in `suffix` and the name having no given name at all.
Two rules cannot both be right about the same word, and the one
asserting that it joins is not the one to explain a name where it did
not.

LATENT: {given, middle, suffix, maiden} is two roles wider than
fix(#400)'s {given, middle}, so the subset test excludes it at any
position -- this rule's comment already reads the same arithmetic as
why neither fix(#411) nor fix(#274) claims the name. No
_CROSS_RULE_WINNERS row; the prose carries it."""

[[change]]
issue = "fix(#411) the bound-given reserve stops counting words the maiden name takes"
# 'van der Berg, abdul nee Jones': P5 reserves a name word so the join
# always leaves a family name behind, but the reserve was counted while
# the marker and the maiden name were still pieces -- group's marker
# pass runs later in the same stage. Counting words that were about to
# leave answered the question about a name that would not exist.
#
# The fields here are the SIDE EFFECT rather than the defect. #411's
# own shape is an emptied family ('abdul Berg nee Jones' read given
# 'abdul Berg', family ''), and no BASELINE shows it -- every released
# version already reads the corpus names carrying that shape the way
# the fix does, so none of them can produce a #411 diff to classify.
# ('abd Berg nee Jones' IS in corpus_rules.jsonl, and goes unexplained
# at all three baselines if the fix is reverted, which is the guard
# working.)
#
# What this corpus
# name shows is the other half: with the reserve counted correctly the
# join declines, so the marker is never merged into 'abdul nee' and
# M2's bound sees a lone marker piece for the first time. That closes
# one of the two join-swallows #412 tracks; P3's connective join is
# the one that survives.
#
# `abdul` is a LITERAL, not an alternation over BOUND_GIVEN_NAMES, and
# the words are NOT interchangeable here. 'abd' is the one shipped word
# in both the bound-given and the suffix vocabulary, so after a family
# comma a declining join leaves the S2 suffix reading instead: 'van der
# Berg, abd nee Jones' moves {given, middle, suffix, maiden}, and the
# extra field breaks the subset test, so it would arrive UNEXPLAINED --
# correct, but not what an alternation over the vocabulary would lead
# an author to expect. 'abdel', 'abdal' and the Arabic spelling do
# behave like 'abdul'; only this name is in the corpora.
name_regex = "(?i),\\s*abdul\\s+n[eé]e\\b"
fields = ["given", "middle", "maiden"]

[[change]]
issue = "fix(#400) abd joins the word after it as one given name"
# 'abd Allah Smith' and 'Salam, abd Allah'. `abd` joined
# BOUND_GIVEN_NAMES in 2.2 so the spellings that write the article as
# its own word join like `abdul`, `abdel` and `abdal` already did.
# v1 had no bound given-name join for it either, so the diff is the
# same shape at every baseline; the 2.0 and 2.1 ledgers carry the same
# rule.
#
# `abd` is also the postnominal ABD and stays in SUFFIX_ACRONYMS --
# position tells the two readings apart -- so the anchors are what
# keeps a trailing 'Jane Smith ABD' out of this rule.
#
# A third corpus name is claimed and does NOT move: a bare 'abd Allah',
# which has no third word for the join to leave as a family name, so
# P5's reserve declines and it reads given 'abd', family 'Allah' at
# every baseline. Same behaviour family as the two that move, so the
# claim is defensible -- recorded so it is not mistaken for coverage.
name_regex = "(?i)(?:^|,\\s*)abd\\s+\\S+"
fields = ["given", "middle"]

[[change]]
issue = "fix(#272/#308) nakaguro division and a glued hangul honorific in one name"
# '马丁·路德·金씨': two behaviours meeting in one name, which is why the
# single-cause CJK rules do not claim it. The nakaguro divides the
# name into given/middle/family and the glued 씨 peels off into
# `suffix`, so all four roles move at once. Literals rather than an
# alternation over the honorific vocabulary, because the rule is about
# the COMBINATION rather than about the vocabulary; it claims exactly
# the one corpus name.
name_regex = "^\\S*\u00b7\\S*\uc528$"
fields = ["given", "middle", "family", "suffix"]

[[change.precedes_narrower]]
issue = "fix(cjk-glued-honorific-peel) glued honorific peels into suffix"
why = """
`middle` is the discriminator and the nakaguro is where it comes from.
This name divides into given/middle/family AND peels its glued \uc528, and
this rule is the one describing both; the peel rule describes the peel
and scopes itself to a name with no comma anywhere and no space before
the honorific, saying nothing about a division. Claiming the name
there would be a rule claiming a diff it does not describe (#372).

LATENT: {given, middle, family, suffix} is outside the peel rule's
{family, given, suffix} at any position, so what is declared is the
hazard of that rule acquiring `middle` -- which is exactly the role
the CJK order flip hands it, so the widening is a plausible one.
Contract tier (corpus_rules.jsonl), and not in _CROSS_RULE_WINNERS:
the roster never had this name added."""

[[change]]
issue = "fix(emoji-boundary) an emoji inside a token divides it"
# 'John😀Smith': 1.4 dropped the emoji and read one token
# (first='JohnSmith'); 2.x treats it as a division, so the name reads
# given 'John', family 'Smith'. rules.md#T1 documents both this and the
# keep-emoji policy reading.
#
# The emoji must stand BETWEEN two non-space characters, which is the
# behavior: it divides a token. A bare character class was the first
# draft and is rejected -- measured, it reaches past 'John😀Smith' to
# corpus names carrying a spaced or trailing emoji, which are
# byte-identical on both sides today and would be pre-excused by a rule
# that claims them. How many such names the corpus holds is not the
# argument and grows with the corpus; that the draft admits the class
# at all is. Pre-claiming shapes it has never seen is the #372 failure
# mode the fix(#379) comment names.
#
# The class is the ASTRAL HALF of _tokenize.py's _EMOJI_RANGES, hand
# copied and pinned by test_the_emoji_boundary_rule_copies_the_dividing_ranges.
# A single \U0001F300-\U0001FAFF span was the first draft and is wrong
# in the dangerous direction: it covers U+1F650-U+1F67F and
# U+1F700-U+1FAFF, where the parser does NOT divide, so the rule's own
# prose is false for about a thousand codepoints it would claim.
# 'John\U0001FA70Smith' reads given 'John\U0001FA70Smith' with no family --
# a future {given, family} diff on such a name, with some other cause,
# would classify here as intended. That is the same #372 shape this
# comment invokes against the bare class.
#
# The BMP half (U+2600-U+26FF, U+2700-U+27BF) is deliberately left out
# rather than copied: no corpus name reaches it once the token anchor
# is on, and a rule should be no wider than the diffs it must explain.
# A name that needs it will arrive unclassified and be read once. That
# omission also leaves the pattern free of \uXXXX-\uXXXX span text.
# That is a CONSEQUENCE, not a safeguard, and the #453 review was
# right to say so: _SPAN reads the 4-hex spelling only, so the class
# below rides past _unrecognized_class_content whatever it contains.
# What actually bounds it is the guard named above, which probes every
# codepoint in Unicode against _EMOJI_RANGES, plus _CORPUS_CLAIMS'
# reach and digest.
name_regex = "\\S[\\U0001F300-\\U0001F64F\\U0001F680-\\U0001F6FF]\\S"
fields = ["given", "family"]

[[change]]
issue = "fix(nickname-typographic-pairs) two typographic quote spans read as one nickname set"
# 'Hans „Erster“ und “Zweiter” Müller': 2.0 extracts typographically
# quoted nicknames, which v1 did not, and this name carries TWO spans
# in different pairs joined by a conjunction. Both come out as
# `nickname` 'Erster Zweiter', and what is left rejoins as a name --
# so `given`, `middle` and `family` all move as well.
#
# Deliberately narrower than "any typographic quote": the corpora hold
# four such names and the single-span ones ('Hans „Hansi“ Müller',
# 'John “Jack” Kennedy') are already accounted for elsewhere. The
# pattern asks for two spans of DIFFERENT pairs with a word between
# them, which is the shape that moves all four roles at once. A
# single-span regression must not be absorbed here. The fourth is
# 'Jane „JD Smith', an UNCLOSED span, which is neither category -- it
# does not diff at any baseline and no rule here claims it.
name_regex = "\u201e[^\u201c]+\u201c\\s+\\S+\\s+\u201c[^\u201d]+\u201d"
fields = ["given", "middle", "family", "nickname"]

[[change.precedes_narrower]]
issue = "feat(#273) typographic nickname delimiters recognized by default"
why = """
feat(#273) is single-span RECOGNITION: a smart-quoted nickname stops
leaking into `middle` as literal text, which is the {middle, nickname}
diff its own names carry ('Hans \u201eHansi\u201c M\u00fcller', 'John \u201cJack\u201d
Kennedy'). This name has two spans of different pairs, and the reason
it needs a rule of its own is the REMAINDER REJOINING as a name once
both come out -- that is what moves `given` and `family`, and #273's
prose has nothing to say about it.

LATENT: {given, middle, family, nickname} is outside {middle,
nickname} at any position. The hazard declared is #273 being widened
toward the multi-span shape, which this rule's own comment already
guards from the other side ("A single-span regression must not be
absorbed here") -- this declaration is that guard read backwards. No
_CROSS_RULE_WINNERS row."""

[[change]]
issue = "fix(#379) a tussenvoegsel after a family comma attaches to the family"
# 'Vega, Juan de la': the Dutch alphabetized listing moves the
# tussenvoegsel behind the given name -- "Beethoven, Ludwig van" is how
# "Ludwig van Beethoven" is filed -- and 1.4 read the trailing particle
# run as a middle name. 2.2 attaches it to the family already named by
# the comma and renders it before the base, so `middle` empties and
# `family` grows. rules.md#P6 states it; the derived views move with it
# (family_particles 'de la', family_base 'Vega').
#
# Fields are {middle, family}: the given name does not move. `suffix`
# is deliberately NOT here, though the #380 half of the change does
# move a token out of it ('Berg, Jan vd' was suffix 'vd' at every
# baseline and is now family 'vd Berg'). Adding `suffix` to claim it
# costs three shapes this rule has no business explaining --
# {family,suffix} taken from fix(#380) below, and {middle,suffix}
# and {middle,family,suffix} taken from UNEXPLAINED, the last two
# being diffs in which `family` does not move at all. A rule that
# pre-claims shapes it has never seen is the #372 failure mode.
# The first name read fix(suffix-routing) until #451 deleted that
# catch-all, and it was already the wrong name by then: measured, a
# {family, suffix} diff on 'Berg, Jan vd' goes to fix(#380), which
# sits BELOW this rule, so claiming `suffix` here would take it from
# there. On a name this regex reaches that fix(#380)'s does not --
# 'Vega, Juan de la' -- the same diff went to the catch-all and
# arrives UNEXPLAINED now. Either way the decision below stands; only
# the rule the shape would be taken FROM has changed.
#
# 'Berg, Jan vd' entered corpus_issues.jsonl and corpus_rules.jsonl
# after this was written, and it did NOT arrive unexplained -- the
# fields-only catch-all took it, and _CROSS_RULE_WINNERS recorded the
# absorption rather than closing it. It has fix(#380)'s own rule now
# (#451, below). The declining was right; what was missing was the
# rule beside it.
#
# Latin-anchored over the WHOLE name, not just the trailing word: with
# a leading .* this absorbed non-Latin comma names whose diff has
# another cause -- a Cyrillic 'Smith, de la' moves {family} because the
# particle's RENDERING ORDER inside the family changed, which no rule
# in this ledger names, and it classified here. (No such name is in
# any corpus, so this is what WOULD happen. It would now arrive
# UNEXPLAINED and block the gate until someone read it, which is the
# right outcome: this ledger has no fields-only rule to absorb it any
# more. The claim that it "falls to the fields-only catch-all" was
# true until #451 deleted that rule, and this file now says what its
# 2.0.0 and 2.1.0 copies have said since 8237b54.) The class is the
# neighbours' and compare.py's own: U+0000-U+024F, which stops at
# Latin Extended-B, so a diacritic-bearing 'Nguyen, Van de la' in NFD
# or Latin Extended Additional is outside it.
#
# What the rule still over-claims is vocabulary, not script: any Latin
# comma name ending in an alternation member is claimed whatever the
# naming tradition, so a future {middle,family} regression on
# 'Nguyen, Van' -- one of the two corpus names it reaches, and the one
# that does NOT move -- would classify as intended.
name_regex = "(?i)^[\\u0000-\\u024f]*,[\\u0000-\\u024f]*\\s(de|del|den|der|di|do|dos|du|la|le|los|mc|van|vd|von|zu)(\\s+(de|del|den|der|di|do|dos|du|la|le|los|mc|van|vd|von|zu))*\\s*$"
fields = ["middle", "family"]

[[change]]
issue = "fix(#380) a trailing vd after a family comma is the tussenvoegsel, not a post-nominal"
# 'Berg, Jan vd': the tree reads it given 'Jan', family 'vd Berg',
# suffix '' -- the trailing 'vd' attaches to the family the comma
# already named, the same P6 precedence fix(#379) states above for the
# leading-particle shapes. Whether 1.4 itself read the trailing word
# as `suffix` is outside what this ledger's worker can check directly
# (tools/differential/README.md's warning against reading a v1 release
# from a cached environment); the diff this rule explains at this
# baseline moves exactly {family, suffix}, which is consistent with
# that reading and is what the fields below claim.
#
# decisions.md#vocabulary-collisions C-ii records the word itself:
# "vd is the live case: never-given particle AND credential acronym
# (the British Volunteer Decoration), neither of them a name.
# Decision: the Dutch van der reading, as the more common." #380 is
# named there as the trailing-orphan half that decision unblocks.
#
# The {family, suffix} companion to fix(#379) above, which claims
# {middle, family} and deliberately declined `suffix` -- that
# comment's own accounting of what claiming it would have cost stands
# as written; this rule is the piece it left out, not a widening of
# it.
#
# Ported verbatim from expected_since_2.0.0.toml, issue text and regex
# included, so the _MUST_NOT_MATCH "fix(#380)" key that already guards
# the 2.x copies guards this one too. Latin-anchored over the whole
# name for fix(#379)'s reason: with a leading .* it would absorb
# non-Latin comma names whose diff has another cause.
#
# The regex also reaches 'Berg, abdul vd', which fix(comma-precomma-family)
# above claims on {family, given} -- a different diff shape, so this
# rule's {family, suffix} fields never match it and it is not claimed
# here. That reach is real, so 'Berg, abdul vd' is NOT a
# _MUST_NOT_MATCH probe for this rule: that roster tests the regex,
# not classify().
name_regex = "(?i)^[\\u0000-\\u024f]*,[\\u0000-\\u024f]*\\svd\\s*$"
fields = ["family", "suffix"]

[[change]]
issue = "fix(#342) rai and cha left the credential acronyms, so a trailing Rai or CHA is a name word"
# 'rai' and 'cha' left SUFFIX_ACRONYMS on 2026-09-07
# (nameparser/config/suffixes.py). Both arrived in the 2019-12-11
# bulk wikipedia post-nominal import (af5bdab), neither was reviewed
# against a surname collision, and decisions.md#suffix-acronym-collisions
# states the criterion that removed them rather than marking them
# ambiguous: marking is for a short credential in wide use that is
# also a name, removal for a longer one that is tenuous and collides.
#
# Five corpus names, all from the radar-tier corpus_issues.jsonl, in
# THREE diff shapes with one cause -- the word stopped being
# credential vocabulary, so the positional read takes it:
#   'Aishwarya Rai'      {family, suffix}          suffix -> family
#                                                  (2.x only -- parity at 1.4.0)
#   'Lala Lajpat Rai'    {middle, family, suffix}  the family shifts right
#   'John Smith RAI'     {middle, family, suffix}  same
#   'John Smith, RAI'    {given, family, suffix}   an ordinary family comma (C1)
#   'Ahmad Jayadi, CHA'  {given, family, suffix}   same
# The comma pair is why `fields` declares four roles rather than the
# two the pre-2.3 fix(#342) rule declared: with no credential after
# the comma, C1 reads the pre-comma run as the family and the
# post-comma word as the GIVEN name, so `given` moves where it did
# not before. The declaration is the exact union of the five, which
# is what the OVER-DECLARED check recomputes at the end of every run.
#
# 'Aishwarya Rai' is in this rule at 2.0.0/2.1.0/2.2.0 and NOT
# explained by it at 1.4.0, where the name now reaches PARITY: 1.4.0
# read family 'Rai' too, which is what the deleted
# `fix(#342) NOT WANTED` rule existed to classify. The regex is the
# same in all four files anyway -- reach is not explanation, and a
# per-ledger regex would say a name left the corpus.
#
# An anchored alternation of the five NAMES rather than a shape. The
# shape is "a trailing word that used to be an acronym entry", which
# would be a copy of SUFFIX_ACRONYMS and would stand ready to explain
# every future trailing-acronym regression. The members are a list of
# names and copy no wordlist, which is what _NOT_A_VOCABULARY_COPY in
# tests/v2/test_ledger_guards.py records; _CORPUS_CLAIMS pins the
# reach at 5 with its digest, and _MUST_NOT_MATCH carries the
# boundaries the paragraph above argues.
name_regex = "^(?:Ahmad Jayadi, CHA|Aishwarya Rai|John Smith RAI|John Smith, RAI|Lala Lajpat Rai)$"
fields = ["family", "given", "middle", "suffix"]

[[change]]
issue = "fix(#397) accepted: a two-word Catalan link has no name word to its right and stays the generation"
# 'Carod i': the tree reads given 'Carod', family '', suffix 'i'. 'i'
# is a bare entry in SUFFIX_WORDS (nameparser/config/suffixes.py --
# the Roman-numeral generation markers i/ii/iii/iv/v, not
# SUFFIX_ACRONYMS), so a two-word name ending in it reads as a name
# plus a trailing generation rather than a two-word family link.
#
# DECIDED, not unresolved, and that is what changed on 2026-09-20:
# #397 landed, 'i' IS connective vocabulary now, and the Catalan link
# joins wherever a name word stands on each side of it -- 'Josep Carod
# i Rovira' and 'Carod i Rovira, Josep' both read family 'Carod i
# Rovira' and have a rule of their own below. This name is the
# boundary that rule states: a connective with nothing to its right is
# connecting nothing, and a word of that vocabulary ending a name is
# the generation it also spells. Two pieces do not reach the join loop
# at all, which needs three, so the reading is refused one gate
# earlier still. rules.md#P3 carries both sentences and this name is
# one of its example lines. decisions.md#P3 records the count decision
# and the both-sides scope behind them.
#
# Whether 1.4 itself read the trailing word as `family` is outside
# what this ledger's worker can check directly
# (tools/differential/README.md's warning against reading a v1 release
# from a cached environment); the diff this rule explains at this
# baseline moves exactly {family, suffix}, which is consistent with
# that reading and is what the fields below claim.
#
# Classified because the cause is known and RECORDED AS WANTED, which
# is a stronger standing than the fix(#342) rule above: that one is
# NOT WANTED and unresolved, this one is the stated boundary of a
# landed rule. A [[never]] exclusion is still wrong for it -- an
# excluded name reports UNEXPLAINED and exits non-zero.
#
# Literal-anchored to the one corpus name that reaches this shape, for
# fix(#342) above's reason: a rule keyed on "two-word name, trailing
# single letter" would pre-excuse every generation-marker regression,
# not just this one. The three longer names in the same family are
# each accounted for elsewhere now -- 'Carod i Rovira' and 'Josep
# Carod i Rovira' by the fix(#397) join rule below, and 'Lluis Carod
# i' by the same both-sides boundary as this name, one word longer and
# therefore diffing nothing at all.
name_regex = "(?i)^carod\\s+i$"
fields = ["family", "suffix"]

[[change]]
issue = "fix(#397) the Catalan/Polish link joins two surnames"
# 'i' is connective vocabulary since #397, and a connective counts as
# a name word toward rules.md#P3's three-word carve-out whatever else
# the vocabulary says it is -- which matters here because 'i' is also
# the roman numeral. So a four-word name reaches the threshold and the
# link joins. 1.4.0 read 'Josep Carod i Rovira' as middle 'Carod i'
# with family 'Rovira', and 'Carod i Rovira, Josep' -- where the link
# stands after a family comma -- as family 'Carod Rovira' with the
# link taken as a GENERATION in `suffix`, which is why the two move
# different field sets and are grouped here rather than split. The
# three longer spellings move with the first: 'Josep Carod i Rovira
# III' and 'Josep Lluis Carod i Rovira' the same {family, middle}, and
# 'Josep Carod i de Rovira' the same pair with the link joining PAST a
# particle (middle 'Carod i' -> 'Carod i de', family 'de Rovira' ->
# 'Rovira'). Five names, `fields` the union of their two shapes.
#
# All five entered this corpus with #397's own rules.md#P3 example
# lines and case rows; before that they were radar-tier names the
# contract did not answer for, which is why a rule appears at this
# baseline only now. decisions.md#P3.
#
# Literal-anchored to the five. The shape is "a single letter between
# two name words", which reaches every corpus name carrying a bare
# initial and would pre-excuse the opposite reading -- #397's whole
# accepted cost is that some such letters must NOT join.
# _MUST_NOT_MATCH in tests/v2/test_ledger_guards.py carries the wall:
# 'Josep i Rovira' (three words, under the carve-out), 'Carod i' (the
# rule above), 'John Quincy Smith i' (the link with nothing to its
# right) and 'Josep Lluis Carod i III' (a generation run, the
# fix(#436/#437) rule at the head of this file).
name_regex = "^(?:Carod i Rovira, Josep|Josep Carod i Rovira|Josep Carod i Rovira III|Josep Carod i de Rovira|Josep Lluis Carod i Rovira)$"
fields = ["family", "middle", "suffix"]
orders = ["DEFAULT"]

[[change]]
issue = "fix(suffix-routing) a two-word trailing generation run peels whole, and the name word before it is the family"
# 'Josep Lluis Carod i V': v1 read middle 'Lluis Carod', last 'i',
# suffix 'V' -- it peeled the LAST word of the trailing run and left
# the first to the family -- where 2.x peels the run whole and reads
# middle 'Lluis', family 'Carod', suffix 'i V'. The same shape
# 'John Smith Mc V' carries on the fix(#424) rule further down, whose
# sentence is about a PARTICLE opening the run; here both words are
# generation vocabulary, so it needs a rule rather than that one's
# widening.
#
# NOT this bundle's doing, and measured rather than argued: against
# the parent 46651750 the parse is byte-identical before and after
# #397 and #461 (given 'Josep', middle 'Lluis', family 'Carod', suffix
# 'i V'), the link having a generation marker and not a name word to
# its right. The name is new to the CORPUS -- it arrived with #397's
# case rows as exactly that boundary -- so a divergence v2 has carried
# since 2.0 is classified here for the first time.
#
# Literal, one name: the shape is "a trailing run of two suffix words"
# and would stand ready to explain every future peel regression.
name_regex = "^Josep Lluis Carod i V$"
fields = ["family", "middle", "suffix"]
orders = ["DEFAULT"]

[[change]]
issue = "fix(suffix-delimiter-rendering) no-space delimiter core token kept whole"
# Only fires when a custom suffix delimiter is configured (Policy /
# Constants.suffix_delimiters); the corpus runs with default policy, so
# this rule is expected to match nothing here. Kept for documentation
# parity with tests/v2/cases.py's 'suffix_delimiter_no_space_core' row
# (anti-#100; mechanisms.md#SPANS).
dormant = "the no-space delimiter rendering fires only under a non-default Policy, and the corpora run under the default one, so no corpus name can reach this rule. Kept because the behavior family is real and documented in tests/v2/cases.py: the rule is ready the moment a matching string is added"
name_regex = "/"
fields = ["suffix"]

[[change]]
issue = "ambiguous-surname-acronym data change: parenthesized (MA)/(DO) now stays nickname"
# suffix_acronyms_ambiguous gained 'ma'/'do' so bare 'Jack Ma' keeps its
# surname (v1 parity restored); side effect: parenthesized/quoted "MA"
# or "DO" no longer escape to suffix (v1 did, since v1 treated them as
# unambiguous there) -- they now fall through to nickname parsing.
#
# 2026-09-18 (#289): the first clause holds for the spelling it names
# and not for its all-caps twin. 'Jack Ma' still keeps its surname by
# the words-to-spare guard; 'Jack MA' is now read as a credential by
# the written case contrast, with nothing to spare -- the guard never
# reaches it. The parenthesized side effect above is untouched: a
# bracketed clause is decided before the class is asked at all, so
# 'Andrew Perkins (MA)' keeps its nickname whatever the case.
# Not expected to fire against this corpus (no such strings survived
# into the v1 banks); kept for documentation completeness.
# The members are the entries themselves, undotted. They carried
# optional periods until corpus_rules.jsonl (#414) brought in 'John
# Smith M.A.': the member `m\.?a\.?` reaches the fragment 'M.A.' in
# that name, and a fragment a member matches has to BE a vocabulary
# entry -- 'M.A.' is not one. The bracket class around the alternation
# meant the RULE never claimed that name, but the member-level guard
# is the one that holds here, because a rule can widen at depth 0
# later and leave a broad member governing it. A parenthesized dotted
# '(M.A.)' should now arrive UNEXPLAINED and be read once, which is
# the same discipline the rest of this file states.
dormant = "no corpus contains a parenthesized (MA) or (DO), so this data change has no diff to explain here. Kept so the rule is ready the moment such a name is harvested"
name_regex = "(?i)[(\"'](ma|do)[)\"']"
fields = ["suffix", "nickname"]

[[change]]
issue = "feat(#269) Arabic بن prefix chains onto family (non-Latin new-recognition)"
# '‏محمد بن سلمان‏': #269 adds the native-script Arabic
# patronymic particle بن ("bin"/"son of") to PARTICLES/
# NON_GIVEN_NAME_PARTICLES. v1 had no such entry, so it left بن a plain
# middle-name token ('سلمان' alone as last); 2.0 now chains it onto the
# family the same way 'von'/'bin' (Latin) do, giving family 'بن سلمان'.
# This is new-recognition on non-Latin input -- the exact behavior
# #269 exists to add -- not a Latin-corpus regression, so it is
# classified rather than reverted.
# Word-bounded: a bare "بن" would also match the substring inside e.g.
# لبنان ("Lebanon") and silently absorb unrelated middle/last diffs.
name_regex = "\\bبن\\b"
fields = ["middle", "family"]

[[change]]
issue = "feat(#273) typographic nickname delimiters recognized by default"
# 'John “Jack” Kennedy', 'Hans „Hansi“ Müller', 'Jean «Petit» Dupont':
# v1 knew only straight quotes and parentheses, so a smart-quoted or
# guillemet-wrapped nickname leaked into `middle` as literal text.
# Matches only when such a delimiter is actually present. A nickname
# diff on the ASCII pairs would be a regression; the ASCII-pairs
# [[never]] entry at the end of this file is what refuses it, not this
# rule's silence (#328), in any position the pair can take. See that
# entry for why the delimiter's position turned out not to be the
# thing worth narrowing on.
name_regex = "[“”„«»「」『』（）]"
fields = ["middle", "nickname"]

[[change]]
issue = "fix(cjk-delimited-nickname) delimiter recognition compounds with the CJK order flip"
# '山田「タロ」太郎', '山田 太郎 (マイケル・ジャクソン)': one name, two
# intended changes at once -- the corner-bracket/nakaguro handling
# (2.0's typographic delimiters; 2.1's dot separator rendering the
# nickname join with a space) changes `nickname`, while the same
# name's wholly-CJK remainder takes the 2.1 family-first flip in
# first/last. Neither single-change rule may claim the union (the
# delimiter rule's fields exclude first/last, the CJK rule's exclude
# nickname -- each on purpose, so a lone regression in the other's
# fields stays loud). Both lookaheads are required: the delimiters
# alone would match 'John 「Jack」 Kennedy' -- the brackets sit in CJK
# Symbols and Punctuation, OUTSIDE every classified span, so a Latin
# name can carry them -- and would then absorb a bare first/last
# regression on it. Requiring a classified codepoint too confines the
# rule to names the order flip can actually reach. The second
# lookahead's class is the same hand copy of _SCRIPT_RANGES the rule
# above carries, pinned by the same sync test. One absorption is
# inherent and accepted: a nickname-ONLY diff on a nakaguro name
# ('マイケル・ジャクソン') classifies here, because subset-matching
# cannot REQUIRE a field to have changed. Positional note: this rule
# overlaps the CJK rule above and the delimiter rule below; within
# the name_regex tier file order decides which label a diff reports
# under, so it sits after the tighter single-change rules on purpose.
# The slug is free-form. It used to avoid the literal #271/#272
# strings, because a pin selected the canonical CJK rule by those
# substrings and asserted uniqueness; that pin is gone (#333) and the
# span sweep finds rules by their character class instead.
name_regex = "(?s)(?=.*[「」『』・･])(?=.*[\\u3005-\\u3006\\u3040-\\u309F\\u30A0-\\u30FF\\u3400-\\u4DBF\\u4E00-\\u9FFF\\uF900-\\uFAFF\\uAC00-\\uD7A3\\uFF65-\\uFF65])"
fields = ["given", "family", "nickname"]

[[change]]
issue = "fix(cjk-fullwidth-paren-nickname) fullwidth-parenthesis recognition compounds with the CJK order flip"
# '山田 花子（旧姓 佐藤）', which reached the corpus from the #329 case
# table via build_cjk_corpus.py. It is NOT a #329 diff: that change is
# gated on a non-empty Policy.maiden_delimiters and the harness runs
# the default policy, where （） is a #273 NICKNAME delimiter. So the
# same two intended changes as the rule above, with a different
# delimiter pair -- 1.4 knew no fullwidth pair and read the brackets as
# name text (first 山田 / middle '花子（旧姓' / last '佐藤）'), while 2.0
# extracts the clause to `nickname` and the wholly-Han remainder left
# behind takes the family-first flip.
#
# Its own rule rather than a widening of fix(cjk-delimited-nickname),
# on both halves. That rule's `fields` deliberately exclude `middle`,
# and this diff has one: the fullwidth clause is written flush against
# the token before it, so 1.4's tokenizer left '花子（旧姓' as a single
# middle-name word -- a spaced corner-bracket name never does that.
# Adding `middle` there would pre-excuse a bare middle regression on
# '山田「タロ」太郎'. Its delimiter set is separately pinned in
# tests/v2/test_ledger_guards.py as "its own decision surface", so
# widening it is a deliberate act with a test to update, and there is
# nothing to gain by making it here.
#
# Both lookaheads are required for the reason given on the rule above:
# （） lives in Halfwidth and Fullwidth Forms, outside every classified
# span, so a Latin name can carry it ('John （Jack） Kennedy') and the
# delimiter alone would let this rule absorb a first/last regression on
# one. The span class is the same hand copy of _SCRIPT_RANGES the rules
# above carry, pinned by the same auto-discovering test. The slug is
# free-form; the #271/#272 substrings it avoids were a constraint of a
# selector retired in #333.
#
# DORMANT since 2.2, and the reason is a migration rather than a
# revert. Its one name moved to fix(cjk-maiden-marker) above: under
# rules.md#M3 the fullwidth clause is read on the strength of the 旧姓
# inside it, so the clause lands in `maiden` and `nickname` no longer
# diffs at all -- 1.4 read the brackets as name text and had no
# nickname here either. The diff is now {given, middle, family,
# maiden}, which is a subset of that rule's fields and not of this
# one's, so classify() hands the name over. That is the right home:
# what the name demonstrates today IS a marker consumption, and the
# fullwidth pair is only what makes the marker a separate token.
#
# Kept rather than deleted because the reasoning below is about the
# `fields` boundary between this rule and fix(cjk-delimited-nickname),
# which nothing else records, and because the declaration is load
# bearing in reverse: if a fullwidth-bracketed CJK NICKNAME diff ever
# appears again, this rule wakes and the harness says the dormant
# reason has gone false.
dormant = "its one name, '山田 花子（旧姓 佐藤）', diffs in `maiden` rather than `nickname` since rules.md#M3 and is claimed by fix(cjk-maiden-marker); no other corpus name pairs a fullwidth bracket with a CJK script"
name_regex = "(?s)(?=.*[（）])(?=.*[\\u3005-\\u3006\\u3040-\\u309F\\u30A0-\\u30FF\\u3400-\\u4DBF\\u4E00-\\u9FFF\\uF900-\\uFAFF\\uAC00-\\uD7A3\\uFF65-\\uFF65])"
fields = ["given", "middle", "family", "nickname"]

[[change]]
issue = "fix(cjk-comma-honorific-peel) glued honorific peels off a post-comma given name"
# '김, 민준씨' / '田中, 太郎さん': the comma already fixes family/given
# order on both sides, so NO order flip happens -- `family` is
# byte-identical. The only change is #312's peel: the honorific glued
# to the post-comma given name comes off into `suffix` (민준씨 ->
# 민준/씨, 太郎さん -> 太郎/さん). Diff is exactly {given, suffix} on
# all seven names this rule claims.
#
# Its own rule because neither neighbour describes it, and #372 is
# about rules explaining what they describe. fix(comma-family) above
# is the Latin lone-post-comma-piece routing and is now anchored to
# Latin, so it cannot reach these at all. fix(cjk-comma-compound)
# below is for the UNION -- comma routing AND the family-first flip
# together -- which is why its fields include `family`; these names
# move no family, so claiming them there would be the same field-shape
# coincidence #372 was filed over, relocated rather than fixed.
#
# `fields` separates the two for the UNION rows ONLY, and file order
# decides the rest -- do not read the first half as the whole. The
# union rows ('Dr 김민준씨, V.', '田中さん, PhD') diff with `family` in
# the mix, which is outside this rule's [given, suffix], so they
# cannot match here however early it sits and still fall through to
# the compound rule. But the seven names this rule EXPLAINS diff
# exactly {given, suffix}, which both rules' `fields` admit, and the
# two regexes are byte-identical -- so file order alone holds them
# here, and swapping the two rules reattributes all seven (measured
# 2026-09-02; docs/design/decisions.md#differential-ledger's Declined
# entry on #382 option 1 carries the measurement and why narrowing
# the regex cannot change it). This rule is narrow-first, the
# declaration-free default, so the pair is no `order_contests`
# contest and owes no [[change.precedes_narrower]] block -- which is
# not the same as order deciding nothing. What pins the seven is
# _CROSS_RULE_WINNERS, by name.
#
# The regex is the same comma-plus-classified-codepoint pair the
# compound rule carries, hand-copied from _SCRIPT_RANGES and pinned by
# the same sync test -- a comma alone matches every Latin 'Smith, Jr.'
# in the corpus.
name_regex = "(?s)(?=.*,)(?=.*[\\u3005-\\u3006\\u3040-\\u309F\\u30A0-\\u30FF\\u3400-\\u4DBF\\u4E00-\\u9FFF\\uF900-\\uFAFF\\uAC00-\\uD7A3\\uFF65-\\uFF65])"
fields = ["given", "suffix"]

[[change]]
issue = "fix(cjk-comma-compound) comma routing compounds with the CJK order flip"
# '威廉·莎士比亚, PhD': one name, two intended changes at once -- the
# post-comma lone-piece routing (fix(comma-family): v1 read PhD as
# title; 2.x routes it to suffix) and the CJK source-order/family-
# first movement in first/middle/last on the pre-comma name. Neither
# single-change rule may claim the union: comma-family's fields
# exclude last, the CJK rule's exclude title/suffix -- each on
# purpose, so a lone regression in the other's fields stays loud.
# Both lookaheads are required, by the same reasoning as the
# delimiter compound above: a comma alone matches every Latin
# 'Smith, Jr.' in the corpus, and the classified-codepoint lookahead
# confines the rule to names the CJK behaviors can actually reach.
# The class is the same hand copy of _SCRIPT_RANGES the rules above
# carry, pinned by the same sync test. The slug is free-form; the
# #271/#272 substrings it avoids were a constraint of a selector
# retired in #333.
#
# #312 sends only the glued-honorific comma rows whose diff includes
# `family` here ('Dr 김민준씨, V.', '田中さん, PhD') -- the union this
# rule is for. The rows whose diff is only {given, suffix} peel
# without any order flip and belong to fix(cjk-comma-honorific-peel)
# above, which names that shape and whose fields exclude `family` so
# the two cannot compete. Until #372 they landed on fix(comma-family)
# instead, on nothing but file order.
#
# `middle` was in that fields list too, on the strength of the
# mechanism paragraph above -- the CJK order flip CAN move a middle
# name for a three-token pre-comma run. None of the 11 names this
# rule actually explains has one: ten have a single-token post-comma
# tail, and the eleventh, '田中さん, Ph. D.', has two ('Ph.' and
# 'D.') but fix_phd merges them into one suffix unit before v1's
# comma split can turn the second token into `middle` the way an
# untreated two-token tail does at 1.4.0 ('Smith, John Middle' reads
# first 'John', middle 'Middle'). So no diff this rule claims has
# ever moved `middle`, for that reason rather than pre-comma token
# count.
#
# classify() admits by subset, so leaving `middle` out is not
# passive: a future diff that grows to include it alongside `title`
# or `suffix` -- the two roles this rule's comma-routing half
# actually claims -- now falls out of this rule instead of being
# silently absorbed, and should arrive UNEXPLAINED and be read once
# rather than get a widened rule pre-built for it (#452). That
# promise does not cover every shape, and the exceptions are per
# SHAPE and per NAME rather than per role -- measured with classify()
# over the 23 names this regex reaches, not reasoned from which role
# grew:
#
#   {given, middle, family}  all 23  -> fix(#271/#272/#298), the order
#                                      flip with no comma routing, whose
#                                      bare CJK regex sits ahead of this
#                                      rule and whose fields were never
#                                      narrowed
#   {middle, suffix}         4 of 23 -> '田中さん, Dr.' to fix(#296), and
#                                      '田中さん, 様.', '김민준, 씨',
#                                      '김민준, 씨.' to
#                                      fix(cjk-honorific-suffix)
#   {middle, title}          none    -> unclassified
#   {middle, suffix, title}  none    -> unclassified
#
# So what #452 buys here is narrower than "middle alongside title or
# suffix": it is the shapes in the last two rows, plus {middle, suffix}
# on the nineteen names the honorific rules do not reach. An earlier
# draft of this paragraph claimed the whole `title`-or-`suffix`
# combination and was falsified by driving classify() over the reach --
# the method decisions.md#differential-ledger names as the only one
# that answers this question.
name_regex = "(?s)(?=.*,)(?=.*[\\u3005-\\u3006\\u3040-\\u309F\\u30A0-\\u30FF\\u3400-\\u4DBF\\u4E00-\\u9FFF\\uF900-\\uFAFF\\uAC00-\\uD7A3\\uFF65-\\uFF65])"
fields = ["given", "family", "title", "suffix"]

[[change.precedes_narrower]]
issue = "fix(cjk-glued-honorific-peel) glued honorific peels into suffix"
why = """
LIVE, and the least comfortable of the declarations in this file.
Seventeen names reach both regexes and FIFTEEN have a diff the peel
rule's {family, given, suffix} admits -- but six of those fifteen are
taken by rules written above both, and so are not this pair's to
decide: '田中, 太郎さん', '김, 민준씨', '김, 민준씨 (Jimmy)',
'선생님, J.씨' and '이, J.씨' go to fix(cjk-comma-honorific-peel), and
'田中さん, Dr.' to fix(#271/#272/#298). That leaves NINE this rule
holds and the peel rule could take, and position alone is what keeps
those nine here. Of the two names outside the fifteen, '田中さん, PhD'
lands here as well but moves `title` too, so the peel rule is
ineligible for it wherever it sits, and '田中さん, 太郎' does not diff
at all. All three counts are classify() over the seventeen, recomputed
rather than carried over.

The order stays because the peel rule scopes itself
to a name with NO COMMA ANYWHERE, and promoting it would put that
label on '田中さん, 様.' and '김민준씨, J.씨', which do route a
post-comma piece and are the comma compound this rule is named for.

What must NOT be claimed is that all nine are compounds. Measured
against the wheel, '王先生, V.', '田中さん, V.' and '김민준씨, V.' show
no comma routing and no order flip at all: 'V.' is the given name on
both sides, the pre-comma family is one unsegmented run, and the whole
diff is the glued peel. They arrive here because this rule's criterion
is "the diff includes `family`", and `family` moves only because the
peel took the honorific off it -- so for those three the rule's own
label is wider than the name is. The rule that would describe them,
fix(cjk-comma-honorific-peel) above, covers this shape for a
POST-comma given name and has no family-side twin. Writing one was
weighed as #496 and DECLINED on one reason alone: the three are radar
(the paragraph below), so no gate can demand the rule, and a rule
nothing can demand is not one to add. #495 asked the converse --
whether the radar-only rules ALREADY here still earn their place --
and closed as not planned, so they stay. That answer leaves the #496
decline exactly where it was: it turns on nothing being able to demand
a NEW rule, which is not what #495 settled. So holding them here is
the least wrong of the readings available, and this is the entry that
says so out loud rather than letting the rule name imply otherwise.

All seventeen contested names are radar tier, by two warrants and
not one: sixteen sit in corpus_cjk_tolerated.jsonl, demoted there by
#488, and the seventeenth, 'Dr 田中さん, V.', is in corpus_issues.jsonl
alone -- harvested, append-only, and radar since #468. So nothing
fatal turns on who wins this particular contest: no rule here can be
demanded on their account, because an unmatched diff on a radar name
is reported rather than failed for want of a rule. Not never-fatal
unconditionally, though -- a [[never]] exclusion outranks the tier
(see _CORPUS_TIERS) and none refuses these. That is a fact about the
NAMES and it does not carry to the rules. Measured by deleting each
rule and re-classifying the corpus -- without fix(cjk-comma-compound)
the run still reports 0 unexplained, so it really is radar-only and it
was the candidate #495 weighed; without the peel rule TWELVE
contract-tier names go UNEXPLAINED ('Andersonさん', '王先生' and
'김민준씨' among them) and the run fails. TWELVE remains the figure
after the 2026-09-05 narrowing of the peel rule, re-measured: the one
name that narrowing moved goes to fix(cjk-honorific-suffix) with the
peel rule present and without it alike. Twelve of the SIXTEEN names the
peel rule explains are contract (measured 2026-09-05; #495 read
fourteen of seventeen, one of which the period-class demotion took to
radar and one of which the narrowing took to another rule), which is
why #495 recorded it as a rule to keep rather than a deletion
candidate. #495 closed as
not planned, so the compound rule keeps its place as well -- and the
reason is this contest read from the other side: measured, deleting
the compound rule does not leave its eleven diffs UNCLASSIFIED, it
hands NINE of them to the peel rule, whose comment is about a
different shape. Two are left unclassified."""

[[change]]
issue = "fix(cjk-glued-honorific-peel) glued honorific peels into suffix"
# '김민준씨' -> 김/민준/씨, '田中さん' -> 田中/さん, 'Andersonさん' ->
# Anderson/さん: #312's peel, on a name with no space before the
# honorific and no comma anywhere. 16 corpus names, which fell to the
# fields-only fix(suffix-routing) catch-all (deleted in #451) until
# #372 gave them a rule that names them. 17 until the 2026-09-05
# narrowing below, which is not one of them leaving the corpus: the
# name it lost was never glued.
#
# The regex is this file's first hand copy of GLUED_HONORIFICS rather
# than SUFFIX_WORDS, and that narrower vocabulary is the whole reason
# this rule can exist. '김민준씨' and the given name '김지양' are the
# same string shape -- hangul ending in a character the spaced list
# calls an honorific -- so a rule keyed on SUFFIX_WORDS could not tell
# them apart, and unanchoring the spaced rule below to reach the glued
# forms would let a future suffix regression on '김지양' classify as a
# recognized honorific. GLUED_HONORIFICS settles it in the config
# instead: 양, 군, 氏, 殿 and 博士 are deliberately absent from it,
# because a glued match on those collides with real given names. Same
# copy, same pin (_HONORIFIC_SOURCES) as the 2.0 ledger's twin, whose
# regex this is verbatim.
#
# `\.?(?=$|[ ,])` rather than `$`: the honorific ends a TOKEN, not
# necessarily the string. '田中さん II' and '김민준씨 Jr.' carry a
# Latin suffix after it, '김민준씨 (Jimmy)' a nickname.
#
# The three negative lookbehinds are the 2026-09-05 narrowing, and the
# 2.0 twin's comment carries the argument for them in full. 박사님,
# 선생님 and 교수님 are the only entries of this alternation containing
# another entry of it, so a match on the interior 님 was the one way a
# SPACED honorific could reach a rule whose title says a glued one was
# peeled off the name. It reached two: '김민준 박사님', where nothing is
# peeled at all -- rules.md#W2's second sentence, whose witness line for
# this string is suffix="박사님", the honorific whole and its own word --
# and '선생님', where `suffix` moves nowhere and the order rule claims
# the diff regardless. The lookbehinds refuse the interior position
# only, so a glued '김민준박사님' still matches on 박사님 itself.
#
# Measured consequence here, 2026-09-05: exactly one name changes hands
# and it is '김민준 박사님', which fix(cjk-honorific-suffix) below takes.
# Summary lines byte-identical, no pin in this file moves,
# order_contests unchanged, recorded reach 37 -> 35.
name_regex = "(?<=[^\\s,])(?<!박사)(?<!선생)(?<!교수)(?:박사님|선생님|교수님|박사|씨|님|先生|女士|小姐|教授|様|さん|さま|くん|ちゃん)\\.?(?=$|[ ,])"
fields = ["given", "family", "suffix"]

[[change.precedes_narrower]]
issue = "fix(suffix-routing) a two-token name ending in a roman numeral keeps it in `suffix`"
why = """
a regex accident, and a script-blind one: the numeral rule opens on a
run of non-space characters, which matches kana as readily as Latin,
while its prose is about a two-token LATIN name with a trailing
numeral and no comma in it. This rule's own pattern already names
'田中さん II' -- it closes on a token-boundary lookahead rather than an
end anchor precisely because a Latin suffix can follow the honorific.

LATENT: measured, the diff is {family, given, suffix} (1.4 read first
'田中さん', last 'II'; 2.x reads last '田中', suffix 'さん, II'), and
`given` is outside the numeral rule's {family, suffix} at any
position. _CROSS_RULE_WINNERS pins the name here. '田中さん II' is
radar tier since #488, so nothing in the gate turns on this contest.
The demotion candidate #495 weighed was the NUMERAL rule -- measured,
both names it explains ('John V', 'Mohamad X') are radar -- and not
this one, which explains twelve contract-tier names (measured
2026-09-05; fourteen when #495 read it). #495 closed as
not planned, so the numeral rule stays; the measurement stands as the
statement about its reach that it always was."""

[[change.precedes_narrower]]
issue = "fix(suffix-routing) a two-token name ending in the suffix word jr keeps it in `suffix`"
why = """
the same script-blindness one rule further down: the jr rule's leading
non-space run matches hangul as readily as Latin, while the rule is
written for 'Smith Jr.' -- one Latin name word, one suffix word, no
comma. The trailing 'Jr.' does move here -- 1.4 read it as the family,
the tree reads suffix '씨, Jr.' -- and that half of the diff is the
{family, suffix} the jr rule is named for. What that rule cannot
describe is the OTHER token: the glued 씨 peels off '김민준씨' and
segments what is left into given '민준', family '김'. `given` is that
segmentation, it is this rule's subject, and it is where the diff
leaves the jr rule's reach.

LATENT, the diff being {family, given, suffix} against the jr rule's
{family, suffix}. _CROSS_RULE_WINNERS pins the name here, on a shape
measured against the wheel -- the corroboration its structural twin
'田中さん II' did not have until #382 re-measured it. The NAME is radar
tier since #488, so nothing fatal turns on it, but neither RULE was a
#495 candidate: the jr rule explains the contract-tier 'Smith Jr.',
and this one twelve contract names (measured 2026-09-05; fourteen when
#495 read it). #495 closed as not planned, so
nothing radar-only is being deleted either, and this pair outlives the
question from both directions."""

[[change]]
issue = "fix(cjk-honorific-suffix) postnominal honorifics recognized, compounding with the CJK order flip"
# '王小明 先生', '김민준 씨', '田中 太郎 様': #307 ships the spaced CJK
# honorifics as suffix vocabulary, so a trailing 先生/씨/様 moves to
# `suffix` where 1.4 read it as a name part -- and the remaining
# wholly-CJK name simultaneously takes the family-first flip, so a
# three-token name moves `middle` too, which is what carried it past
# the fields-only suffix-routing rule while that rule existed (#451
# deleted it). Keyed on the honorific alternation itself
# (the maiden-marker rule's pattern): the trigger tokens are wholly
# CJK characters, so the rule matches only a name whose TRAILING
# token is a listed honorific -- a mostly-Latin name with one
# ('Wang Xiaoming 先生') is inside its shadow, accepted because the
# recognized honorific is the diff's cause there too, and the
# alternation is a hand copy of SUFFIX_WORDS' CJK entries --
# pinned by tests/v2/test_ledger_guards.py, which derives the expected
# set from the config by script membership. Anchored to a WHOLE
# trailing token ((?:^| )...$), judged on the NAME STRING: without
# it, any name string merely ENDING in 양/군 -- the glued given name
# 김지양, the spaced 김 지양 -- would match and could have a real
# regression absorbed as intentional (the case table pins the
# parser-side twin: suffix matching is whole-token, never endswith).
# GLUED diffs (田中さん, 김민준씨, and the 김씨 that segmentation
# already reached) never match this rule -- the anchor is judged on
# the name STRING, and a glued form has no space before its
# honorific. They fell to the fields-only suffix-routing rule by
# their {first, last, suffix} shape (v1 held the whole token in
# first, so last moves too) -- field-honest, even though that rule's
# prose described the two-token Latin case. Verified by the
# 2026-07-30 run, not assumed: #308's peel put a dozen glued names
# in the corpus (Latin+glued like Andersonさん included) and every
# one classified there -- none carried a middle-field diff. They have
# fix(cjk-glued-honorific-peel) above since #372, and the catch-all
# they were falling to is gone (#451), so the sentence is history:
# nothing absorbs a glued diff this rule declines any more.
name_regex = "(?:^| )(?:씨|박사|박사님|선생님|교수님|군|양|님|先生|女士|小姐|博士|教授|様|氏|殿|さん|さま|くん|ちゃん)\\.?$"
fields = ["given", "middle", "family", "suffix"]

[[change]]
issue = "feat(#269) non-Latin titles/conjunctions recognized"
# 'г-н Иван Петров' (Cyrillic title), 'Хосе И Мария Сантос' (Cyrillic
# conjunction И joining two given names). v1 shipped Latin-only
# vocabulary, so these were plain name tokens and everything shifted
# one position. New recognition on non-Latin input -- the point of
# #269 -- not a Latin-corpus regression.
#
# Cyrillic only, and only the three fields the shift can touch. The
# first draft allowed five fields across four scripts, which put every
# Arabic name in the corpus -- including ones that are currently
# PARITY -- into its shadow, and pre-excused Greek and Hebrew, against
# which nothing has ever been compared. A leading title or an absorbed
# conjunction moves a word from `first` to `title`, or from `middle`
# into `first`; it cannot reach `last` or `suffix`. Widen this only
# with a name that demonstrates the need, and prefer a new rule per
# script over loosening this one -- the \bبن\b rule below is the
# model.
name_regex = "[\\u0400-\\u04FF]"
fields = ["title", "given", "middle"]


# The fix(leading-credential) rule that stood here is GONE, and its
# absence is the record: it explained 2.0 routing a leading split
# 'Ph. D.' to `suffix` where v1 read title 'Ph.' and given 'D.'. #371
# restored v1 on all four names of that shape, so the rule explained
# nothing, and the gate reported it SHADOWED -- `fix(comma-precomma-
# family)` above claims the one name still diffing here, which is the
# #426 precedent for dropping rather than keeping a shadowed rule.
# Read the diagnosis, not just the error: compare.py separates
# `reverted` (matches no diffing name) from `shadowed` (an earlier
# rule claimed every diff it would have) precisely because the fixes
# differ. Three of this rule's four names became parity; the fourth,
# 'Ph. D., Jr.', still diverges and rides under that earlier rule.
#
# What v1 did -- never heal the pair at the HEAD of the string,
# because its regex `\s(ph\.?\s+d\.?)` required a preceding space,
# while healing it anywhere else, mid-name as readily as trailing --
# is what the parser does again; rules.md#S2 now states it as a rule
# rather than a regex accident.


# Deliberately NOT a [[change]] rule: TRAILING 'Ph. D.' split-token
# healing ('John Ph. D.', 'John Smith, Ph. D.') is PARITY, not a 2.0
# behavior change -- v1's fix_phd healing of the adjacent 'Ph.'/'D.'
# pair into one suffix unit is replicated exactly by 2.0's 'joined'
# vocab tag (tests/v2/cases.py classification="parity" on both
# 'phd_split' and 'suffix_comma_split_phd'; verified empirically, zero
# diff against the 1.4 worker). Adding a suppression rule for it would
# risk masking a real regression in this exact shape, so the
# trailing-'Ph. D.' [[never]] entry below refuses it instead: any diff here
# reports UNEXPLAINED (#328). (The leading case above is a separate
# shape, which is why it needed its own anchored rule rather than a
# widened one.)
#
# The scope of what is parity still has to be read narrowly. Parity is
# the two inputs named above, where the pair LEADS its run. A trailing
# pair after another suffix diffs on ORDER -- 'John Smith, Jr. Ph. D.'
# is 1.4.0 suffix 'Ph. D., Jr.' against 2.0's 'Jr. Ph. D.', because
# fix_phd extracted the credential pre-parse and re-appended it while
# 2.0 renders the tail as written (tests/v2/cases.py
# 'suffix_comma_split_phd_after_another_suffix',
# classification="fix(credential-pair-order)"). That input is in the
# case table and in no corpus, so nothing is reported on it either
# way; note that the trailing-'Ph. D.' [[never]] entry's anchor
# captures it too, and would call its intended order diff a regression
# if a corpus ever gained it. Reconciling them then means a narrower
# `name_regex`, and only that: the two renderings differ in the ORDER
# of one suffix string and in nothing else, so the diff is `suffix`
# alone -- the one field the parity promise is about. Any `fields`
# list permissive enough to let the order diff classify would abandon
# the promise. Not a question to settle now, on a name the harness
# never sees.
#
# No ordering question arises here: exclusions are consulted before
# any rule, so this is independent of where it sits in the file.
#
# Before the [[never]] entry existed this shape was ABSORBED rather
# than refused: fix(comma-family) below matches on a bare comma and
# lists `suffix`, so a probe corpus carrying the name came out
# unexplained 0. That is one of the instances filed as #372. It is
# no longer what happens here -- exclusions are consulted first, so
# the name is refused before any rule sees it -- and #372 tracks the
# general problem, which this entry does not solve.

[[change]]
issue = "fix(#369) a given-name title licenses the bound given-name join with one word to spare"
# 'Sheik abdul salam': rules.md#P5 -- "or after a given-name title,
# which asserts that a given name follows (H1): there the two words
# join and the name has no family". Given 'abdul', family 'salam'
# becomes given 'abdul salam', family '' -- the empty family H1
# accepts for "Sir John". The 'Sheik abdul salam Jr' rules example
# is the same move with the suffix standing; 'Sheik abdul Jr Smith'
# is in reach and does not move -- the licence takes a name word,
# not a suffix.
#
# 'Sheik Abu Bakar', the #367 regression this issue was filed for,
# reads given 'Abu Bakar' again with every field byte-identical to
# this baseline, so no rule names its fields: restored, not moved.
#
# Without this rule the name landed on the fields-only
# fix(suffix-routing) catch-all, which moved no suffix here. #451
# deleted that catch-all, so this ledger has no fields-only rule left
# to absorb anything.
name_regex = "(?i)^sheik\\s+abdul\\b"
fields = ["given", "family"]

[[change]]
issue = "fix(#401) the bound-given reserve counts the trailing numeral assign reads as the suffix"
# 'abdul Smith V', 'abdul Smith Jr V': rules.md#P5 -- "a trailing
# roman numeral that assign reads as the suffix (S2) is no word to
# spare, and is not joined". first 'abdul Smith', last 'V' -> given
# 'abdul', family 'Smith', suffix 'V'; at this baseline the V was not
# read as a suffix, so all three fields move here where the 2.x
# ledgers list two. Both are rules.md examples; no differential corpus
# name has the shape. The 'abdul Smith V Ph. D.' spelling stays out
# of the corpus: a trailing split credential is this ledger's
# [[never]] shape, and its v1 reading carries the same family loss
# that entry would then refuse to explain.
#
# A rule with fewer fields than this diff silently handed the name to
# the fields-only fix(suffix-routing) catch-all, which is how this fix
# was first recorded as "1.4.0 parity": the catch-all's printout was
# capped, and EXPLAINED NOTHING is not byte-identical. #451 deleted
# that catch-all, so a narrowed rule here now costs the name its
# explanation outright instead of hiding it -- louder, and the reason
# the lesson is worth keeping written down.
name_regex = "(?i)^abdul\\s+smith\\s+(jr\\s+)?v$"
fields = ["given", "family", "suffix"]

[[change]]
issue = "fix(#421) the bound-given join never absorbs a suffix piece"
# 'abdul Jr Smith Berg': rules.md#P5 -- "the join never absorbs a
# marker standing as a word of its own -- a marker is not a name word
# (M2) -- nor a word of the unambiguous suffix vocabulary (S2),
# wherever position will then place it". given 'abdul Jr', middle
# 'Smith' -> given 'abdul', middle 'Jr Smith'. Parity with this
# baseline until now; a
# rules.md example, since no differential corpus name has the shape.
name_regex = "(?i)^abdul\\s+jr\\s+smith\\s+berg$"
fields = ["given", "middle"]

[[change]]
issue = "fix(#421) the bound-given join never absorbs a split credential"
# 'abdul Ph. D. Smith Berg': the rule above, on the split credential.
# At this baseline v1's fix_phd extracted the credential before
# parsing, so: first 'abdul Smith', suffix 'Ph. D.' -> given 'abdul',
# middle 'Smith', suffix 'Ph. D.' -- the suffix field unchanged here,
# the given deliberately not restored (decisions.md#P5), so this
# ledger lists two fields where the 2.x ledgers list three. A rules.md
# example; no differential corpus name has the shape.
name_regex = "(?i)^abdul\\s+ph\\.\\s+d\\.\\s+smith\\s+berg$"
fields = ["given", "middle"]

[[change]]
issue = "fix(#425) accepted: a bare ambiguous acronym the peel does not take joins as a name word"
# 'abdul Ma Smith': rules.md#P5 -- "a bare ambiguous acronym is a name
# word wherever the peel does not take it". first 'abdul', middle
# 'Ma' -> given 'abdul Ma': v1's join counted the acronym out as
# suffix vocabulary and declined; since 2.0 the join takes it, as
# assign reads it (a middle name, not a credential, with a family
# behind it). A 2.0 reading, byte-identical at 2.0.0 and 2.1.0, first
# witnessed here -- P5 records it as Accepted, and the example exists
# to carry the shape into this corpus.
name_regex = "(?i)^abdul\\s+ma\\s+smith$"
fields = ["given", "middle"]

[[change]]
issue = "fix(#424) an unlisted abbreviation is as transparent as a listed title to the leading particle, the P4 example"
# 'Xyz. van Johnson': the rules.md#P4 example of the 'Esq. van Gogh'
# rule of this change (beside the fix(#367) rules, further down),
# same reading and fields. Separate rather than an alternation, per
# the guards' one-alternation-per-rule roster.
name_regex = "(?i)^xyz\\.\\s+van\\s+johnson$"
fields = ["given", "family"]

[[change]]
issue = "fix(#424) accepted: the maiden walk keeps the numeral an initial before the marker vetoes"
# 'J. née Jones Smith V': rules.md#M2 -- the numeral is taken "read as
# the take would leave the name, the word before the numeral being
# then the word before the marker". 1.4.0 has no maiden support and
# read middle 'née Jones', last 'Smith', suffix 'V'; 2.x reads maiden
# 'Jones Smith V' with the J. before the marker vetoing the fork, as
# 'J. V' reads the V as a name. The fix(#274) rule's fields omit
# the suffix v1 read, so this accepted reading names its own.
name_regex = "(?i)^j\\.\\s+n[ée]e\\s+jones\\s+smith\\s+v$"
fields = ["middle", "family", "suffix", "maiden"]

[[change]]
issue = "fix(#424) accepted: the chain keeps an acronym assign will not peel behind a title-and-particle word"
# 'Freiherr von Berg MA': rules.md#P2 -- the trailing suffix is read
# "over the pieces the chain leaves". #367 stops the leading-particle
# scan at a title-and-particle word, so the chain takes 'von Berg',
# and the acronym the fork counted with three pieces meets assign
# with two; the chain asks the peel again and takes it. first 'von
# Berg', last 'MA' -> family 'von Berg MA' (master's reading since
# 2.0). A rules.md example. Without this rule the name landed on the
# fields-only fix(suffix-routing) catch-all -- the count was the tell.
# #451 deleted that catch-all, so this ledger has no fields-only rule
# left to absorb anything.
#
# 2026-09-18 (#289): a THIRD reading, and it is the one that ships.
# The comment above says the chain "asks the peel again and takes
# it"; with the case signal the peel takes the ACRONYM instead, so
# the name reads title 'Freiherr', family 'von Berg', suffix 'MA' --
# neither 1.4.0's (first 'von Berg', last 'MA') nor 2.0-2.3's
# (family 'von Berg MA'). Accepted rather than repaired: the lean
# ends P2's chain with no words to spare where the count would not,
# and `fields` gains `suffix` because the diff moves it. Measured at
# this baseline: given 'von Berg' -> '', family 'MA' -> 'von Berg',
# suffix '' -> 'MA'. The rule kept explaining nothing between the
# case signal landing and this edit -- the diff had grown past the
# declaration, which is the under-declared half of #452.
name_regex = "(?i)^freiherr\\s+von\\s+berg\\s+ma$"
fields = ["given", "family", "suffix"]

[[change]]
issue = "fix(#424) a title-led chain before the numeral is the one name piece"
# 'Freiherr von Richthofen V': rules.md#P2 boundary -- the chain stops
# before the numeral, and the chain is then the one name piece, which
# reads as 'Dr. Smith V' reads. v1 read last 'von Richthofen V'; #424
# split the numeral off, and #410 then moved the one name piece behind
# the title out of `given`, so today it is family 'von Richthofen',
# suffix 'V' -- 'Dr. Smith V' moved the same way, so the comparison
# still holds. A rules.md example.
#
# The diff was {given, family, suffix} before #410 and is {family,
# suffix} after it. `fields` declared all three until this round, and
# that width is exactly why the movement never surfaced: the subset
# test kept matching as the diff shrank, so a real change of reading
# passed through a green run unnamed. The declaration is narrowed to
# what the diff actually is, which is what makes a future `given`
# regression on this name loud instead of absorbed. A `fields` list
# wider than the diff it explains is a silent absorber.
name_regex = "(?i)^freiherr\\s+von\\s+richthofen\\s+v$"
fields = ["family", "suffix"]

[[change]]
issue = "fix(#424) accepted: a particle of the suffix vocabulary opening the trailing run is a suffix piece"
# 'John Smith Mc V': rules.md#P2 Accepted -- "where it opens the
# trailing run the chain stops before it as before any suffix word,
# and the peel takes it". middle 'Smith', last 'Mc V' -> family
# 'Smith', suffix 'Mc, V'. A rules.md example; the class was found
# unrecorded by the second docs review of #424.
name_regex = "(?i)^john\\s+smith\\s+mc\\s+v$"
fields = ["middle", "family", "suffix"]

[[change]]
issue = "fix(#424) the particle chain stops before the trailing numeral"
# 'John van der Berg V': rules.md#P2 -- "a trailing suffix begins --
# read as assign will read it (S2): a trailing roman numeral, or a
# bare acronym with words to spare, ends the chain as a suffix word
# does". last 'van der Berg V' -> family 'van der Berg', suffix 'V',
# as 'John Smith V' reads. Shipped since 1.x: the chain's stop asked
# with the suffix-piece test, whose initial veto does not see a bare
# V. A rules.md example; no differential corpus name has the shape.
# Without this rule the name landed on the fields-only
# fix(suffix-routing) catch-all -- the count was the tell. #451
# deleted that catch-all, so this ledger has no fields-only rule left
# to absorb anything.
name_regex = "(?i)^john\\s+van\\s+der\\s+berg\\s+v$"
fields = ["family", "suffix"]

[[change]]
issue = "fix(#424/#445) accepted: the maiden walk keeps a bare acronym, and the lone name word is the family"
# 'John née Jones Smith Ma': rules.md#M2 -- "a bare acronym the
# reading declines is maiden text all the same". middle
# 'née Jones', family 'Smith', suffix 'Ma' -> maiden 'Jones Smith Ma':
# v1 had no maiden support; 2.0 has read the name so since #274, and
# since #533 the walk asks the acronym fork rather than leaving it:
# what declines this word is the WRITING, Title case saying name
# where capitals would say credential, and the count such a reading
# needs is taken over the name the take would leave rather than over
# the words as they stand. The fix(#274) rule
# cannot carry it: its fields omit the suffix v1 read. A rules.md
# Accepted example, first witnessed here.
#
# Renamed for #445 (2026-08-27) rather than widened in place, because
# the diff now has two causes and one rule has to explain the whole
# of it. What the walk leaves is a single name word, and rules.md#M4
# makes that word the family: given 'John' -> family 'John', so
# `given` joins the four fields above. Attributing that to #424 alone
# would have been false, and leaving this rule at four fields would
# have made it explain nothing while the name went UNEXPLAINED --
# which is exactly how the gate reported it before this edit. The
# name is #445's only mover whose diff is not the shape the fix(#445)
# rule below carries, the suffix v1 read being the difference.
#
# 2026-09-19, #533: NARROWED from (?i) to the two spellings whose
# reading this rule describes, and widened to the second of them.
# The (?i) anchor reached 'John née Jones Smith MA' as well, and
# that name now does the OPPOSITE of what this rule says -- the
# clause gives the MA up and it reads suffix 'MA' -- so leaving
# the anchor alone would have this rule explain a diff under the
# reasoning of the reading it lost. It is carried below, by
# 'fix(#445/#533) the clause gives the credential up, and the one
# name word it leaves is the family'. 'JOHN NEE JONES SMITH MA
# PHD' joins instead: one case, so no lean, and a suffix word
# BEHIND the member ends the peel before it reaches the member --
# the clause keeps the MA and the lone name word is the family,
# which is this rule's sentence exactly. Its mixed-case spelling
# does not read that way ('John nee Jones Smith MA PHD' reads
# suffix 'MA PHD', measured), which is why the anchor cannot go
# back to (?i) to pick it up.
name_regex = "^(?:JOHN NEE JONES SMITH MA PHD|John n[ée]e Jones Smith Ma)$"
fields = ["given", "middle", "family", "suffix", "maiden"]

[[change]]
issue = "fix(#360) ste moved into the never-given particles with mc"
# 'Ste Marie': the second word of the vocabulary move, which the
# fix(#360) comment in the 2.x ledgers names as a name that should
# arrive UNEXPLAINED and be read once. It has. Without this rule it
# landed on the fields-only catch-all, whose prose described a trailing
# credential rather than a leading particle folding into the family;
# #451 deleted that catch-all, so removing this rule now costs the
# name its explanation outright (measured through classify()).
name_regex = "(?i)^ste\\s+\\S+$"
fields = ["given", "family"]

[[change]]
issue = "fix(#360) mc moved into the never-given particles, so it folds into the family"
# 'Mc Donald': mc became a never-given particle, so the leading token
# stops being read as the given name and folds into the family instead
# ('Mc' + 'Donald' -> family 'Mc Donald'). The twin of the ste rule
# above, and written beside it for that reason.
#
# In `(?i)^mc\s+\S+$` the `mc` is a LITERAL anchored at the start,
# followed by whitespace and then exactly one token to the string's
# end. `\S+$`, not a `\b`, is what closes it: the pattern carries no
# word boundary at all. 'McDonald, Ronald' and 'Mcintyre Smith Jr.'
# fail on the whitespace, having none after 'mc'; 'Ste Marie' and
# 'Los Santos' fail earlier still, opening with neither letter. None
# of the four is this rule's to claim, whatever else explains it --
# and if one ever needs explaining, it needs a rule of its own. Do
# not widen this one to reach it: a rule claiming names its prose
# does not describe is what #451 is retiring.
#
# Ported verbatim from expected_since_2.0.0.toml, minus `_ambiguities`:
# below baseline 2.0 there is no v2 surface, so no diff can carry that
# pseudo-field and naming it would narrow by something unreachable.
# Until this port the name fell to the fields-only catch-all, which
# _CROSS_RULE_WINNERS recorded rather than closed (#451).
name_regex = "(?i)^mc\\s+\\S+$"
fields = ["given", "family"]

[[change]]
issue = "fix(#367) a title no longer displaces a leading never-given particle"
# 'Sir de Mesnil': the title stops pushing the particle out of the
# leading position, so the particle run reads as the family rather
# than the given name. The `de` sibling of the two #367 `van` rules
# below.
#
# `(?i)^sir\s+de\b` is anchored at the start, and its `\b` is real
# work rather than decoration: it is what keeps 'Sir Denis Smith' and
# 'Sir del Rio' out. The roster's own probes fail earlier -- 'John Sir
# de Mesnil' and 'Smith, Sir de Vaux' on the anchor, 'sir' opening
# neither string, and 'Sir Smith' on the literal 'de'. None of the
# three is this rule's to claim, whatever else explains it, and a name
# of that shape that ever needs explaining wants its own rule rather
# than a widening of this one (#451).
#
# Ported verbatim from expected_since_2.0.0.toml, whose copy already
# reads fields = ["given", "family"] and carries nothing to drop --
# unlike the #360 rule above, this one never claimed `_ambiguities`.
name_regex = "(?i)^sir\\s+de\\b"
fields = ["given", "family"]

[[change]]
issue = "fix(#424) an unlisted abbreviation is as transparent as a listed title to the leading particle"
# 'Esq. van Gogh' (corpus_issues): rules.md#P4 -- "An unlisted
# abbreviation before the particle is as transparent as a listed
# title, since assign reads it as one (H2)". title 'Esq.', last 'van
# Gogh' -> given 'van', family 'Gogh', as 'Dr. van Gogh' reads since
# #367 (whose rule below records v1's titled-particle reading). #367 keyed the leading-particle exception on the
# first piece of the name by group's title test, which does not see
# H2's abbreviations; the scan asks assign's test now. Literal for the
# reason the #367 rule gives: a regex cannot ask whether a word is a
# title, and this one cannot ask whether it is unlisted.
# Without this rule the name landed on the fields-only
# fix(suffix-routing) catch-all -- the count was the tell. #451
# deleted that catch-all, so this ledger has no fields-only rule left
# to absorb anything.
name_regex = "(?i)^esq\\.\\s+van\\s+gogh$"
fields = ["given", "family"]

[[change]]
issue = "fix(#367) a title no longer displaces a leading particle out of the leading position"
# 'Mr. Van Nguyen': a leading particle deliberately does not chain --
# that is what makes 'Van Nguyen' read as given Van, family Nguyen.
# Through 2.1 the exception was keyed on piece index 0, so a TITLE
# displaced the particle and the chain fired, giving family
# 'Van Nguyen' (v1's reading, which is why this name is parity with
# 1.4.0 until now). 2.2 keys it on the first piece of the NAME, so a
# titled name reads as the same text reads untitled.
#
# The wider class is any title followed by a particle -- 'Dr. Van
# Johnson', 'Sir de Mesnil', 'Sheik Abu Bakar' all move (the last restored
# by #369) -- and this
# regex names one title and one particle because 'Mr. Van Nguyen' is
# the one name in the corpora that moves. Deliberately narrower than
# the class: a corpus name that joins it later should arrive
# UNEXPLAINED and be read once, not be absorbed silently. Widen the
# literals then, and record the new count.
#
# Three joined through #413's backtick harvest: 'Dr. Van Johnson',
# 'Sir Van Johnson', 'Jr. Van Johnson'. Widened here as well as in the
# 2.0 and 2.1 copies -- widening only those left these three landing on
# the fields-only fix(suffix-routing) catch-all (deleted in #451),
# which is the very absorption this comment describes two paragraphs
# up. None of them is a two-token name and none moves a suffix.
#
# The title slot copies TITLES: all four spellings are in it. `jr` is
# also suffix vocabulary and reads as a title here simply because it
# is in TITLES and leads -- 1.4.0 already gives title 'Jr.' for
# 'Jr. Van Johnson', so that reading predates #367 entirely.
#
# The title slot is a LITERAL for that reason and not by accident.
# Nothing in a regex over the raw string can ask whether a word is a
# title, so the `(?i)^\S+\.?\s+van\b` this rule shipped with matched
# ANY first word: it reached 11 corpus names and explained 1. The
# other ten include 'Vincent van Gogh', 'VINCENT VAN GOGH' and
# 'Alex van Johnson' -- the "Van Johnson" family AGENTS.md names as a
# standard regression canary. name_regex rules sort ahead of
# fields-only ones and `fields` matches by subset, so a future
# regression on any of those would have been labelled fix(#367) and
# exited 0 -- a strict loss at this baseline, whose ledger was empty
# before. (`\.?` was inert into the bargain: `\S+` is greedy, so it
# had already taken the period.)
#
# `fields` is what carries the rest of the tightness -- and it is
# narrower than the change rather than a description of it. The wider
# mechanism moves more than `given`/`family`: un-chaining reveals
# whatever was hidden behind the particle, so 'Dr. St John Smith'
# moves `title` (title 'Dr.', family 'St John Smith' -> title
# 'Dr. St', given 'John', family 'Smith'), 'Mr. Van Johnson nee Brown'
# moves `maiden` (family 'Van Johnson nee Brown' with no maiden ->
# given 'Van', family 'Johnson', maiden 'Brown'), and a third token
# after the particle moves `middle` the same way ('Mr. Van Johnson
# Middle': v1 gives it all to `last`; the un-chained reading gives
# given 'Van', middle 'Johnson', last 'Middle'). `suffix` and
# `nickname` are the two roles that genuinely never move.
#
# `fields` is what keeps those wider shapes out, NOT the regex --
# measured, `^(mr|dr|sir)\.?\s+van\b` has no end anchor and does
# reach 'Mr. Van Johnson nee Brown' and 'Mr. Van Johnson Middle';
# only 'Dr. St John Smith' is outside it. The three names this rule
# actually claims are 'Mr. Van Nguyen', 'Dr. Van Johnson' and
# 'Sir Van Johnson' -- NOT the trio two paragraphs up, which includes
# 'Jr. Van Johnson', the next rule's one name -- and each diffs
# {given, family} alone. `fields` names those two roles and no
# others, so `title`, `maiden` and `middle` are left out on purpose.
# classify() admits by subset, so leaving a role out is not passive:
# a diff that grows to include one of them falls out of THIS rule
# instead of being silently absorbed. Where it lands then is a
# separate question, and it depends on the SHAPE rather than the role.
# Measured on the nee name above: {family, maiden} goes to fix(#274),
# which is its right home, but {given, family, maiden} -- the shape
# this rule would actually grow into, since it already moves `given`
# -- is claimed by nothing, because fix(#274)'s own `fields` stop at
# maiden/middle/family and its comment says why. A `middle` or `title`
# growth is likewise claimed by nothing. So the honest statement is
# per shape, not per role: drive classify() rather than reasoning from
# which role moved (#452).
#
# This rule has to exist even though the run already exited 0 without
# it. The diff was being classified by fix(suffix-routing), a
# fields-only rule whose ["given", "family", "suffix"] was a superset
# of this diff's ["given", "family"] -- a rule about a trailing
# credential absorbing a leading-particle change, which is the
# mis-classification the README warns about. A name_regex rule
# outranks every fields-only one, so this claimed it back; #451 has
# since deleted the catch-all, and no ledger has a fields-only rule
# for anything to be claimed back from.
name_regex = "(?i)^(mr|dr|sir)\\.?\\s+van\\b"
fields = ["given", "family"]

[[change]]
issue = "fix(#367) an inferred title no longer displaces a leading particle either"
# 'Jr. Van Johnson': the same change as the rule above, for a leading
# piece the period-abbreviation inference reads as a title (H2). It
# sat in that rule's alternation as 'jr' while 'jr' was title
# vocabulary; #296's audit took it out (a postnominal only), so the
# member would now reach a word the vocabulary does not ship, and the
# shape gets its literal. The reading is unchanged: 'Jr.' is still a
# title by shape, and Van is still the leading name piece.
#
# `middle` was declared here too, the same excess the 'Mr./Dr./Sir.'
# rule above drops and for the same reason: this rule's one name,
# 'Jr. Van Johnson', diffs {given, family} alone. classify() admits
# by subset, so leaving `middle` out means a diff that grows to
# include it falls out of this rule instead of being silently
# absorbed. Measured, nothing else claims a `middle` diff on this
# rule's name either, so it arrives unclassified and is read once
# rather than have a widened rule pre-built for it (#452).
name_regex = "(?i)^jr\\.\\s+van\\b"
fields = ["given", "family"]

# Shapes that must never be explained. A [[change]] rule says "this
# diff is intended, and here is what changed"; there was no rule
# meaning "whatever happens here is a regression", so the two promises
# below could only be written as prose -- and both were false as
# written from the day they were written (the first shipped with the
# harness itself, the second three days later) until #328 found them.
#
# The two are not false alike, and the difference matters now that
# this file scopes the second promise to one reading. Both said
# "unclassified", unqualified, and both were claimed on SOME reading
# from day one. But only the Ph. D. promise was claimed on the reading
# it now protects; no rule has ever claimed the ASCII pairs' NICKNAME
# reading, then or today. That entry is a tripwire under no present
# tension, which is the point of setting it before the tension exists.
#
# classify() consults these before any rule, so a matching name
# reports UNEXPLAINED however many rules would claim it.
#
# `examples` is not decoration. A protected shape need not appear in
# any corpus -- 'John (Jack) Kennedy' does not -- so the entry carries
# its own test data, which tests/v2/test_ledger_guards.py runs against
# every non-empty subset of the fields a rule may name: the seven
# roles and the `_ambiguities` pseudo-field. An entry carrying
# `fields` is asked only about the subsets those cover -- 3 for the
# ASCII pairs, not 255 -- which is where the 387 in that file comes
# from.
#
# The illustration was 'John "Jack" Kennedy' until #486's shape 1-3
# variation matrix gave that string's existing case row a shape tag --
# the row (tests/v2/cases.py 'nickname_quotes') long predates that
# work; only the tag is new -- which put it in corpus_shapes.jsonl.
# The sentence is about the KEY, not about that name, so it moved to
# the sibling example still in no corpus at all; of the four, the
# remaining two ('"Rick" Edmonds', 'Franklin, Benjamin (Ben)') are
# corpus names in radar files. That an example can be promoted this
# way is the point of the key rather than a problem with it --
# nothing about the entry depends on which side of the corpus its
# test data sits on.
#
# The replacement is one tag from the same fate, and whoever writes
# that tag should read this: 'John (Jack) Kennedy' is itself a case
# row's text ('nickname_parens', the medial-paren sibling of the row
# above), so tagging it with shape 1 puts it in corpus_shapes.jsonl
# and falsifies this sentence exactly as the last tag did. There is
# no example left that is not a corpus name or a case row, which is
# the honest state of it: repoint the sentence at whichever example
# is still outside, or restate it as "examples are not required to be
# corpus names" and stop naming one.

[[never]]
why = "trailing 'Ph. D.' split-token healing is PARITY, not a 2.0 change: v1 healed the adjacent pair too, so a diff here is a regression"
# Anchored to the END, and that is the whole design. The promise names
# two forms -- 'John Ph. D.' and 'John Smith, Ph. D.' -- so an
# exclusion keyed on the comma protects half of it while looking
# complete. The anchor also keeps clear of 'Ph. D. John Smith', the
# LEADING shape. That shape had its own fix(leading-credential) rule
# until #371 restored v1 and it went dormant; the carve-out stays
# load-bearing anyway, since it is what lets 'Ph. D., Jr.' reach
# fix(comma-precomma-family). Dropping it because the rule it once
# protected is gone takes this gate red. No `fields`: any diff on this shape is a
# regression, which is what omitting the key means.
#
# One shape this deliberately over-reaches: 'John Smith, Jr. Ph. D.'
# still matches, and its ORDER diff (1.4's 'Ph. D., Jr.' against 2.x's
# 'Jr. Ph. D.') is an INTENDED change -- cases.py classifies it
# fix(credential-pair-order). No corpus contains it, so nothing is
# silenced today. Erring toward refusal is the safe direction: an
# UNEXPLAINED diff blocks a release for scrutiny, where a wrongly
# classified one passes silently. If a corpus ever gains a
# <suffix> Ph. D. name, narrow this entry rather than widening a rule
# to claim it.
#
# One did, through #413's backtick harvest, and this is that
# narrowing. It is written as the ORIGINAL broad refusal minus three
# named exceptions, not as a positive description of the two promised
# shapes. The first attempt did the latter -- "a name then the
# credential, or two words, a comma, then the credential" -- and cut
# far more than the three: 'Smith, John Ph. D.', the ordinary
# family-first listing, and every multi-comma or mid-title form
# ('Smith, John, Ph. D.', 'Smith, Dr. John Ph. D.') stopped being
# refused. All of those are dead-parity today, so the gate stayed
# green while the tripwire was gone -- and a healing regression on
# them would then have classified under fix(comma-family) and exited
# 0, which is the outcome this entry's own `why` exists to prevent.
#
# The three exceptions, each diffing for a cause this ledger names
# elsewhere: a leading credential with no name before it (which had
# a fix(leading-credential) rule until #371 restored v1 and it went
# dormant -- see the note where it stood), one word before the comma
# (fix(comma-precomma-family)), and a suffix word between the name and
# the credential (fix(credential-pair-order), its own rule below).
# Refusing those was the entry over-reaching; refusing anything else
# is the entry doing its job.
#
# Latin-anchored: an unrestricted trailing anchor also caught
# '田中さん, Ph. D.', whose diff is a real fix(cjk-comma-compound)
# classification -- measured, it took the gate to unexplained: 1. The
# cut is at U+0250, the same threshold _is_latin_only uses in
# compare.py, so it covers Latin-1 and Latin Extended-A and -B rather
# than bare ASCII: the split-token healing is script-independent, and
# 'José Smith, Ph. D.' is as much the protected shape as 'Jose Smith,
# Ph. D.' is. An ASCII-only class protected one and not the other.
name_regex = "(?i)^(?!\\s*ph\\.)(?![^\\s,]+\\s*,\\s*ph\\.\\s*d\\.\\s*$)(?![\\u0000-\\u024f]*\\b(?:jr|sr|ii|iii|iv)\\.?\\s+ph\\.\\s*d\\.\\s*$)[\\u0000-\\u024f]*\\bph\\.\\s*d\\.\\s*$"
examples = ["John Ph. D.", "John Smith Ph. D.", "John Smith, Ph. D."]

[[never]]
why = "feat(#273) recognizes TYPOGRAPHIC nickname delimiters; the ASCII pairs were already recognized in 1.4, so a NICKNAME diff on them is a regression"
# Narrowed by ROLE, not by shape, and the reason is measured.
#
# By shape this covers a delimited run anywhere: leading
# ('"Rick" Edmonds'), medial ('John (Jack) Kennedy') or trailing
# ('Franklin, Benjamin (Ben)'), with a word character or a period as
# the inner flank so a middle initial counts ('Cherice J. (Johnson)
# Williams'). HOW MANY corpus names that is has a single home, and it
# is not this line: tests/v2/test_ledger_guards.py pins it as this
# entry's `captures` -- grep _EXCLUSION_EFFECT for the pattern above
# and read the number there, where a change fails CI. This comment
# carried a copy of it for several rounds (34, then 46, then 51) and
# the copy was stale more often than not, since the figure moves
# whenever the CORPORA move and not only when the entry does -- it
# never caught up to 55, which the pin was already holding when the
# copy still read 51, and that lag is the whole argument for deleting
# the copy rather than correcting it a fourth time.
#
# It was medial-only for three rounds, on the theory that the trailing
# position is where credentials live and that widening would silence
# 21 legitimate classifications. Both halves were wrong, and 1.4.0
# says so directly:
#
#   'Andrew Perkins (JD)'      1.4 nickname 'JD'   2.x nickname 'JD'
#   'Andrew Perkins (MBA)'     1.4 suffix   'MBA'  2.x suffix   'MBA'
#   'Franklin, Benjamin (Ben)' 1.4 nickname 'Ben'  2.x nickname 'Ben'
#
# 1.4 read a trailing '(JD)' as a NICKNAME, exactly as it read
# '(Ben)'. So the promise -- ASCII pairs were already recognized, a
# nickname diff on them is a regression -- covers the trailing
# credentials too, and refusing them is the promise being kept rather
# than over-reach. Where 1.4 did read the parens as a credential it
# put them in `suffix` ('MBA' is in the suffix vocabulary), so the
# diff lands outside this entry's `fields` and the exclusion never
# fires. The PARSER discriminates by vocabulary, which is the
# discrimination no delimiter regex can make.
#
# Cost of the widening, measured against the 1.4.0 wheel: of the 21
# names it adds, only 3 diff at all, and none of those diffs is a
# subset of {nickname, middle} -- '山田 太郎 (マイケル・ジャクソン)'
# moves {first,last,nickname}, '김, 민준씨 (Jimmy)' {first,suffix},
# '김민준씨 (Jimmy)' {first,last,suffix}. Zero classifications lost.
#
# A bare [("'] class is still wrong, for the reason the role
# narrowing cannot fix: it reaches names whose only match is an
# apostrophe that is part of the word ("Brian O'connor",
# "Harietta Keopuolani Nahi'ena'ena"), which is not a delimited run at
# all. Both figures moved twice in the #335 delta and are the class
# this file keeps getting wrong, so recount rather than adjust -- the
# body sits flush left because `python -c` compiles it as a module:
#
# uv run python -c "
# import glob, json, re
# def _n(x): return x if isinstance(x, str) else x['name']
# names = {_n(json.loads(l)) for f in glob.glob('tools/differential/corpus*.jsonl')
#          for l in open(f, encoding='utf-8') if l.strip()}
# hit = [n for n in names if re.search(r'[(\"\']', n)]
# only = [n for n in hit if not re.search(r'[(\"]', n)
#         and not re.search(r'(^|\\s)\'', n) and re.search(r'\\w\'', n)]
# print(len(hit), len(only))"
#
# By role: ASCII parens mark nicknames, maiden names, suffixes and
# credentials alike, and no regex tells them apart. The shape reaches
# 'Jenny (Johnson) Baker' and 'Lon (Jr.) Williams', whose parens are a
# maiden name and a suffix -- both areas under active development
# (#335, suffix in parens). `fields` names the two roles a nickname
# regression moves a token BETWEEN, so those names stay classifiable
# on the five it does not name. It does not leave them wholly alone:
# 'Lon (Jr.) Williams' parses its suffix into `middle` today, so a
# middle-only diff on it is silenced. That is the price of protecting
# the reading at all, since a nickname regression is exactly a
# middle/nickname move.
#
# feat(#273)'s own rule needs no shape narrowing of this kind -- a
# typographic delimiter is not a credential marker -- which is why its
# regex is a bare character class. It does carry `fields`, for the
# separate reason recorded there.
name_regex = "(^|[\\w.]\\s+)[(\"'][^)\"']+[)\"'](\\s+\\w|\\s*$)"
fields = ["nickname", "middle"]
examples = ["John \"Jack\" Kennedy", "John (Jack) Kennedy",
            "\"Rick\" Edmonds", "Franklin, Benjamin (Ben)"]

[[change]]
issue = "fix(#418) the connective carve-out counts the name the maiden clause leaves behind"
# 'Juan y Garcia née Jones': rules.md#P3's three-word carve-out
# counted the marker and the maiden name, so 'y' joined and the
# family was empty once the clause left. fix(#274) above cannot
# classify this one: it moves `given` as well, since the joined
# 'Juan y Garcia' comes apart. `maiden` is in the fields because 1.4
# has no maiden field at all, the same reason every marker name is a
# diff at this baseline. Checked against this baseline's own run; the
# expected_since_2.1.0.toml copy carries the fuller account.
name_regex = "(?i)^\\S+\\s+[ye]\\s+\\S+\\s+n[eé]e\\s+\\S+$"
fields = ["given", "middle", "family", "maiden"]

[[change]]
issue = "fix(#432) a dotted numeral behind a name is a middle initial, not the generation"
# 'Smith, John V.': v1 read suffix 'V.'. Behind a NAME word the period
# is decisive -- it marks an abbreviation, and an abbreviation is name
# material -- so the numeral is the middle initial it looks like, as
# 'Smith, John B.' always was. The BARE form is the boundary and is
# v1 parity either way: 'Smith, John V' stays suffix 'V' (#144), and it
# is a corpus name, so the gate asserts that half rather than this
# entry's silence.
#
# The #430 half needs no entry at this baseline: 'Smith, PSM I' is
# already claimed by "fix(comma-family) lone post-comma piece routes to
# suffix/title, not first", whose fields cover the move. A second rule
# would be dormant, which the gate reports as EXPLAINED NOTHING.
name_regex = "(?i)^smith,\\s*john\\s+v\\.$"
fields = ["middle", "suffix"]

[[change]]
issue = "fix(#410) a title and one name word name the family, whatever annotation stands beside it"
# rules.md#H1 reads a title plus exactly one name word as the family
# ('Mr. Johnson' -> family 'Johnson'). The guard implementing it also
# declined whenever ANY token carried a suffix, nickname or maiden
# role, so the very same name with an annotation beside it kept the
# word in `given` and reported no family at all. None of the three is
# a name word, so the term went and these names move `given` ->
# `family`, reading as their un-annotated twins already did.
#
# Keyed on the names by literal rather than by shape. The shape is "a
# title, one name word, and an annotation" -- a parse tree, not a
# string -- and a fields-only rule standing in for it would classify
# every future given/family swap in this corpus.
#
# Its own rule because these have nothing to do with suffix routing:
# they were falling to the fields-only fix(suffix-routing) catch-all
# (deleted in #451), on a rule whose every other name moves a trailing
# token into `suffix`, while these move no suffix at all. Same surgery
# #372 did on the same catch-all, whose heading returned to 14 once
# this rule took them.
#
# THREE names here, where the 2.0.0 and 2.1.0 ledgers classify four:
# at this baseline 'Dr. Smith née Jones' also moves `middle` and
# `maiden`, because 1.4.0 has no maiden support and read the marker as
# a middle name. It gets the separate rule below rather than widening
# `fields` here, which would let these three move a maiden name
# unnoticed.
#
# Four classified across the two rules, out of FIVE names that change
# reading. The fifth is 'Freiherr von Richthofen V' -- a title, one
# name word and a suffix, so this same shape -- and the fix(#424) rule
# further down has always claimed it. #410 only narrows its diff, from
# {given, family, suffix} to {family, suffix}, and that rule declares
# all three, so the gate stayed green and never named it. It is not
# moved here; the classification was right and the count was not.
name_regex = "(?i)^(?:Senator \"Rick\" Edmonds|Xyz\\. \\(Bud\\) Smith|'Smitty' Dr\\. Jones)$"
fields = ["given", "family"]

[[change]]
issue = "fix(#410) the maiden flavor, where 1.4.0 read the marker as a middle name"
# 'Dr. Smith née Jones': the same H1 widening as the rule above, but
# against a baseline with no maiden support, so the diff is four
# fields rather than two. 1.4.0 had nowhere to put a birth surname --
# no default marker vocabulary routes to `maiden` -- so it read first
# 'Smith', middle 'née', last 'Jones'. 2.x extracts the clause
# (`middle` and `maiden`), and #410 is what moves 'Smith' from `given`
# to `family` on top of that.
#
# Separate from the rule above because `fields` is the union of two
# different changes here, and a single rule carrying all four would
# let the three names up there move a `middle` or a `maiden` without
# anything noticing. This is the one name in the corpus where the
# marker extraction and the H1 fix land together.
name_regex = "(?i)^Dr\\. Smith n[ée]e Jones$"
fields = ["given", "middle", "family", "maiden"]

[[change]]
issue = "fix(#434) a multi-word maiden marker takes the maiden name"
# 'Maria Kowalska z domu Nowak': maiden_markers gained PHRASE entries
# and the Polish "z domu" is the first one any shipped set holds, so
# rules.md#M2's take fires on a marker that spans two tokens. Every
# earlier version read the marker as name text -- middle 'Kowalska z
# domu', family 'Nowak' -- because neither z nor domu is a marker
# alone and nothing looked at the pair.
#
# `fields` is the three the diff moves and no more. The marker leaves
# the name, so `middle` empties and `family` moves back one word,
# which is why this cannot share a rule with the bracketed name below:
# there the clause changes role and the name words around it do not
# move at all. One rule over both would have to declare the union and
# would pre-excuse a middle/family regression on the bracketed
# spelling -- the #444 failure the fix(#335) rules above spell out.
#
# Keyed on the literal, like those rules and for their reason: the
# shape is "a marker phrase inside a name", a question about the
# parse, and a fields-only rule standing in for it would pre-excuse
# every future middle/family/maiden confusion in the corpus.
name_regex = "(?i)^Maria Kowalska z domu Nowak$"
fields = ["middle", "family", "maiden"]

[[change]]
issue = "fix(#434) a multi-word marker leads a bracketed clause to the maiden name"
# 'Maria Kowalska (z domu Nowak)': the same vocabulary change at the
# other site. rules.md#M3 reads a marker-led clause as the maiden name
# whatever pair encloses it, and #335 gave it that reach in 2.2 -- but
# the reach alone leaves this name a nickname, since M3 asks whether
# the content opens with a recognized marker and through 2.1 no
# vocabulary answered yes here. The phrase entry is what moves it, so
# it is #434's diff and not #335's, and it is deliberately NOT a
# seventh alternative in that rule's six literals.
#
# `fields` is the pair that moves. The clause changes role; the name
# words keep their readings, so a `given`, `middle` or `family`
# movement here is a regression and stays loud.
name_regex = "(?i)^Maria Kowalska \\(z domu Nowak\\)$"
fields = ["nickname", "maiden"]

[[change]]
issue = "fix(#335) a marker-led bracketed clause reads as the maiden name whatever pair encloses it"
# 'Jane Smith (née Jones)', 'Jane (née Jones) Smith', 'Jane Smith
# (née V)', 'Anna Müller (geb. Schmidt)', 'Ursula von der Leyen
# (geb. Albrecht)': rules.md#M3 reads a bracketed clause whose content
# opens with a marker word and carries a word after it as the maiden
# name. 1.4 extracted the same five clauses as NICKNAMES -- v1 knew
# the parenthesis pair and had no maiden reading to give an
# undeclared one -- so the diff is the role and only the role.
#
# `fields` is exactly the pair that moves. Five names, two fields,
# measured; the union with what these names move against 2.0.0 would
# be wider, and declaring a field a diff does not move is what let a
# real given/family movement hide behind fix(#424) until PR #444.
#
# The CJK name is NOT here, unlike in the two 2.x ledgers. Against
# 1.4 it diffs in {given, middle, family, maiden}: v1 read the
# fullwidth brackets as name text, so there is no nickname on either
# side to change hands, and fix(cjk-maiden-marker) above already
# describes exactly that diff. See the dormancy note on
# fix(cjk-fullwidth-paren-nickname), which is the rule that used to
# hold it.
name_regex = "(?i)^(?:Jane Smith \\(n[ée]e Jones\\)|Jane \\(n[ée]e Jones\\) Smith|Jane Smith \\(n[ée]e V\\)|Anna Müller \\(geb\\. Schmidt\\)|Ursula von der Leyen \\(geb\\. Albrecht\\))$"
fields = ["nickname", "maiden"]

[[change]]
issue = "fix(#335) a marker-led clause leaves the one name word its bare reading"
# 'Smith (née Jones)', which rules.md#N3 carries as an Accepted line.
# N3 reads a name that is only a nickname plus one name word as "that
# word is the family name", and a marker-led clause is not a nickname
# clause, so N3 no longer reaches this shape: the word keeps the
# reading the bare "Smith née Jones" gives it.
#
# Its own rule rather than a sixth alternative in the fix(#335) rule
# above, for the reason that rule states: one rule holding both would
# have to declare the union of two different diffs and would
# pre-excuse whatever else landed inside it.
#
# The revisit note this block carried was answered on 2026-08-27, and
# the answer is the opposite of what it feared. It expected #445 to
# widen this diff and be absorbed here; #445 SHRANK it. The bare
# reading the word keeps is now `family` (rules.md#M4), and 1.4.0
# read this name family 'Smith', nickname 'née Jones' -- so `given`
# and `family` agree with the baseline again and only the clause
# changes hands. The declaration is narrowed to the two fields that
# still move, which is what the note asked for: a `given` or `family`
# move on this name is UNEXPLAINED from here on rather than absorbed.
# Measured, not reasoned -- and the first pass got the 2.x half of
# that sentence wrong, saying those baselines read `given` when they
# read family 'Smith', nickname 'née Jones' like this one. Both are
# narrowed to two fields now (2026-08-27 review round). This name is
# the one shape in #445's class the gates do NOT report, which is
# why nothing but reading the ledger could catch it.
#
# What the narrowing buys was said here to differ by ledger, and it
# did not. The sentence claimed the fields-only fix(suffix-routing)
# rule that then stood below "still matches every name with {given,
# family, suffix} and would take it"; that stopped being true when the
# same #451 bundle narrowed the catch-all to {family, suffix}, since a
# {given, family} diff is not a subset of those two. Measured against the
# ledger as it stood then, this name's {given, family} diff was
# already UNEXPLAINED at THIS baseline, exactly as at 2.0.0 and
# 2.1.0. #451 has since deleted the catch-all outright, and the
# measurement is unchanged.
name_regex = "(?i)^Smith \\(n[ée]e Jones\\)$"
fields = ["nickname", "maiden"]

[[change]]
issue = "fix(#445) a maiden marker makes the lone name word the family"
# rules.md#M4 -- "a maiden name standing beside exactly one name word
# makes that word the family name". A maiden name is a FORMER family
# name, which only means something beside a current one, so the word
# left standing beside it is the surname the bearer uses now. Seven
# names, one field set: 'Smith née Jones'
# read first 'Smith', middle 'née', last 'Jones' on 1.4.0 and reads
# family 'Smith', maiden 'Jones' here.
#
# Three of the four fields are #274's marker consumption -- v1 had no
# maiden support, so the marker sat in the name as a middle word and
# the last word was the family -- and the fix(#274) rule above
# carried these names until #445 added `given` to their diffs and
# they left its declaration. Only `given` is new; the rule declares
# all four because a rule explains a name's whole diff.
#
# Anchored, and spelled out one name per alternative, for the reason
# M4 itself gives. The shape regex a reader would write first -- one
# word, then a marker -- also matches M4's two carve-outs
# ('abd née Jones', 'J. née Jones Smith V'), and a rule declaring
# `given` over those two would stand ready to explain the very
# given -> family move the carve-outs exist to prevent. They stay
# with fix(#274), whose fields do not include it.
#
# 'Smith née Jones' and 'Smith née Jones PhD' are corpus rows this
# change itself added, being M4's own example lines; the other five
# were already here, and were five of the eight the fix(#274) note
# above listed as the checklist to re-measure.
name_regex = "(?i)^(?:Janey n[ée]e Jones|Jane n[ée]e Jones J\\. V|Jane n[ée]e Jones Smith|Jane n[ée]e and Jones Smith|John n[ée]e Jones Smith V|Smith n[ée]e Jones|Smith n[ée]e Jones PhD)$"
fields = ["given", "middle", "family", "maiden"]

[[change]]
issue = "fix(N3) a nickname-led name with a trailing suffix keeps the suffix in `suffix`"
# "'Smitty' Jones Jr.": the diff against 1.4.0 moves exactly {family,
# suffix} -- `given` is 'Jones' at both baselines, and it is `given`
# BECAUSE N3 declines: N3's one-piece count does not set a trailing
# suffix aside, so the suffix disqualifies the rule and the positional
# read applies. Set the suffix aside and N3 does fire --
# "'Smitty' Jones" reads family 'Jones' (rules.md#N3's own example).
# Whether 1.4 itself read the trailing word as
# `family` is outside what this ledger's worker can check directly
# (tools/differential/README.md's warning against reading a v1
# release from a cached environment); the diff shape is consistent
# with that reading, and 2.x reads this name given 'Jones', family
# '', suffix 'Jr.'. decisions.md#N3.
#
# Its own rule because it is three tokens -- a quoted nickname, one
# bare name word, one suffix word -- and #451 retired the fields-only
# fix(suffix-routing) catch-all by giving its names narrower
# rules; this name was one of that catch-all's nine when that work
# started. The two-token suffix rules #451 owed are now the four
# below, and this shape -- three tokens, a leading nickname -- fits
# none of them, which is why it kept a rule of its own.
#
# Note what is NOT settled here: decisions.md#H1 records that N3 and
# H1 count a trailing suffix in opposite directions. H1 IGNORES one --
# rules.md#H1 makes the lone word the family "whatever suffix,
# nickname or maiden name stands beside it", so 'Dr. Smith Jr.' reads
# family 'Smith' (the declining term was there until #410 took it
# out, which is what that entry is recording). N3 counts one, and so
# declines: "N3 counts a suffix the other way (`'Smitty' Jones Jr.`
# reads given 'Jones', family '')" -- and H1 states plainly that
# "which of the two readings is right for a nickname-led name is not
# decided here". This rule classifies only the 1.4-to-2.x movement
# measured above; it does not endorse either reading.
name_regex = "(?i)^['\"‘“][^'\"’”]+['\"’”]\\s+\\S+\\s+(jr|sr|ii|iii|iv|v)\\.?$"
fields = ["family", "suffix"]

# The four rules below are what is left of the fields-only
# fix(suffix-routing) catch-all, which stood between fix(#380) and
# fix(#342) above until #451 deleted it. It was the only rule in any
# ledger with no name_regex, so it sorted after every other rule and
# took whatever nothing narrower named -- 25 names when #372 first cut
# it back, six by the time this task began. Those six are the six the
# four rules below explain, one behaviour family each. The numeral and
# jr rules reach more corpus names than they explain -- the surplus is
# claimed by rules above, or does not diff at all, and each of those
# two comments names its own. _CORPUS_CLAIMS holds the reaches; do not
# restate them here, because nothing recomputes a number in a comment.
#
# They sit at the END of the file on purpose. The catch-all sorted last
# because it had no name_regex; with regexes these join the regex tier,
# where _sorted_rules is STABLE and FILE ORDER decides ties. Placing
# them last reproduces the catch-all's position exactly: every rule
# above keeps every contest it already won. The numeral rule's regex
# reaches 'Carod i' and '田中さん II', and _CROSS_RULE_WINNERS pins
# both -- but only the first is a real contest: measured by moving the
# numeral rule to the front of the file, 'Carod i' changes hands and
# '田中さん II' does not, because its diff moves {family, given,
# suffix} and these four declare {family, suffix}, so the `given` move
# is outside them wherever they sit. File order decides one, the
# subset test the other, and the roster does not care which.

[[change]]
issue = "fix(suffix-routing) a two-token name ending in a roman numeral keeps it in `suffix`"
# 'John V' and 'Mohamad X': v1 routed a lone trailing suffix to
# family/first (no comma is present in either), and 2.x reads the
# trailing numeral as the suffix. Whether 1.4 itself read that token as
# `family` is outside what this ledger's worker can check directly
# (tools/differential/README.md's warning against reading a v1 release
# from a cached environment); the diff this rule explains at this
# baseline moves exactly {family, suffix}, which is consistent with
# that reading and is what the fields below claim.
#
# The numeral does not reach `suffix` through a wordlist. It reaches it
# through _vocab.is_trailing_numeral_suffix -- "assign's roman-numeral
# fork, shared with group's bound-given reserve (#401): a FINAL
# single-token piece that is a roman numeral reads as the suffix when
# the piece before it does not look like part of an initial run". That
# is a PATTERN test plus a layout test, and no vocabulary lookup at
# all: 'x' is in none of SUFFIX_WORDS, SUFFIX_ACRONYMS or their
# ambiguous subsets, and 'Mohamad X' moves anyway. Which is why this
# alternation is declared in _NOT_A_VOCABULARY_COPY rather than in
# _LATIN_ALTERNATION_SOURCES -- there is no vocabulary here to drift
# from.
#
# The alternation is _ROMAN's own body, r"^(X|IX|IV|V?I{0,3})$" in
# nameparser/_pipeline/_vocab.py, with the EMPTY alternative removed:
# I{0,3} becomes I{1,3}, and the bare V that change would lose is
# spelled out beside it. Measured over every string of length 0 to 4
# drawn from IVXivx -- length 0 included on purpose, since the empty
# string is the whole difference -- the two accept exactly the same
# strings but that one, which _ROMAN takes and this does not. Dropping
# it is a latent widening removed: with the `^\S+\s+` prefix the empty
# alternative would match a name ending in whitespace, which no corpus
# name is today. Dropping it is deliberate: behind "^\S+\s+" and before "$" an
# empty alternative would match a name ending in whitespace. No corpus
# name does, so this is a latent widening removed rather than a bug
# fixed -- and it is the reason the two patterns are NOT byte-identical
# copies of one another, which a reader comparing them should know
# before "fixing" the difference.
#
# 'v' is in SUFFIX_WORDS as well, and the jr rule below deliberately
# does not spell it: the numeral fork is what actually moves it, and
# two rules claiming one token would leave file order to decide which
# explains it.
#
# The regex also reaches corpus names this rule does not explain, and
# the list is the count:
# 'Carod i' is fix(#397)'s NOT-WANTED rule above -- a real contest,
# same fields and both regexes matching, decided by nothing but file
# order -- and '田中さん II' is fix(cjk-glued-honorific-peel)'s, where
# the diff moves {family, given, suffix} and this rule's `fields`
# cannot admit the `given` move whatever the order.
# _CROSS_RULE_WINNERS pins both. That reach is
# real, so neither is a _MUST_NOT_MATCH probe here: that roster tests
# the regex, not classify().
name_regex = "(?i)^\\S+\\s+(X|IX|IV|V?I{1,3}|V)$"
fields = ["family", "suffix"]

[[change]]
issue = "fix(suffix-routing) a two-token name ending in the suffix word jr keeps it in `suffix`"
# 'Smith Jr.': v1 routed a lone trailing suffix to family/first (no
# comma present) and 2.x keeps a recognized suffix WORD in `suffix`.
# Whether 1.4 itself read that token as `family` is outside what this
# ledger's worker can check directly (tools/differential/README.md's
# warning against reading a v1 release from a cached environment); the
# diff this rule explains at this baseline moves exactly {family,
# suffix}, which is consistent with that reading and is what the fields
# below claim.
#
# 'jr' is an entry in SUFFIX_WORDS (nameparser/config/suffixes.py), so
# unlike the numeral above this one really is a vocabulary claim. It is
# written as a single LITERAL rather than as a one-member alternation,
# which is what keeps it off _LATIN_ALTERNATION_SOURCES: that roster is
# discovered from alternation syntax, and a rule with no alternation
# owes it nothing. A second suffix word needing this shape should
# become an alternation and be enrolled against SUFFIX_WORDS then, not
# be smuggled in as another literal.
#
# The regex also reaches corpus names this rule does not explain, and
# the list is the count. Three of them diff and belong to two other
# rules: 'Kim, Jr.' and 'Smith, Jr.' are fix(#296)'s lone post-comma
# credential and '김민준씨 Jr.' is fix(cjk-glued-honorific-peel)'s.
# What keeps them there is `fields`, not file order: measured, they
# diff {family, given, suffix, title} and
# {family, given, suffix}, and neither is a subset of the two roles
# below, so this rule is INELIGIBLE for all three wherever it sits.
# Order is the second line of defence, not the first -- a widening of
# `fields` alone would still lose to the rules above, and it would
# take a widening AND a move to hand any of them over.
# _CROSS_RULE_WINNERS pins all three against that pair of edits.
# 'Doe,, Jr.' is reached too and does not diff against this baseline
# at all, so it has no winner to lose and no row. That reach is real
# either way, so none of the reached names is a _MUST_NOT_MATCH probe
# here: that roster tests the regex, not classify().
name_regex = "(?i)^\\S+\\s+jr\\.?$"
fields = ["family", "suffix"]

[[change]]
issue = "fix(suffix-routing) a two-token name ending in a credential acronym keeps it in `suffix`"
# 'Donald mc' and 'QC MP': v1 read the trailing token as a name part
# and 2.x reads it as the postnominal it is -- 'QC MP' is two
# credentials and no name at all. Whether 1.4 itself read that token as
# `family` is outside what this ledger's worker can check directly
# (tools/differential/README.md's warning against reading a v1 release
# from a cached environment); the diff this rule explains at this
# baseline moves exactly {family, suffix}, which is consistent with
# that reading and is what the fields below claim.
#
# Both members are entries in SUFFIX_ACRONYMS, which is a DIFFERENT
# vocabulary from the jr rule's SUFFIX_WORDS above, and that is why
# these are two rules rather than one. _LatinCopy carries exactly one
# `vocabulary`, and
# test_latin_alternations_mean_something_the_vocabulary_ships asserts
# exactly one roster key per alternation, so an alternation spanning
# both sources could not be pinned against either. The split is forced
# by the guard, not chosen for taste.
#
# 'mc' deserves its own paragraph, because it is in SUFFIX_ACRONYMS and
# in PARTICLES both -- the collision decisions.md#vocabulary-collisions
# C-ii settled for 'vd' ("the Dutch van der reading, as the more
# common"), and which its own C-ii note records that 'do' and 'mc'
# inherit "without being weighed". That decision reaches a written name
# only through P6's attachment, which is scoped to the comma form --
# decisions.md#P6: "the COMMA form only, deliberately. [...] Without
# the comma the written shape is not settled [...] Those keep their
# positional reading and are not tracked as deviations." 'Donald mc'
# has no comma, so P6 never reaches it.
#
# What stands instead is rules.md#S2: "an unambiguous suffix is
# consumed even when that leaves no family name at all". That is the
# authority here, and NOT P6's scope note, which does not support it:
# P6 promises the comma-less shapes keep their POSITIONAL reading, and
# for the words that are both particle and suffix vocabulary it does
# not hold. Measured, 'Jong de' and 'Smith do' keep theirs (family
# 'de', family 'do') while 'Donald mc' and 'Smith vd' lose the family
# entirely to `suffix`. decisions.md#P6's own arc entry recorded that
# as a rules.md defect rather than a ledger one, and #454 fixed it on
# 2026-09-07: P6's Accepted clause now names vd and mc as the two words
# the positional reading does not hold for, which is what this rule has
# been classifying all along. This rule is unchanged by that repair and
# still rests on S2's statement.
#
# The two neighbouring shapes both already have rules above, and the
# contrast is the point: 'Mc Donald' has the particle LEADING and folds
# into the family (fix(#360), #360), and 'Berg, Jan vd' has it trailing
# WITH a comma, so P6 attaches it to the family (fix(#380), #380).
# Trailing and comma-less is the third corner, and it is this one.
name_regex = "(?i)^\\S+\\s+(mc|mp)$"
fields = ["family", "suffix"]

[[change]]
issue = "fix(suffix-routing) the dotted M.A. spelling reads as a credential (ma-do)"
# 'Jack M.A.': v1 read the trailing token as a name part and 2.x reads
# it as a credential. Whether 1.4 itself read that token as `family` is
# outside what this ledger's worker can check directly
# (tools/differential/README.md's warning against reading a v1 release
# from a cached environment); the diff this rule explains at this
# baseline moves exactly {family, suffix}, which is consistent with
# that reading and is what the fields below claim.
#
# This is a DECIDED reading, unlike the fix(#342) and fix(#397) rules
# above, which classify a diff because its cause is known and not
# because the reading is wanted. decisions.md#ma-do decides it: "ma and
# do joined the ambiguous acronym set because both are common surnames;
# the two-word 'Jack Ma' is kept intact by S2's words-to-spare guard,
# while the periods gate governs the dotted spellings ('M.A.' counts
# unambiguously)". The bare and dotted spellings of one name therefore
# read differently ON PURPOSE, which is why both spellings of the bare
# one are _MUST_NOT_MATCH probes here.
#
# 2026-09-18 (#289): the quoted sentence holds for the spelling it
# names and not for its all-caps twin. 'Jack Ma' is still kept intact
# by the words-to-spare guard; 'Jack MA' is now read as a credential
# by the written case contrast, with nothing to spare -- the guard
# never reaches it, and the periods gate is not what decides it. Only
# 'Jack Ma' is still a probe here; 'Jack MA' moved to the fix(#289)
# rule's own roster at the bottom of this file, where the roster
# comment says why. decisions.md#ma-do carries the amendment.
#
# Literal-anchored, and it could not be anything else. Measured: the
# member `m\.?a\.?` matches the fragment 'M.A.' in the corpus, and
# _normalize leaves that as 'm.a', which is not a SUFFIX_ACRONYMS entry
# -- so test_latin_alternations_mean_something_the_vocabulary_ships
# rejects it as an alternation member -- its helper
# _reaches_non_vocabulary puts the rule as "every fragment a member
# matches must BE an entry". The ambiguous-surname-acronym rule above
# records the same finding and answers it the same way: keep the
# periods out of the members. There is no alternation here at all, so
# nothing is owed to _LATIN_ALTERNATION_SOURCES.
#
# Anchored on 'jack' as well as on the spelling: 'John Smith M.A.' is
# also a corpus name (it arrived with corpus_rules.jsonl, #414), it is
# three tokens rather than two, and it does not diff against this
# baseline at all -- so a rule keyed on the dotted spelling alone would
# stand ready to explain a future regression on it. It is a
# _MUST_NOT_MATCH probe for that reason.
name_regex = "(?i)^jack\\s+m\\.a\\.$"
fields = ["family", "suffix"]

# ---------------------------------------------------------------------
# The `_initials` rules (#484). `_initials` is the differential's
# derived-view pseudo-field: it enters a name's diff ONLY when the
# seven roles and `_ambiguities` agree on every compared surface, so
# every rule below declares it alone (validate_rules refuses it
# beside a role). None of these classifies a role move; each
# classifies a change in what HumanName.initials() -- and from 2.0
# on parse().initials() -- renders for a parse whose fields did not
# move.
#
# The order the file has them in: the four literal name LISTS first
# (fix(#385/#402), fix(#360), feat(#269), fix(#528) -- the last added
# 2026-09-13), then the three VOCABULARY rules -- connective,
# bound-given, particle chain -- then the Ph. D. merge.
# Only the bound-given/particle-chain pair is ordered by narrowness,
# and by measured reach rather than by reading: 41 corpus names
# against 107 (measured 2026-09-02 at this baseline, and recorded in
# _CORPUS_CLAIMS). The connective rule's position ahead of both is NOT
# a specificity claim -- its reach is 96, wider than the bound-given
# rule it precedes -- it is just where it was written.
#
# Every rule below carries orders = ["DEFAULT"]. Each describes a
# DEFAULT-order render, and an order-bearing entry never consults the
# facade at all -- main() passes empty dicts for it -- so an
# `_initials` diff under a declared order could only come from the
# CORE, and must not be absorbed by a rule whose prose says "facade".
#
# #383/#479 HAD no rule in this block, and #528 gave it one. Recorded
# as a pair because the absence was itself a measured finding and the
# reason it stopped holding is the whole of #528. The change moved
# what `parse(...).initials()` renders for 'john e smith', 'john e
# jones', 'jones, john e' and 'JUAN Y GARCIA' -- and on 2026-09-13
# `HumanName.initials()` re-derived the connective decision from
# vocabulary and initial shape on the raw text instead of reading the
# parse's tags, so the FACADE's view did not move at all and the
# facade is the only surface compared below 2.0. Measured that day:
# not one of the four diffed here. #528 closed the split; the facade
# reads the tags now, the same four names move here, and
# `fix(#528) the facade's initials follow the parse's connective tags`
# below classifies them.
#
# THE FOUR ARE NOT THE CHANGE'S WHOLE POPULATION, and this is the
# one place in this file that says which names it leaves out.
# Measured 2026-09-13 over the corpus glob, driving the facade before
# and after #528: SIX one-case names' `HumanName.initials()` move for
# the tag reason, and the two that are missing above
# ('jose e maria santos', 'JUAN GARCIA Y LOPEZ') move their ROLES
# against this baseline as well, so `_initials` never enters their
# diff (compare.py's roles-identical guard) and the role rule at the
# end of this file explains what happened to them. Scoped to that
# reason deliberately: other corpus names' facade initials move
# against 1.4.0 for other reasons and are no part of the six --
# 'e and e' ('e a e.' -> 'e. a. e.') and 'juan garcia y lopez'
# ('j. g l.' -> 'j. g. l.'), both measured from the wheel the same
# day, move on the 2.0.0 per-word GROUPING the `fix(initials-per-word)`
# rules below describe. decisions.md#P3 records the split and
# decisions.md#R3 its closing.
#
# THE #528 RULE SITS AHEAD OF THE VOCABULARY RULES, with the literal
# name lists, and the position is load-bearing rather than tidy: the
# connective rule below carries `fields = ["_initials"]` too, its
# regex reaches 'john e smith' and 'john e jones' (measured
# 2026-09-13), and equal `fields` puts the pair outside
# `precedes_narrower` -- which leaves file order deciding, with
# _CROSS_RULE_WINNERS in tests/v2/test_ledger_guards.py pinning the
# answer. Written first, the narrower rule wins, which is this file's
# convention.

[[change]]
issue = "fix(#385/#402) an all-particle name part initials its words (R2)"
# 'Anh Do', 'Juan van der', 'Nguyen, Van Le': a name part whose every
# word is particle vocabulary is a part where none of them is doing a
# particle's work, so its words initial as ordinary name words --
# rules.md#R2/#R3, shipped in 2.2.0 (release_log "Fix a family name
# made only of particle words reporting no base"), decisions.md#R2.
# 1.4.0 contributed nothing for such a part ('Anh Do' -> 'A.'; the
# tree gives 'A. D.'). The fields did not move, only the view, which
# is why no rule could classify this until #484 gave the gate an
# initials column. Reach exactly the 28 names that move (25 spellings,
# three of them case variants), listed literally rather than shaped
# -- 'anh van mc' joined on 2026-09-18 with the case row that
# admitted it to the corpus, the unambiguous-vocabulary twin of the
# 'anh van do' already here:
# the shape is "a part of nothing but particles", which no regex over
# the raw string can state, and the fix(#445) rule above set the
# precedent for a name list in THIS ledger (fix(#410) and fix(#335)
# are two more). 'de los Santos' is NOT here: its
# initials moved for a different reason (the rule below).
name_regex = "(?i)^(?:anh do|smith van der|yin le|yin a le|vai la|jong van der|jong, van der|juan van der|mesnil garcia de|mesnil garcia van|mesnil de|sander van|van ma van|anh van do|anh van mc|beethoven ludwig van|berg jan de jr\\.|john van mc|jong anke de|juan de|ménil christophe de|ménil de|nguyen thi van|nguyen, van le|van berg jan de)$"
fields = ["_initials"]
orders = ["DEFAULT"]

[[change]]
issue = "fix(#360) los joined the particles, so it no longer initials"
# 'de los Santos': #360 (2.2) added the Spanish/Portuguese articles to
# PARTICLES. The family was 'de los Santos' before and after; what
# changed is that 'los' is now a particle and contributes no initial
# ('l. S.' -> 'S.'). One name, literal.
name_regex = "(?i)^de los santos$"
fields = ["_initials"]
orders = ["DEFAULT"]

# `feat(#269) a recognized non-Latin connective contributes no
# initial` STOOD HERE until 2026-09-20 and is DELETED, not declared
# dormant. It covered '^محمد و علي$' on `fields = ["_initials"]`,
# saying that `و` was recognized as a connective in 2.0 and so stopped
# contributing a letter: 'م. و. ع.' became 'م. ع.'. #461 asks the
# question of the PART instead, and `و` is the whole middle part with
# no name word beside it to join, so it initials again -- the tree
# gives 'م. و. ع.' from both surfaces, which is 1.4.0's own answer,
# measured from the wheel. The name stops diffing at this baseline
# and the rule reported EXPLAINED NOTHING. Its REASON is wrong now,
# not merely unreached, so a `dormant = "..."` declaration would
# assert something false; the ledger's own convention
# (tools/differential/README.md, the dormancy tiers) is deletion.
# It still diffs at the four 2.x baselines, where 2.0 through 2.3 all
# dropped the letter, and the fix(#461) readmission rule in each of
# those ledgers carries it. decisions.md#R3.

[[change]]
issue = "fix(#528) the facade's initials follow the parse's connective tags"
# 'john e smith', 'john e jones', 'jones, john e' and 'JUAN Y GARCIA'.
# `HumanName.initials()` decided "is this word the connective" from
# the lexicon plus v1's initial SHAPE on the part's raw text, where
# the core's initials() reads the tag the parse recorded. #383/#479
# gave rules.md#P3 a fork the shape cannot see -- in a name written
# wholly in one case a marked 'e' is an initial and an unmarked 'y'
# joins -- so from 2.4's #527 until #528 the two views of one parse
# disagreed about the same letter. They agree now, and the facade's
# answer is the core's. Name by name, with 1.4.0's values measured
# from the wheel on 2026-09-13: 'john e smith' goes 'j. s.' ->
# 'j. e. s.'; 'john e jones' and 'jones, john e' both go 'j. j.' ->
# 'j. e. j.', the two e-names whose family initial is a `j` and not
# an `s`; and 'JUAN Y GARCIA' goes 'J. Y. G.' -> 'J. G.', the
# capital one losing a letter where the other three gain one. No
# role moves on any of the four -- P3's three-word carve-out is untouched -- which
# is exactly why the derived view is the whole diff here.
#
# LITERAL, four names; which two of the change's movers they leave
# out, and why, is the block header above.
# A regex for the class -- "a one-case name whose single-letter
# connective the parse read against 1.4.0's reading" -- is not
# writable over the raw string at all, the reading being the parse's.
# _MUST_NOT_MATCH in tests/v2/test_ledger_guards.py carries the
# probes: the mixed-case spellings, where the writing decides the
# letter and nothing moved on either surface; 'maria y lopez', whose
# lowercase 'y' was the connective before and after; and
# 'Ph. D., John', the one corpus name whose two initials views still
# disagree -- the facade merges the credential into one list element
# and renders 'P D' with no inner delimiter, which is
# fix(initials-per-word) the Ph. D. merge below and not this.
#
# Two of the four -- 'john e smith' and 'john e jones' -- were
# EXPLAINED BY THE CONNECTIVE RULE BELOW before this rule existed
# (measured 2026-09-13 at this baseline: both sat in its classified
# list). Why this rule takes them instead: the block header above.
# _CROSS_RULE_WINNERS pins it and _RECORDED_DIFFS carries the shapes.
#
# 2026-09-20, #461: 'JUAN Y GARCIA' LEAVES the alternation, and the
# name is the one of the four this rule can no longer say anything
# about. Its 'Y' holds the middle part alone, so under #461 it
# initials again on both surfaces: the tree gives 'J. Y. G.' from
# HumanName.initials() and 'J. Y. G.' from parse(...).initials(),
# which is word for word what the 1.4.0 wheel gives, so the name has
# no diff left at this baseline to explain (measured 2026-09-20 from
# the wheel and from the tree). Dropping it from the regex rather
# than leaving it there is the narrowing this file asks for -- a
# member reaching a name that cannot diff is a standing claim on
# whatever that name diffs NEXT. The other three still move for this
# rule's own reason, the facade reading the parse's tags, and are
# untouched. The name keeps a rule at 2.0.0/2.1.0/2.2.0, where
# fix(#462) explains it and its surface flipped; at 2.3.0 the rule
# written for it is deleted for this reason. decisions.md#R3.
name_regex = "^(?:john e smith|john e jones|jones, john e)$"
fields = ["_initials"]
orders = ["DEFAULT"]

# ---------------------------------------------------------------
# #461: A CONNECTIVE CONTRIBUTES NOTHING WHERE IT IS JOINING, AND
# INITIALS LIKE ANY OTHER NAME WORD WHERE ITS PART HOLDS NOTHING
# ELSE FOR IT TO JOIN (rules.md#R3, decisions.md#R3).
#
# ONE rule at this baseline and two at every 2.x one, and the
# asymmetry is measured rather than tidy. The half that LOSES a
# letter -- a connective with name words beside it -- was already
# diffing here before this change, on the 2.0.0 per-word GROUPING
# the four fix(initials-per-word) rules below describe, so its names
# stay on those rules and the first of them carries a dated
# paragraph saying which half of its diff is now which. The half
# that GAINS one had no 1.4.0 diff at all: every name below agreed
# with the wheel before this bundle and diverges from it now, which
# is a parity break this file has to state in its own words rather
# than let an older rule absorb.
# ---------------------------------------------------------------

[[change]]
issue = "fix(#461) a connective holding its part alone contributes an initial"
# Fifteen names, each one a part whose only word is the connective,
# so there is nothing there for it to join and it initials as any
# other name word does -- which is what `family_base` and
# `given_base` have said about the same token since 2.2
# (rules.md#R2/#R3). 1.4.0 dropped the letter and so did every
# release since; the tree keeps it. Measured from the 1.4.0 wheel
# and from the tree on 2026-09-20, name by name: 'Juan de y' 'J.' ->
# 'J. y.'; 'johnny y' 'j.' -> 'j. y.'; 'Garcia y Lopez' 'G. L.' ->
# 'G. y. L.'; 'Juan y Garcia' 'J. G.' -> 'J. y. G.' and 'juan y
# garcia' the lowercase twin; 'John y Jane' 'J. J.' -> 'J. y. J.';
# 'Carod y de Rovira i' 'C. R.' -> 'C. y. R.'; 'John e Smith' 'J. S.'
# -> 'J. e. S.', with 'John e Smith III', 'John e Smith, III' and
# 'Smith, John e, III, Jr' giving the same pair; 'john e jones, III'
# 'j. j.' -> 'j. e. j.'; 'Jose e Maria' 'J. M.' -> 'J. e. M.';
# 'Lt.Gov. juan e garcia' 'j. g.' -> 'j. e. g.'; and 'Fritz Freiherr
# und von Bar' 'F.' -> 'F. u.', the German spelling of the same
# shape.
#
# NOT THE PER-WORD GROUPING BELOW, and that is the reason this rule
# exists at this baseline rather than the names being left to it.
# 1.4.0 rendered every one of these with the same granularity the
# tree does -- 'J. G.', not 'J G.' -- so nothing about the grouping
# moved; what moved is the LETTER COUNT. Each of the eleven whose
# spelling carries a lowercase ' y ' or ' e ' is reached by that
# rule's alternation all the same, and would be absorbed by it
# silently, which is what _RECORDED_DIFFS and _CROSS_RULE_WINNERS
# adjudicate: equal `fields`, so neither rule is the narrower and
# file order is the whole decision, and this rule is written first.
#
# `Fritz Freiherr und von Bar`, 'johnny y' and 'Smith, John e, III,
# Jr' reach no such contest -- the alternation below carries no
# 'und', and it wants whitespace AFTER the letter, which a letter at
# end of string and a letter before a comma never offer -- so the
# three have no pin.
#
# Literal-anchored to the fifteen. The shape is "a part holding one
# connective and nothing else", which no regex over the raw string
# can state -- the reading is the parse's -- and the nearest
# writable shape, "a name carrying a lone cased letter", reaches
# every bare-initial name in the corpora. _MUST_NOT_MATCH carries
# the wall: 'Jon Dough and' (base 'Dough and', a connective with a
# name word beside it, keeping 'J. D.'), 'Juan Velasquez y Garcia'
# (the joined run, keeping 'J. V. G.') and 'Juan Garcia Lopez y'.
name_regex = "^(?:Carod y de Rovira i|Fritz Freiherr und von Bar|Garcia y Lopez|John e Smith|John e Smith III|John e Smith, III|John y Jane|Jose e Maria|Juan de y|Juan y Garcia|Lt\\.Gov\\. juan e garcia|Smith, John e, III, Jr|john e jones, III|johnny y|juan y garcia)$"
fields = ["_initials"]
orders = ["DEFAULT"]

[[change]]
issue = "fix(initials-per-word) a connective run initials each word (facade, since 2.0.0)"
# 'Juan y Eva Garcia', 'Dean of Chemistry Robert Johns', 'John & Jane':
# 1.4.0 built initials one group per *_list ELEMENT, and a run its
# parse joined into one element ('Velasquez y Garcia') gave one
# initial per word joined by the separator with NO delimiter --
# 'V G.'. The 2.0 facade initials each WORD of an element, 'V. G.'.
# The parse is identical; this is the facade's rendering, changed in
# 2.0.0 and recorded first in 2.3.0's release log (decisions.md,
# "the initials view"). Strip periods and spaces and every name here
# agreed with 1.4.0 letter for letter until 2026-09-20.
#
# 2026-09-20, #461: THAT SENTENCE NO LONGER HOLDS FOR EVERY NAME, and
# the ones it stopped holding for have TWO causes in one diff. A
# connective with a name word beside it now contributes no initial at
# all, so the group it used to render per-word is simply gone: 'John
# and Jane Smith' goes 'J a J. S.' at the wheel to 'J. J. S.' in the
# tree, where the grouping half is 'J a J. S.' -> 'J. a. J. S.' and
# #461's half is the drop of the 'a'. Measured against the parent
# 46651750 on 2026-09-20, the names this rule explains where BOTH
# halves are now in the diff are: 'Assoc Dean of Chemistry Robert
# Johns', 'Dean of Chemistry', 'Dean of Chemistry Robert Johns',
# 'Duke of Edinburgh', 'Duke of Wellington', 'John & Jane', 'John and
# Jane Aznar y Lopez', 'John and Jane Smith', 'John of the Doe', 'Jose
# e Maria Santos', 'Juan & Garcia', 'Juan and Garcia', 'Juan y Eva
# Garcia', 'Mr. and Mrs. John and Jane Smith', 'Rob And Beth Edmunds',
# 'and Jon Dough', 'the and Jon Dough' and the two 'part1 of ...'
# strings. Every one of them ALREADY diffed here before this bundle,
# and on this rule's own sentence, which is why they stay on it rather
# than moving to the fix(#461) rule above -- that rule is for the
# names whose 1.4.0 diff this change CREATED. Both halves are stated
# rather than one absorbing the other, the treatment fix(#462) and
# fix(#383/#479) already get in these files. decisions.md#R3.
#
# CASE-SENSITIVE, the whole alternation, deliberately -- and it is the
# SINGLE LETTERS the case decides, because a capital `E`/`Y` is an
# initial and so is a dotted `E.`/`Y.`/`e.`/`y.`. The dotted spellings
# are kept out by the PERIOD rather than by the case: the alternation
# wants whitespace after the letter, so 'john e. smith' and
# 'scott e. werner' cannot match whatever their case. The bare capital
# is kept out by the case alone, and that is the half worth keeping.
# The #462 names ('Amy E Maid', 'Jose E Maria Santos') AGREE with
# 1.4.0 since the facade fix and diff only against the 2.x baselines,
# where fix(#462) claims them. What the two exclusions buy is
# unconditional and outlives that fix: any future facade initials
# change touching these shapes must report UNEXPLAINED here rather
# than be absorbed as per-word grouping.
# `and`/`And` because both spellings are corpus names and 'Rob And
# Beth Edmunds' carries no lowercase alternation word to be reached
# by. `of`/`the` have no capital variant because no name in this
# cluster needs one -- a corpus fact and not a shape claim: a capital
# `Of` occurs nowhere in the corpora, and the two cluster names
# carrying a capital `The` ('part1 of The part2 ...' and its `And`
# twin) are already reached through their own lowercase `of`/`the`.
name_regex = "(?:^|\\s)(?:y|e|&|and|And|of|the)(?=\\s)"
fields = ["_initials"]
orders = ["DEFAULT"]

[[change]]
issue = "fix(initials-per-word) a bound-given run initials each word (facade, since 2.0.0)"
# 'Abdul Salam Hassan, MD', 'Abu Bakar Salim', 'Berg, abdul van': the
# bound-given join makes one list element of the pair, and 1.4.0
# initialed the element as one group ('A S. H.'); the 2.0 facade
# initials each word ('A. S. H.'). Same change as the rule above, on
# the BOUND_GIVEN_NAMES words the corpora carry. Written before the
# particle rule below DEFENSIVELY, not to win a live contest: nothing
# is contested yet. Two corpus names carry both a bound word and a
# particle chain -- 'Sir abdul van der Berg', which does not diff at
# all, and 'van der Berg, abdul née Jones', whose diff is ROLES and so
# never reaches the pseudo-field -- and the one name this rule shares
# with the Ph. D. rule ('abdul Ph. D. Smith Berg') moves roles too.
# _CROSS_RULE_WINNERS' comment lists these three among the FIVE names
# that two per-word rules both reach, and says why none of them is
# pinned there (its rows under this rule are other names). So the
# position decides nothing today; it is the narrower reading --
# measured, 41 corpus names against the particle chain's 107 --
# which is this file's
# write-the-narrower-rule-first convention (the header above, and
# #382's open question about separating such a pair by a predicate
# instead), and it is what would decide a future contest.
name_regex = "(?i)(?:^|[\\s,])(?:abdul|abu)\\s"
fields = ["_initials"]
orders = ["DEFAULT"]

[[change]]
issue = "fix(initials-per-word) a particle chain inside a name part initials each word (facade, since 2.0.0)"
# 'John van der Berg Smith', 'pennie von bergen wessels', 'de la Cruz
# Juan Carlos': a particle chain that lands INSIDE a part -- a family
# of 'van der Berg Smith' or of 'von bergen wessels' -- is one
# list element, and 1.4.0 initialed it as one group ('J. B S.'); the
# 2.0 facade gives 'J. B. S.'. The shape is a chain-opening particle
# followed by at least two more words, so the particle cannot be the
# family's own tussenvoegsel standing before a single family word
# (those do not move: the particles contribute nothing either way).
# The chain lands in a MIDDLE name only where something later bounds
# the part: one of the eleven names this rule explains does, 'Jane van
# der Berg née Jr Jones', whose maiden marker ends the middle at 'Jr'.
#
# The chain's SECOND word is not spelled out. It was, as an optional
# `(?:\\s+(?:der|la))?` before the two-word tail, and that group was
# provably inert: X(?:A)?Y accepts XY either way, and requiring 'der'
# there only asks for a THIRD word after the particle, which is a
# subset of what the tail already demands. Measured, both spellings
# reach the same 107 corpus names with the same digest. It came out
# because it also put a second alternation in the rule, and
# _LATIN_ALTERNATION_SOURCES keys one vocabulary per rule -- so the
# roster could pin `van|von|de` or `der|la`, never both.
name_regex = "(?i)(?:^|\\s)(?:van|von|de)\\s+\\S+\\s+\\S+"
fields = ["_initials"]
orders = ["DEFAULT"]

[[change]]
issue = "fix(initials-per-word) the Ph. D. merge initials each word (facade, since 2.0.0)"
# 'Ph. D., John' and 'Sir Ph. D. Van Johnson': the merged credential
# is one list element ('Ph. D.'), and the two facades group it
# differently -- 1.4.0 'J. P. D.', the tree 'J. P D.'; and in the
# titled name the element 'Van Johnson' went from 'V J.' to 'V. J.'.
# Same per-word change, on the phd-merge shape (decisions.md#phd-merge).
# Literal, no alternation. 'Ph. D., Jr.' also matches, and is harmless
# in both directions: its initials do not move ('D.' at 1.4.0 and
# 'D.' here), and its diff is ROLES anyway -- fix(comma-precomma-family)
# claims it on `first`/`last` -- so `_initials` never enters it and
# this rule can neither explain nor absorb it.
name_regex = "(?i)\\bph\\. d\\."
fields = ["_initials"]
orders = ["DEFAULT"]

# ---------------------------------------------------------------
# THE 2.3 TITLE-RUN BUNDLE: #489 (a title run addresses by its last
# title), #316 (a trailing period-marked title word reads as a
# title), the leading peel's name-word floor, and the `esq` acronym
# drop that shipped beside them. Five rules, four of them one per
# ARGUMENT rather
# than one per name, plus a fifth that is #316's argument again on
# the one name a script-classified alternation cannot hold. Over
# twenty-four corpus names.
#
# LAST in the file, and that is narrow-first rather than a
# preference: every rule already here that REACHES one of the
# twenty-four declares `fields` that are a strict subset of the bundle
# rule claiming that name, and a wide rule sitting AHEAD of a
# narrower one it shares a corpus name with is an order-decided
# contest the run refuses (#382). Measured 2026-09-08, all four
# ledgers: at 1.4.0 fix(#296)'s trailing `dr` reaches 'John Smith
# Dr.' and 'John Smith Prof. Dr.', the two comma routings reach
# 'Smith, John Prof.', and the two-token `jr` rule reaches 'Dr Jr'
# (and reached 'Sir Jr' until that row left corpus_rules.jsonl on
# 2026-09-09); at 2.0.0 and 2.1.0 only fix(#296) reaches any of
# them; at 2.2.0 none does. Not one of those rules ADMITS the diff
# it reaches -- every shape is outside its field list, measured --
# so nothing below takes a name off a rule that was explaining it,
# and no [[change.precedes_narrower]] block is needed anywhere.
#
# `_initials` appears in none of the four field lists although the
# initials of several of the twenty-four do move. The derived view
# enters a diff only where every ROLE and every ambiguity kind
# agrees (compare.py's _RULE_FIELDS, main()'s roles-identical
# guard), and all twenty-four move roles -- so no run can produce a
# shape here carrying it, and validate_rules refuses it beside
# another field in any case.
# ---------------------------------------------------------------

[[change]]
issue = "fix(#489) a title run addresses by its last title"
# 'Her Majesty Queen Elizabeth' and 'Dr. Sir John': the
# given_name_titles lookup was keyed on the WHOLE run, and 'her
# majesty queen' is in no vocabulary and never could be, so the one
# name word behind the run stayed the family. Both sites that ask --
# rules.md#H1's retag and rules.md#P5's licence -- now test the whole
# run's key OR the last word's, and 'queen' and 'sir' are
# GIVEN_NAME_TITLES entries. The name word behind the run becomes the
# GIVEN name and the family empties, which is H1's Accepted outcome.
# Both roles move together and `fields` declares both. `title` is
# deliberately OUT: the run itself is unchanged, only what it
# addresses as, so a name whose TITLE moved arrives UNEXPLAINED, as
# it should.
#
# 'Reverend Mother Teresa', 'Mr Sir John', 'Xyz. Sir John' and 'Sir
# Sheikh abdul rahman' move the same way and are NOT members: none of
# them is in any corpus file, so a member for one would be a rule
# reaching nothing.
#
# An anchored alternation of the two NAMES rather than a shape. What
# selects them is a SHAPE -- a multi-word title run whose LAST word
# is a given-name title -- and a member copying GIVEN_NAME_TITLES
# would reach 'Sir John Smith' and 'Dr. Smith', which do not move.
# The members are a list of names and copy no wordlist, which is what
# _NOT_A_VOCABULARY_COPY in tests/v2/test_ledger_guards.py records;
# _CORPUS_CLAIMS pins the reach at 2 with its digest, and
# _MUST_NOT_MATCH carries three boundaries: a ONE-word run ('Sir John
# Smith'), and two runs whose last word is title vocabulary that is
# not given-name vocabulary ('His Excellency Lord Duncan', 'Her Royal
# Highness Princess Anne' -- the open vocabulary question, #519). One
# set, identical in all four ledgers.
name_regex = "^(?:Dr\\. Sir John|Her Majesty Queen Elizabeth)$"
fields = ["family", "given"]

[[change]]
issue = "change(suffix-acronym-collisions) esq leaves the acronym set"
# 'John Smith E.S.Q.': 'esq' left SUFFIX_ACRONYMS, where the 2019 bulk
# post-nominal import put it (af5bdab, #93) -- esquire is a
# contraction, not an initialism -- so the multi-dot spelling stops
# being credential vocabulary and falls to the positional read: given
# 'John', middle 'Smith', family 'E.S.Q.', where every release since
# 1.4.0 read family 'Smith', suffix 'E.S.Q.'.
#
# A BEHAVIOR CHANGE rather than a fix, which is what the `change` tag
# says: this is a deliberate parity break at all four baselines, and
# the entry that argues it is decisions.md#suffix-acronym-collisions
# -- there is no issue number to cite, and the release-log bullet
# carries none either. It is not NOT WANTED: that spelling is for a
# reading nobody wants, and this reading is the one the decision
# chose.
#
# 2026-09-18 (#516): this rule stopped explaining anything, and the
# reason is not a revert. The by-shape credential class reads a word
# of two or more period-separated chunks that no vocabulary claims by
# POSITION (rules.md#S3), so 'John Smith E.S.Q.' is a credential again
# with no wordlist entry behind it at all -- the reading this baseline
# has, recovered by a different route than the acronym entry gave it.
# The vocabulary decision the `change` tag records still stands and is
# still the history of that entry; what is gone is its diff AT THIS
# BASELINE, where `_ambiguities` is not a compared surface at all.
# Above 2.0 the name still diffs, on the `suffix-or-name` report the
# positional reading brings with it, and fix(#516) classifies that --
# each 2.x copy's own `dormant` string says so. Declared
# `dormant` rather than deleted, so the harness says so out loud if a
# future change takes the positional reading away again.
#
# Literal, no alternation, and exactly as wide as the diff: 'esq'
# keeps its SUFFIX_WORDS membership, so the acronym entry's only
# unique coverage was this one spelling and this one corpus name.
# _MUST_NOT_MATCH carries the three spellings that did NOT move --
# 'John Smith Esq' (the word list still reads it), 'Esq. Smith'
# (rules.md#H2's leading inference) and 'Smith, Esq.' (the lone
# post-comma credential).
dormant = "'John Smith E.S.Q.' no longer diffs at this baseline: #516's by-shape credential class reads the multi-dot spelling as a credential by position, with no wordlist entry, which is the reading this baseline already had. Kept because the vocabulary change it records is real history and the rule wakes if that reading is lost again"
name_regex = "^John Smith E\\.S\\.Q\\.$"
fields = ["family", "middle", "suffix"]

[[change]]
issue = "fix(#489) the title peel leaves a name word a suffix cannot be"
# 'Dr King Jr', 'Dr. King MD', 'Dr Jr' and 'Sir Jr': the leading title
# peel's only floor was "leave one piece", so it peeled 'Dr King'
# whole and left the post-nominal to be the name -- title 'Dr King',
# family 'Jr', no suffix at all. leading_titles now also refuses to
# leave a word that is nothing but suffix vocabulary standing as the
# name and gives the run's last word back (rules.md#H3,
# decisions.md#H3), so 'Dr King Jr' reads title 'Dr', family 'King',
# suffix 'Jr' -- what the comma spelling 'King, Dr Jr' always read.
#
# FOUR roles, and no single name moves all four. The two three-word
# names move `title`, `family` and `suffix`; 'Dr Jr' and 'Sir Jr'
# move `given` as well, or instead of `family`, the word given back
# standing alone with the credential peeled off it. At the 2.x
# baselines `_ambiguities` joins the list -- with the title given
# back there is no title left to make the reading H1's, so all four
# report title-or-name through rules.md#H4 -- and it is absent at
# 1.4.0, which has no ambiguity surface to compare (compare.py's
# _RULE_FIELDS).
#
# An anchored alternation of the four NAMES rather than a shape. What
# selects them is a SHAPE -- a title run with nothing but post-nominal
# pieces behind it, whose own last word is not one of those -- and a
# member copying TITLES or SUFFIX_WORDS would reach 'MD DDS', 'Jr.
# Ph. D.' and 'Marquess of Bath', every one of which the floor
# declines and every one of which is a _MUST_NOT_MATCH probe, with
# 'Dr Smith Jr' beside them for the ordinary titled name the floor
# never sees. The members are a list of names and copy no wordlist,
# which is what _NOT_A_VOCABULARY_COPY records. THREE of the four are
# corpus names, not four: 'Sir Jr' left corpus_rules.jsonl on
# 2026-09-09, when the rules.md example pinning it was dropped as a
# duplicate of 'Dr Jr' (decisions.md#H5), and it stays in the
# alternation because a name_regex names INPUTS rather than corpus
# rows. _CORPUS_CLAIMS pins the reach at 3 with its digest. One set,
# identical in all four ledgers; only the `fields` differ, as the
# paragraph above says.
name_regex = "^(?:Dr Jr|Dr King Jr|Dr\\. King MD|Sir Jr)$"
fields = ["family", "given", "suffix", "title"]

[[change]]
issue = "fix(#316) a trailing period-marked title word reads as a title"
# 'John Smith Prof.' and thirteen more: a trailing run of period-marked
# LISTED title words is peeled as a title, so the surname behind it
# stops being lost -- title 'Prof.', given 'John', family 'Smith',
# where every baseline read middle 'Smith', family 'Prof.'. A RUN,
# mirroring the leading peel: 'John Smith Prof. Dr.' gives title
# 'Prof. Dr.' and 'Dr. John Smith Prof.' gives 'Dr. Prof.' in input
# order. The family-comma segment takes the same walk, so 'Smith,
# John Prof.' agrees with the bare spelling at last. And the trailing
# title is TRANSPARENT to the post-nominal peel that follows it:
# 'John Smith Jr. Prof.' keeps suffix 'Jr.' rather than promoting the
# generational suffix to the family name, and 'John Prof. MA' reads
# family 'MA' by rules.md#S2's reserve.
#
# 2026-09-18 (#289): the last clause is retracted. S2's reserve is no
# longer what decides 'John Prof. MA': written capitals in a
# mixed-case name lean credential with nothing to spare, so the name
# reads title 'Prof.', family 'John', suffix 'MA' -- the transparency
# this rule is about is unchanged and now shows a DIFFERENT reading
# through it, which is the point of transparency. This rule keeps the
# name at every baseline where it already had it; the fix(#289) rule
# at the bottom of each file carries the names whose reading moved and
# that nothing else claims.
#
# Five roles, the union of what the sixteen move; no name moves all
# five (four is the most, 'John Smith Jr. Prof.'), and two move only
# two at every baseline -- 'Smith, John Prof.' {title, middle} and
# 'Smith Sir.' {title, family} -- with 'Mary Jane King.' moving three.
# A third joins them at 1.4.0, 2.0.0 and 2.1.0, 'John Smith Dr.'
# {title, suffix}, which moves {title, middle, family} at 2.2.0
# instead: 'dr' was suffix vocabulary until 2.2, so the role it
# vacates differs by baseline (measured 2026-09-09 against all four
# wheels). `_ambiguities` is not among the five, and it is not
# because no name reports one: 'John Prof. MA' reports
# `suffix-or-name`, which is S2's bare-acronym reserve and not this
# rule. None of the sixteen reports `title-or-name` -- the walk
# leaves a title standing, so H4's title half never fires -- and the
# derived view cannot enter a diff here in any case, every one of the
# sixteen moving roles (compare.py's _RULE_FIELDS).
#
# TWO of the sixteen end in ' Dr.' and are also reached by
# fix(#296)'s trailing-`dr` rule above -- 'John Smith Dr.', which
# that rule used to explain, and 'John Smith Prof. Dr.'. That rule
# declares {middle, family, suffix} and neither diff fits it now, so
# both fall through to here; its comment records the handover, and
# narrow-first placement is what keeps the pair out of contest. The
# BARE trailing spelling stays with fix(#296): 'Smith Dr' and the 'dr
# ... dr' names wear no abbreviation period and the walk never sees
# them (#316(b), left open).
#
# The last two members arrived with the 2026-09-09 review of the
# docs commit, which added two rules.md examples: 'Mary Jane King.',
# the H5 Accepted clause's collision example (title 'King.', given
# 'Mary', family 'Jane', where every baseline read family 'King.'
# behind middle 'Jane'), and 'Smith Sir.', which is an H1 example.
# 'Smith Sir.' is HERE and not on the fix(#489) run rule above
# because the DIFF decides: it moves {title, family}, the walk
# taking 'Sir.' out of the name, while its given/family reading is
# what every baseline already gave ('Smith' stays the given name on
# both sides). The #489 rule declares {family, given} and does not
# reach a title role at all, so it could not claim the diff even
# placed ahead of this one.
#
# An anchored alternation of the sixteen NAMES rather than a shape.
# What selects them is a SHAPE -- period-marked, listed, trailing --
# and a member copying TITLES would reach the BARE 'Mary Jane King'
# and 'John Smith Sir', which do not move; the period-marked
# 'Mary Jane King.' is a member precisely because it does, which is
# the line the period draws and the whole of what it draws. A member
# spelled as the shape (a trailing dotted word) would reach 'John
# Smith Xyz.', which is the boundary the leading slot's H2 inference
# is deliberately NOT given here. Those three and 'Smith, Prof.' --
# the comma shape whose segment holds no name word and which reads
# by a different gate -- are the _MUST_NOT_MATCH probes. The members
# are a list of names and copy no wordlist, which is what
# _NOT_A_VOCABULARY_COPY records; _CORPUS_CLAIMS pins the reach at
# 14 with its digest.
#
# 'Andrew Perkins (Mgr.)' is spelled with \\x28 and \\x29 rather than
# the \\( and \\) the paren-bearing rules above use. Escaped or not, a
# literal parenthesis inside an alternation body hides the WHOLE
# group from test_ledger_guards._alternations -- its member pattern
# excludes '(' and ')' -- and a sixteen-member alternation should not
# be invisible to the discovery pass that demands every alternation
# declare what it copies. The two spellings match the same string.
# One set, identical in all four ledgers.
#
# 2026-09-18 (#289/#516): a SEVENTEENTH member, 'JOHN PROF. MA'. It
# arrived in the rules corpus as rules.md#H5's one-case witness that
# the suffix reading is taken over what STANDS once the title chain
# has run, not over what stood -- the reading the mixed-case spelling
# stopped demonstrating when the caps lean started deciding it. The
# name is wholly one case, so no lean fires and nothing about it is
# this arc's: what moves is exactly this rule's trailing-title chain
# ({title, family, suffix}, inside the five roles already declared),
# and it stops diffing at 2.3.0 for the same reason its sixteen
# siblings do.
name_regex = "^(?:Andrew Perkins \\x28Mgr\\.\\x29|Dr\\. John Smith Prof\\.|Dr\\. Smith Sir\\.|JOHN PROF\\. MA|John Prof\\. MA|John Smith Dr\\.|John Smith Jr\\. Prof\\.|John Smith Mr\\.|John Smith Prof\\.|John Smith Prof\\. Dr\\.|John Smith Prof\\. Jr\\.|John Smith Rev\\.|Mary Jane King\\.|Sir John Prof\\.|Smith Prof\\.|Smith Sir\\.|Smith, John Prof\\.)$"
fields = ["family", "given", "middle", "suffix", "title"]

[[change]]
issue = "fix(#316) a trailing Latin title on a native-script name is a title"
# '毛 泽东 Dr.': the rule above's walk, on the one corpus name it
# reaches that is not Latin-only. The walk runs BEFORE the positional
# read, so the pieces the script test sees are all Han and the
# family-first order stands -- this is '毛 泽东' plus a title, and
# it reads title 'Dr.', given '泽东', family '毛'. A Latin title at
# the back of a wholly-Han name is the one piece that would make the
# piece set look mixed-script, which is what the ordering of the two
# buys.
#
# ITS OWN rule rather than a seventeenth alternative above, and not by
# preference: an UNDECLARED alternation holding a script-classified
# member is claimed by the honorific pin in
# tests/v2/test_ledger_guards.py, which requires such an
# alternation's members to BE the config's CJK honorific entries --
# and until #322/#323 taught that pin to ask whether the members FOLD
# into that vocabulary, that was every such alternation. So this
# stands alone, literal-anchored,
# reaching exactly one corpus name (_CORPUS_CLAIMS carries the 1)
# with _MUST_NOT_MATCH probes for the boundary -- the same shape the
# four #436/#437 CJK rules above take, and for the same reason.
#
# Classified 2026-09-09, in the review round that fixed which title
# run H1 addresses by; the reading itself is untouched by that fix.
# The name is RADAR tier (corpus_cjk_tolerated.jsonl, tolerated since
# the 2026-09-01 CJK demotion) and it had been printing UNCLASSIFIED
# at all four gates since the trailing walk landed. Radar never
# blocks, so nothing failed -- and this bundle's convention is that
# every gate line reads `radar unclassified: 0`, which is the whole
# reason the row is here rather than left to print.
#
# FOUR roles here, and NOT the same four at every baseline, which is
# why this is the one bundle rule whose `fields` differ per ledger.
# This baseline read first '毛', last '泽东', suffix 'Dr.' -- the
# Latin word taken as a post-nominal and the two Han words read
# given-first -- so `title`, `given`, `family` and `suffix` all move.
#
# Literal and anchored, so the reach cannot widen into the other
# forty-six tolerated CJK names (twenty-nine until this bundle's
# seventeen rows joined the file). _MUST_NOT_MATCH carries three of
# them as probes: '王先生, V.' (a Latin post-nominal behind a
# comma, which the trailing walk never sees), '田中さん, Dr.' (the
# comma spelling of this very shape, routed by the segment gate) and
# '田中さん II' (a spaced Latin post-nominal that is not title
# vocabulary).
name_regex = "^毛 泽东 Dr\\.$"
fields = ["family", "given", "suffix", "title"]

# #322/#323, LAST in the file. The parser knew ONE full stop --
# the ASCII period -- and knew it at ONE site, the lexicon's edge
# strip. It now reads four: the ASCII period, the fullwidth '．',
# the ideographic '。' and its halfwidth '｡'. A full stop glued
# AFTER a script-written word is punctuation and not part of the
# word -- invisible to the script reading and to the vocabulary,
# and left in the text on the word it arrived with -- because no
# East Asian script writes an initial or an abbreviation with a
# period. A leading stop folds away for the vocabulary lookup,
# which reads both edges; the classification fold that feeds the
# surname site reads the TRAILING edge only, so a word wearing a
# leading stop is given no script and never becomes a surname
# site: '.김민준' stays one whole word, given. The honorific peel
# is not gated by that fold -- the tail alone licenses it -- so a
# leading stop does not stop it: '.김민준씨' peels to '.김민준'
# and '씨' (rules.md's W Background, decisions.md#cjk-full-stops).
#
# The eleven names here are the ones whose diff carries a `title`
# or a `suffix` move -- nine CJK, the katakana 'マイケル.' (a #323
# mover added 2026-09-10 in the whole-branch review, its diff being
# title-or-given), and the bracketed '(김민준.) John Smith', added
# in the review round after that, whose diff carries the `title`
# the unwrapped clause used to take. SIX MORE of the bundle's
# seventeen movers are absent on purpose, and for one reason in two
# shapes. '김. 민준', '양 지훈.' and '양. 지훈' move within {given,
# middle, family} at this baseline -- {family, given}, as it
# happens -- which the native-script CJK rule above already
# declares. The three stop-bearing FAMILY_COMMA rows
# the same review round added are the other shape: '田中さん., V.' and '이, J.씨.'
# are claimed here by the broad 'fix(cjk-comma-compound)' and
# 'fix(cjk-comma-honorific-peel)' rules above, and '김민준씨., J.씨'
# produces no diff at this baseline at all. Adding
# any of the six would only take a name off a rule that describes
# it, or claim a diff that does not exist.
#
# LAST is narrow-first (#382), not taste. Two earlier rules reach
# these names by regex: 'fix(#271/#272/#298) native-script CJK'
# reaches all eleven (its script-range scope catches the katakana
# mover, and the bracketed row's CJK clause) and 'fix(cjk-glued-honorific-peel)' reaches the two
# glued spellings ('田中さん.', '김민준씨.'). This rule's five
# roles are a STRICT SUPERSET of the three each of those declares,
# so both are the narrower rule and both belong ahead of it;
# order_contests sees no pair at all, a contest needing the LATER
# rule's fields to nest inside the earlier one's.
#
# An anchored alternation of the NAMES rather than a shape, and the
# two criteria a shape could be written on both reach names this
# rule must not claim. "An edge full stop on a word carrying a
# classified character" reaches 22 corpus names, measured
# 2026-09-10: the bundle's seventeen movers and FIVE that do not
# move ('田中さん 様.', '田中さん, 様.', '김민준 씨.', '김민준 양.',
# '김민준, 씨.'). Measured with the TOKENIZER and not a whitespace
# split -- two of the movers wear their stop before a comma
# ('김민준씨.,', '田中さん.,'), which a whitespace split does not
# see -- plus the bracketed '(김민준.) John Smith' by hand, its stop
# sitting inside the clause until rules.md#S1 unwraps it; an 18
# recorded earlier the same day came from the split, over a corpus
# four names smaller. A character class of the four stops would be a hand
# copy of nameparser._lexicon.FULL_STOPS besides, and would reach
# the looser population of "an ASCII period anywhere in a CJK-
# bearing name" -- 20 distinct names on 21 corpus rows before this
# bundle ('Dr 김민준씨, Jr.' being the name on two of them), wider
# because it sweeps in periods sitting on LATIN tokens inside a CJK
# name ('毛 泽东 Dr.', '田中さん, V.'). None of the five or the
# twenty is moved BY THIS BUNDLE, so a shape spelling would
# reach names whose diffs belong to other rules (most of them
# do diff against the older baselines -- 19 of the twenty at
# 1.4.0) or to no rule at all; decisions.md#cjk-full-stops
# carries both counts and the recompute. The members copy no wordlist,
# which the honorific pin in tests/v2/test_ledger_guards.py DERIVES
# rather than taking on trust -- no member of this alternation folds
# into the CJK honorific vocabulary, bare or wearing a full stop;
# _CORPUS_CLAIMS pins the reach at 11 with its digest, and
# _MUST_NOT_MATCH pins the four readings the bundle left alone.
[[change]]
issue = "fix(#322/#323) a full stop on a CJK token is read as punctuation and stays on its token"
name_regex = "^(?:\\x28김민준\\.\\x29 John Smith|マイケル\\.|田中\\.|田中\\. 太郎|田中さん\\.|김민준 씨。|김민준 씨．|김민준 씨｡|김민준\\.|김민준\\. 지훈|김민준씨\\.)$"
fields = ["family", "given", "middle", "suffix", "title"]

# ---------------------------------------------------------------
# #383/#479: A SINGLE-LETTER CONNECTIVE JOINS ONLY ON CASE EVIDENCE.
# One rule, and the count is the finding. Seventeen corpus names are
# written wholly in one case AND carry a cased single-letter
# connective -- the whole population this change can reach, measured
# 2026-09-13 over the 1174-name corpus by folding every one-letter
# token of every one-case name against CONJUNCTIONS -- and exactly
# two of them move a ROLE BECAUSE OF THIS CHANGE. Of the fifteen
# others, thirteen move no role at all and the Cyrillic pair move
# theirs for #269's reason -- vocabulary that has decided their 'и'
# since 2.0, nothing to do with the fork -- so four names in the
# population move a role against this baseline and only two of the
# four are this rule's. The other two are classified by
# `feat(#269) non-Latin titles/conjunctions recognized` above, whose
# reach the population grew by exactly those two.
# The report the change also emits is a v2
# surface that does not exist below 2.0, while the derived view moved
# only in the CORE, which is not compared here either (the note in
# the `_initials` block above). So this is the whole of 2.4's
# #383/#479 blast radius at 1.4.0.
#
# LAST in the file: every diff it claims reported UNEXPLAINED on the
# run that preceded it (measured 2026-09-13), so no rule above
# already claims one, and nothing below can be shadowed by a literal
# alternation of two names.
# ---------------------------------------------------------------

[[change]]
issue = "fix(#383/#479) a single-letter connective joins only on case evidence"
# 'jose e maria santos' and 'JUAN GARCIA Y LOPEZ', both rules.md#P3
# examples. A name written wholly in one case carries no case
# evidence about any letter in it, so the reading comes from the
# vocabulary: 'e' is marked as reading both ways and reads as an
# initial, 'y' is not and joins. Both directions are v1 parity BREAKS
# and both are deliberate -- 1.4.0 gives 'jose e maria santos' first
# 'jose e maria' and 'JUAN GARCIA Y LOPEZ' middle 'GARCIA Y'
# (measured from the 1.4.0 wheel, 2026-09-13). See rules.md#P3 and
# the 2026-09-13 entry of decisions.md#P3.
#
# The two names move DISJOINT role pairs and the declaration is their
# union: 'jose e maria santos' moves `given` and `middle` (the joined
# run splits, and what is past the letter becomes the middle name),
# 'JUAN GARCIA Y LOPEZ' moves `middle` and `family` (the letter now
# joins, so the middle empties into the family). `#452`'s
# over-declaration check recomputes that union on every run, so a
# third role here would fail rather than stand as a claim on a future
# diff.
#
# Literal-anchored to the two names: the class is wide (every one-case
# name with a cased single-letter connective) but the corpora carry
# only these two at a role-moving shape, and a regex for the class
# would claim the fifteen OTHER names of that population (the section
# comment above counts them) whose roles this change does not move
# -- including 'juan garcia y lopez', which already joined, and
# 'JUAN Y GARCIA', whose three-word carve-out keeps the letter a name
# word in both directions.
# _MUST_NOT_MATCH in tests/v2/test_ledger_guards.py carries the probes,
# every one of them a MIXED-case spelling: mixed case is where the
# writing decides, nothing moved there at all, and a rule reaching one
# would be absorbing a regression in the half of rules.md#P3 this
# change did not touch.
name_regex = "^(?:jose e maria santos|JUAN GARCIA Y LOPEZ)$"
fields = ["given", "middle", "family"]
orders = ["DEFAULT"]

[[change]]
issue = "fix(#289) a written case contrast decides a bare ambiguous acronym"
# A member of suffix_acronyms_ambiguous written in CAPITALS inside a
# mixed-case name is written the way a credential is written, and is
# taken as one with nothing to spare ('Jack MA' -> given 'Jack',
# suffix 'MA'); one written in any other cased form is written the way
# a surname is written and stays one even with words to spare ('John
# Smith Ma' -> middle 'Smith', family 'Ma'). The same lean reaches the
# post-comma given slot ('Smith, MA' -> family 'Smith', suffix 'MA';
# 'Smith, Ma' keeps its given), and the comma form's words-to-spare
# test becomes a count of NAME words, which is case-blind -- so
# 'John Smith, MA', 'John Smith, Ed', 'JOHN SMITH, MA' and
# 'john smith, ma' all read the credential where the token count read
# a given name. See rules.md#S2, rules.md#C1 and rules.md#P2.
#
# A name written wholly in one case carries no contrast and does not
# move on the LEAN at all -- 'JOHN SMITH MA', 'ANH DO', 'anh van do'
# and 'Jack Ma' are _MUST_NOT_MATCH probes in
# tests/v2/test_ledger_guards.py. The one-case comma forms in the list
# above are here on the NAME-word count instead, which asks nothing
# about case; that is why they sit beside the lean's own names rather
# than in a rule of their own.
#
# Accepted costs, both recorded rather than repaired: the walk stops
# at a declined pick instead of continuing past it, so a genuine
# suffix standing in front of a name-leaning acronym is never reached
# ('abdul Smith Jr Ma' reads middle 'Jr'), and the lean ends P2's
# particle chain with no words to spare where the count would not
# ('Freiherr von Berg MA', whose own rule further up this file carries
# the reading at 1.4.0).
#
# The Title-case half is witnessed at the comma by two minimal pairs
# rather than argued: 'John Smith, MA'/'John Smith, Ma' both read the
# credential, because two NAME words before the comma decide before
# the case is looked at, and 'Smith Jr., MA'/'Smith Jr., Ma' split,
# because one name word leaves the case to decide and Title-case
# declines. 'Smith Jr., Ma' diffs here for a reading this change did
# NOT move -- the pre-comma restructure v2 has done since 2.0, at
# 1.4.0, and the fork's new report at the 2.x baselines -- while
# 'John Smith, Ma' moves on the COUNT, as its all-caps twin does, and
# has no 1.4.0 diff at all, v1 having read the credential there too.
# Both sit on this rule because the rule is what states which way
# each member of a pair goes.
#
# Literal-anchored to the measured movers. The four 2.x ledgers share
# ONE set; this copy is that set less FOUR names, for the reasons the
# paragraphs below give. "One set for all five" was written before
# the first carve-out existed and is corrected in all five copies
# (2026-09-18). The set is literal because the class is
# wide (every mixed-case name whose trailing piece is a listed
# ambiguous acronym, plus every comma form with two name words before
# the comma) and a regex for the class would claim the one-case
# spellings that do not move. A name here that does not diff at a
# given baseline is simply one the reading already agreed with there.
# `fields` is per-baseline, the union the run at THAT baseline
# measures (#452).
#
# One name is held OUT of the set here and only here: 'John Prof. MA'
# is claimed at this baseline by `fix(#316) a trailing period-marked
# title word reads as a title`, whose own comment carries the dated
# retraction of what the name used to demonstrate. That rule declares
# a `title` role this one does not, describes the whole of the diff
# rather than the acronym's half of it, and stands first -- so the
# name is narrowed out rather than left to be decided by file order,
# which the harness refuses to let go undeclared.
#
# THREE MORE are held out here and only here, added to the 2.x copies
# on 2026-09-19: 'Doe, MA', 'Doe, MA PhD' and 'Doe, Dr. MA', the lone
# post-comma credentials #531's control rows brought into the corpora.
# They diff at this baseline too -- v1 read first 'MA', last 'Doe' --
# but that diff is already claimed here by `fix(comma-family) lone
# post-comma piece routes to suffix/title, not first`, which stands
# near the top of this file and whose {given, suffix, title} admits
# their {given, suffix}. Adding them to this rule would give one diff
# two rules and leave file order to arbitrate, which is the shape the
# harness refuses to let go undeclared; so the 2.x copies carry them
# and this one does not.
name_regex = "^(?:Davis Royce, Ed|Freiherr von Berg MA|JOHN SMITH, MA|Jack MA|Jack MA\\.|Jack Wei Ma|John Smith Ma|John Smith, Ed|John Smith, MA|John Smith, Ma|John de Ma|John van der Berg Ma|Smith Jr\\., MA|Smith Jr\\., Ma|Smith, MA|abdul Smith Berg Ma|abdul Smith Jr Ma|abdul Smith Ma|john smith, ma)$"
fields = ["family", "given", "middle", "suffix"]
orders = ["DEFAULT"]

[[change]]
issue = "fix(#516) an unlisted dotted acronym is read by position"
# A token of two or more period-separated chunks that no vocabulary
# claims joins the ambiguous credential class by SHAPE and is read by
# POSITION, exactly as a bare listed acronym is: a credential where
# the name has words to spare, a name word where it does not, either
# reading reported (rules.md#S3). Case says nothing here -- the
# periods are the evidence -- which is why 'john smith x.y.z.' moves
# with 'John Smith X.Y.Z.'. The same admission reaches the comma form,
# where the NAME-word count decides ('John Smith, A.B.' -> suffix
# 'A.B.'; 'Smith, A.B.' keeps its given and only reports).
#
# Two names here restore a reading a PRIOR bundle's vocabulary change
# took away, by a different route than it lost it: 'John Smith E.S.Q.'
# and 'John Smith C.H.A.' fell to a bare positional read when 'esq'
# and 'cha' left SUFFIX_ACRONYMS
# (decisions.md#suffix-acronym-collisions), and the shape class reads
# them as the credentials they always were with no wordlist entry.
# At the baselines where
# that restoration lands on the baseline's own reading, only the new
# report is left and `fields` says so.
#
# The narrow half of the same change: a chunk match no longer makes a
# dotted token a suffix where EVERY matched chunk is a single ASCII
# character, which reaches only the roman numerals -- 'Jack X.Y.I.'
# moves to family for that reason and not for the shape one.
#
# The shapes the vocabulary settles are untouched and are
# _MUST_NOT_MATCH probes in tests/v2/test_ledger_guards.py: a
# whole-token match ('Jack M.A.', 'John Smith Ph.D.', 'Smith,
# A.B.C.'), a surviving chunk claim ('Doe, John Msc.Ed.'), a leading
# dotted run ('X.Y.Z. Smith', 'J.R.R. Tolkien', 'A.B. Vajpayee'), the
# single trailing period that is no shape at all ('John Smith Xyz.'),
# and a digit chunk, which the alphabetic gate refuses ('Bridge (1.4)').
#
# Literal-anchored to the measured movers, one set for all five
# ledgers, for the reason the fix(#289) rule above gives: the class is
# a SHAPE, and a regex for the shape would claim every dotted token
# the vocabulary already answers for.
name_regex = "^(?:Jack X\\.Y\\.I\\.|John Smith B\\.Tech\\.|John Smith C\\.H\\.A\\.|John Smith E\\.S\\.Q\\.|John Smith Q\\.W\\.E\\.R\\.T\\.|John Smith X\\.Y\\.Z\\.|John Smith, A\\.B\\.|Smith, E\\.S\\.Q\\.|john smith x\\.y\\.z\\.)$"
fields = ["family", "given", "middle", "suffix"]
orders = ["DEFAULT"]

[[change]]
issue = "fix(given-part-trailing-slot) a credential acronym ending the given part of a family-comma listing reads as a middle name"
# 2026-09-19, #531: THE WIDENING THIS RULE'S OWN COMMENT PREDICTED HAS
# LANDED, AND THE RULE NEITHER RETIRED NOR NARROWED -- IT CHANGED
# NAMES. What the rule SAYS is still true, of a different set, and for
# a different reason, so read the two paragraphs below as replacing
# the retirement paragraph rather than amending it.
#
# 'Doe, John MA' is GONE from the regex: the emitter now reaches the
# trailing slot of the given part, so the tree reads suffix 'MA'
# exactly as the 1.4.0 wheel does and the name has no diff at this
# baseline at all (the report it gains is a v2 surface that cannot
# enter a diff below baseline 2.0, which is why the 2.x ledgers carry
# it and this one does not).
#
# What is here instead is the four names where the reading is STILL
# the middle name v1 read as a post-nominal -- and the mechanism is no
# longer the slot's silence. It is the WRITING: a member written in a
# cased form that is neither capitals nor wholly lower, in a name
# written in more than one case, is written the way a name is written
# and stays one (rules.md#S2, decisions.md#S2). 'Doe, John Ma',
# 'Doe, John Ed' and 'Doe, Mary Jo Ma' are Title-cased members in
# mixed-case names, and 'Doe, John MA Ma' is a two-member run whose
# LAST member is Title-cased, so the walk declines there and the whole
# run stays middle text. v1 took all four as suffixes, and the four
# keep the 2.0-era reading against it. Each of them now REPORTS the
# fork it declined, which is #531's doing and is a v2 surface, so it
# is invisible here and carried by the 2.x ledgers' own rule.
#
# The four names entered the corpora with #531's case rows
# (2026-09-18); the reading they carry is a 2.0-era one this PR did
# not move, exactly as 'Doe, John MA's was when this rule was written.
#
# The dotted sibling is still NOT here and must not be folded in: it
# now LEAVES 1.4.0's middle for the credential reading, which is the
# opposite direction, and has a rule of its own at the bottom of this
# file.
#
# Literal-anchored for the same reason the fix(#289) rule above gives:
# the class is a slot, and a regex for the slot would claim every
# family-comma name whose given part ends in an ambiguous acronym,
# including 'Doe, John MA' itself, which v1 now agrees with.
# _MUST_NOT_MATCH carries that name as a probe, beside
# 'Doe, John MA Smith', whose member is not at the trailing slot at
# all and whose diff has the comma-family rule below.
name_regex = "^(?:Doe, John Ed|Doe, John MA Ma|Doe, John Ma|Doe, Mary Jo Ma)$"
fields = ["middle", "suffix"]
orders = ["DEFAULT"]

[[change]]
issue = "fix(#531) a dotted credential ending the given part leaves 1.4's middle name"
# The dotted half of #531, and the one place the change accepts a v1
# parity BREAK rather than restoring one. 'Doe, John X.Y.Z.' reads
# middle 'X.Y.Z.' on the 1.4.0 wheel (measured) and middle at 2.0.0
# through 2.3.0 too; the tree reads suffix 'X.Y.Z.'.
#
# Deliberate, and the reason is agreement rather than history: a
# multi-chunk dotted token no vocabulary claims joins the ambiguous
# credential class BY SHAPE and is read by POSITION (rules.md#S3,
# fix(#516)'s rule above), the comma-less 'John Doe X.Y.Z.' reads it
# as the credential, and at this slot the comma has already named the
# family so the words-to-spare count is satisfied by construction.
# The acronym half of #531 restores v1; this half departs from it, and
# decisions.md#S2 records the pair as one decision with two
# directions.
#
# `listed_lean` returns None wherever the by-shape tag rides, so no
# case evidence is consulted here at all -- which is why this name
# needs a rule of its own rather than sitting with the acronyms above
# or with the four the writing declines.
#
# Literal, one name. A regex for the dotted SHAPE would claim every
# dotted token the vocabulary already answers for, which is the reach
# fix(#516)'s own comment refuses; _MUST_NOT_MATCH carries the probes
# it names.
name_regex = "^Doe, John X\\.Y\\.Z\\.$"
fields = ["middle", "suffix"]
orders = ["DEFAULT"]

[[change]]
issue = "fix(comma-family) an interior credential acronym stays a middle-name word"
# THIS PR DID NOT MOVE THIS READING, and the rule exists only because
# the name entered the corpus here -- the shape the rule above is
# bounded by, arriving as #531's recorded negative control
# (2026-09-18). 'Doe, John MA Smith' reads middle 'Smith', suffix 'MA'
# on the 1.4.0 wheel and middle 'MA Smith' at 2.0.0 and every baseline
# since, this tree included. Measured case-independent: 'DOE, JOHN MA
# SMITH' and 'doe, john ma smith' read the same way.
#
# It is NOT the trailing slot and must not be folded into either rule
# above: a NAME WORD stands behind the member, which ends the trailing
# run, so no fork is consulted, nothing reports, and the member is an
# ordinary middle-name word. What v1 did instead was read the
# post-comma part's suffix vocabulary by POSITION and lift 'MA' out of
# the middle of the given part -- a family-comma routing difference
# 2.0 settled, which is why this files under the comma-family group
# that tests/v2/cases.py gives the row.
#
# Literal, one name: the shape is "a family-comma name whose given
# part carries an ambiguous acronym with a name word behind it", and a
# regex for it would claim the trailing-slot names two rules above.
name_regex = "^Doe, John MA Smith$"
fields = ["middle", "suffix"]
orders = ["DEFAULT"]

[[change]]
issue = "fix(comma-family) a credential acronym grouping joined into one piece stays middle-name text"
# THIS PR DID NOT MOVE THESE READINGS EITHER, and the three names
# arrived for the same reason the one above did: #531's fix round
# needed the rows that PIN the trailing slot's piece test, so they
# entered the corpora (2026-09-19). All three read the middle name at
# 2.0.0 and at every baseline since, this tree included, and v1 read
# the trailing word as a post-nominal.
#
# The mechanism is a STAGE EARLIER than the slot, and it is the piece
# rather than the word: grouping merges each of these members into a
# multi-token piece before assign asks anything -- 'MA y' on the
# conjunction, 'van Ma' on the particle chain in front, 'DO Ed' on the
# chain the member itself heads -- and the slot reads a piece, so a
# piece of two tokens is not the lone member the branch asks about.
# What v1 did instead was read the post-comma part's suffix
# vocabulary by POSITION, which is the same family-comma routing
# difference 'Doe, John MA Smith' carries above; these differ from it
# only in what ends the reach.
#
# Literal, three names. The shape is "a family-comma name whose given
# part ends in a joined piece carrying a class member", and a regex
# for it would need the join, which is not in the string: 'Doe, John
# MA Smith' and 'Doe, John MA' are spelled alike and neither is here.
# _MUST_NOT_MATCH carries both as probes.
name_regex = "^(?:Doe, John DO Ed|Doe, John MA y|Doe, John van Ma)$"
fields = ["middle", "suffix"]
orders = ["DEFAULT"]

[[change]]
issue = "fix(#380) the do attachment leaves the credential in front of it in the middle name"
# THE SAME DECISION AS THE fix(#380) RULE BELOW, on a name that moves
# one field more than any of its five. 'Doe, John MA do' entered the
# corpora with #531's fix round (2026-09-19) and is NOT this PR's
# doing -- byte-identical at cc78c960 and on the 2.3.0 wheel.
#
# v1 read the whole tail as post-nominals, suffix 'MA, do'. Here the
# lower-case 'do' leans nothing, so the trailing slot declines it to
# P6 exactly as 'Doe, John Do' does -- and a piece that walk refuses
# ENDS the run, so the all-caps 'MA' in front of it is never asked
# and stays middle-name text, capitals and all. Two readings on one
# string: {family, suffix} is the attachment the rule below names,
# and `middle` is the silence behind it, which is why the name needs
# a rule of its own rather than joining that literal set -- a
# three-field diff is no subset of its {family, suffix}.
#
# Literal, one name. tests/v2/cases.py's
# the_particle_carve_out_silences_the_member_in_front is the row.
name_regex = "^Doe, John MA do$"
fields = ["family", "middle", "suffix"]
orders = ["DEFAULT"]

[[change]]
issue = "fix(#380) a trailing mc or do after a family comma is the tussenvoegsel, not a post-nominal"
# THE SAME DECISION AS THE fix(#380) RULE ABOVE, over the two other
# words that carry the collision it names. Five names entered the
# corpora with #531's case rows and its `do` pairing (2026-09-18), and
# every one of them reads here what 'Berg, Jan vd' reads there: the
# trailing word attaches to the family the comma already named
# (rules.md#P6) where v1 read it as a post-nominal, so {family,
# suffix} moves and nothing else does.
#
# 'Berg, Jan mc' is the second word of decisions.md#vocabulary-
# collisions' live pair, and decisions.md#suffix-acronym-collisions
# is where 'mc' was left in the acronym set as no borne name at all.
# The other four are the `do` rows: 'Doe, John Do', 'SMITH, JOHN DO',
# 'NASCIMENTO, EDSON ARANTES DO' and 'Nascimento, Edson Arantes do'.
#
# THIS PR DID NOT MOVE ANY OF THE FIVE -- verified name by name
# against the tree at cc78c960, where all five parse byte-identically
# (2026-09-19). What #531 DID do is take the sixth spelling OUT of
# this set: 'Doe, John DO' is an all-caps member in a mixed-case name,
# the one writing that carries a positive credential lean, so the
# credential reading wins, P6 stands down, and the name reaches 1.4.0
# parity and drops out of this ledger entirely. That is
# decisions.md#S2's `do` pairing, and 'Doe, John DO' is a
# _MUST_NOT_MATCH probe here because of it -- the one-case
# 'SMITH, JOHN DO' beside it in the regex is the accepted cost the
# same entry records.
#
# Literal-anchored, unlike the vd rule's shape regex: `do` is
# ordinary given-name and particle text in a way `vd` is not, so a
# regex over the trailing word would claim every Portuguese and
# Vietnamese comma listing in the corpora. The vd rule's own
# _MUST_NOT_MATCH key was rekeyed to its full issue text when this
# rule landed, for the reason fix(#360)'s pair already records: the
# bare tag now matches two rules, and each one's boundary is the
# other's claim.
name_regex = "^(?:Berg, Jan mc|Doe, John Do|NASCIMENTO, EDSON ARANTES DO|Nascimento, Edson Arantes do|SMITH, JOHN DO)$"
fields = ["family", "suffix"]
orders = ["DEFAULT"]

[[change]]
issue = "fix(#274/#424) accepted: a maiden clause keeps a trailing credential v1 read as a post-nominal"
# Six names whose reading this change does not touch: each reads on
# this tree exactly as it read at 2f57ff21, measured name by name,
# and the whole of the 1.4.0 diff is v1 having no maiden field. The
# marker takes the words after it, the trailing member among them --
# rules.md#M2's Accepted reading, which has shipped since #274 and
# which #533 leaves standing wherever the WRITING declines the word
# (a Title-cased member in a mixed-case name: 'Jane Doe nee Smith
# Ma', 'Jane Doe nee Yo-Yo Ma', 'Doe, Jane nee Smith Ma'), wherever
# the member is the only word the marker would leave ('Jane Doe nee
# MA'), and wherever P6's attachment claims the word instead ('Doe,
# Jane nee Smith do', 'Doe, Jane nee Smith MA do'). What #533 adds on
# these six is a REPORT, and 1.4.0 has no surface to compare one
# against -- so nothing of this change is visible from here, and the
# rule is named for the change that is.
#
# Its own rule rather than a widening of fix(#274) above, and the
# reason is that rule's `fields`: it stops at maiden/middle/family
# because a Latin marker moves only those, while these six also move
# the `suffix` v1 read. Folding them in would have fix(#274) stand
# ready to explain a suffix regression on every name carrying a
# marker -- the trade 'fix(#424/#445) accepted: the maiden walk keeps
# a bare acronym' already refused for the same reason and records.
#
# Literal-anchored: the subject is a SLOT, and a regex for it would
# claim the names whose writing gives the word UP as readily as
# these.
name_regex = "^(?:Doe, Jane nee Smith MA do|Doe, Jane nee Smith Ma|Doe, Jane nee Smith do|Jane Doe nee MA|Jane Doe nee Smith Ma|Jane Doe nee Yo-Yo Ma)$"
fields = ["family", "maiden", "middle", "suffix"]

[[change]]
issue = "fix(#274/#436/#437) a clause the unambiguous credential ended, and the run it left renders with spaces"
# 'Jane Doe nee Smith PhD MA', and #533 moves nothing on it either:
# the unambiguous PhD already ended the walk before this change, so
# the clause gave the MA up then as it does now -- maiden 'Smith',
# suffix 'PhD MA', the same reading as at 2f57ff21. Two changes meet
# in the 1.4.0 diff and one rule has to explain the whole of it: the
# marker leaving the name (#274) and R1's space-separated rendering
# of the run v1 wrote 'PhD, MA' (#436/#437).
#
# The name is the order-sensitivity #533 was filed about, seen from
# the side that never moved: 'Jane Doe nee Smith MA PhD' reads the
# same way now and did not before, and it is in the rule below.
name_regex = "^Jane Doe nee Smith PhD MA$"
fields = ["family", "maiden", "middle", "suffix"]

[[change]]
issue = "fix(#533) the clause gives the credential up, and the run it joins renders as the writer spaced it"
# Four names where #533 changes which words the clause holds, and the
# 1.4.0 diff carries two more changes besides. What the marker takes
# now ends where a trailing credential begins (rules.md#M2,
# decisions.md#M2), so 'Jane Doe nee Smith MA PhD' reads suffix 'MA
# PhD' where the tree read maiden 'Smith MA' at 2f57ff21, and 'Jane
# Doe nee Smith MA JD' reads suffix 'MA JD' where it read maiden
# 'Smith MA JD'. 'Jane Doe nee Smith Ma JD' is the pair's other
# half: the Title-cased Ma stays in the clause and only the JD behind
# it leaves. 'Doe, J. nee MA ba' is the CLAMP -- a member that is the
# first word after the marker stays the maiden name, so maiden 'MA'
# is kept and suffix 'ba' is given up.
#
# The other two changes are the marker leaving the name (#274, which
# v1 has no field for) and R1's space-separated rendering of the run
# the member joins, which v1 wrote with commas: 'MA, PhD' -> 'MA
# PhD', 'MA, JD' -> 'MA JD', 'MA, ba' -> 'ba' (#436/#437). One rule
# explains the whole of each diff, which is why this is not three.
#
# NOT case-insensitive, and measured: 'Jane Doe nee Smith Ma JD' and
# 'Jane Doe nee Smith MA JD' read differently from each other -- the
# capitals are the evidence the lean reads -- so an (?i) anchor here
# would stand ready to explain either with the other's reasoning.
name_regex = "^(?:Doe, J\\. nee MA ba|Jane Doe nee Smith MA JD|Jane Doe nee Smith MA PhD|Jane Doe nee Smith Ma JD)$"
fields = ["family", "maiden", "middle", "suffix"]

[[change]]
issue = "fix(#445/#533) the clause gives the credential up, and the one name word it leaves is the family"
# 'John née Jones Smith MA', whose diff has three causes from 1.4.0
# and one rule has to explain the whole of it. v1 read given 'John',
# middle 'née Jones', last 'Smith', suffix 'MA'; the tree reads
# family 'John', suffix 'MA', maiden 'Jones Smith'. The marker takes
# the words after it (#274), rules.md#M4 makes the one name word the
# clause leaves the family (#445), and #533 is what takes the MA back
# out of the maiden name -- at 2f57ff21 this read maiden 'Jones Smith
# MA' with no suffix at all, so `suffix` was in the diff then and is
# not now.
#
# Its own rule because 'fix(#424/#445) accepted: the maiden walk
# keeps a bare acronym, and the lone name word is the family' above
# says the OPPOSITE of what this name now does, and until this commit
# its (?i) anchor claimed both spellings. That rule is narrowed to
# the spellings whose reading it describes; this one carries the
# spelling that gives the member up.
name_regex = "^John née Jones Smith MA$"
fields = ["family", "given", "maiden", "middle"]

[[change]]
issue = "fix(#533) accepted: an unlisted dotted acronym ending a maiden clause leaves v1's family name"
# 'Jane Doe nee Smith X.Y.Z.': v1 read middle 'Doe nee Smith', last
# 'X.Y.Z.' and no suffix at all; the tree reads family 'Doe', suffix
# 'X.Y.Z.', maiden 'Smith'. A by-shape member carries no writing
# convention to read -- `listed_lean` returns None where the switch
# made the token credential-SHAPED and the vocabulary did not list it
# -- so the positional reading decides alone and the clause gives the
# word up. The same trade #531 recorded at the given part's slot and
# for the same reason: taken to agree with the comma-less 'John Doe
# X.Y.Z.' and rules.md#S3's shape rule, not to restore anything.
#
# Accepted, and the divergence from v1 is the whole of it: v1 made
# the dotted acronym the family name, and nothing here proposes to.
name_regex = "^Jane Doe nee Smith X\\.Y\\.Z\\.$"
fields = ["family", "maiden", "middle", "suffix"]

[[change]]
issue = "fix(#434/#533) a marker PHRASE takes the maiden name, and its clause ends at the credential"
# 'Maria Kowalska z domu Nowak MA'. fix(#274)'s regex is the
# n[ée]e/geb alternation and cannot reach a phrase entry at all --
# its own comment says why, at length -- and the fix(#434) rules
# below are anchored to the bare 'Maria Kowalska z domu Nowak'.
# Separate rather than a widening of that anchor: the diff here is
# the same three fields but the CAUSE is two changes, and a rule
# naming only #434 would attribute this change's stop to the
# vocabulary addition.
#
# What #533 does here is not in the field list: `maiden` moves for
# the phrase's sake either way, and what changed is the TEXT it
# holds -- 'Nowak MA' at 2f57ff21, 'Nowak' now, with the MA a suffix
# v1 also read as one.
name_regex = "^Maria Kowalska z domu Nowak MA$"
fields = ["family", "maiden", "middle"]


# #397 review: A LINK INSIDE A MAIDEN CLAUSE STAYS IN THE BIRTH NAME
# (2026-09-20; a third rule added 2026-09-22 with rules.md#M2's
# `deviates: #538` example). Separate rules rather than one, because
# at this baseline OTHER changes ride along in the same diffs and one
# rule has to explain the whole of each: the marker leaving the name
# (#274), R1's space-joined rendering of a suffix run v1 wrote with a
# comma (#436/#437), and -- for the name added last -- the suffix
# field v1 put a whole suffix-comma tail in.
#
# The third new name, 'Jane Doe nee Puig i Soler', needs no rule here:
# its diff at this baseline is {family, maiden, middle}, which the
# fix(#274) alternation above already explains -- v1 has no maiden
# support at all, so the clause leaving the name IS the whole diff and
# the link's placement inside it changes none of the three field
# NAMES. The fourth, 'Jane Doe nee Puig i', is explained there too.
#
# rules.md#M2 states the exception; decisions.md#M2's 2026-09-20
# bullet carries the measurement.
# ---------------------------------------------------------------

[[change]]
issue = "fix(#274/#397) a link inside a maiden clause stays in the birth name, after a family comma"
# 'Doe, Jane nee Puig i Soler'. v1 read middle 'nee Puig Soler' with
# suffix 'i' -- the marker an ordinary word and the link a generation.
# The tree reads given 'Jane', family 'Doe', maiden 'Puig i Soler':
# the marker consumed (#274) and the link kept inside the clause it
# stands in (#397). `suffix` is in the list because v1 had one and the
# tree does not, which is the link's half.
#
# Literal, one name. The shape would be "a maiden marker and a bare
# letter", which reaches every clause name in the corpora.
name_regex = "^Doe, Jane nee Puig i Soler$"
fields = ["maiden", "middle", "suffix"]

[[change]]
issue = "fix(#274/#436/#437) a clause the generational link ended, and the run it left renders with spaces"
# 'Jane Doe nee Puig i III'. Two changes meet in the v1 diff: the
# marker leaving the name (#274, maiden 'Puig' where v1 read last
# 'Puig' and middle 'Doe nee') and the two-word generation run 'i III'
# that v1 rendered 'i, III' (#436/#437). The link fix moves NOTHING on
# it and that is what the name is in the corpus for -- measured
# against the parent 46651750, the parse is byte-identical before and
# after this bundle, the link having a generation to its right rather
# than a name word.
#
# Separate from the fix(#274/#436/#437) rule above it rather than a
# widening of that anchor: that one is about a clause an unambiguous
# CREDENTIAL ended, and a rule naming only credentials would
# attribute this stop to the wrong reading.
name_regex = "^Jane Doe nee Puig i III$"
fields = ["family", "maiden", "middle", "suffix"]

[[change]]
issue = "fix(#274/#397) a maiden clause inside a suffix-comma tail leaves the suffix field, link and all"
# 'Smith, John, PhD née Puig Mr. - i Soler', which arrives from
# rules.md#M2 rather than from a report: it is the doc's
# `deviates: #538` example, and the doc reaches that deviation with a
# configured ' - ' this corpus does not apply. What the gate sees is
# the DEFAULT facade reading, where the dash is an ordinary name word
# like any other.
#
# v1 had no maiden markers at all, so everything behind the suffix
# comma stayed in the suffix: suffix 'PhD née Puig Mr. - i Soler'
# against the tree's 'PhD', maiden '' against 'Puig Mr. - i Soler'
# (measured 2026-09-22). One rule for the whole of it -- the marker
# leaving the name (#274) and, inside what it takes, the link kept in
# the clause it stands in (#397), which is what puts 'i Soler' on the
# maiden side of the same two fields.
#
# Not a widening of the fix(#274/#397) comma rule above: that one is
# about a FAMILY comma, where v1 left a middle name behind and the
# field list says so. This tail leaves v1 a suffix and nothing else.
#
# Literal, one name, for the reason those rules give: the shape would
# be "a maiden marker and a bare letter", which reaches every clause
# name in the corpora.
name_regex = "^Smith, John, PhD née Puig Mr\\. - i Soler$"
fields = ["maiden", "suffix"]

[[change]]
issue = "change(suffix-acronym-collisions) ph leaves the acronym set"
# 'John Smith Ph.': 'ph' left SUFFIX_ACRONYMS with #459's all-caps
# repair (PR #521, 2026-09-13). The fragment let the merged 'Ph. D.'
# token pass the acronym test on its first piece -- the merge itself
# keys on the PH/D regexes of _pipeline/_vocab.py and keeps working
# without it -- and its only unique coverage was a bare trailing
# 'Ph.' with no 'D.' behind it, read as a credential by every release
# since 1.4.0. Out of the set that spelling falls to the positional
# read: given 'John', middle 'Smith', family 'Ph.', suffix ''.
#
# A BEHAVIOR CHANGE rather than a fix, which is what the `change` tag
# says: a deliberate 2.x parity break at every baseline, argued in
# decisions.md's `Excluded (SUFFIX_ACRONYMS — ph)` block beside esq's
# and carried by the 2.4.0 release-log bullet. No corpus name had the
# shape until the cases.py row was written to carry it, which is why
# the removal measured as 0 role movers at review time; 'John Smith
# Ph. D.', 'Smith, Ph. D.' and 'john smith phd' do not move.
#
# Literal to the one corpus name that carries the shape. The CLASS
# the removal moves is wider -- the undotted 'John Smith Ph'/'PH',
# 'Ph.' inside a credential run ('John Smith Ph. MD', 'MD Ph.',
# 'Ph. Jr.'), and the comma form 'Smith, Ph.' from 2.2.0 on -- every
# one a bare ph with no D. behind it (the decisions block lists them,
# measured 2026-09-22). A row carrying one of those arrives
# unexplained here by design: widen this rule to it, do not file it.
name_regex = "^John Smith Ph\\.$"
fields = ["family", "middle", "suffix"]
