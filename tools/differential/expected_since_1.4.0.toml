# Every rule needs all three of `issue`, `name_regex` and `fields`.
# `fields` stopped being optional on 2026-08-29: validate_rules had
# refused a rule carrying `fields` and no `name_regex` since #451, and
# #456 closed the mirror shape, so a half-declared rule is now a
# startup error whichever key is the missing one. An unexplained diff
# is a release blocker until classified
# (tools/differential/README.md). The citation here used to name a
# gitignored spec requirement, and passed the armed legacy-citation
# guard only because the line wrapped between the two words.
# Rules were seeded from the 2.0 rewrite's working notes
# and the `classification="fix(...)"` rows in tests/v2/cases.py; keep
# each entry's `name_regex`/`fields` as tight as the diff allows.
# FILE ORDER IS LOAD-BEARING: every rule carries a `name_regex`, so
# they all sit in one tier, _sorted_rules is stable, and file order
# decides every tie. Write the narrower rule first -- that is the
# DEFAULT and not a law: a wider rule that describes a compound
# behavior its component rule does not is the better classifier and
# stays where it is, saying so in a [[change.precedes_narrower]] block
# naming the rule it outranks (#382; eleven rules below carry one, and
# tools/differential/README.md's "Declaring a wide-first pair" owns
# the mechanics). Do NOT reorder to satisfy the check -- that moves
# which rule classifies a name and breaks _CROSS_RULE_WINNERS. See
# also the note above the four fix(suffix-routing) rules at the end of
# this file.
#
# RECOMPUTE, once for all eleven. Those `why` texts quote counts that
# drift -- "explains N names", the contract/radar splits inside them,
# the 17/15/9/6 breakdown on the compound/peel pair, and how many
# contract names go UNEXPLAINED if a rule is deleted. NONE is pinned
# by a test, so re-measure before editing any of them rather than
# copying the neighbouring digits (docs/design/AGENTS.md: a count
# that drifts carries its recompute; a stale one here has already
# reached a filed issue once).
#   1. `uv run python tools/differential/compare.py --baseline 1.4.0`
#      prints `## <issue> (N)` per rule. N IS the explains-count; the
#      roster under it truncates at ten names, the heading does not.
#   2. For a tier split, take each explained name's corpus file from
#      the tools/differential/corpus*.jsonl glob and its tier from
#      compare.py's _CORPUS_TIERS -- read that map, never rebuild it
#      from a file's name or size. corpus.jsonl is the LARGEST corpus
#      and it is RADAR; a name in both tiers reads contract, the
#      dedup loading contract files first.
#   3. For "N names this pair is contested over", call
#      order_contests(rules, names) with `names` the union of
#      _load_entries over that same glob.
#   4. For "deleting the rule sends N contract names to UNEXPLAINED",
#      delete the rule and re-run step 1.
# Do NOT substitute driving classify() over a rule's regex reach at
# its declared `fields`: that answers what the rule COULD claim, not
# what it explains. Measured 2026-09-02 over the rules named in the
# eleven exemptions, reach runs from equal to the explained count up
# to forty times it -- 288 against 8 for the lone post-comma routing
# rule, which is the rule a wrong count reached a filed issue on.

# #436/#437: the suffix view's entry boundary became the comma the
# writer typed. rules.md#R1: "a run of post-nominals written with
# spaces renders with spaces, and one written with commas keeps
# them" -- true of the comma paths since 1.4.0 and of the NO-COMMA
# path only since 2.3, which is the whole of what these names move.
# Every one goes from a comma-joined render to a space-joined one;
# none goes the other way, and none has a comma in the original
# between the two words. Roles do not move: this rule declares
# `suffix` alone, so a name whose ROLES move here arrives
# UNEXPLAINED, as it should.
#
# FIRST in the file, and that is narrow-first rather than a
# preference: `fields = ["suffix"]` is a strict subset of several
# rules below, and any of them sitting earlier while both regexes
# reach one corpus name is an undeclared order-decided contest the
# run refuses (#382). Measured 2026-09-06 by moving this rule to
# the end of a scratch copy of this file and re-running the gate,
# which raises 3 such contests here.
#
# An anchored alternation of the names rather than a shape, because
# the shape is "two post-nominals with a space between them" and
# that reaches every listing form in the corpora. The members are a
# list of NAMES and copy no wordlist, which is what
# _NOT_A_VOCABULARY_COPY in tests/v2/test_ledger_guards.py records;
# _CORPUS_CLAIMS pins the reach at 10 with its digest, and
# _MUST_NOT_MATCH pins the five comma and delimiter forms it must
# never claim.
[[change]]
issue = "fix(#436/#437) a space-separated post-nominal run renders with spaces, not commas"
name_regex = "^(?:JOHN DOE PHD MD|John Doe MD PhD|John Smith MD PhD|John Smith Mc V|Kenneth Clarke QC MP|Smith, John PhD I\\.|The Rt Hon Kenneth Clarke QC MP, HMG|Washington Jr\\. MD, Franklin|abdul Smith Jr Ma|abdul Smith Jr V)$"
fields = ["suffix"]

[[change]]
issue = "fix(#271/#272/#298) native-script CJK: family-first order, hangul segmentation, the kana license and the dots"
# '毛 泽东', '김민준': script_orders flips first/last for a name written
# wholly in Han or Hangul, and the Korean surnames that now ship as
# default vocabulary additionally split an unspaced hangul token into
# last + first. '高橋 みなみ', 'マイケル・ジャクソン': #272 extends the
# same order table to kana-bearing Japanese names and makes the
# katakana middle dot a token separator, which moves pieces between the
# same three fields. Seeded from the fix(#271) and fix(#272) rows in
# tests/v2/cases.py.
#
# One rule, not two, because it is one diff shape: both issues move
# name pieces between first/middle/last on native-script CJK input, and
# splitting the class by issue would need a rule per script with no
# gain in tightness (the fields list is already the narrow half).
#
# Scoped by script, which is exactly the scope of the behavior --
# nothing here can touch a name with no CJK character in it. Han's
# astral block (U+20000-U+323AF) is deliberately left out of the class:
# no name in either corpus reaches it, and a rule should be no wider
# than the diffs it has to explain. Extend it -- and the sync pin in
# tests/v2/test_ledger_guards.py, which fails if the two disagree -- if
# one ever does. The kana spans are BMP-only for a different reason:
# supplementary-plane kana is hentaigana and other archaic forms no
# modern name uses, so _SCRIPT_RANGES does not list it either.
#
# U+FF65 is the one span here that _SCRIPT_RANGES does NOT have, and
# it is deliberate. The halfwidth middle dot separates tokens like
# its fullwidth twin, so 'ﾏｲｹﾙ･ｼﾞｬｸｿﾝ' splits where 1.4 left one
# token, but halfwidth kana is excluded from CLASSIFICATION on
# purpose (a separate normalization problem). The rest of the
# halfwidth block (U+FF66-U+FF9F) is left out for the usual tightness
# reason, and it was measured rather than assumed: a dotless
# halfwidth name such as 'ﾏｲｹﾙ ｼﾞｬｸｿﾝ' is byte-identical on both
# sides, so covering the block would pre-excuse a future regression
# on a shape that is parity today. U+00B7, the context-sensitive
# 间隔号 (#298), deliberately gets NO span even though it too changes
# parses: its flank guard divides only between classified-script
# characters, so every name it can change already matches this class
# through a flanking character -- and a B7 span's only actual effect
# would be letting this rule claim first/middle/last diffs on
# punt-volat Latin names ('Gal·la Marcet'), pre-excusing a regression
# on exactly the input class the guard exists to protect.
#
# corpus_cjk.jsonl (#295) exists so this rule fires in every real
# run: build_cjk_corpus.py harvests every CJK-bearing text in
# tests/v2/cases.py -- the fix(#271)/fix(#272)/fix(shime-mark) rows
# AND the parity rows, whose value here is pinning NON-diffs (マイケル
# must not change against 1.4) -- closing the blind spot the other
# two corpora have by construction: v1's banks had no reason to test
# CJK, and build_issues_corpus.py requires an internal space, which
# unspaced names never have.
#
# Since 2026-09-01 that one harvest writes TWO files, not one: rows
# carrying `tolerated` go to corpus_cjk_tolerated.jsonl and the rest
# to corpus_cjk.jsonl. The never-dormant conclusion above survives
# the split unchanged, because both files load in every real run --
# what the split changed is the TIER (corpus_cjk_tolerated.jsonl is
# radar, so an unmatched diff on one of its names reports instead of
# failing), and a rule fires on names it is given regardless of what
# an unmatched diff would then cost.
name_regex = "[\\u3005-\\u3006\\u3040-\\u309F\\u30A0-\\u30FF\\u3400-\\u4DBF\\u4E00-\\u9FFF\\uF900-\\uFAFF\\uAC00-\\uD7A3\\uFF65-\\uFF65]"
fields = ["given", "middle", "family"]

[[change]]
issue = "fix(#274) maiden markers consumed"
# The alternation is a hand copy of MAIDEN_MARKERS, pinned by
# tests/v2/test_ledger_guards.py: every alternative must match at least
# one entry the config ships, and none may match ordinary name text.
#
# Its members reach 3 of the 17 entries -- geb, nee, née -- which is
# not the same set as the markers the corpora contain (geb, nee, née,
# z domu and 旧姓; the first three are covered here). Fourteen entries
# go unreached, and the carve-outs in that arithmetic are
# load-bearing: TWO of the fourteen do appear in the corpora and each
# is classified somewhere other than this alternation. 旧姓 is one,
# and it has fix(cjk-maiden-marker) of its own below rather than an
# alternative here. z domu is the other, and it cannot be an
# alternative here at all: this is a per-WORD regex over a name, and
# the words of a phrase entry are an ordinary Polish preposition and
# an ordinary noun -- an alternative matching either would claim names
# carrying no marker, which is the one thing the pin above forbids.
# Its two names are classified by the fix(#434) rules, keyed on the
# literal. Growing this rule toward the other TWELVE buys nothing:
# none of them appears as a token in any corpus, so there is no diff
# for them to classify. The roz alternative was
# dropped in 2.2 with the vocabulary entry it copied (see
# maiden_markers.py's Deliberately absent note): no corpus name
# contains the string in any case or position, so it classified
# nothing and its removal moved no name.
#
# 旧姓 is a different case, and it has been got wrong three times, so
# state it precisely. Widening this rule to cover it changes no corpus
# classification -- every 旧姓 name in the corpora leaves a wholly Han
# residual, which reads family-first (#271), so its diff includes
# `given`, and classify() requires the diff's fields to be a subset of
# the rule's. That is a fact about the CORPUS, not about the rules: a
# 旧姓 name with a Latin residual would diff without `given`, and since
# this rule sorts ahead of fix(cjk-maiden-marker) in the same tier it
# would take that name from it. Inert today, shadowing in principle.
# Widen deliberately, and record the new coverage in
# _LATIN_ALTERNATION_SOURCES.
#
# 'born' was an alternative here from the harness's first commit and
# was removed in #350. It is not in MAIDEN_MARKERS and never was, in
# v1 or v2, so it could not correspond to a real #274 change. What it
# could do is claim any name containing "born" -- with fields
# maiden/middle/family -- and absorb a genuine regression. No corpus
# name contains it, so removing it changed no classification.
#
# Supporting 'born' would mean shipping it as vocabulary first, and it
# is not free: 'Bertha Born Smith' loses its family name to the marker.
# Note the vocabulary is not missing English -- 'nee' is there, and
# tests/v2/cases.py calls it the spelling English writes most often.
# See maiden_markers.py's own "Deliberately absent" note for what has
# actually been considered and declined.
#
# The lookarounds and the two context tests are not decoration. corpus_rules.jsonl (#414)
# brought in 'Jane Smith (Nee)' and 'Jane Smith (Nee) (Jones)', which
# are M1's examples of a one-word clause keeping a word that may
# itself be a surname. Under the DEFAULT facade -- which is what the
# differential parses with -- no maiden delimiter is configured, so
# the parenthesized word is a NICKNAME and no marker is active at all.
# Without the lookarounds this rule matched the word anyway and stood
# ready to explain a `maiden` diff on a name that has no marker in it,
# which is absorption waiting to happen. The vocabulary-presence guard
# in test_ledger_guards.py is what caught it.
#
# The same corpus addition also put M2's BOUNDARY examples in reach --
# 'Jones nee', 'nee Jones', 'Jane van der Berg nee', 'Muller geb.' --
# names M2 states as unchanged, because a marker with nothing before
# or after it is just a word. Nothing guards that: those names really
# do carry marker vocabulary, so the presence guard is satisfied.
# Hence the two context tests, which say what this rule has always
# meant: a marker with a name word BEFORE it and one AFTER it. Reach
# 16 -> 11 when they were added, and every name it explained then was
# inside the eleven -- figures from that measurement rather than from
# today's corpus, which has grown since and keeps growing. For today's,
# read the `## fix(#274) maiden markers consumed (N)` heading off
# `compare.py --baseline 1.4.0`; a number written here instead would
# only be that heading's value on the day someone typed it.
#
# These claimed names still do not move, recorded rather than
# excluded: 'Jane Smith, née Jones' (post-comma, M2's remaining
# Accepted limit), 'Jane van der Berg née PhD' and 'Jane Smith née V'
# (only a suffix follows, so the consumer declines), and
# 'Jane née Jr y Jones' and 'Jane van der Berg née Jr Jones' (the
# connective and bound-given joins, #412). Each would need the regex
# to ask a vocabulary question -- suffix or connective membership --
# a second alternation this rule cannot spend. A count stood at the
# head of that list and said four until a review round re-measured
# it: the corpus grew and the sentence did not, which is this file's
# standing hazard. The list is the count now, and it is self-checking
# where a digit was not. Measured 2026-08-27 against the 1.4.0 wheel,
# name by name over everything the regex claims rather than over a
# sample of it -- a walk whose length is whatever `_claimed()` returns
# that day.
#
# #445 landed 2026-08-27, and the prediction this note used to carry
# was wrong in a way worth keeping on the record. It reasoned that a
# "keep the family" fix would leave these diffs a subset of {maiden,
# middle, family}, so this rule would go on explaining them and would
# absorb the change in silence. The rule #445 actually chose MOVES
# the one name word rather than adding one: `given` empties as
# `family` fills, so every name that moved left this rule's fields
# and arrived UNEXPLAINED -- loud, at all three baselines. The note
# earned its keep all the same, and that is why it is corrected here
# rather than deleted: it named the right rule, the right field and
# the right eight names, and re-measuring its checklist is what
# showed its own reasoning wrong.
#
# Six of the eight moved: five by the fix(#445) rule at the end of
# this file, and 'John née Jones Smith Ma' by the fix(#424/#445)
# acronym rule above it, its diff carrying the suffix v1 read as
# well. The other two are rules.md#M4's own carve-outs, and their
# diffs are unchanged to the field, which is what makes them a
# boundary rather than an oversight. 'abd née Jones' -- whose word
# the bound-given vocabulary has claimed -- is still this rule's.
# 'J. née Jones Smith V' -- whose word is an initial -- is NOT, and
# never was: its 1.4.0 diff carries `suffix`, which these three
# fields cannot hold, so 'fix(#424) accepted: the maiden walk keeps
# the numeral an initial before the marker vetoes' is what explains
# it (asked of classify directly, 2026-08-27, rather than read off
# the regexes). The safety argument holds through that rule instead:
# it declares no `given` either, so a `given` move on either
# carve-out lands UNEXPLAINED rather than absorbed.
#
# The two other fix(#445) names,
# 'Smith née Jones' and 'Smith née Jones PhD', are corpus rows M4's
# own example lines added.
name_regex = "(?i)(?<![(（])(?<=\\S\\s)\\b(n[ée]e|geb)\\.?(?![)）])(?=\\s+\\S)"
fields = ["maiden", "middle", "family"]

[[change]]
issue = "fix(cjk-maiden-marker) maiden marker consumed, compounding with the CJK order flip"
# Its own rule rather than a widening of fix(#274) above: that rule's
# fields stop at maiden/middle/family because a Latin marker moves
# only those, while a Han one also flips `given` -- the name left after
# the marker is consumed is wholly Han, so it reads family-first
# (#271). Adding `given` to #274's list would make it broader than its
# prose and let it absorb diffs that have nothing to do with markers
# (#328). The regex is the marker itself, so this rule can claim
# nothing else.
name_regex = "旧姓"
fields = ["given", "middle", "family", "maiden"]

[[change]]
issue = "fix(credential-pair-order) a split credential and a suffix render in written order"
# 'John Smith, Jr. Ph. D.': 1.4 rendered the pair as 'Ph. D., Jr.',
# 2.x renders 'Jr. Ph. D.' -- the order the name was written in.
# tests/v2/cases.py carries the same input under this classification.
#
# The trailing-Ph. D. exclusion refused this name until #413's harvest
# brought it into a corpus. That is the arrival the entry predicted in
# writing and told its reader to narrow for, so the entry was narrowed
# and the name reads here. Only `suffix` moves -- the given and family
# names are untouched by the order the credentials render in.
#
# POSITION is load-bearing. fix(comma-family) below matches this name
# too, and its ["given","title","suffix"] is a superset of the {suffix}
# moved here, so whichever is written first wins -- both carry a
# name_regex, and _sorted_rules is stable within that tier. Written
# after it, this rule explains nothing and the name files under "lone
# post-comma piece routes to suffix/title".
name_regex = "(?i)^[\\u0000-\\u024f]*,\\s*jr\\.?\\s+ph\\.?\\s*d\\.?\\s*$"
fields = ["suffix"]

[[change]]
issue = "fix(A2) content-free input names nobody, so every role empties"
# '(' / '.,': v1 kept a punctuation-only string as a name -- parse('.')
# read first='.' -- and 2.0 empties input with no name content in it.
# decisions.md#A2. Five corpus names are content-free ('', '()', ',',
# '(', '.,'); two of them diff at this baseline and the other three
# were already empty on both sides.
#
# Written ABOVE `fix(comma-family) lone post-comma piece routes to
# suffix/title, not first` deliberately -- that rule, well down the
# file, and NOT the comma-family rule sitting immediately below this
# one, which is anchored to a literal name and cannot reach '.,' at
# all. Both carry a name_regex so they share a tier, where
# _sorted_rules' stable sort leaves file order deciding, and that
# rule's Latin-range comma regex reaches '.,' -- which is how a comma
# rule came to explain an emptying that has nothing to do with commas.
# (Its regex was a bare ',' until #372; the Latin anchoring it has
# now reaches '.,' just the same. That rule's own comment owns the
# story of what the anchoring keeps off it, and the count with it --
# restating either here is how one copy goes stale while the other
# does not.) _CROSS_RULE_WINNERS pins the reassignment.
#
# `\W` rather than a punctuation class, because it IS A2's own
# predicate: _assemble.py decides the emptying with `not
# any(c.isalnum() ...)`, and across all of Unicode `\w` and isalnum
# diverge on exactly one codepoint -- U+005F, which A2 empties and
# this rule does not claim. So the rule is a strict SUBSET of the
# behavior it names, by construction rather than by measurement: it
# cannot claim a name A2 leaves alone. Being Unicode-aware, it also
# puts any name carrying a letter or digit in any script outside
# itself, which is why it matches none of validate_rules' sentinels.
name_regex = "^\\W*$"
fields = ["given"]

[[change]]
issue = "fix(comma-family) a comma followed only by titles keeps the given/family split"
# 'Bob Jones, author' / 'Bob Jones, compositeur': the comma is followed
# by nothing but a title word, which said nothing about where the
# family name ends, so the pre-comma name keeps its positional read --
# first 'Bob Jones' -> given 'Bob', family 'Jones', the title staying
# where it was (the post-comma word is a title on both sides). 2.0 had
# merged the pre-comma run into the family (the comma-precomma-family
# rule below, whose fields would absorb this move -- written ahead of
# it so the name files here and that rule's count tells).
name_regex = "(?i)^bob\\s+jones,\\s*[a-z]+$"
fields = ["given", "family"]

[[change]]
issue = "fix(comma-family) a comma followed only by titles keeps the given/family split, the C1 example"
# 'John Smith, Mr.' and 'John Smith, Mr. Jr.': the rules.md#C1 examples
# of the rule above (first 'John Smith' -> given 'John', family
# 'Smith'; the title stays where it was; with the postnominal, v1's
# first 'Jr.' is the suffix). Without this rule the second landed on
# the fields-only fix(suffix-routing) catch-all, back when that
# catch-all declared `given` as well; once #451 narrowed it to
# {family, suffix} a {given, family, suffix} diff stopped being a
# subset of it, and #451 has now deleted it outright. Measured both
# before and after that deletion: with this rule removed the diff is
# UNEXPLAINED. Its own literal rather than an alternation with 'Bob
# Jones', which would be no vocabulary.
name_regex = "(?i)^john\\s+smith,\\s*mr\\.?(\\s+jr\\.?)?$"
fields = ["given", "family", "suffix"]

[[change.precedes_narrower]]
issue = "fix(comma-precomma-family) pre-comma run reads as family, not given"
why = """
LIVE -- one of the two live pairs in this file, and the one where the
narrower rule would be actively WRONG rather than merely partial.
'John Smith, Mr.' diffs {given, family}, which the precomma rule
admits, so nothing but file order keeps it here.

The discriminator is what becomes of the pre-comma run. Measured, 2.x
CREATES a split across it where 1.4 had none: 1.4 read first 'John
Smith' with no family at all, and the tree reads given 'John', family
'Smith'. So the precomma rule's stated behaviour -- the pre-comma run
reads as family -- is half true of this name and no more: 'Smith'
becomes the family, 'John' does not. This rule describes the split;
that one describes the whole run moving, which is not what happens
here.

That claim is about THIS name and is deliberately not generalised to
the precomma rule's other names. 'Dr. Do Van Johnson, MD' is one of
its seven and its pre-comma run splits too, so "that rule only ever
explains whole-run moves" would be false -- which is the shape of
argument to distrust here, since nothing recomputes a claim about
another rule's names.

'John Smith, Mr. Jr.' sits beside it latently: {given, family,
suffix} is outside the precomma rule's fields at any position.
_CROSS_RULE_WINNERS has no row for either name. It pins the sibling
decision instead -- ('Bob Jones, author', ('family','given')) to the
unsuffixed C1 rule above, on the note that "the rule written for that
shape is ahead of the precomma merge in the file" -- and this rule is
that rule's suffixed twin."""

[[change]]
issue = "fix(#296) a dropped prenominal takes the name position it occupies"
# 'Do Quang Minh': 'do' left TITLES -- a postnominal (D.O.) and a
# Vietnamese surname, never a prenominal -- so a leading 'Do' is no
# longer peeled as a title and falls through to the positional read:
# title 'Do', first 'Quang' -> given 'Do', middle 'Quang'. The
# 2026-07-30 audit table's disposition; 'phd', 'jr', 'junior' and
# 'se' left with it, and no corpus name leads with a bare one (the
# three that lead with 'Jr.' are read by the period inference and do
# not move). The rule's second name is 'MD, DO, DDS': title 'DO' ->
# given 'DO', the comma anchor's one corpus hit. `family`
# is deliberately OUT of the field list: the family name must not
# move on this rule, so a regression there stays loud. The anchors
# are the two openings a name has (start, or after a family comma).
name_regex = "(?i)(^|,\\s*)do\\b"
fields = ["title", "given", "middle"]

[[change]]
issue = "fix(#296) dr is not postnominal vocabulary, so a trailing Dr. is a name word"
# 'John Smith Dr.' and 'dr Vincent van Gogh dr' with its #100 siblings
# (and, at 2.x only, 'Smith Dr', which 1.4.0 already read as the
# family): 'dr' left SUFFIX_WORDS, where it was v1
# residue -- 'Dr.' is not a postnominal in any tradition -- so a
# trailing bare 'Dr' is no longer suffix vocabulary and falls to the
# positional read, taking the family name with it. NOT a new class:
# no trailing title-only word routes to title on the no-comma path
# ('John Smith Prof.' reads family 'Prof.' at every baseline), and
# the suffix entry was the only thing making 'dr' the exception. #316
# is the open question for the class.
name_regex = "(?i)\\sdr\\.?$"
fields = ["middle", "family", "suffix"]

[[change]]
issue = "fix(#296) a credential-only comma string reads a name and its postnominal"
# 'Jr., PhD' / 'MD, PHD': a string that is nothing BUT credentials.
# v1 read the trailing one as a title and the leading one as a first
# name; with 'phd' out of TITLES the comma structure reads it as a
# one-word name plus a postnominal -- a reading of a string nobody
# writes as a name, and the honest one for it.
name_regex = "(?i)^[a-z]{2,3}\\.?,\\s*phd$"
fields = ["title", "given", "family", "suffix"]

[[change.precedes_narrower]]
issue = "fix(comma-family) lone post-comma piece routes to suffix/title, not first"
why = """
LATENT. Both names move {title, given, family, suffix}, and the
routing rule declares no `family`, so it is ineligible for them
wherever it sits -- file order decides nothing here today. What the
declaration records is the hazard that wakes if that rule's `fields`
ever grow `family`, and its own comment disclaims precisely that
growth ("family/`last` is unchanged either way -- pre-comma is
definitionally family") while the family move is the whole of the
credential reading here: 'MD' stops being a first name and becomes the
one-word name. This rule is the routing rule PLUS the pre-comma merge
on a single string, so a widened routing rule would take the union and
report only half of it. _CROSS_RULE_WINNERS pins 'MD, PHD' here,
keyed by the name alone since #497, and the shape it is adjudicated
at -- ('family','given','suffix','title') -- is the one
compare._RECORDED_DIFFS records for the name. Both names sit in
corpus_issues.jsonl alone -- radar since #468's tier split, and
untouched by #488, which created corpus_cjk_tolerated.jsonl and holds
neither name -- so neither can demand a rule any more and nothing
fatal turns on this pair. The tier reaches the NAMES, not both rules:
measured, this rule explains two names and both are radar, which made
it a candidate for #495; the routing rule explains eight of which FIVE
are contract, and was not one. (Six shipped here in #499 and is what
tiering by FILE MEMBERSHIP gives, with a correct _CORPUS_TIERS: it
counts 'John Smith, Dr.' contract because corpus_shapes.jsonl holds a
copy. The dedup is on (name, order), and that copy carries shape 4,
whose FAMILY_FIRST order makes it a SECOND entry rather than the
dedup winner -- verified at baseline 2.0.0, where the run compares
both -- and shape 4's min_baseline of 2.0.0 puts it among the seven
this baseline skips. So the only entry a 1.4.0 run compares for that
string is the radar one from corpus_issues.jsonl. Tier here is a
property of the ENTRY the run compared, not of the files the string
sits in.) #495 is now closed as not planned and
the radar-only rules keep their place, so both halves of that
measurement are facts about REACH and no longer a question about
either rule's life -- docs/design/decisions.md#differential-ledger's
Declined entry on #495 has the population and why deleting one
mislabels rather than merely loses."""

[[change.precedes_narrower]]
issue = "fix(comma-precomma-family) pre-comma run reads as family, not given"
why = """
LATENT by the same arithmetic and for a different reason: a four-field
diff cannot fit {given, family} at any position, so the precomma rule
is ineligible for these two wherever it sits. The hazard here is a
rule that is this one's PRE-COMMA HALF alone. 'MD' going given ->
family really is its shape, so a reader widening it would have a
plausible-looking case -- and it would then explain a credential-only
string as a name with a listing comma, losing the postnominal reading
that moves the title and the suffix in the same breath. A string that
is nothing but credentials is not a name plus a comma. Radar tier
since #468 on both names -- corpus_issues.jsonl, which #488 did not
touch -- so this pair is watched rather than enforced, and again only
the wider rule was ever #495's business.
Measured, the precomma rule explains seven names of which three are
contract ('Berg, abdul vd', 'Smith, Dr.', 'Smith, de Mesnil Jean'), so
