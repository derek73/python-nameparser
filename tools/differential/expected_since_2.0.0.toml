# Ledger for baseline 2.0.0 -- what changes for a user upgrading from
# the previous minor. Same rule grammar as expected_since_1.4.0.toml:
# every rule needs `issue`; optional `name_regex` and `fields` narrow
# it, and compare.py sorts name_regex rules ahead of fields-only ones.
#
# `fields` names roles the way Role does, for BOTH compared surfaces,
# plus the pseudo-field `_ambiguities`. The roster is deliberately not
# restated here -- it is Role's members, validate_rules rejects
# anything outside them, and a copy in prose goes stale the day a role
# is added. A rule saying "first" or "last" is rejected at startup.
#
# Rules here are NOT a subset of the 1.4 ledger's. That one classifies
# everything 2.x changed since 1.4, including what 2.0 itself changed;
# this one classifies only what 2.1 changed on top of 2.0. A rule
# copied across without checking will either over-match (hiding a real
# 2.1 regression behind a 2.0-era label) or never fire.
#
# Every rule below carries a `name_regex`, so they all sit in one tier
# and file order breaks ties between them. Where that matters it is
# said on the rule; the ordering decision made twice here is that the
# GLUED honorific rule precedes the SPACED one, because a name can
# carry both shapes at once.

[[change]]
issue = "fix(#271/#272/#298) native-script CJK: family-first order, hangul segmentation, the kana license and the dots"
# The 2.1 East Asian defaults, in the fields they move name pieces
# between. '毛 泽东' and '毛泽东' read family-first through the new
# Policy.script_orders (#271); '김민준' and '남궁민수' additionally
# split, hangul segmentation being on by default (#271), which is also
# where the one _ambiguities diff in the run comes from -- 남궁민수 now
# reports SEGMENTATION, a kind 2.0 did not have. '高橋 みなみ' and
# '山田 エミ' take the same order rule under the kana license (#272),
# while a wholly-katakana transcription ('マイケル・ジャクソン') is
# excluded from the kana license and stays positional. A hangul
# transcription like '마이클·잭슨' is a different mechanism -- it
# divides on the 间隔号 below and its pieces then read positionally. The two dots divide tokens: the
# nakaguro ・/･ unconditionally (#272) and the 间隔号 · between
# classified-script characters (#298), so 'マイケル・ジャクソン',
# '威廉·莎士比亚' and '马丁·路德·金' come apart where 2.0 held one
# token. '〆木 太郎' rides in this class too: #303 counts the shime
# mark as Han, which is what puts the name in scope of the order rule
# at all.
#
# One rule, not five, for the reason the 1.4 ledger gives its twin:
# these are one diff shape -- pieces moving between given/middle/family
# on a native-script CJK name -- and splitting by issue would need a
# rule per script and per dot with no gain in tightness, the fields
# list being the narrow half.
#
# `suffix` is deliberately absent, which is what keeps this rule from
# swallowing the honorific work below; `maiden`, `nickname` and `title`
# are absent for the same reason against the compound rules further
# down. The class is copied verbatim from the same rule in
# expected_since_1.4.0.toml rather than rewritten in literal
# characters, so the two ledgers spell the same class the same way.
#
# tests/v2/test_ledger_guards.py pins this copy, and the honorific
# alternations below, by sweeping every expected_since_*.toml rather
# than naming one (#333). A span removed from the script table, or an
# entry removed from SUFFIX_WORDS or GLUED_HONORIFICS, now
# forces this file to narrow with it instead of leaving a wide twin
# behind to classify a real regression as intended.
name_regex = "[\\u3005-\\u3006\\u3040-\\u309F\\u30A0-\\u30FF\\u3400-\\u4DBF\\u4E00-\\u9FFF\\uF900-\\uFAFF\\uAC00-\\uD7A3\\uFF65-\\uFF65]"
fields = ["given", "middle", "family", "_ambiguities"]

[[change]]
issue = "fix(#308/#312/#319/#320) glued CJK honorific peeled off the name into suffix"
# '田中さん', '김민준씨', '王小明先生', 'Andersonさん': #308 splits an
# honorific written against the name off the end of its token and
# routes it to `suffix`, where 2.0 left it inside the name. #312 lets
# the peel reach across a comma ('김, 민준씨', '田中, 太郎さん',
# '威廉·莎士比亚さん'), #319 makes it survive an all-credential
# post-comma run ('田中さん, V.', '田中さん, Ph. D.', '김민준씨, V.',
# '김민준씨, J.씨'), and #320 stops an ASCII period vetoing the
# honorific it finds there ('田中さん 様.', '田中さん, 様.'). Every one
# of them is the same diff shape, so they share a rule; the peeled name
# then goes through the ordinary machinery, which is why `given` and
# `family` move alongside `suffix` (김민준씨 -> family 김, given 민준,
# suffix 씨).
#
# Keyed on GLUED_HONORIFICS specifically -- the peelable subset -- and
# not on the wider spaced vocabulary, because that subset is exactly
# the vetting this rule needs. 양, 군, 氏, 博士, 殿 and 君 are excluded
# from it precisely because they can END a name (김지양 is a given
# name, 鵜殿 a surname), so keying on the wider set would let this rule
# claim a suffix regression on '김지양' or '鵜殿' -- names that are in
# this run for the order flip alone and must stay in the rule above.
#
# The lookbehind is the glued half: the honorific must sit against a
# preceding non-space, non-comma character, so a SPACED honorific never
# matches here and falls through to the rule below. The trailing
# `\.?(?=$|[ ,])` is the whole-token half, judged on the name STRING:
# without it any name merely CONTAINING one of these strings would
# match, and the optional period is #320's shape. `middle` is
# deliberately not in `fields` -- no glued diff in this run carries
# one, and admitting it would pre-excuse a middle regression that the
# spaced rule below legitimately has.
#
# Sits AHEAD of the spaced rule on purpose. Three names match BOTH
# rules -- '田中さん 様.', '田中さん, 様.' and '김민준 박사님' -- and
# both rules are in the name_regex tier, so file order is the only
# thing deciding which label they report under (measured 2026-08-05).
# The glued さん is the piece #308 moves, so this label is the true one.
# ('선생님, J.씨' is NOT one of them: it opens with a spaced honorific
# at index 0, which this file's spaced rule deliberately no longer
# matches, so only this rule claims it and no ordering is involved.)
#
# One name lands here that is spaced, and it is left that way: the
# SPACED '김민준 박사님' matches on its 님, which sits glued to 사
# inside 박사님 and ends the string. The label is still true of it --
# #308 is the change that added 박사님 to the vocabulary at all, so its
# spaced form routes to `suffix` because of #308 -- and closing the
# overlap would take a lookbehind asserting the match is not interior
# to a longer listed honorific, which is more machinery than a correct
# label is worth here.
name_regex = "(?<=[^\\s,])(?:박사님|선생님|교수님|박사|씨|님|先生|女士|小姐|教授|様|さん|さま|くん|ちゃん)\\.?(?=$|[ ,])"
fields = ["given", "family", "suffix"]

[[change]]
issue = "fix(#307/#308/#320) spaced CJK postnominal honorific routed to suffix"
# '王小明 先生', '김민준 씨', '田中 太郎 様', '田中 殿': #307 ships the
# spaced CJK honorifics as suffix vocabulary, so a trailing 先生/씨/様
# moves to `suffix` where the family-first default of 2.1 would
# otherwise have made it the given name. #308 added さん, さま, くん,
# ちゃん, 殿, 님 and 박사님 to that vocabulary, so their spaced forms
# ('田中 さん') move here too -- though not '김민준 박사님', which the
# glued rule above claims first on its 님; see the note there. #320
# lets a trailing
# ASCII period through ('김민준 씨.', '김민준 양.').
#
# Whole-token on the name STRING -- preceded by a space or comma,
# followed by end, space or comma, with #320's optional period between.
# That anchor is what the 1.4 ledger's honorific rule exists to
# explain: unanchored, any name ENDING in 양 or 군 would match, and a
# real suffix regression on the glued given name '김지양' would be
# absorbed as intentional. The alternation is the CJK half of
# SUFFIX_WORDS. It is written longest-first for readability,
# not for correctness: the trailing `(?=$|[ ,])` forces backtracking
# out of a short alternative, so '박사|박사님' matches '박사님' too
# (measured 2026-08-05, and the 1.4 ledger's twin lists them in that
# order and works).
#
# The leading `^` alternative this rule used to carry has been REMOVED,
# because it reopened at the head exactly the hole the tail anchor
# closes. 양 and 군 are honorifics in trailing position and ordinary
# SURNAMES in leading position -- Yang and Gun -- so '양 미선' matched
# on its own surname. Today that name's diff is {given, family} and the
# CJK order rule above claims it first, so nothing was misclassified;
# but a future change routing the leading 양 to `suffix` would give
# {given, family, suffix}, which is no longer a subset of that rule's
# fields, and it would fall through to THIS rule -- whose fields do
# include suffix -- and be reported as an intended honorific. A surname
# silently reclassified as a suffix is the regression class this gate
# exists to catch. A postnominal honorific is by definition not at the
# start of the name, so nothing legitimate needs the head match:
# dropping it leaves all 89 diffs classified (measured 2026-08-05).
#
# `middle` is in `fields` here where the glued rule omits it, and the
# reason is measured: a three-token spaced name loses its middle to the
# order flip while the honorific leaves ('田中 太郎 様' -> given 太郎,
# family 田中, suffix 様; '김민준 박사 씨' likewise).
name_regex = "[ ,](?:박사님|선생님|교수님|박사|씨|님|군|양|先生|女士|小姐|博士|教授|様|氏|殿|さん|さま|くん|ちゃん)\\.?(?=$|[ ,])"
fields = ["given", "middle", "family", "suffix"]

[[change]]
issue = "fix(#309) 旧姓 maiden marker consumed, compounding with the CJK order flip"
# '山田 花子 旧姓 佐藤', '山田花子 旧姓 佐藤': #309 adds the Japanese
# maiden-name marker to the default vocabulary, so the marker is
# consumed and the name behind it routes to `maiden`, where 2.0 left
# both as plain name text. `given`/`family` move in the same parse
# because the remainder is wholly Han and takes the family-first
# reading (#271), and `middle` empties because that is where 2.0 held
# the marker.
#
# The regex is the marker itself, so the rule can claim nothing that
# does not contain it. Note what is NOT here: '山田 花子（旧姓 佐藤）'
# is in this run as a bare {given, family} order flip, classified by
# the first rule. #329 is gated on a non-empty Policy.maiden_delimiters
# and the harness runs the default policy, where （） is a #273
# NICKNAME delimiter -- so no #329 diff can appear at all, and adding a
# rule for one would be an allowlist entry covering nothing.
name_regex = "旧姓"
fields = ["given", "middle", "family", "maiden"]

[[change]]
issue = "fix(#272) nakaguro inside delimited content renders as a space, compounding with the CJK order flip"
# '山田 太郎 (マイケル・ジャクソン)': the nakaguro is a token separator
# now, and rendering follows it, so the extracted nickname comes back
# 'マイケル ジャクソン' where 2.0 echoed the dot -- while the wholly-Han
# remainder takes the family-first flip in given/family. Neither
# single-change rule may claim the union: the first rule's fields
# exclude `nickname` on purpose, so a lone nickname regression stays
# loud.
#
# Both lookaheads are required. A delimiter alone matches every
# parenthesized nickname in the Latin corpus and would let this rule
# absorb a bare given/family regression on one; the nakaguro alone is
# already in the first rule's territory. Requiring both confines the
# rule to the one shape it explains. No `middle`: this diff has none,
# and the 1.4 ledger's twin rule reserves that field for the fullwidth
# pair, which under the default policy cannot produce a 2.1 diff.
name_regex = "(?s)(?=.*[・･])(?=.*[(（「『])"
fields = ["given", "family", "nickname"]

[[change]]
issue = "fix(#298) 间隔号 division changes the comma reading, sending the credential from title to suffix"
# '威廉·莎士比亚, PhD': one name, two intended changes at once. #298
# divides the transcription, so the pre-comma run is two words where
# 2.0 saw one, and the comma structure that follows from the word count
# re-reads the lone post-comma credential -- PhD moves out of `title`
# and into `suffix` -- while given/family take #298's division itself.
# Neither the first rule (whose fields exclude title/suffix, on
# purpose) nor the honorific rules (which key on vocabulary this name
# has none of) may claim the union.
#
# All three lookaheads are required. A comma alone matches every Latin
# 'Smith, Jr.' in the corpus; the interpunct alone is the Catalan punt
# volat too ('Gal·la Marcet'), which is exactly the input class #298's
# flank guard exists to protect; the classified-codepoint lookahead is
# what confines the rule to names #298 can actually reach, and its
# class is the same pinned copy of _SCRIPT_RANGES the first rule
# carries.
#
# The interpunct is written as an escape rather than as itself, alone among
# the punctuation spelled literally in this file: · (U+00B7), ・
# (U+30FB) and ･ (U+FF65) are three different separators with three
# different rules in 2.1, and they are indistinguishable enough on
# screen that a literal here would be unreviewable.
name_regex = "(?s)(?=.*,)(?=.*\\u00B7)(?=.*[\\u3005-\\u3006\\u3040-\\u309F\\u30A0-\\u30FF\\u3400-\\u4DBF\\u4E00-\\u9FFF\\uF900-\\uFAFF\\uAC00-\\uD7A3\\uFF65-\\uFF65])"
fields = ["given", "family", "title", "suffix"]

[[change]]
issue = "fix(#380) a trailing vd after a family comma is the tussenvoegsel, not a post-nominal"
# 'Berg, Jan vd'. The 2.1 ledger carries the same rule and the full
# reasoning; `vd` is in both the particle and suffix-acronym
# vocabularies, and 2.2 attaches it to the family the comma already
# named (rules.md#P6) where 2.0 read it as a post-nominal. Arrived via
# corpus_rules.jsonl (#414), which is the arrival fix(#379) below
# predicted in writing.
name_regex = "(?i)^[\\u0000-\\u024f]*,[\\u0000-\\u024f]*\\svd\\s*$"
fields = ["family", "suffix"]

[[change]]
issue = "fix(#399) a maiden marker bounds the particle chain that swallowed it"
# 'Jane de la née Jones', 'Jane van der Berg née Jones', 'John van der
# Berg née Jones'. Same rule and same reasoning as the 2.1 ledger's
# copy: the particle chain swallowed the marker before the maiden
# consumer could see it, so the family kept both the marker and the
# maiden name. The particle requirement keeps this off 'Jane Smith née
# Jones', which is in the corpora and does not move. The anchors keep
# it off the trailing-marker shape, the connective join and the
# post-comma bound-given join -- M2's accepted limits. 'Jane van der
# Berg nee PhD' is still claimed and does not move: excluding a suffix
# tail needs a second vocabulary alternation, and the guards allow one
# per rule. See the 2.1 ledger's copy for the argument.
name_regex = "(?i)^(?![^\\n]*,)[^\\n]*\\b(de|del|den|der|di|do|dos|du|la|le|los|mc|van|vd|von|zu)\\b.*?\\sn[e\u00e9]e\\s+\\S+$"
fields = ["family", "maiden"]

[[change]]
issue = "fix(#360) mc moved into the never-given particles, so it folds into the family"
# 'Mc Donald'. A data change (6389f06), not a rule change: `mc` moved
# out of the ambiguous half of the particle vocabulary, so P1's fold
# takes it into the family and the particle-or-given fork it used to
# report stops being a fork. `_ambiguities` is claimed for that reason
# and is the v2 surface only.
name_regex = "(?i)^mc\\s+\\S+$"
fields = ["given", "family", "_ambiguities"]

[[change]]
issue = "fix(#411) the bound-given reserve stops counting words the maiden name takes"
# 'van der Berg, abdul nee Jones': P5 reserves a name word so the join
# always leaves a family name behind, but the reserve was counted while
# the marker and the maiden name were still pieces -- group's marker
# pass runs later in the same stage. Counting words that were about to
# leave answered the question about a name that would not exist.
#
# The fields here are the SIDE EFFECT rather than the defect. #411's
# own shape is an emptied family ('abdul Berg nee Jones' read given
# 'abdul Berg', family ''), and no BASELINE shows it -- every released
# version already reads the corpus names carrying that shape the way
# the fix does, so none of them can produce a #411 diff to classify.
# ('abd Berg nee Jones' IS in corpus_rules.jsonl, and goes unexplained
# at all three baselines if the fix is reverted, which is the guard
# working.)
#
# What this corpus
# name shows is the other half: with the reserve counted correctly the
# join declines, so the marker is never merged into 'abdul nee' and
# M2's bound sees a lone marker piece for the first time. That closes
# one of the two join-swallows #412 tracks; P3's connective join is
# the one that survives.
#
# `abdul` is a LITERAL, not an alternation over BOUND_GIVEN_NAMES, and
# the words are NOT interchangeable here. 'abd' is the one shipped word
# in both the bound-given and the suffix vocabulary, so after a family
# comma a declining join leaves the S2 suffix reading instead: 'van der
# Berg, abd nee Jones' moves {given, middle, suffix, maiden}, and the
# extra field breaks the subset test, so it would arrive UNEXPLAINED --
# correct, but not what an alternation over the vocabulary would lead
# an author to expect. 'abdel', 'abdal' and the Arabic spelling do
# behave like 'abdul'; only this name is in the corpora.
name_regex = "(?i),\\s*abdul\\s+n[eé]e\\b"
fields = ["given", "middle", "maiden"]

[[change]]
issue = "fix(#400) abd joins the word after it as one given name"
# 'abd Allah Smith' and 'Salam, abd Allah'. `abd` joined
# BOUND_GIVEN_NAMES so the spellings writing the article separately
# join like `abdul` already did. Both openings move, hence the
# alternative anchors; `abd` is also the postnominal ABD, which the
# anchors keep out.
#
# A third corpus name is claimed and does NOT move: a bare 'abd Allah',
# which has no third word for the join to leave as a family name, so
# P5's reserve declines and it reads given 'abd', family 'Allah' at
# every baseline. Same behaviour family as the two that move, so the
# claim is defensible -- recorded so it is not mistaken for coverage.
name_regex = "(?i)(?:^|,\\s*)abd\\s+\\S+"
fields = ["given", "middle"]

[[change]]
issue = "fix(#367) a title no longer displaces a leading never-given particle"
# 'Sir de Mesnil'. The never-given half of the rule below, which named
# this very name as a future arrival. Separate rather than widened
# because the guards allow one vocabulary alternation per rule, and
# the fields differ for a real reason: a never-given particle folds
# into the family under P1, emptying the given side, where the
# ambiguous half leaves a family behind.
name_regex = "(?i)^sir\\s+de\\b"
fields = ["given", "family"]

[[change]]
issue = "fix(#272/#308) nakaguro division and a glued hangul honorific in one name"
# '马丁·路德·金씨': two 2.1 behaviours meeting in one name, which is why
# neither of the single-cause rules above claims it. The nakaguro
# divides the name into given/middle/family (#272/#298) AND the glued
# 씨 peels off into `suffix` (#308), so all four roles move at once
# where each rule alone accounts for a subset.
#
# Written as literals -- a nakaguro anywhere in a spaceless name that
# ends in 씨 -- rather than as an alternation over the honorific
# vocabulary, which would need a _HONORIFIC_SOURCES declaration for a
# rule that is about the COMBINATION rather than about the vocabulary.
# It claims exactly the one corpus name; another combination name
# should arrive UNEXPLAINED and be read once.
name_regex = "^\\S*\u00b7\\S*\uc528$"
fields = ["given", "middle", "family", "suffix"]

[[change]]
issue = "fix(#369) a given-name title licenses the bound given-name join with one word to spare"
# 'Sheik abdul salam': rules.md#P5 -- "or after a given-name title,
# which asserts that a given name follows (H1): there the two words
# join and the name has no family". Given 'abdul', family 'salam'
# becomes given 'abdul salam', family '' -- the empty family H1
# accepts for "Sir John". The 'Sheik abdul salam Jr' rules example
# is the same move with the suffix standing; 'Sheik abdul Jr Smith'
# is in reach and does not move -- the licence takes a name word,
# not a suffix.
#
# 'Sheik Abu Bakar', the #367 regression this issue was filed for,
# reads given 'Abu Bakar' again with every field byte-identical to
# this baseline, so no rule names its fields: restored, not moved.
name_regex = "(?i)^sheik\\s+abdul\\b"
fields = ["given", "family"]

[[change]]
issue = "fix(#401) the bound-given reserve counts the trailing numeral assign reads as the suffix"
# 'abdul Smith V', 'abdul Smith Jr V': rules.md#P5 -- "a trailing
# roman numeral that assign reads as the suffix (S2) is no word to
# spare, and is not joined". given 'abdul Smith', family '' -> given
# 'abdul', family 'Smith'; the suffix was already read at this
# baseline, which is why the 1.4.0 rule lists three fields and this
# one two. Both are rules.md examples; no differential corpus name
# has the shape, and the 'abdul Smith V Ph. D.' spelling stays out of
# the corpus (the 1.4.0 ledger's [[never]] shape).
name_regex = "(?i)^abdul\\s+smith\\s+(jr\\s+)?v$"
fields = ["given", "family"]

[[change]]
issue = "fix(#421) the bound-given join never absorbs a suffix piece"
# 'abdul Jr Smith Berg': rules.md#P5 -- "the join never absorbs a
# marker standing as a word of its own -- a marker is not a name word
# (M2) -- nor a word of the unambiguous suffix vocabulary (S2),
# wherever position will then place it". given 'abdul Jr', middle
# 'Smith' -> given 'abdul', middle 'Jr Smith'. Parity with this
# baseline until now; a
# rules.md example, since no differential corpus name has the shape.
name_regex = "(?i)^abdul\\s+jr\\s+smith\\s+berg$"
fields = ["given", "middle"]

[[change]]
issue = "fix(#421) the bound-given join never absorbs a split credential"
# 'abdul Ph. D. Smith Berg': the rule above, on the split credential
# -- a 2.0 regression: given 'Smith', suffix 'abdul Ph. D.' -> given
# 'abdul', middle 'Smith', suffix 'Ph. D.', the suffix field 1.4.0's
# again (that ledger carries the given's own story). A rules.md
# example; no differential corpus name has the shape.
name_regex = "(?i)^abdul\\s+ph\\.\\s+d\\.\\s+smith\\s+berg$"
fields = ["given", "middle", "suffix"]

[[change]]
issue = "fix(#425) the bound-given reserve runs assign's peel over the joined view"
# 'abdul Smith Jr Ma', 'abdul Smith Ma': rules.md#P5 -- "the join is
# tried on the pieces as it would leave them, assign's trailing peel
# (S2) is read over that, and the name words it leaves are the words
# to spare" and "a word the peel reads as a suffix unjoined must read
# so joined, or the join declines". given 'abdul Smith', family '' ->
# given 'abdul', family 'Smith' (the acronym and the suffix peel as
# they do for 'John Smith Jr Ma'); given 'abdul Smith', family 'Ma'
# -> given 'abdul', family 'Smith', suffix 'Ma' (the join would have
# turned a credential into the family). Both 1.4.0 parity, so the
# 1.4.0 ledger has no twin. Rules.md examples; no differential corpus
# name has either shape.
name_regex = "(?i)^abdul\\s+smith\\s+(jr\\s+)?ma$"
fields = ["given", "family", "suffix"]

[[change]]
issue = "fix(#424) an unlisted abbreviation is as transparent as a listed title to the leading particle, the P4 example"
# 'Xyz. van Johnson': the rules.md#P4 example of the 'Esq. van Gogh'
# rule of this change (beside the fix(#367) rules, further down),
# same reading and fields. Separate rather than an alternation, per
# the guards' one-alternation-per-rule roster.
name_regex = "(?i)^xyz\\.\\s+van\\s+johnson$"
fields = ["given", "family", "_ambiguities"]

[[change]]
issue = "fix(#424) a title-led chain before the numeral is the one name piece"
# 'Freiherr von Richthofen V': rules.md#P2 boundary -- the chain stops
# before the numeral, and the chain is then the one name piece, which
# reads as 'Dr. Smith V' reads. The baseline read family 'von
# Richthofen V'; #424 split the numeral off as the suffix, and #410
# then moved the one name piece behind the title out of `given`, so
# the reading today is family 'von Richthofen', suffix 'V' -- and
# 'Dr. Smith V' moved with it, so the comparison still holds. A
# rules.md example.
#
# #410 narrowed this diff rather than adding one: {given, family,
# suffix} before it, {family, suffix} after. `fields` declares the
# wider set, so the name stayed classified here and no run reported
# it moving.
name_regex = "(?i)^freiherr\\s+von\\s+richthofen\\s+v$"
fields = ["given", "family", "suffix", "_ambiguities"]

[[change]]
issue = "fix(#424) accepted: a particle of the suffix vocabulary opening the trailing run is a suffix piece"
# 'John Smith Mc V': rules.md#P2 Accepted -- "where it opens the
# trailing run the chain stops before it as before any suffix word,
# and the peel takes it". middle 'Smith', family 'Mc V' -> family
# 'Smith', suffix 'Mc, V'. A rules.md example; the class was found
# unrecorded by the second docs review of #424.
name_regex = "(?i)^john\\s+smith\\s+mc\\s+v$"
fields = ["middle", "family", "suffix", "_ambiguities"]

[[change]]
issue = "fix(comma-family) a comma followed only by titles keeps the given/family split"
# 'Bob Jones, author' / 'Bob Jones, compositeur': the comma is followed
# by nothing but a title word, which said nothing about where the
# family name ends, so the pre-comma name keeps its positional read --
# family 'Bob Jones' -> given 'Bob', family 'Jones', the title staying
# where it was. The FAMILY_COMMA rule that segment 0 is wholly the
# family rests on the writer having marked where it ends; a comma
# followed only by titles marked nothing ('John Smith, Mr.' is 'Mr.
# John Smith' with the honorific moved).
name_regex = "(?i)^bob\\s+jones,\\s*[a-z]+$"
fields = ["given", "family"]

[[change]]
issue = "fix(comma-family) a comma followed only by titles keeps the given/family split, the C1 example"
# 'John Smith, Mr.' and 'John Smith, Mr. Jr.': the rules.md#C1 examples
# of the rule above (family 'John Smith' -> given 'John', family
# 'Smith'; title and suffix stay where they were). Its own literal rather than
# an alternation with 'Bob Jones', which would be no vocabulary.
name_regex = "(?i)^john\\s+smith,\\s*mr\\.?(\\s+jr\\.?)?$"
fields = ["given", "family"]

[[change]]
issue = "fix(#296) a dropped prenominal takes the name position it occupies"
# 'Do Quang Minh': 'do' left TITLES -- a postnominal (D.O.) and a
# Vietnamese surname, never a prenominal -- so a leading 'Do' is no
# longer peeled as a title and falls through to the positional read:
# title 'Do', given 'Quang' -> given 'Do', middle 'Quang'. The
# 2026-07-30 audit table's disposition; 'phd', 'jr', 'junior' and
# 'se' left with it, and no corpus name leads with a bare one (the
# three that lead with 'Jr.' are read by the period inference and do
# not move). The rule's second name is 'MD, DO, DDS': title 'DO' ->
# given 'DO', the comma anchor's one corpus hit. `family`
# is deliberately OUT of the field list: the family name must not
# move on this rule, so a regression there stays loud. The anchors
# are the two openings a name has (start, or after a family comma).
name_regex = "(?i)(^|,\\s*)do\\b"
fields = ["title", "given", "middle", "_ambiguities"]

[[change]]
issue = "fix(#296) dr is not postnominal vocabulary, so a trailing Dr. is a name word"
# 'John Smith Dr.' and 'dr Vincent van Gogh dr' with its #100 siblings
# (and, at 2.x only, 'Smith Dr', which 1.4.0 already read as the
# family): 'dr' left SUFFIX_WORDS, where it was v1
# residue -- 'Dr.' is not a postnominal in any tradition -- so a
# trailing bare 'Dr' is no longer suffix vocabulary and falls to the
# positional read, taking the family name with it. NOT a new class:
# no trailing title-only word routes to title on the no-comma path
# ('John Smith Prof.' reads family 'Prof.' at every baseline), and
# the suffix entry was the only thing making 'dr' the exception. #316
# is the open question for the class.
name_regex = "(?i)\\sdr\\.?$"
fields = ["middle", "family", "suffix"]

[[change]]
issue = "fix(#296) a credential-only comma string reads a name and its postnominal"
# 'Jr., PhD' / 'MD, PHD': a string that is nothing BUT credentials.
# v1 read the trailing one as a title and the leading one as a first
# name; with 'phd' out of TITLES the comma structure reads it as a
# one-word name plus a postnominal -- a reading of a string nobody
# writes as a name, and the honest one for it.
name_regex = "(?i)^[a-z]{2,3}\\.?,\\s*phd$"
fields = ["title", "given", "family", "suffix"]

[[change]]
issue = "fix(#296) a lone post-comma credential is a suffix"
# 'Smith, Jr.' / 'Kim, Jr.' / 'Smith, PhD': rules.md#C1 -- the listing
# form holds with one word before the comma, and the word after it is
# the credential run. v1 put the family in `first` and the credential
# in `title`; 2.0 routed the pre-comma word to the family (the
# comma-family rule below) but the title peel still claimed the
# credential -- 'jr' and 'phd' were title vocabulary, and the
# period-abbreviation inference reads 'Jr.' as a title regardless --
# so the postnominal position is read first now: a post-comma run
# that is nothing but suffix pieces is suffixes. A one-word name, a
# comma, one short word: the reach is pinned by the guards.
name_regex = "(?i)^[a-z]+,\\s*[a-z]{2,6}\\.?$"
fields = ["title", "given", "family", "suffix"]

[[change]]
issue = "fix(#296) a glued honorific before a lone credential: the credential is the postnominal"
# '田中さん, PhD': 'phd' left TITLES, so the lone post-comma credential
# is the suffix it is; the glued-honorific peel is #312's (2.1), so at
# this baseline both halves move: title 'PhD', family '田中さん' ->
# family '田中', suffix 'さん, PhD'.
name_regex = "(?i)^田中さん,\\s*phd$"
fields = ["title", "family", "suffix"]

[[change]]
issue = "fix(#296) do is a name, so it no longer stops the leading-particle scan as a title"
# 'Dr. Do Van Johnson, MD': the fix(#367) title-and-particle rule that
# explained this name is gone with 'do' from TITLES -- a word in both
# the title and particle vocabularies stopped the transparency scan
# and stayed a title piece (master, after #367/#413, read title 'Dr.
# Do'); 'do' is a particle and a name now, and reads as the given
# name. At this baseline: given 'Do Van Johnson' -> given 'Do',
# family 'Van Johnson'; the title 'Dr.' is unchanged here.
name_regex = "(?i)^dr\\.?\\s+do\\s+van\\b"
fields = ["given", "family"]

[[change]]
issue = "fix(#296) dr is not postnominal vocabulary, so 'John Smith, Dr.' keeps its split and its title"
# 'John Smith, Dr.' / 'John, Smith, Dr.': with 'dr' out of the suffix
# sets the post-comma 'Dr.' is a title only, so the comma is followed
# by nothing but titles and the pre-comma name keeps its split (the
# no-name-word repair): suffix 'Dr.' -> title 'Dr.' for the two-part
# spelling. The three-part spelling keeps suffix 'Dr.' (a third part
# is suffix by position) and moves only by gaining the
# COMMA_STRUCTURE report C2 gives a third part that is not suffix
# words.
name_regex = "(?i)^john,?\\s+smith,\\s*dr\\.?$"
fields = ["title", "suffix", "_ambiguities"]

[[change]]
issue = "fix(#325) a split credential followed by another suffix after a one-word family comma reads as suffixes"
# 'Smith, Ph. D. Jr.' and the #325 rows it leads ('Smith, Ph. D. MD',
# 'Smith, Ph. D. III', 'Smith, Ph. D. Jr. MD', 'Smith, Ph.D. Jr.', and
# 'Smith, PhD Jr.', which the regex reaches too -- title 'PhD' at
# every baseline, suffix 'PhD, Jr.' now):
# with one word before the comma the name is the listing form, and
# the space-split 'Ph. D.' followed by another suffix was no longer
# the LONE post-comma piece, so it fell through to the given name --
# a 1.4.0 regression (v1 read suffix 'Ph. D.', title 'Jr.'). The
# whole run is suffixes now. Literal rather than the shape: a shape
# regex absorbed 'Smith, Dr. Jr.', which is the comma-family rule's
# (the comment review).
name_regex = "(?i)^smith,\\s*ph\\.?\\s?d\\.?\\s"
fields = ["title", "given", "suffix"]

[[change]]
issue = "fix(#325) a credential run across a second comma reads as suffixes"
# 'Smith, Jr., PhD': title 'Jr.', suffix 'PhD' -> suffix 'Jr., PhD';
# segments 2+ compose with the run.
name_regex = "(?i)^smith,\\s*jr\\.?,\\s*phd$"
fields = ["title", "suffix"]

[[change]]
issue = "fix(#296) an ambiguous acronym counts as a suffix only when written with its periods"
# 'Jack Ma.': rules.md#S2 -- "written with its periods, one after each
# letter"; a single trailing period is the abbreviation shape any
# word can wear. The gate was "any period" until #296's review, so
# suffix 'Ma.' -> family 'Ma.', which is how 1.4.0 read it.
name_regex = "(?i)^jack\\s+ma\\.$"
fields = ["family", "suffix", "_ambiguities"]

[[change]]
issue = "fix(#424) the particle chain stops before the trailing numeral"
# 'John van der Berg V': rules.md#P2 -- "a trailing suffix begins --
# read as assign will read it (S2): a trailing roman numeral, or a
# bare acronym with words to spare, ends the chain as a suffix word
# does". last 'van der Berg V' -> family 'van der Berg', suffix 'V',
# as 'John Smith V' reads. Shipped since 1.x: the chain's stop asked
# with the suffix-piece test, whose initial veto does not see a bare
# V. A rules.md example; no differential corpus name has the shape.
# The fork's report arrives with the reading.
name_regex = "(?i)^john\\s+van\\s+der\\s+berg\\s+v$"
fields = ["family", "suffix", "_ambiguities"]

[[change]]
issue = "fix(#424) the particle chain stops before a bare acronym with words to spare"
# 'John van der Berg Ma': the rule above, on S2's other fork. family
# 'van der Berg Ma' -> family 'van der Berg', suffix 'Ma', as 'John
# Smith Ma' reads -- and as 1.4.0 read it, so this rule has no 1.4.0
# twin: a 2.0 regression. A rules.md example; no differential corpus
# name has the shape.
name_regex = "(?i)^john\\s+van\\s+der\\s+berg\\s+ma$"
fields = ["family", "suffix", "_ambiguities"]

[[change]]
issue = "fix(#424) the maiden walk stops before the trailing numeral"
# 'John née Jones Smith V': rules.md#M2 -- "takes the words after it
# -- up to any suffix word, or the trailing roman numeral assign
# reads as the suffix (S2) -- as the maiden name". maiden 'Jones
# Smith V' -> maiden 'Jones Smith', suffix 'V'. The walk's stop asked
# with the suffix-piece test too. No 1.4.0 twin: v1 had no maiden
# support, and the fix(#274) rule carries the name there. A rules.md
# example; no differential corpus name has the shape.
name_regex = "(?i)^john\\s+n[ée]e\\s+jones\\s+smith\\s+v$"
fields = ["suffix", "maiden", "_ambiguities"]

[[change]]
issue = "fix(#424) a marker followed only by the numeral is just a word"
# 'Jane Smith née V': the peel is read from the marker, so the V has
# the piece before it the fork wants and reads as the suffix; nothing
# follows the marker but a suffix, the pass declines, and the marker
# stays a word -- as for 'Jane Smith née PhD'. maiden 'V' -> middle
# 'Smith', family 'née', suffix 'V', which is 1.4.0's reading, so
# this rule has no 1.4.0 twin. A rules.md example.
name_regex = "(?i)^jane\\s+smith\\s+n[ée]e\\s+v$"
fields = ["middle", "family", "suffix", "maiden", "_ambiguities"]

[[change]]
issue = "fix(#369) the bound given-name join takes a particle-and-bound word, so no fork is reported"
# 'Sheik Abu Bakar': the fields are byte-identical to this baseline
# (the rule above); what moves is the REPORT. Through 2.1 the particle
# chain took 'Bakar' and reported PARTICLE_OR_GIVEN. The join that
# takes it now is P5's, licensed by the given-name title, and a bound
# word read as the bound word is not a fork.
name_regex = "(?i)^sheik\\s+abu\\b"
fields = ["_ambiguities"]

[[change]]
issue = "fix(#360) ste moved into the never-given particles with mc"
# 'Ste Marie': the second word of the vocabulary move the fix(#360)
# rule explains for `mc`, and that rule named it -- "'Ste Marie',
# 'Los Santos' and 'Das Silva' all move the same way ... The others
# should arrive UNEXPLAINED and be read once." One has. A sibling
# rather than an alternation: the guards allow one vocabulary
# alternation per rule, and the other moved words are in no corpus.
name_regex = "(?i)^ste\\s+\\S+$"
fields = ["given", "family", "_ambiguities"]

[[change]]
issue = "fix(#399) a maiden marker bounds the particle chain: the geb. spelling"
# 'Ursula von der Leyen geb. Albrecht': #399's own headline name, which
# reached the corpus through the backtick harvest (#413) -- it sat in
# that issue's TITLE while #399 shipped noting the class was invisible
# to this harness. A sibling of the fix(#399) rule rather than a
# widened marker slot: making that a vocabulary alternation would be a
# second one, and the guards allow one per rule. The particle
# alternation is identical to that rule's, deliberately -- both resolve
# to the same roster key and must cover the same set.
name_regex = "(?i)^(?![^\\n]*,)[^\\n]*\\b(de|del|den|der|di|do|dos|du|la|le|los|mc|van|vd|von|zu)\\b.*?\\sgeb\\..?\\s+\\S+$"
fields = ["family", "maiden"]

[[change]]
issue = "fix(#424) an unlisted abbreviation is as transparent as a listed title to the leading particle"
# 'Esq. van Gogh' (corpus_issues): rules.md#P4 -- "An unlisted
# abbreviation before the particle is as transparent as a listed
# title, since assign reads it as one (H2)". family 'van Gogh' ->
# given 'van', family 'Gogh', with the PARTICLE_OR_GIVEN report, as
# 'Dr. van Gogh' reads since #367. #367 keyed the leading-particle
# exception on the first piece of the name by group's title test,
# which does not see H2's abbreviations; the scan asks assign's test
# now. Literal for the reason the #367 rule gives.
name_regex = "(?i)^esq\\.\\s+van\\s+gogh$"
fields = ["given", "family", "_ambiguities"]

[[change]]
issue = "fix(#367) a title no longer displaces a leading particle out of the leading position"
# 'Mr. Van Nguyen': a leading particle deliberately does not chain --
# that is what makes 'Van Nguyen' read as given Van, family Nguyen.
# Through 2.1 the exception was keyed on piece index 0, so a TITLE
# displaced the particle and the chain fired, giving family
# 'Van Nguyen' (v1's reading, which is why this name is parity with
# 1.4.0 until now). 2.2 keys it on the first piece of the NAME, so a
# titled name reads as the same text reads untitled.
#
# The wider class is any title followed by a particle -- 'Dr. Van
# Johnson', 'Sir de Mesnil', 'Sheik Abu Bakar' all move (the last restored
# by #369) -- and this
# regex names one title and one particle because 'Mr. Van Nguyen' is
# the one name in the corpora that moves. Deliberately narrower than
# the class: a corpus name that joins it later should arrive
# UNEXPLAINED and be read once, not be absorbed silently. Widen the
# literals then, and record the new count.
#
# Three joined it through #413's backtick harvest: 'Dr. Van Johnson',
# 'Sir Van Johnson', 'Jr. Van Johnson'. The title slot is an
# alternation over TITLES, which all four spellings copy; `jr` reads
# as a title because it is in TITLES and leads, which 1.4.0 already
# did.
# `\.?` earns its place now the literals are spelled out.
#
# The title slot is a LITERAL for that reason and not by accident.
# Nothing in a regex over the raw string can ask whether a word is a
# title, so the `(?i)^\S+\.?\s+van\b` this rule shipped with matched
# ANY first word: it reached 11 corpus names and explained 1. The
# other ten include 'Vincent van Gogh', 'VINCENT VAN GOGH' and
# 'Alex van Johnson' -- the "Van Johnson" family AGENTS.md names as a
# standard regression canary. name_regex rules sort ahead of
# fields-only ones and `fields` matches by subset, so a future
# regression on any of those would have been labelled fix(#367) and
# exited 0 -- a strict loss at this baseline, whose ledger was empty
# before. (`\.?` was inert into the bargain: `\S+` is greedy, so it
# had already taken the period.)
#
# `fields` is what carries the rest of the tightness -- and it is narrower
# than the change rather than a description of it. The change moves
# `title` as well: a word in BOTH vocabularies stops the transparency
# scan and stays a title piece instead of being chained onto the name,
# so 'Dr. St John Smith' goes from title 'Dr.', family 'St John Smith'
# to title 'Dr. St', given 'John', family 'Smith'. It moves `maiden`
# as well: un-chaining lets a marker standing behind the particle be
# seen at all, so 'Mr. Van Johnson nee Brown' goes from family
# 'Van Johnson nee Brown' with no maiden name to given 'Van', family
# 'Johnson', maiden 'Brown'. `suffix` and `nickname` are the two that
# genuinely never move. Naming three roles anyway is deliberate, for
# the reason the regex names only `van`: a corpus name that moves
# `title` or `maiden` should arrive UNEXPLAINED and be read once,
# rather than be absorbed here.
#
# The 1.4 ledger carries the same rule, where it also has a second job:
# there the diff was already being absorbed by that file's fields-only
# fix(suffix-routing), a rule about a trailing credential whose
# ["given", "family", "suffix"] is a superset of this diff's fields. No
# fields-only rule exists here, so this file's copy is the plain
# classification.
name_regex = "(?i)^(mr|dr|sir)\\.?\\s+van\\b"
fields = ["given", "middle", "family"]

[[change]]
issue = "fix(#367) an inferred title no longer displaces a leading particle either"
# 'Jr. Van Johnson': the same change as the rule above, for a leading
# piece the period-abbreviation inference reads as a title (H2). It
# sat in that rule's alternation as 'jr' while 'jr' was title
# vocabulary; #296's audit took it out (a postnominal only), so the
# member would now reach a word the vocabulary does not ship, and the
# shape gets its literal. The reading is unchanged: 'Jr.' is still a
# title by shape, and Van is still the leading name piece.
name_regex = "(?i)^jr\\.\\s+van\\b"
fields = ["given", "middle", "family"]

[[change]]
issue = "fix(#379) a tussenvoegsel after a family comma attaches to the family"
# 'Vega, Juan de la': the Dutch alphabetized listing moves the
# tussenvoegsel behind the given name -- "Beethoven, Ludwig van" is how
# "Ludwig van Beethoven" is filed -- and 1.4 read the trailing particle
# run as a middle name. 2.2 attaches it to the family already named by
# the comma and renders it before the base, so `middle` empties and
# `family` grows. rules.md#P6 states it; the derived views move with it
# (family_particles 'de la', family_base 'Vega').
#
# Fields are {middle, family}: the given name does not move. `suffix`
# is deliberately NOT here, though the #380 half of the change does
# move a token out of it ('Berg, Jan vd' was suffix 'vd' at every
# baseline and is now family 'vd Berg'). No corpus name exercises that
# shape, and adding `suffix` to claim it costs three shapes this rule
# has no business explaining -- {family,suffix} taken from
# fix(suffix-routing), and {middle,suffix} and {middle,family,suffix}
# taken from UNEXPLAINED, the last two being diffs in which `family`
# does not move at all. A rule that pre-claims shapes it has never seen
# is the #372 failure mode. If a vd-shaped name ever enters the corpus
# it should arrive unexplained and be read once.
#
# Latin-anchored over the WHOLE name, not just the trailing word: with
# a leading .* this absorbed non-Latin comma names whose diff has
# another cause -- a Cyrillic 'Smith, de la' moves {family} because the
# particle's RENDERING ORDER inside the family changed, which no rule
# in this ledger names, and it classified here. (It now falls to the
# fields-only catch-all, so the absorption moved rather than vanished;
# worth a narrower rule if such a name ever appears.) The class is the
# neighbours' and compare.py's own: U+0000-U+024F, which stops at
# Latin Extended-B, so a diacritic-bearing 'Nguyen, Van de la' in NFD
# or Latin Extended Additional is outside it.
#
# What the rule still over-claims is vocabulary, not script: any Latin
# comma name ending in an alternation member is claimed whatever the
# naming tradition, so a future {middle,family} regression on
# 'Nguyen, Van' -- one of the two corpus names it reaches, and the one
# that does NOT move -- would classify as intended.
name_regex = "(?i)^[\\u0000-\\u024f]*,[\\u0000-\\u024f]*\\s(de|del|den|der|di|do|dos|du|la|le|los|mc|van|vd|von|zu)(\\s+(de|del|den|der|di|do|dos|du|la|le|los|mc|van|vd|von|zu))*\\s*$"
fields = ["middle", "family"]

[[change]]
issue = "fix(#412) a connective join no longer absorbs the maiden marker beside it"
# 'Jane van der Berg née y Jones' and 'Jane née and Jones Smith': the
# last of the join-swallows. rules.md#M2 takes a marker standing as a
# word of its own, and rules.md#P3's connective join ran first in the
# grouping stage and merged the marker into a multi-word piece, so the
# bound never saw one. The marker pass now runs before every join
# (#418 is the same order defect in P3's word count), so the marker is
# taken and the words after it, connective included, are the maiden
# name: family 'van der Berg', maiden 'y Jones'; given 'Jane', maiden
# 'and Jones Smith'.
#
# Checked against this baseline's own run: 2.0.0 reads both names the
# way 2.1.0 does, so the same two arrive UNEXPLAINED here. The
# expected_since_2.1.0.toml copy carries the fuller account.
name_regex = "(?i)\\bn[eé]e\\s+(y|and)\\b"
fields = ["middle", "family", "maiden"]

[[change]]
issue = "fix(#418) the connective carve-out counts the name the maiden clause leaves behind"
# 'Juan y Garcia née Jones': rules.md#P3's three-word carve-out
# counted the marker and the maiden name, so the connective joined
# and the family was empty once the clause left. Checked against this
# baseline's own run -- 2.0.0 reads it as 2.1.0 did, given 'Juan y
# Garcia' with no family. The expected_since_2.1.0.toml copy carries
# the fuller account.
name_regex = "(?i)^\\S+\\s+[ye]\\s+\\S+\\s+n[eé]e\\s+\\S+$"
fields = ["given", "middle", "family"]

[[change]]
issue = "fix(#418) accepted: a suffix word inside the maiden name ends it, connective or not"
# 'Jane née Jr y Jones': the accepted cost of the marker-pass reorder
# (rules.md#M2's Accepted row). Checked against this baseline's own
# run -- 2.0.0 reads it as 2.1.0 does, maiden 'Jr y Jones'. The
# expected_since_2.1.0.toml copy carries the fuller account.
name_regex = "(?i)^jane\\s+n[eé]e\\s+jr\\s+y\\s+jones$"
fields = ["middle", "family", "maiden"]

[[change]]
issue = "fix(#429) a wholly-credential segment after a one-word family renders as one entry"
# 'Smith, MD PhD': one word before the comma and nothing but
# credentials after it. The baseline read the leading 'MD' as a title
# and left suffix 'PhD'; the segment is the credential run rules.md#C1
# describes and now lands whole in `suffix`.
#
# The roles moved in #325; what #429 adds is the RENDER. #325 shipped
# them as 'MD, PhD' -- a comma the writer never typed -- because group
# decided "one comma segment is one suffix entry" by segment INDEX
# while assign decided the same segment by CONTENT. group now asks
# assign's own predicate, so the run renders as written and this path
# agrees with the full-name 'John Smith, MD PhD', which has rendered
# 'MD PhD' since 1.4.0.
#
# The name entered the corpus as the rules.md#C1 example that fix
# added, so this entry arrives with it rather than explaining a
# name that was already there. `family` and `given` are deliberately
# OUT of the field list: neither moves on this rule, so a regression
# in either stays loud. Literal-anchored -- the class has no other
# corpus name, and a harvested one should arrive UNEXPLAINED and be
# read once rather than absorbed here.
name_regex = "(?i)^smith,\\s*md\\s+phd$"
fields = ["title", "suffix"]

[[change]]
issue = "fix(#430) a credential run does not end at the roman numeral describing it"
# 'Smith, PSM I' and 'Smith, PSM I.': the baseline read given 'PSM',
# suffix 'I' -- the run ended at the numeral because rules.md#S2's
# initial veto keeps a numeral out of a suffix reading, so the segment
# did not look like a credential run and fell to the given-and-suffix
# walk. Behind a SUFFIX the numeral is describing that suffix ('PSM I'
# is Professional Scrum Master level I), so the run continues through
# it, period included -- an initial in that position is no shape anyone
# writes. The full-name 'John Smith, PSM I' has read it this way all
# along; this brings the one-word family into line.
#
# `family` is deliberately OUT of the field list: the family name does
# not move on this rule, so a regression there stays loud. Anchored to
# the two example spellings -- the class has no other corpus name, and
# a harvested one should arrive UNEXPLAINED and be read once.
name_regex = "(?i)^smith,\\s*psm\\s+i\\.?$"
fields = ["given", "suffix"]

[[change]]
issue = "fix(#432) a dotted numeral behind a name is a middle initial, not the generation"
# 'Smith, John V.': the baseline read suffix 'V.'. Behind a NAME word
# the period is decisive -- it marks an abbreviation, and an
# abbreviation is name material -- so the numeral is the middle initial
# it looks like. 'Smith, John B.' has always read middle 'B.'; the only
# thing that made V. differ is that V is also suffix vocabulary.
#
# The BARE form is the boundary and does not move: 'Smith, John V' is
# still suffix 'V' (v1 parity, #144), and it is a corpus name, so that
# half is asserted by the gate rather than by this entry's silence.
# `given` and `family` are out of the field list; neither moves.
name_regex = "(?i)^smith,\\s*john\\s+v\\.$"
fields = ["middle", "suffix"]

[[change]]
issue = "fix(#410) a title and one name word name the family, whatever annotation stands beside it"
# rules.md#H1 reads a title plus exactly one name word as the family
# ('Mr. Johnson' -> family 'Johnson'). The guard implementing it also
# declined whenever ANY token carried a suffix, nickname or maiden
# role, so the very same name with an annotation beside it kept the
# word in `given` and reported no family at all. None of the three is
# a name word, so the term went, and the four names below move
# `given` -> `family` to read as their un-annotated twins already did.
#
# Keyed on the four names by literal rather than by shape. The shape
# is "a title, one name word, and an annotation" -- a parse tree, not
# a string -- and a fields-only rule standing in for it would classify
# every future given/family swap in this corpus.
#
# `fields` is exactly the pair that moves: no annotation changes hands
# here, which is the whole point of the fix, so a diff in `nickname`,
# `maiden` or `suffix` on these names stays loud.
#
# Four names are classified here, out of five that move. The one left
# out is 'Freiherr von Richthofen V', which the fix(#424) rule below
# has claimed all along; #410 shrinks its diff (the name piece stops
# moving through `given`) without shrinking it out of that rule's
# fields, which is why no run ever mentioned it. Left where it is
# deliberately -- the classification is right, only the counting was
# wrong.
#
# These four are therefore the names of this shape that nothing else
# explains, not every name of this shape: two with a nickname, one with
# a maiden clause, one where the nickname leads. That fifth name is
# also the suffix flavor, so the corpus does carry one; it is the bare
# 'Dr. Smith PhD' spelling that appears nowhere, and
# tests/v2/cases.py::suffix_stays_suffix_title pins that.
#
# The change is in the 2.2 cycle, so 2.0.0 sees the same four diffs
# 2.1.0 does and the rule is shared verbatim with that ledger --
# checked against this baseline's own run, not assumed from it.
name_regex = "(?i)^(?:Senator \"Rick\" Edmonds|Xyz\\. \\(Bud\\) Smith|Dr\\. Smith n[ée]e Jones|'Smitty' Dr\\. Jones)$"
fields = ["given", "family"]
