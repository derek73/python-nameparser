# Ledger for baseline 2.1.0 -- what changes for a user upgrading from
# the previous minor. Same rule grammar as the other ledgers: `issue`,
# `name_regex` and `fields` are every one of them required. Neither
# narrowing key may stand on its own -- #451 banned a rule with
# `fields` and no regex, #456 banned the reverse -- so a rule here
# narrows by name AND by role, never by just one. Every
# rule therefore sits in one tier, _sorted_rules is stable, and FILE
# ORDER decides every tie: write the narrower rule first. That is the
# declaration-free DEFAULT rather than a law -- a wider rule that
# describes a compound behavior its component rule does not may sit
# first and declare it in a [[change.precedes_narrower]] block naming
# the rule it outranks (#382). Never reorder to satisfy that check;
# see tools/differential/README.md, "Declaring a wide-first pair".
#
# This file was opened empty the day 2.1.0 shipped (AGENTS.md release
# step 8) and stayed that way through #354, #358 and #361, none of
# which moved the default-order corpus. #367 is the first 2.2 change
# that does, and its rule below is the first entry here.
#
# The ledger is opened before it has anything to say because
# DEFAULT_BASELINE and the ledger are coupled: _allowlist_for treats a
# missing file as a hard error, on the reasoning that an absent ledger
# classifies nothing and would make every diff report as unexplained.
# So the baseline could not advance to 2.1.0 without this file.
#
# Do not copy rules across from expected_since_2.0.0.toml: that ledger
# classifies what 2.1 changed on top of 2.0, and a rule copied without
# checking either over-matches -- hiding a real 2.2 regression behind a
# 2.1-era label -- or never fires at all. The #367 rule below IS shared
# with the other two ledgers, and that is not an exception to this: the
# change is in the 2.2 cycle, so every baseline before it sees the same
# diff, and each copy was checked against its own run rather than
# assumed.
#
# tests/v2/test_differential.py permits exactly one empty ledger, the
# one DEFAULT_BASELINE names -- a permission this file no longer needs.
#
# tests/v2/test_ledger_guards.py's _SPAN_BEARING_RULES records this
# file with an empty set: no rule here hand-copies _SCRIPT_RANGES, and
# the first one that does has to be recorded there or the sweep fails.
# #367's rule is Latin-only and declares no script span.
#
# There is deliberately no `change = []` line. TOML forbids appending a
# [[change]] table to a statically defined array, so that line would
# have blocked the entry below -- and every reader uses
# .get("change", []) -- four call sites across three files -- so the
# key's absence was already the empty ledger.
# tests/v2/test_differential.py checks that nothing else is defined at
# the top level here, since a mistyped table name would otherwise read
# as an empty ledger rather than as a broken one.

# #436/#437: the suffix view's entry boundary became the comma the
# writer typed. rules.md#R1: "a run of post-nominals written with
# spaces renders with spaces, and one written with commas keeps
# them" -- true of the comma paths since 1.4.0 and of the NO-COMMA
# path only since 2.3, which is the whole of what these names move.
# Every one goes from a comma-joined render to a space-joined one;
# none goes the other way, and none has a comma in the original
# between the two words. Roles do not move: this rule declares
# `suffix` alone, so a name whose ROLES move here arrives
# UNEXPLAINED, as it should.
#
# FIRST in the file, and that is narrow-first rather than a
# preference: `fields = ["suffix"]` is a strict subset of several
# rules below, and any of them sitting earlier while both regexes
# reach one corpus name is an undeclared order-decided contest the
# run refuses (#382). Measured 2026-09-06 by moving this rule to
# the end of a scratch copy of this file and re-running the gate,
# which raises 3 such contests here.
#
# An anchored alternation of the names rather than a shape, because
# the shape is "two post-nominals with a space between them" and
# that reaches every listing form in the corpora. The members are a
# list of NAMES and copy no wordlist, which is what
# _NOT_A_VOCABULARY_COPY in tests/v2/test_ledger_guards.py records;
# _CORPUS_CLAIMS pins the reach at 10 with its digest, and
# _MUST_NOT_MATCH pins the five comma and delimiter forms it must
# never claim.
[[change]]
issue = "fix(#436/#437) a space-separated post-nominal run renders with spaces, not commas"
# 2026-09-19, #533: one name joins the alternation and the rule
# does not change. 'Jane Doe nee Smith PhD MA' is a two-word
# credential run this baseline renders 'PhD, MA' and the tree
# renders 'PhD MA' -- the whole of its diff at this baseline, and
# the same diff at 2f57ff21, measured. #533 moves nothing on it:
# the unambiguous PhD already ended the walk, so the clause gave
# the MA up before this change as it does after it. What grew is
# the CORPUS, and the run rendering is what the diff is about.
name_regex = "^(?:JOHN DOE PHD MD|Jane Doe nee Smith PhD MA|John Doe MD PhD|John Smith MD PhD|John Smith Mc V|Kenneth Clarke QC MP|Smith, John PhD I\\.|The Rt Hon Kenneth Clarke QC MP, HMG|Washington Jr\\. MD, Franklin|abdul Smith Jr Ma|abdul Smith Jr V)$"
fields = ["suffix"]

# The six #449 rules go SECOND, not first: the rule above
# declares its own first-in-file position with a measurement,
# and `fields = ["suffix"]` and `fields = ["_ambiguities"]`
# are disjoint, so nothing orders the two against each other.
# They DO sit ahead of every rule below whose `fields` is a
# strict superset of `_ambiguities`, which is the narrow-first
# default (#382).
[[change]]
issue = "feat(#449) a lone name word reports given-or-family"
# rules.md#O5's convention, now reported. Twenty-two corpus names, and
# the alternation is a list of NAMES rather than a copy of any
# wordlist -- what selects them is the SHAPE (one name word, and no
# title, maiden name, comma, script order or vocabulary claim deciding
# it), so it is declared in _NOT_A_VOCABULARY_COPY. A suffix beside
# the word does NOT decide it: 'Smith Jr.' and "'Smitty' Jones Jr."
# are the peel taking the suffix and the convention placing what is
# left. `_ambiguities` alone: no role moves anywhere in this change.
# The five CJK-bearing names in the same population ride five rules of
# their own below, because a CJK member in an alternation is claimed
# by the honorific pin, which would demand this be a copy of
# GLUED_HONORIFICS. #322/#323 opened the one escape from that pin --
# a member set declared in _NOT_A_VOCABULARY_COPY -- and nothing here
# declares one, so the five rules stand.
name_regex = "(?i)^(?:'Smitty' Jones Jr\\.|Andrew|Carod i|Dean of Chemistry|Donald mc|Duke of Edinburgh|Duke of Wellington|Garcia|Jack M\\.A\\.|John & Jane|John V|John of the Doe|Juan & Garcia|Juan and Garcia|Mohamad X|Smith|Smith Jr\\.|e and e|part1 of The part2 of the part3 and part4|part1 of and The part2 of the part3 And part4|test|سلمان،)$"
fields = ["_ambiguities"]

[[change]]
issue = "feat(#449) a wholly-katakana name keeps the declared order, so the convention decides it"
# 'マイケル'. rules.md#W4 gives katakana no order of its own -- a
# wholly-katakana name is usually a transcription and keeps whatever
# the caller declared -- so the script rule DECLINES and O5's
# convention is what is left. Literal-anchored on one corpus name, so
# _CORPUS_CLAIMS cannot see a widening and _MUST_NOT_MATCH carries the
# wall.
name_regex = "^マイケル$"
fields = ["_ambiguities"]

[[change]]
issue = "feat(#449) an interpunct transcription declines the script order, so the convention decides it"
# '王·Smith'. rules.md#T3: the 間隔号 marks a transcription and
# suppresses the script_orders lookup whole, so name_order governs and
# the one remaining name word is O5's. Literal-anchored, one corpus
# name.
name_regex = "^王·Smith$"
fields = ["_ambiguities"]

[[change]]
issue = "feat(#449) an ideographic comma leaves one name word, and the convention decides it"
# '田中、太郎'. The comma is inside the token, so the text resolves to
# no single script and the order lookup declines; what is left is one
# name word and O5. A rules.md#W3 shape -- tolerated, read
# best-effort -- and the report says only what the parse actually
# called. Literal-anchored, one corpus name.
name_regex = "^田中、太郎$"
fields = ["_ambiguities"]

[[change]]
issue = "feat(#449) a glued Japanese honorific leaves a Latin name word the script cannot order"
# 'Andersonさん'. rules.md#W2 peels the glued honorific to SUFFIX and
# leaves 'Anderson' -- Latin, so effective_script answers None and no
# script order is resolved at all. One name word, and O5's convention
# places it. Literal-anchored, one corpus name.
#
# `_ambiguities` alone here, where the 2.0.0 ledger's twin also carries
# `given` and `suffix`: #308's peel is already in THIS baseline, so
# the report is the whole diff. The gate's OVER-DECLARED check is what
# forces the two spellings apart -- a rule may not declare a role no
# diff it explains moves.
name_regex = "^Andersonさん$"
fields = ["_ambiguities"]

[[change]]
issue = "feat(#449) a glued Korean honorific leaves a Latin name word the script cannot order"
# 'Anderson선생님'. The Japanese rule's argument, in Hangul: the
# honorific is peeled, the Latin stem resolves to no script, and the
# convention places the one name word left. Literal-anchored, one
# corpus name, and `_ambiguities` alone for the reason given above.
name_regex = "^Anderson선생님$"
fields = ["_ambiguities"]

# The two #491 rules sit beside #449's, same position rule: both
# declare `fields = ["_ambiguities"]`, so they are disjoint from the
# `suffix` rule that owns first place and ahead of every rule below
# whose fields are a strict superset of theirs (#382's narrow-first
# default).
[[change]]
issue = "feat(#491) an all-titles input reports title-or-name for the word the title peel left as the name"
# rules.md#H4. Six corpus names, one alternative each -- a list of
# NAMES, not a copy of TITLES: what selects them is the SHAPE (the
# title peel leaves exactly one name word, and that word is itself
# title vocabulary), and a member copying the wordlist would reach
# 'Dr. Smith', 'Rabbi Cohen' and every other title-plus-surname name,
# none of which moves. Declared in _NOT_A_VOCABULARY_COPY for that
# reason. `_ambiguities` alone: the reading each of these gets is
# unchanged, only the silence about it.
name_regex = "(?i)^(?:Dr\\. King|His Holiness|His Holiness the Dalai Lama|Lord Chancellor|The Right Hon\\. the President of the Queen's Bench Division|The Rt Hon)$"
fields = ["_ambiguities"]

[[change]]
issue = "feat(#491) an all-suffix input reports suffix-or-name for the word it made the name"
# rules.md#H4's suffix half, emitted at assign's bare-suffix
# carve-out. Two corpus names. A list of names, not a copy of
# SUFFIX_WORDS or SUFFIX_ACRONYMS: a member copying either would reach
# 'John Smith MD', 'Smith Jr.' and the rest of the corpus's credential
# names, none of which moves -- what selects these two is that nothing
# was left to be the name.
name_regex = "(?i)^(?:QC MP|Rinpoche)$"
fields = ["_ambiguities"]

[[change]]
issue = "feat(#491) a joined unit carrying title vocabulary reports title-or-name"
# H4's join clause -- the one name unit is a join (P3) and one of the
# words it joins is title vocabulary, so the doubt is whether that
# word is a title rather than which field the unit takes. These two
# arrive because the #518 review round moved the clause out from under
# O5's field-deciding guards: both peel a title in front ('Attorney',
# 'Deputy') and leave the join standing as the last piece, which a
# title cannot be, so H3 never chains it. A list of two names, not a
# copy of TITLES: a member copying the wordlist would reach 'Prince of
# Wales' -- a join LED by a title word, which H3 does chain -- and
# every title-plus-surname name besides. `_ambiguities` alone: the
# reading is unchanged, only the silence about it.
name_regex = "(?i)^(?:Attorney General of Minnesota|Deputy Secretary of State)$"
fields = ["_ambiguities"]

# The four CJK names of #436/#437's class, one rule each. Not one
# alternation: an UNDECLARED alternation holding a script-classified
# member is claimed by the honorific pin in
# tests/v2/test_ledger_guards.py, which requires its members to BE
# the config's CJK honorific entries -- and until #322/#323 opened
# the _NOT_A_VOCABULARY_COPY escape that was every such alternation.
# These are names, so each stands alone, literal-anchored,
# reaching exactly one corpus name (_CORPUS_CLAIMS carries the 1)
# with _MUST_NOT_MATCH probes for the boundary each one has.
# rules.md#R1: "a run of post-nominals written with spaces renders
# with spaces, and one written with commas keeps them" -- the peel
# puts the honorific in `suffix` (rules.md#W2) and the run it lands
# in is spaced, so the render spaces it. At 1.4.0 and 2.0.0 these
# names already diff on `suffix` under the honorific rules and are
# claimed there; only at 2.1.0 and 2.2.0 is the render the whole of
# what moved.
[[change]]
issue = "fix(#436/#437) the glued honorific and the roman numeral are one post-nominal run"
name_regex = "^田中さん II$"
fields = ["suffix"]

[[change]]
issue = "fix(#436/#437) the glued honorific and the polite address are one post-nominal run"
name_regex = "^田中さん 様\\.$"
fields = ["suffix"]

[[change]]
issue = "fix(#436/#437) the spaced doctorate and the honorific after it are one post-nominal run"
name_regex = "^김민준 박사 씨$"
fields = ["suffix"]

[[change]]
issue = "fix(#436/#437) the glued honorific and the generational suffix are one post-nominal run"
name_regex = "^김민준씨 Jr\\.$"
fields = ["suffix"]

# #346: swami, guru, baba and lama moved from the TITLES-only block
# into GIVEN_NAME_TITLES on 2026-09-06. rules.md#H1's Accepted clause
# -- "a given-name title plus one name word leaves the family empty"
# -- now reaches them, so the one name word behind the title is the
# GIVEN name and the family is empty, where every baseline read it as
# the family. Both roles move together and `fields` declares both: a
# name whose TITLE moved would arrive UNEXPLAINED, as it should.
#
# Four corpus names, all from the radar-tier corpus_issues.jsonl and
# all moving the same way. The two- and three-word spellings are the
# boundary and are _MUST_NOT_MATCH probes: 'Swami Vivekananda
# Saraswati' and 'Guru Gobind Singh' keep their family names, because
# H1's fold requires exactly one name word, and a rule reaching them
# would stand ready to explain the very regression that boundary
# exists to catch.
#
# An anchored alternation of the four NAMES rather than a shape,
# under the ledger discipline expected_since_1.4.0.toml's header
# states for all four files: keep each entry's `name_regex` as tight
# as the diff allows. Four names moved, so a four-name list is the
# tightest expression of that diff; anything shape-shaped is wider
# than what was measured. It copies no wordlist either, which is what
# _NOT_A_VOCABULARY_COPY in tests/v2/test_ledger_guards.py records;
# _CORPUS_CLAIMS pins the reach at 4 with its digest.
[[change]]
issue = "fix(#346) a renunciate title and one name word leave the name a given name"
name_regex = "^(?:Baba Ramdev|Guru Nanak|Lama Zopa|Swami Vivekananda)$"
fields = ["family", "given"]

# #519: prince and princess moved from the TITLES-only block into
# GIVEN_NAME_TITLES on 2026-09-10. rules.md#H1's fold now reaches
# them, so the one name word behind the title is the GIVEN name and
# the family is empty, where every baseline read it as the family.
# Both roles move together and `fields` declares both.
#
# Three corpus names: 'Prince Charles' and 'Prince Fielder' from the
# radar-tier corpus_issues.jsonl, and the contract-tier rules.md
# example 'Her Royal Highness Princess Anne' (corpus_rules.jsonl), all
# moving the same way. 'Prince Fielder' moves too and is wrong either
# way -- Prince is his given name, which is #348's collision and not
# this rule's subject. The boundary is pinned by _MUST_NOT_MATCH
# probes: two name words behind the title ('Prince Harry Windsor'),
# the chained run 'Prince of Wales Jr' (addresses by `wales`), the
# trailing 'Robert Prince', 'Lord Byron' (`lord` stays out) and the
# bare 'Prince'.
#
# An anchored alternation of the NAMES rather than a shape, under
# the ledger discipline expected_since_1.4.0.toml's header states:
# keep each entry's `name_regex` as tight as the diff allows. It
# copies no wordlist, which _NOT_A_VOCABULARY_COPY records;
# _CORPUS_CLAIMS pins the reach with its digest.
[[change]]
issue = "fix(#519) prince and princess join the given-name titles"
name_regex = "^(?:Her Royal Highness Princess Anne|Prince Charles|Prince Fielder)$"
fields = ["family", "given"]

[[change]]
issue = "fix(#342) rai and cha left the credential acronyms, so a trailing Rai or CHA is a name word"
# 'rai' and 'cha' left SUFFIX_ACRONYMS on 2026-09-07
# (nameparser/config/suffixes.py). Both arrived in the 2019-12-11
# bulk wikipedia post-nominal import (af5bdab), neither was reviewed
# against a surname collision, and decisions.md#suffix-acronym-collisions
# states the criterion that removed them rather than marking them
# ambiguous: marking is for a short credential in wide use that is
# also a name, removal for a longer one that is tenuous and collides.
#
# Five corpus names, all from the radar-tier corpus_issues.jsonl, in
# THREE diff shapes with one cause -- the word stopped being
# credential vocabulary, so the positional read takes it:
#   'Aishwarya Rai'      {family, suffix}          suffix -> family
#                                                  (2.x only -- parity at 1.4.0)
#   'Lala Lajpat Rai'    {middle, family, suffix}  the family shifts right
#   'John Smith RAI'     {middle, family, suffix}  same
#   'John Smith, RAI'    {given, family, suffix}   an ordinary family comma (C1)
#   'Ahmad Jayadi, CHA'  {given, family, suffix}   same
# The comma pair is why `fields` declares four roles rather than the
# two the pre-2.3 fix(#342) rule declared: with no credential after
# the comma, C1 reads the pre-comma run as the family and the
# post-comma word as the GIVEN name, so `given` moves where it did
# not before. The declaration is the exact union of the five, which
# is what the OVER-DECLARED check recomputes at the end of every run.
#
# 'Aishwarya Rai' is in this rule at 2.0.0/2.1.0/2.2.0 and NOT
# explained by it at 1.4.0, where the name now reaches PARITY: 1.4.0
# read family 'Rai' too, which is what the deleted
# `fix(#342) NOT WANTED` rule existed to classify. The regex is the
# same in all four files anyway -- reach is not explanation, and a
# per-ledger regex would say a name left the corpus.
#
# An anchored alternation of the five NAMES rather than a shape. The
# shape is "a trailing word that used to be an acronym entry", which
# would be a copy of SUFFIX_ACRONYMS and would stand ready to explain
# every future trailing-acronym regression. The members are a list of
# names and copy no wordlist, which is what _NOT_A_VOCABULARY_COPY in
# tests/v2/test_ledger_guards.py records; _CORPUS_CLAIMS pins the
# reach at 5 with its digest, and _MUST_NOT_MATCH carries the
# boundaries the paragraph above argues.
name_regex = "^(?:Ahmad Jayadi, CHA|Aishwarya Rai|John Smith RAI|John Smith, RAI|Lala Lajpat Rai)$"
fields = ["family", "given", "middle", "suffix"]

[[change]]
issue = "fix(#369) a given-name title licenses the bound given-name join with one word to spare"
# 'Sheik abdul salam': rules.md#P5 -- "or after a given-name title,
# which asserts that a given name follows (H1): there the two words
# join and the name has no family". Given 'abdul', family 'salam'
# becomes given 'abdul salam', family '' -- the empty family H1
# accepts for "Sir John". The 'Sheik abdul salam Jr' rules example
# is the same move with the suffix standing; 'Sheik abdul Jr Smith'
# is in reach and does not move -- the licence takes a name word,
# not a suffix.
#
# 'Sheik Abu Bakar', the #367 regression this issue was filed for,
# reads given 'Abu Bakar' again with every field byte-identical to
# this baseline, so no rule names its fields: restored, not moved.
name_regex = "(?i)^sheik\\s+abdul\\b"
fields = ["given", "family"]

[[change]]
issue = "fix(#401) the bound-given reserve counts the trailing numeral assign reads as the suffix"
# 'abdul Smith V', 'abdul Smith Jr V': rules.md#P5 -- "a trailing
# roman numeral that assign reads as the suffix (S2) is no word to
# spare, and is not joined". given 'abdul Smith', family '' -> given
# 'abdul', family 'Smith'; the suffix was already read at this
# baseline, which is why the 1.4.0 rule lists three fields and this
# one two. Both are rules.md examples; no differential corpus name
# has the shape, and the 'abdul Smith V Ph. D.' spelling stays out of
# the corpus (the 1.4.0 ledger's [[never]] shape).
name_regex = "(?i)^abdul\\s+smith\\s+(jr\\s+)?v$"
fields = ["given", "family"]

# #436/#437 compounding with the bound-given reserve, one name.
# 'abdul Smith Jr V' already diffs {family, given} at this baseline
# under fix(#401) above, whose `fields` are those two alone -- so
# once the render moves as well, the diff is {family, given, suffix}
# and no longer a subset of anything fix(#401) declares. Two
# mechanisms, one name: the reserve decides the ROLES and #436
# decides the SEPARATOR, and the ledger's idiom for that is a rule
# naming both (the cjk-*-compound rules are the precedent). AFTER
# fix(#401) in file order, because its `fields` are a strict subset
# of these and the reverse arrangement is an undeclared contest
# (#382). fix(#401) keeps 'abdul Smith V', which still diffs on the
# two roles alone, so it neither goes dormant nor over-declares.
[[change]]
issue = "fix(#436/#437) the space-separated post-nominal run compounds with the bound-given reserve"
name_regex = "(?i)^abdul\\s+smith\\s+jr\\s+v$"
fields = ["given", "family", "suffix"]

[[change]]
issue = "fix(#421) the bound-given join never absorbs a suffix piece"
# 'abdul Jr Smith Berg': rules.md#P5 -- "the join never absorbs a
# marker standing as a word of its own -- a marker is not a name word
# (M2) -- nor a word of the unambiguous suffix vocabulary (S2),
# wherever position will then place it". given 'abdul Jr', middle
# 'Smith' -> given 'abdul', middle 'Jr Smith'. Parity with this
# baseline until now; a
# rules.md example, since no differential corpus name has the shape.
name_regex = "(?i)^abdul\\s+jr\\s+smith\\s+berg$"
fields = ["given", "middle"]

[[change]]
issue = "fix(#421) the bound-given join never absorbs a split credential"
# 'abdul Ph. D. Smith Berg': the rule above, on the split credential
# -- a 2.0 regression: given 'Smith', suffix 'abdul Ph. D.' -> given
# 'abdul', middle 'Smith', suffix 'Ph. D.', the suffix field 1.4.0's
# again (that ledger carries the given's own story). A rules.md
# example; no differential corpus name has the shape.
name_regex = "(?i)^abdul\\s+ph\\.\\s+d\\.\\s+smith\\s+berg$"
fields = ["given", "middle", "suffix"]

[[change]]
issue = "fix(#425) the bound-given reserve runs assign's peel over the joined view"
# 'abdul Smith Jr Ma', 'abdul Smith Ma': rules.md#P5 -- "the join is
# tried on the pieces as it would leave them, assign's trailing peel
# (S2) is read over that, and the name words it leaves are the words
# to spare" and "a word the peel reads as a suffix unjoined must read
# so joined, or the join declines". given 'abdul Smith', family '' ->
# given 'abdul', family 'Smith' (the acronym and the suffix peel as
# they do for 'John Smith Jr Ma'); given 'abdul Smith', family 'Ma'
# -> given 'abdul', family 'Smith', suffix 'Ma' (the join would have
# turned a credential into the family). Both 1.4.0 parity, so the
# 1.4.0 ledger has no twin. Rules.md examples; no differential corpus
# name has either shape.
#
# 2026-09-18 (#289): the sentence above -- "Both 1.4.0 parity, so the
# 1.4.0 ledger has no twin" -- stops being true, and this rule's own
# diff shrinks at the same time. The surname lean (rules.md#S2) never
# lets the peel take a Title-case 'Ma', so the acronym is a name word
# to spare and the join fires: 'abdul Smith Ma' reads given 'abdul
# Smith', family 'Ma' -- which is what THIS baseline reads, so the
# name stops diffing here altogether -- and 'abdul Smith Jr Ma' reads
# given 'abdul Smith', middle 'Jr', family 'Ma', where v1 read first
# 'abdul', last 'Smith' and the acronym as a suffix in both. The
# 1.4.0 ledger gains its twin, inside the fix(#289) rule at the
# bottom of that file. `Jr` as a middle name is an ACCEPTED cost: the
# surname lean breaks the peel at 'Ma', so the suffix behind it is
# never reached. `fields` is narrowed to the union the run measures
# here -- `given` no longer moves on the one name left diffing, and
# a role nothing moves is a standing claim (#452).
name_regex = "(?i)^abdul\\s+smith\\s+(jr\\s+)?ma$"
fields = ["family", "middle", "suffix"]

[[change]]
issue = "fix(#424) an unlisted abbreviation is as transparent as a listed title to the leading particle, the P4 example"
# 'Xyz. van Johnson': the rules.md#P4 example of the 'Esq. van Gogh'
# rule of this change (beside the fix(#367) rules, further down),
# same reading and fields. Separate rather than an alternation, per
# the guards' one-alternation-per-rule roster.
name_regex = "(?i)^xyz\\.\\s+van\\s+johnson$"
fields = ["given", "family", "_ambiguities"]

[[change]]
issue = "fix(#424) a title-led chain before the numeral is the one name piece"
# 'Freiherr von Richthofen V': rules.md#P2 boundary -- the chain stops
# before the numeral, and the chain is then the one name piece, which
# reads as 'Dr. Smith V' reads. The baseline read family 'von
# Richthofen V'; #424 split the numeral off as the suffix, and #410
# then moved the one name piece behind the title out of `given`, so
# the reading today is family 'von Richthofen', suffix 'V' -- and
# 'Dr. Smith V' moved with it, so the comparison still holds. A
# rules.md example.
#
# #410 narrowed this diff rather than adding one: {given, family,
# suffix} before it, {family, suffix} after. `fields` went on
# declaring the wider set, and because the match is a subset test the
# rule kept claiming the name as its diff shrank -- a real change of
# reading crossing a green gate with nothing to name it. The
# declaration now matches the diff, so `given` moving on this name
# again would be unexplained rather than absorbed. The general form:
# a `fields` list wider than the diff it explains silently absorbs
# whatever else lands inside it.
name_regex = "(?i)^freiherr\\s+von\\s+richthofen\\s+v$"
fields = ["family", "suffix", "_ambiguities"]

[[change]]
issue = "fix(#424) accepted: a particle of the suffix vocabulary opening the trailing run is a suffix piece"
# 'John Smith Mc V': rules.md#P2 Accepted -- "where it opens the
# trailing run the chain stops before it as before any suffix word,
# and the peel takes it". middle 'Smith', family 'Mc V' -> family
# 'Smith', suffix 'Mc, V'. A rules.md example; the class was found
# unrecorded by the second docs review of #424.
name_regex = "(?i)^john\\s+smith\\s+mc\\s+v$"
fields = ["middle", "family", "suffix", "_ambiguities"]

[[change]]
issue = "fix(comma-family) a comma followed only by titles keeps the given/family split"
# 'Bob Jones, author' / 'Bob Jones, compositeur': the comma is followed
# by nothing but a title word, which said nothing about where the
# family name ends, so the pre-comma name keeps its positional read --
# family 'Bob Jones' -> given 'Bob', family 'Jones', the title staying
# where it was. The FAMILY_COMMA rule that segment 0 is wholly the
# family rests on the writer having marked where it ends; a comma
# followed only by titles marked nothing ('John Smith, Mr.' is 'Mr.
# John Smith' with the honorific moved).
name_regex = "(?i)^bob\\s+jones,\\s*[a-z]+$"
fields = ["given", "family"]

[[change]]
issue = "fix(comma-family) a comma followed only by titles keeps the given/family split, the C1 example"
# 'John Smith, Mr.' and 'John Smith, Mr. Jr.': the rules.md#C1 examples
# of the rule above (family 'John Smith' -> given 'John', family
# 'Smith'; title and suffix stay where they were). Its own literal rather than
# an alternation with 'Bob Jones', which would be no vocabulary.
name_regex = "(?i)^john\\s+smith,\\s*mr\\.?(\\s+jr\\.?)?$"
fields = ["given", "family"]

[[change]]
issue = "fix(#296) a dropped prenominal takes the name position it occupies"
# 'Do Quang Minh': 'do' left TITLES -- a postnominal (D.O.) and a
# Vietnamese surname, never a prenominal -- so a leading 'Do' is no
# longer peeled as a title and falls through to the positional read:
# title 'Do', given 'Quang' -> given 'Do', middle 'Quang'. The
# 2026-07-30 audit table's disposition; 'phd', 'jr', 'junior' and
# 'se' left with it, and no corpus name leads with a bare one (the
# three that lead with 'Jr.' are read by the period inference and do
# not move). The rule's second name is 'MD, DO, DDS': title 'DO' ->
# given 'DO', the comma anchor's one corpus hit. `family`
# is deliberately OUT of the field list: the family name must not
# move on this rule, so a regression there stays loud. The anchors
# are the two openings a name has (start, or after a family comma).
name_regex = "(?i)(^|,\\s*)do\\b"
fields = ["title", "given", "middle", "_ambiguities"]

[[change]]
issue = "fix(#296) dr is not postnominal vocabulary, so a trailing Dr. is a name word"
# 'dr Vincent van Gogh dr' with its #100 siblings (and, at 2.x only,
# 'Smith Dr', which 1.4.0 already read as the family): 'dr' left
# SUFFIX_WORDS, where it was v1 residue -- 'Dr.' is not a postnominal
# in any tradition -- so a trailing bare 'Dr' is no longer suffix
# vocabulary and falls to the positional read, taking the family name
# with it.
#
# 2026-09-08: 'John Smith Dr.' has LEFT this rule, and the sentence
# that used to close this comment has been retracted with it. It read
# "NOT a new class: no trailing title-only word routes to title on
# the no-comma path ('John Smith Prof.' reads family 'Prof.' at every
# baseline) ... #316 is the open question for the class". #316 is
# answered: a trailing PERIOD-MARKED listed title word now routes to
# title, so 'John Smith Dr.' moves {title, suffix} against this
# baseline and {title, middle, family} against 2.2.0, neither of them
# a subset of the three roles below, and the bundle rule `fix(#316) a
# trailing period-marked title word reads as a title` at the end of
# this file claims it. What stays here is the BARE spelling, which
# #316(b) leaves open: 'Smith Dr' and the 'dr ... dr' names wear no
# abbreviation period and the trailing walk never sees them. This
# rule is narrower than that one and stands first, so the DIFF
# decides which of the two claims a name, not file order.
#
# `middle` left the field list in the same edit: it was there for
# 'John Smith Dr.', whose middle name moved, and the three names the
# rule still explains move `family` and `suffix` alone. The gate said
# so itself -- OVER-DECLARED, "classify() matches by SUBSET, so the
# excess is not inert" (#452).
name_regex = "(?i)\\sdr\\.?$"
fields = ["family", "suffix"]

[[change]]
issue = "fix(#296) a credential-only comma string reads a name and its postnominal"
# 'Jr., PhD' / 'MD, PHD': a string that is nothing BUT credentials.
# v1 read the trailing one as a title and the leading one as a first
# name; with 'phd' out of TITLES the comma structure reads it as a
# one-word name plus a postnominal -- a reading of a string nobody
# writes as a name, and the honest one for it.
#
# `given` and `family` are OUT: by 2.1.0 the comma-family move has
# already landed, so both names diff {title, suffix} alone at this
# baseline -- checked directly, 'Jr., PhD' reads last 'Jr.' on both
# the 2.1.0 release and the tree and only title 'PhD' -> suffix 'PhD'
# moves. The 1.4.0 copy of this same rule keeps `given`/`family`:
# there the pre-comma word is still v1's `first`, so the same names
# diff all four roles at that baseline and the wider declaration is
# earned, not excess. classify() admits by subset, so leaving the two
# roles out here is not passive -- a diff on either name that grows to
# move `given` or `family` falls out of this rule instead of being
# silently absorbed; measured against the narrowed ledger, nothing
# else in this file claims a {given, family, title, suffix} diff on
# these names either, so it would arrive UNEXPLAINED (#452).
name_regex = "(?i)^[a-z]{2,3}\\.?,\\s*phd$"
fields = ["title", "suffix"]

[[change]]
issue = "fix(#296) a lone post-comma credential is a suffix"
# 'Smith, Jr.' / 'Kim, Jr.' / 'Smith, PhD': rules.md#C1 -- the listing
# form holds with one word before the comma, and the word after it is
# the credential run. v1 put the family in `first` and the credential
# in `title`; 2.0 routed the pre-comma word to the family (the
# comma-family rule below) but the title peel still claimed the
# credential -- 'jr' and 'phd' were title vocabulary, and the
# period-abbreviation inference reads 'Jr.' as a title regardless --
# so the postnominal position is read first now: a post-comma run
# that is nothing but suffix pieces is suffixes. A one-word name, a
# comma, one short word: the reach is pinned by the guards.
#
# `given` and `family` are OUT for the same reason as the
# credential-only rule above: the comma-family move already landed by
# 2.1.0, so 'Smith, Jr.' reads last 'Smith' on both the 2.1.0 release
# and the tree and diffs {title, suffix} alone -- checked directly.
# The 1.4.0 copy of this same rule keeps `given`/`family` because
# there the pre-comma word is still moving `first` -> `last`, the
# larger diff that baseline actually produces. classify() admits by
# subset, so a diff here that grows to move `given` or `family` falls
# out of this rule instead of being silently absorbed; measured
# against the narrowed ledger, nothing else in this file claims a
# {given, family, title, suffix} diff on these names, so it would
# arrive UNEXPLAINED (#452).
name_regex = "(?i)^[a-z]+,\\s*[a-z]{2,6}\\.?$"
fields = ["title", "suffix"]

[[change]]
issue = "fix(#296) a glued honorific before a lone credential: the credential is the postnominal"
# '田中さん, PhD': 'phd' left TITLES, so the lone post-comma credential
# is the suffix it is, and the glued-honorific peel (#312) reads 田中
# and さん as before. title 'PhD' -> suffix 'さん, PhD'.
#
# `family` is OUT: at this baseline the glued-honorific peel (#312)
# already ships, so both the 2.1.0 release and the tree read family
# '田中' with さん already split into the postnominal position -- checked
# directly, only title 'PhD' -> suffix 'さん, PhD' moves. The 2.0.0 copy
# of this rule keeps `family` because #312 postdates that release: at
# 2.0.0 the whole 'さん' honorific is still riding on the family, so
# family '田中さん' -> '田中' is a real part of that baseline's diff. No
# 1.4.0 copy exists to compare against. classify() admits by subset,
# so a diff here that grows to move `family` falls out of this rule
# instead of being silently absorbed; measured against the narrowed
# ledger, nothing else in this file claims a {family, title, suffix}
# diff on this name either, so it would arrive UNEXPLAINED (#452).
name_regex = "(?i)^田中さん,\\s*phd$"
fields = ["title", "suffix"]

[[change]]
issue = "fix(#296) do is a name, so it no longer stops the leading-particle scan as a title"
# 'Dr. Do Van Johnson, MD': the fix(#367) title-and-particle rule that
# explained this name is gone with 'do' from TITLES -- a word in both
# the title and particle vocabularies stopped the transparency scan
# and stayed a title piece (master, after #367/#413, read title 'Dr.
# Do'); 'do' is a particle and a name now, and reads as the given
# name. At this baseline: given 'Do Van Johnson' -> given 'Do',
# family 'Van Johnson'; the title 'Dr.' is unchanged here.
name_regex = "(?i)^dr\\.?\\s+do\\s+van\\b"
fields = ["given", "family"]

[[change]]
issue = "fix(#296) dr is not postnominal vocabulary, so 'John Smith, Dr.' keeps its split and its title"
# 'John Smith, Dr.' / 'John, Smith, Dr.': with 'dr' out of the suffix
# sets the post-comma 'Dr.' is a title only, so the comma is followed
# by nothing but titles and the pre-comma name keeps its split (the
# no-name-word repair): suffix 'Dr.' -> title 'Dr.' for the two-part
# spelling. The three-part spelling keeps suffix 'Dr.' (a third part
# is suffix by position) and moves only by gaining the
# COMMA_STRUCTURE report C2 gives a third part that is not suffix
# words.
#
# The two-part spelling is ALSO compared under FAMILY_FIRST, as shape
# 4 of corpus_shapes.jsonl: the declared order applies to the
# pre-comma name on both sides, so the split does not move and the
# diff is the same {title, suffix} one from the same cause. That is
# why the name lists twice in this rule's block, once order-tagged --
# and why this rule's `orders` names exactly those two: unlike the
# four rules at the foot of this file it genuinely explains the
# default-order diff too, and unlike an order-blind rule it stops
# there. FAMILY_FIRST_GIVEN_LAST is not listed because no shape tags
# this string under it, so a diff arriving there would be one nobody
# has looked at.
name_regex = "(?i)^john,?\\s+smith,\\s*dr\\.?$"
fields = ["title", "suffix", "_ambiguities"]
orders = ["DEFAULT", "FAMILY_FIRST"]

[[change]]
issue = "fix(#325) a split credential followed by another suffix after a one-word family comma reads as suffixes"
# 'Smith, Ph. D. Jr.' and the #325 rows it leads ('Smith, Ph. D. MD',
# 'Smith, Ph. D. III', 'Smith, Ph. D. Jr. MD', 'Smith, Ph.D. Jr.', and
# 'Smith, PhD Jr.', which the regex reaches too -- title 'PhD' at
# every baseline, suffix 'PhD Jr.' now; this line read
# 'PhD, Jr.' and had been stale since #429 made the run one
# entry, corrected 2026-09-06):
# with one word before the comma the name is the listing form, and
# the space-split 'Ph. D.' followed by another suffix was no longer
# the LONE post-comma piece, so it fell through to the given name --
# a 1.4.0 regression (v1 read suffix 'Ph. D.', title 'Jr.'). The
# whole run is suffixes now. Literal rather than the shape: a shape
# regex absorbed 'Smith, Dr. Jr.', which is the comma-family rule's
# (the comment review).
name_regex = "(?i)^smith,\\s*ph\\.?\\s?d\\.?\\s"
fields = ["title", "given", "suffix"]

[[change]]
issue = "fix(#325) a credential run across a second comma reads as suffixes"
# 'Smith, Jr., PhD': title 'Jr.', suffix 'PhD' -> suffix 'Jr., PhD';
# segments 2+ compose with the run.
name_regex = "(?i)^smith,\\s*jr\\.?,\\s*phd$"
fields = ["title", "suffix"]

[[change]]
issue = "fix(#296) an ambiguous acronym counts as a suffix only when written with its periods"
# 'Jack Ma.': rules.md#S2 -- "written with its periods, one after each
# letter"; a single trailing period is the abbreviation shape any
# word can wear. The gate was "any period" until #296's review, so
# suffix 'Ma.' -> family 'Ma.', which is how 1.4.0 read it.
name_regex = "(?i)^jack\\s+ma\\.$"
fields = ["family", "suffix", "_ambiguities"]

[[change]]
issue = "fix(#424) the particle chain stops before the trailing numeral"
# 'John van der Berg V': rules.md#P2 -- "a trailing suffix begins --
# read as assign will read it (S2): a trailing roman numeral, or a
# bare acronym with words to spare, ends the chain as a suffix word
# does". last 'van der Berg V' -> family 'van der Berg', suffix 'V',
# as 'John Smith V' reads. Shipped since 1.x: the chain's stop asked
# with the suffix-piece test, whose initial veto does not see a bare
# V. A rules.md example; no differential corpus name has the shape.
# The fork's report arrives with the reading.
name_regex = "(?i)^john\\s+van\\s+der\\s+berg\\s+v$"
fields = ["family", "suffix", "_ambiguities"]

[[change]]
issue = "fix(#424) the particle chain stops before a bare acronym with words to spare"
# 'John van der Berg Ma': the rule above, on S2's other fork. family
# 'van der Berg Ma' -> family 'van der Berg', suffix 'Ma', as 'John
# Smith Ma' reads -- and as 1.4.0 read it, so this rule has no 1.4.0
# twin: a 2.0 regression. A rules.md example; no differential corpus
# name has the shape.
#
# 2026-09-18 (#289): the MIXED-CASE spelling stops diffing here, and
# the rule survives on the one-case one. The surname lean
# (rules.md#S2) never lets the peel take a Title-case 'Ma', so
# 'John van der Berg Ma' reads family 'van der Berg Ma' again --
# which is exactly what this baseline reads. What the chain does when
# the acronym IS taken is unchanged, and the one-case spelling
# 'john van der berg ma' shows it: no case contrast, the count
# decides, the chain stops before the acronym and the name reads
# family 'van der berg', suffix 'ma'. That spelling entered the
# corpus with rules.md#P2's own contrast pair in 2.4, which is why
# this rule went briefly dormant and then woke in the same commit.
# The case-insensitive regex was already written to reach both.
name_regex = "(?i)^john\\s+van\\s+der\\s+berg\\s+ma$"
fields = ["family", "suffix", "_ambiguities"]

[[change]]
issue = "fix(#424/#445) the maiden walk stops before the trailing numeral, and the lone name word is the family"
# 'John née Jones Smith V': rules.md#M2 -- "takes the words after it
# -- up to any suffix word, or the trailing roman numeral assign
# reads as the suffix (S2) -- as the maiden name". maiden 'Jones
# Smith V' -> maiden 'Jones Smith', suffix 'V'. The walk's stop asked
# with the suffix-piece test too. No 1.4.0 twin: v1 had no maiden
# support, and the fix(#274) rule carries the name there. A rules.md
# example; no differential corpus name has the shape.
#
# Renamed for #445 (2026-08-27) rather than widened in place, because
# the diff has two causes now and one rule has to explain the whole
# of it. The walk leaves a single name word, and rules.md#M4 makes
# that word the family: given 'John' -> family 'John' joins the three
# fields above. Attributing that to #424 would be false, and leaving
# the declaration at three fields left this rule explaining nothing
# while the name went UNEXPLAINED -- which is how the gate reported
# it before this edit, at 2.0.0 and 2.1.0 alike. No 1.4.0 twin to
# rename: the fix(#445) rule there carries this name.
name_regex = "(?i)^john\\s+n[ée]e\\s+jones\\s+smith\\s+v$"
fields = ["given", "family", "suffix", "maiden", "_ambiguities"]

[[change]]
issue = "fix(#424) a marker followed only by the numeral is just a word"
# 'Jane Smith née V': the peel is read from the marker, so the V has
# the piece before it the fork wants and reads as the suffix; nothing
# follows the marker but a suffix, the pass declines, and the marker
# stays a word -- as for 'Jane Smith née PhD'. maiden 'V' -> middle
# 'Smith', family 'née', suffix 'V', which is 1.4.0's reading, so
# this rule has no 1.4.0 twin. A rules.md example.
name_regex = "(?i)^jane\\s+smith\\s+n[ée]e\\s+v$"
fields = ["middle", "family", "suffix", "maiden", "_ambiguities"]

[[change]]
issue = "fix(#369) the bound given-name join takes a particle-and-bound word, so no fork is reported"
# 'Sheik Abu Bakar': the fields are byte-identical to this baseline
# (the rule above); what moves is the REPORT. Through 2.1 the particle
# chain took 'Bakar' and reported PARTICLE_OR_GIVEN. The join that
# takes it now is P5's, licensed by the given-name title, and a bound
# word read as the bound word is not a fork.
name_regex = "(?i)^sheik\\s+abu\\b"
fields = ["_ambiguities"]

[[change]]
issue = "fix(#360) ste moved into the never-given particles with mc"
# 'Ste Marie': the second word of the same vocabulary move the
# fix(#360) rule below explains for `mc`, and that rule named it --
# "'Ste Marie', 'Los Santos' and 'Das Silva' all move the same way ...
# The others should arrive UNEXPLAINED and be read once." One has.
#
# A sibling rule rather than an alternation over the moved words: the
# guards allow one vocabulary alternation per rule, and an alternation
# here would copy PARTICLES for a two-member set whose other members
# ('los', 'las', 'das') are still not in any corpus.
name_regex = "(?i)^ste\\s+\\S+$"
fields = ["given", "family", "_ambiguities"]

[[change]]
issue = "fix(#399) a maiden marker bounds the particle chain: the geb. spelling"
# 'Ursula von der Leyen geb. Albrecht': #399's own headline name,
# which reached the corpus through the backtick harvest (#413) -- it
# sat in that issue's TITLE while #399 shipped noting the class was
# invisible to this harness.
#
# A sibling of the fix(#399) rule rather than a widened marker
# alternation: the marker slot there is a character class, and making
# it an alternation over MAIDEN_MARKERS would be a second vocabulary
# alternation, which the guards allow only one of per rule. The
# particle alternation is identical to that rule's, deliberately --
# both resolve to the same _LATIN_ALTERNATION_SOURCES key and must
# cover the same set.
name_regex = "(?i)^(?![^\\n]*,)[^\\n]*\\b(de|del|den|der|di|do|dos|du|la|le|los|mc|van|vd|von|zu)\\b.*?\\sgeb\\..?\\s+\\S+$"
fields = ["family", "maiden"]

[[change]]
issue = "fix(#399) a maiden marker bounds the particle chain: a native-script marker"
# 'Jane van der Berg 旧姓 Jones': the cross-script pair -- a Latin
# tussenvoegsel and a Latin maiden name either side of a native-script
# marker. The stop is one vocabulary lookup, so it reaches every marker
# spelling; this is the only corpus name that shows it.
#
# The marker is a literal rather than an alternation, so no CJK
# honorific declaration is needed: the rule is about the particle
# chain, not about the marker vocabulary.
name_regex = "(?i)\\b(de|del|den|der|di|do|dos|du|la|le|los|mc|van|vd|von|zu)\\b.*?\\s\u65e7\u59d3\\s+\\S+$"
fields = ["family", "maiden"]

[[change]]
issue = "fix(#424) an unlisted abbreviation is as transparent as a listed title to the leading particle"
# 'Esq. van Gogh' (corpus_issues): rules.md#P4 -- "An unlisted
# abbreviation before the particle is as transparent as a listed
# title, since assign reads it as one (H2)". family 'van Gogh' ->
# given 'van', family 'Gogh', with the PARTICLE_OR_GIVEN report, as
# 'Dr. van Gogh' reads since #367. #367 keyed the leading-particle
# exception on the first piece of the name by group's title test,
# which does not see H2's abbreviations; the scan asks assign's test
# now. Literal for the reason the #367 rule gives.
name_regex = "(?i)^esq\\.\\s+van\\s+gogh$"
fields = ["given", "family", "_ambiguities"]

[[change]]
issue = "fix(#367) a title no longer displaces a leading particle out of the leading position"
# 'Mr. Van Nguyen': a leading particle deliberately does not chain --
# that is what makes 'Van Nguyen' read as given Van, family Nguyen.
# Through 2.1 the exception was keyed on piece index 0, so a TITLE
# displaced the particle and the chain fired, giving family
# 'Van Nguyen' (v1's reading, which is why this name is parity with
# 1.4.0 until now). 2.2 keys it on the first piece of the NAME, so a
# titled name reads as the same text reads untitled.
#
# The wider class is any title followed by a particle -- 'Dr. Van
# Johnson', 'Sir de Mesnil', 'Sheik Abu Bakar' all move (the last restored
# by #369) -- and this
# regex names one title and one particle because 'Mr. Van Nguyen' is
# the one name in the corpora that moves. Deliberately narrower than
# the class: a corpus name that joins it later should arrive
# UNEXPLAINED and be read once, not be absorbed silently. Widen the
# literals then, and record the new count.
#
# Three joined it, through #413's backtick harvest: 'Dr. Van Johnson',
# 'Sir Van Johnson', 'Jr. Van Johnson'. The title slot is now an
# alternation over TITLES, which is what all four spellings copy --
# `jr` is also suffix vocabulary and reads as a title here simply
# because it is in TITLES and leads -- 1.4.0 already gives title 'Jr.'
# for 'Jr. Van Johnson', so that reading predates #367. (Not the
# stops-the-scan mechanism described below: that one is about a word in
# both the title and PARTICLE vocabularies FOLLOWING a title.) `\.?` earns its place now that the literals
# are spelled out: 'Sir' and 'Jr.' differ in whether the period is
# there. `van` stays literal -- the particle half of the class is
# wider ('Sir de Mesnil' has its own rule) but only `van` names in
# this title set are in the corpora.
#
# The title slot is a LITERAL for that reason and not by accident.
# Nothing in a regex over the raw string can ask whether a word is a
# title, so the `(?i)^\S+\.?\s+van\b` this rule shipped with matched
# ANY first word: it reached 11 corpus names and explained 1. The
# other ten include 'Vincent van Gogh', 'VINCENT VAN GOGH' and
# 'Alex van Johnson' -- the "Van Johnson" family AGENTS.md names as a
# standard regression canary. name_regex rules sort ahead of
# fields-only ones and `fields` matches by subset, so a future
# regression on any of those would have been labelled fix(#367) and
# exited 0 -- a strict loss at this baseline, whose ledger was empty
# before. (`\.?` was inert into the bargain: `\S+` is greedy, so it
# had already taken the period.)
#
# `fields` is what carries the rest of the tightness -- and it is narrower
# than the change rather than a description of it. The change moves
# `title` as well: a word in BOTH vocabularies stops the transparency
# scan and stays a title piece instead of being chained onto the name,
# so 'Dr. St John Smith' goes from title 'Dr.', family 'St John Smith'
# to title 'Dr. St', given 'John', family 'Smith'. It moves `maiden`
# as well: un-chaining lets a marker standing behind the particle be
# seen at all, so 'Mr. Van Johnson nee Brown' goes from family
# 'Van Johnson nee Brown' with no maiden name to given 'Van', family
# 'Johnson', maiden 'Brown'. `suffix` and `nickname` are the two that
# genuinely never move.
#
# `fields` names the two this rule's diffs DO move and no others, so
# `title`, `maiden` and `middle` are all left out on purpose, for the
# reason the regex names only `van`. It is `fields` that keeps the
# wider shapes out rather than the regex: `^(mr|dr|sir)\.?\s+van\b` has
# no end anchor and does reach 'Mr. Van Johnson nee Brown' -- checked
# directly, that name diffs {given, family, maiden} at this baseline,
# outside `fields`, and classify() returns nothing for it here. A diff
# growing into `title` or `maiden` falls out of this rule the same way
# rather than being silently absorbed; it should arrive UNEXPLAINED
# and be read once (#452).
#
# The 1.4 ledger carries the same rule, where it also has a second job:
# there the diff was already being absorbed by that file's fields-only
# fix(suffix-routing), a rule about a trailing credential whose
# ["given", "family", "suffix"] is a superset of this diff's fields. No
# fields-only rule exists here, so this file's copy is the plain
# classification.
#
# `middle` is OUT too, the same excess the paragraphs above already
# argue for `title` and `maiden`: the diff on the three names this rule
# actually claims here -- 'Mr. Van Nguyen', 'Dr. Van Johnson', 'Sir Van
# Johnson' -- is {given, family} alone at this baseline, checked
# directly against the released 2.1.0 and the tree (none of the three
# has a third name piece, so `middle` reads empty on both sides).
# classify() admits by subset, so leaving it out is not passive: a
# diff that grows to move `middle` falls out of this rule instead of
# being silently absorbed. Measured against the narrowed ledger,
# nothing else in this file claims a {given, family, middle} diff on
# any of the three names either, so it would arrive UNEXPLAINED and be
# read once rather than have a widened rule pre-built for it (#452).
name_regex = "(?i)^(mr|dr|sir)\\.?\\s+van\\b"
fields = ["given", "family"]

[[change]]
issue = "fix(#367) an inferred title no longer displaces a leading particle either"
# 'Jr. Van Johnson': the same change as the rule above, for a leading
# piece the period-abbreviation inference reads as a title (H2). It
# sat in that rule's alternation as 'jr' while 'jr' was title
# vocabulary; #296's audit took it out (a postnominal only), so the
# member would now reach a word the vocabulary does not ship, and the
# shape gets its literal. The reading is unchanged: 'Jr.' is still a
# title by shape, and Van is still the leading name piece.
#
# `middle` was declared here too, the same excess the 'Mr./Dr./Sir'
# rule above drops and for the same reason: this rule's one name,
# 'Jr. Van Johnson', diffs {given, family} alone at this baseline,
# checked directly against the released 2.1.0 and the tree (no third
# name piece, so `middle` reads empty on both sides). classify() admits
# by subset, so leaving `middle` out means a diff that grows to include
# it falls out of this rule instead of being silently absorbed.
# Measured against the narrowed ledger, nothing else claims a
# {given, family, middle} diff on this rule's name either, so it
# arrives UNEXPLAINED and is read once rather than have a widened rule
# pre-built for it (#452).
name_regex = "(?i)^jr\\.\\s+van\\b"
fields = ["given", "family"]

[[change]]
issue = "fix(#380) a trailing vd after a family comma is the tussenvoegsel, not a post-nominal"
# 'Berg, Jan vd': the #380 half of the tussenvoegsel change, and the
# fix(#379) rule below predicted this arrival in writing -- "No corpus
# name exercises that shape, and adding `suffix` to claim it costs
# three shapes this rule has no business explaining ... If a vd-shaped
# name ever enters the corpus it should arrive unexplained and be read
# once." It has, via corpus_rules.jsonl (#414), and this is the once.
#
# `vd` is in both the particle and the suffix-acronym vocabulary. 1.4.0
# and 2.1 alike read the trailing token as a post-nominal; 2.2 attaches
# it to the family the comma already named, on the judgment that a
# trailing abbreviation after a family comma is the tussenvoegsel far
# more often than the decoration it collides with. rules.md#P6 states
# it.
#
# Fields are {family, suffix} -- deliberately NOT a superset of
# fix(#379)'s {middle, family}. The two halves move different fields
# because they start from different readings: #379's names had the
# particle in `middle`, this one had it in `suffix`. A rule spanning
# both would claim {middle, family, suffix}, which is the shape #379's
# comment refused for exactly this reason.
#
# `vd` is a LITERAL, not an alternation over the dual-membership words.
# The release log names `mc` as sweeping in on the same shape, and no
# corpus name exercises it -- so an mc-after-comma name should arrive
# UNEXPLAINED and be read once, the same discipline that produced this
# rule.
#
# `_ambiguities` joined the diff in #405, which made the attachment
# report the fork it decides. Measured on THIS ledger's run: both names
# this rule explains -- 'Berg, Jan vd' and 'Berg, abdul vd' -- move
# {family, suffix, _ambiguities}, each gaining SUFFIX_OR_NAME, the kind
# that names the post-nominal reading the attachment declined. Neither
# name moves a field it did not move before, so the widening admits one
# more role and no more names; the union over the two is exactly the
# three declared. A separate fix(#405) rule was tried first and cannot
# work: classify matches on `fields` being a SUPERSET of the whole
# diff, so an `_ambiguities`-only rule matches neither name and this
# rule would go dormant with both of them unexplained.
name_regex = "(?i)^[\\u0000-\\u024f]*,[\\u0000-\\u024f]*\\svd\\s*$"
fields = ["family", "suffix", "_ambiguities"]

[[change]]
issue = "fix(#399) a maiden marker bounds the particle chain that swallowed it"
# 'Jane de la née Jones', 'Jane van der Berg née Jones', 'John van der
# Berg née Jones': grouping's particle chain absorbed everything up to
# the next particle or suffix piece, and the maiden marker is consumed
# later in the SAME stage -- by then the chain had merged the marker
# away and there was no lone marker piece left to find, so the family
# kept both the marker and the maiden name. rules.md#M2 states the
# stop; decisions.md#M2 records it.
#
# Fields are {family, maiden}: the given name does not move. The
# `orders` key below says the rest of it -- this shape IS compared
# under a declared order, on a name this regex reaches, and the rule
# has nothing to say about that reading.
#
# The rule requires a PARTICLE ahead of the marker because that IS the
# defect -- a marker with no particle in front of it was always
# consumed correctly. 'Jane Smith née Jones' is in the corpora and does
# NOT move, so the particle requirement is what keeps this rule off it.
#
# The three anchors each keep the rule off a shape M2 states as
# unchanged, and they are worth naming because the first cut of this
# rule claimed all three. Requiring exactly one word after the marker
# keeps it off the trailing-marker shape ('Jane van der Berg nee',
# which M2 leaves as an ordinary name word) and off the connective
# join ('Jane van der Berg nee y Jones', M2's accepted limit, #412).
# The leading no-comma lookahead keeps it off the post-comma
# bound-given join ('van der Berg, abdul nee Jones', the other limit).
#
# One name is still claimed that does NOT move, recorded rather than
# fixed: 'Jane van der Berg nee PhD', where the only word after the
# marker is a SUFFIX, so the consumer declines and M2 leaves the
# marker in the family. Excluding it needs the regex to ask whether a
# word is suffix vocabulary, which would be a second vocabulary
# alternation -- and the guards allow one per rule, spent here on
# PARTICLES. A future {family, maiden} regression on that one name
# would classify as intended. Named for the same reason fix(#379)
# names 'Nguyen, Van': an over-claim someone can find is survivable,
# an unrecorded one is not.
#
# One marker spelling, spelled out rather than alternated over
# MAIDEN_MARKERS: the three names that move all use it, the guards
# allow one vocabulary alternation per rule and this rule spends its
# on PARTICLES, and a differently-spelled name of this shape should
# arrive UNEXPLAINED rather than be absorbed.
name_regex = "(?i)^(?![^\\n]*,)[^\\n]*\\b(de|del|den|der|di|do|dos|du|la|le|los|mc|van|vd|von|zu)\\b.*?\\sn[e\u00e9]e\\s+\\S+$"
fields = ["family", "maiden"]
# Scoped to the DEFAULT order: every diff this rule explains is a
# default-order one. The regex reaches 'de la Cruz n\u00e9e Vega', which
# corpus_shapes.jsonl tags under both family-first orders, and this
# rule sorts ahead of the two rules written for that name -- so
# order-blind it would absorb a family-first regression there and call
# it intentional.
orders = ["DEFAULT"]

[[change]]
issue = "fix(#360) mc moved into the never-given particles, so it folds into the family"
# 'Mc Donald': a DATA change rather than a rule change (6389f06). `mc`
# and `ste` moved out of the ambiguous half of the particle vocabulary
# into the never-given half, and `los`, `las` and `das` were added
# having been absent entirely. A never-given leading particle folds
# into the family under rules.md#P1, so 'Mc Donald' goes from given
# 'Mc', family 'Donald' to family 'Mc Donald' -- and the
# PARTICLE_OR_GIVEN ambiguity it used to report goes away, the fork
# having stopped being a fork once the word can never be a given name.
#
# Fields are {given, family, _ambiguities}. The ambiguity is claimed
# rather than left out because it genuinely moves and the comparator
# would otherwise leave the diff unexplained: once `mc` can never be a
# given name there is no particle-or-given fork left to report, so the
# report disappearing is part of this change rather than a separate
# one. `_ambiguities` is the v2 surface only.
#
# `mc` is a LITERAL and the rule is anchored at the start. The class is
# every word the commit moved -- 'Ste Marie', 'Los Santos' and 'Das
# Silva' all move the same way -- and only 'Mc Donald' is in the
# corpora. The others should arrive UNEXPLAINED and be read once.
name_regex = "(?i)^mc\\s+\\S+$"
fields = ["given", "family", "_ambiguities"]

[[change]]
issue = "fix(#411) the bound-given reserve stops counting words the maiden name takes"
# 'van der Berg, abdul nee Jones': P5 reserves a name word so the join
# always leaves a family name behind, but the reserve was counted while
# the marker and the maiden name were still pieces -- group's marker
# pass runs later in the same stage. Counting words that were about to
# leave answered the question about a name that would not exist.
#
# The fields here are the SIDE EFFECT rather than the defect. #411's
# own shape is an emptied family ('abdul Berg nee Jones' read given
# 'abdul Berg', family ''), and no BASELINE shows it -- every released
# version already reads the corpus names carrying that shape the way
# the fix does, so none of them can produce a #411 diff to classify.
# ('abd Berg nee Jones' IS in corpus_rules.jsonl, and goes unexplained
# at all three baselines if the fix is reverted, which is the guard
# working.)
#
# What this corpus
# name shows is the other half: with the reserve counted correctly the
# join declines, so the marker is never merged into 'abdul nee' and
# M2's bound sees a lone marker piece for the first time. That closes
# one of the two join-swallows #412 tracks; P3's connective join is
# the one that survives.
#
# `abdul` is a LITERAL, not an alternation over BOUND_GIVEN_NAMES, and
# the words are NOT interchangeable here. 'abd' is the one shipped word
# in both the bound-given and the suffix vocabulary, so after a family
# comma a declining join leaves the S2 suffix reading instead: 'van der
# Berg, abd nee Jones' moves {given, middle, suffix, maiden}, and the
# extra field breaks the subset test, so it would arrive UNEXPLAINED --
# correct, but not what an alternation over the vocabulary would lead
# an author to expect. 'abdel', 'abdal' and the Arabic spelling do
# behave like 'abdul'; only this name is in the corpora.
name_regex = "(?i),\\s*abdul\\s+n[eé]e\\b"
fields = ["given", "middle", "maiden"]

[[change]]
issue = "fix(#400) abd joins the word after it as one given name"
# 'abd Allah Smith' and 'Salam, abd Allah': `abd` was added to
# BOUND_GIVEN_NAMES so the spellings that write the article as its own
# word join like `abdul`, `abdel` and `abdal` already did. Both the
# plain and the post-comma given side move, which is why the rule
# allows either opening.
#
# Fields are {given, middle}: the word joins forward within the given
# name, so nothing leaves the given side. The family name does not
# move -- 'abd Allah Smith' keeps family 'Smith'.
#
# `abd` is a LITERAL and word-bounded. It is also the postnominal ABD
# and stays in SUFFIX_ACRONYMS, where position tells the two apart, so
# the anchors matter: a trailing 'Jane Smith ABD' is a suffix and must
# not be claimed here.
#
# A third corpus name is claimed and does NOT move: a bare 'abd Allah',
# which has no third word for the join to leave as a family name, so
# P5's reserve declines and it reads given 'abd', family 'Allah' at
# every baseline. Same behaviour family as the two that move, so the
# claim is defensible -- recorded so it is not mistaken for coverage.
name_regex = "(?i)(?:^|,\\s*)abd\\s+\\S+"
fields = ["given", "middle"]

[[change]]
issue = "fix(#367) a title no longer displaces a leading never-given particle"
# 'Sir de Mesnil': the same change as the fix(#367) rule below, on the
# other half of the particle vocabulary, and that rule predicted this
# arrival by name -- "The wider class is any title followed by a
# particle -- 'Dr. Van Johnson', 'Sir de Mesnil', 'Sheik Abu Bakar' all
# move ... a corpus name that joins it later should arrive UNEXPLAINED
# and be read once". It has, via corpus_rules.jsonl (#414).
#
# A SEPARATE rule rather than widened literals, which is what that
# comment asked for, because the guards allow one vocabulary
# alternation per rule: widening both the title and the particle slot
# needs two, and their `covers` sets cannot both be recorded under one
# key. Two rules with literal pairs say the same thing and stay
# checkable.
#
# The fields differ from the sibling's for a real reason, not just
# tightness. There the particle was ambiguous, so un-chaining moved it
# to `given` and left a family behind: {given, middle, family}. Here it
# is never-given, so P1's fold takes the whole name into the family and
# the given side empties: {given, family}.
name_regex = "(?i)^sir\\s+de\\b"
fields = ["given", "family"]

[[change]]
issue = "fix(#379) a tussenvoegsel after a family comma attaches to the family"
# 'Vega, Juan de la': the Dutch alphabetized listing moves the
# tussenvoegsel behind the given name -- "Beethoven, Ludwig van" is how
# "Ludwig van Beethoven" is filed -- and 1.4 read the trailing particle
# run as a middle name. 2.2 attaches it to the family already named by
# the comma and renders it before the base, so `middle` empties and
# `family` grows. rules.md#P6 states it; the derived views move with it
# (family_particles 'de la', family_base 'Vega').
#
# Fields are {middle, family}: the given name does not move. `suffix`
# is deliberately NOT here, though the #380 half of the change does
# move a token out of it ('Berg, Jan vd' was suffix 'vd' at every
# baseline and is now family 'vd Berg'). Adding `suffix` to claim it
# costs three shapes this rule has no business explaining --
# {family,suffix} taken from fix(#380) above, and {middle,suffix}
# and {middle,family,suffix} taken from UNEXPLAINED, the last two
# being diffs in which `family` does not move at all. A rule that
# pre-claims shapes it has never seen is the #372 failure mode.
#
# 'Berg, Jan vd' is a corpus name, and it did not arrive unexplained
# here either: fix(#380) above already claims {family, suffix} for
# exactly this shape, in this same ledger, so there was never a gap
# for a future rule to fill at this baseline the way there was at
# 1.4.0's.
#
# Latin-anchored over the WHOLE name, not just the trailing word: with
# a leading .* this absorbed non-Latin comma names whose diff has
# another cause -- a Cyrillic 'Smith, de la' moves {family} because the
# particle's RENDERING ORDER inside the family changed, which no rule
# in this ledger names, and it classified here. (No such name is in
# any corpus, so this is what WOULD happen. It would now arrive
# UNEXPLAINED and block the gate until someone read it, which is the
# right outcome: this ledger has no fields-only rule to absorb it.
# The claim that it "falls to the fields-only catch-all" was copied
# from the 1.4 ledger, where one existed until #451 deleted it.)
# The class is the
# neighbours' and compare.py's own: U+0000-U+024F, which stops at
# Latin Extended-B, so a diacritic-bearing 'Nguyen, Van de la' in NFD
# or Latin Extended Additional is outside it.
#
# What the rule still over-claims is vocabulary, not script: any Latin
# comma name ending in an alternation member is claimed whatever the
# naming tradition, so a future {middle,family} regression on
# 'Nguyen, Van' -- one of the two corpus names it reaches, and the one
# that does NOT move -- would classify as intended.
#
# `_ambiguities` joined the diff in #405, which made the attachment
# report the fork it decides. Measured on THIS ledger's run, the seven
# names split: five move {middle, family, _ambiguities} -- 'Vega, Juan
# de la', 'Beethoven, Ludwig van', 'Berg, Jan van der', 'der, y van'
# and 'Nguyen, Thi Van', each gaining PARTICLE_OR_GIVEN, their particle
# being vocabulary that could have been a name word -- and two still
# move {middle, family} alone: 'Jong, Anke de' and 'Jong, Piet de',
# whose `de` can be no name in any reading, so nothing was declined and
# nothing is reported. The union over the seven is the three fields
# declared, which is what the over-declaration check asks for; narrowing
# to {middle, family} would orphan the five. A separate fix(#405) rule
# cannot take them instead: classify matches on `fields` being a
# SUPERSET of the whole diff, so an `_ambiguities`-only rule matches
# none of the five, and any rule wide enough to match them is this rule
# plus a role -- which then also claims the two silent names and leaves
# this one dormant.
name_regex = "(?i)^[\\u0000-\\u024f]*,[\\u0000-\\u024f]*\\s(de|del|den|der|di|do|dos|du|la|le|los|mc|van|vd|von|zu)(\\s+(de|del|den|der|di|do|dos|du|la|le|los|mc|van|vd|von|zu))*\\s*$"
fields = ["middle", "family", "_ambiguities"]

[[change]]
issue = "fix(#412) a connective join no longer absorbs the maiden marker beside it"
# 'Jane van der Berg née y Jones' and 'Jane née and Jones Smith': the
# last of the join-swallows. rules.md#M2 takes a marker standing as a
# word of its own, and rules.md#P3's connective join ran first in the
# grouping stage and merged the marker into a multi-word piece, so the
# bound never saw one -- the family kept 'née y Jones', or the
# marker-headed join read as a middle name. The marker pass now runs
# before every join (#418 is the same order defect in P3's word
# count), so the marker is taken and the words after it, connective
# included, are the maiden name: family 'van der Berg', maiden
# 'y Jones'; given 'Jane', maiden 'and Jones Smith'.
#
# Checked against this baseline's own run, not copied: both names
# arrive UNEXPLAINED here and at 2.0.0 alike, and nothing else does.
# Since #445 (2026-08-27) this rule explains only the first of the
# two: the marker in 'Jane née and Jones Smith' takes the rest of the
# name and leaves one name word, so `given` empties into `family` and
# the diff outgrew these fields. It has a rule of its own at
# the end of this file. The names were split rather than the fields
# widened, because 'Jane van der Berg née y Jones' keeps a given name
# and adding `given` here would have pre-excused its loss.
# At 1.4.0 fix(#274) already classifies them -- v1 has no maiden
# field, so every marker-bearing name is a diff there.
#
# The regex asks for a marker IMMEDIATELY followed by a connective,
# which is the shape the corpora carry. The join reached the marker
# from the other side too -- 'Jane Smith and née Jones' read middle
# 'Smith and née' and now reads family 'Smith and', maiden 'Jones' --
# but no corpus name has that shape, so the rule does not claim it;
# one arriving lands UNEXPLAINED and is read once, as a new name
# should be. A marker followed by a name word ('Jane van der Berg née
# Jones') is fix(#399)'s and does not move.
#
# `middle` is OUT: checked directly against the released 2.1.0 and the
# tree, the one name this rule now explains diffs {family, maiden}
# alone -- `given` 'Jane' and `middle` (empty on both sides) are
# unmoved; only `last` shrinks from 'van der Berg née y Jones' to
# 'van der Berg' and `maiden` fills with 'y Jones'. classify() admits
# by subset, so declaring `middle` here was not inert: a diff that
# grows to move it falls out of this rule instead of being silently
# claimed. Measured against the narrowed ledger, nothing else in this
# file claims a {family, maiden, middle} diff on this name either, so
# it would arrive UNEXPLAINED (#452).
name_regex = "(?i)\\bn[eé]e\\s+(y|and)\\b"
fields = ["family", "maiden"]

[[change]]
issue = "fix(#418) the connective carve-out counts the name the maiden clause leaves behind"
# 'Juan y Garcia née Jones': rules.md#P3 keeps a single-letter
# connective a name word in a THREE-word name, and the count included
# the marker and the maiden name, which leave -- so this read as five
# words, 'y' joined, and once the clause left there was no family:
# given 'Juan y Garcia', family ''. The marker pass now runs before
# the count, and the name reads as 'Juan y Garcia' does plus a maiden
# name: given 'Juan', middle 'y', family 'Garcia', maiden 'Jones'.
#
# This is the example the fix added to P3, and it reached the corpus
# through the rules-corpus regeneration in the same change. The other
# eight corpus names with this defect show it only under an APPENDED
# clause ('John e Smith', 'Lt.Gov. juan e garcia', ...), which the
# gate cannot construct; the case table pins that half.
#
# Exactly three words, a single-letter connective second, then the
# marker: four name words ('Juan y Eva Garcia née Jones') join with or
# without the clause and do not move.
name_regex = "(?i)^\\S+\\s+[ye]\\s+\\S+\\s+n[eé]e\\s+\\S+$"
fields = ["given", "middle", "family"]

[[change]]
issue = "fix(#418) accepted: a suffix word inside the maiden name ends it, connective or not"
# 'Jane née Jr y Jones': the one reading the marker-pass reorder costs,
# recorded as an Accepted row under rules.md#M2 and so in the rules
# corpus. The marker now reads the words as written, before any join,
# so 'Jr' ends the maiden name where the connective join used to bind
# 'Jr y Jones' into one name word first. The marker is then a word
# with nothing but a suffix after it (M2 declines), and the connective
# builds the family out of what is left: middle 'née', family 'Jr y
# Jones', no maiden name, against the baseline's maiden 'Jr y Jones'.
#
# Literal-anchored to the example: the class (a suffix homograph
# anywhere in the maiden name beside a connective) has no other corpus
# name, and a harvested one should arrive UNEXPLAINED and be read
# once rather than absorbed here.
name_regex = "(?i)^jane\\s+n[eé]e\\s+jr\\s+y\\s+jones$"
fields = ["middle", "family", "maiden"]

[[change]]
issue = "fix(#429) a wholly-credential segment after a one-word family renders as one entry"
# 'Smith, MD PhD': one word before the comma and nothing but
# credentials after it. The baseline read the leading 'MD' as a title
# and left suffix 'PhD'; the segment is the credential run rules.md#C1
# describes and now lands whole in `suffix`.
#
# The roles moved in #325; what #429 adds is the RENDER. #325 shipped
# them as 'MD, PhD' -- a comma the writer never typed -- because group
# decided "one comma segment is one suffix entry" by segment INDEX
# while assign decided the same segment by CONTENT. group asked
# assign's own predicate from #429, so the run renders as written
# and this path agrees with the full-name 'John Smith, MD PhD',
# which has rendered 'MD PhD' since 1.4.0. (2026-09-06, #436: the
# render is post_rules' now -- it reads the commas the writer typed
# rather than any predicate about segment content -- and 'MD PhD'
# here is unchanged by that move.)
#
# The name entered the corpus as the rules.md#C1 example that fix
# added, so this entry arrives with it rather than explaining a
# name that was already there. `family` and `given` are deliberately
# OUT of the field list: neither moves on this rule, so a regression
# in either stays loud. Literal-anchored -- the class has no other
# corpus name, and a harvested one should arrive UNEXPLAINED and be
# read once rather than absorbed here.
name_regex = "(?i)^smith,\\s*md\\s+phd$"
fields = ["title", "suffix"]

[[change]]
issue = "fix(#430) a credential run does not end at the roman numeral describing it"
# 'Smith, PSM I' and 'Smith, PSM I.': the baseline read given 'PSM',
# suffix 'I' -- the run ended at the numeral because rules.md#S2's
# initial veto keeps a numeral out of a suffix reading, so the segment
# did not look like a credential run and fell to the given-and-suffix
# walk. Behind a SUFFIX the numeral is describing that suffix ('PSM I'
# is Professional Scrum Master level I), so the run continues through
# it, period included -- an initial in that position is no shape anyone
# writes. The full-name 'John Smith, PSM I' has read it this way all
# along; this brings the one-word family into line.
#
# `family` is deliberately OUT of the field list: the family name does
# not move on this rule, so a regression there stays loud. Anchored to
# the two example spellings -- the class has no other corpus name, and
# a harvested one should arrive UNEXPLAINED and be read once.
name_regex = "(?i)^smith,\\s*psm\\s+i\\.?$"
fields = ["given", "suffix"]

[[change]]
issue = "fix(#432) a dotted numeral behind a name is a middle initial, not the generation"
# 'Smith, John V.': the baseline read suffix 'V.'. Behind a NAME word
# the period is decisive -- it marks an abbreviation, and an
# abbreviation is name material -- so the numeral is the middle initial
# it looks like. 'Smith, John B.' has always read middle 'B.'; the only
# thing that made V. differ is that V is also suffix vocabulary.
#
# The BARE form is the boundary and does not move: 'Smith, John V' is
# still suffix 'V' (v1 parity, #144), and it is a corpus name, so that
# half is asserted by the gate rather than by this entry's silence.
# `given` and `family` are out of the field list; neither moves.
name_regex = "(?i)^smith,\\s*john\\s+v\\.$"
fields = ["middle", "suffix"]

[[change]]
issue = "fix(#410) a title and one name word name the family, whatever annotation stands beside it"
# rules.md#H1 reads a title plus exactly one name word as the family
# ('Mr. Johnson' -> family 'Johnson'). The guard implementing it also
# declined whenever ANY token carried a suffix, nickname or maiden
# role, so the very same name with an annotation beside it kept the
# word in `given` and reported no family at all. None of the three is
# a name word, so the term went, and the four names below move
# `given` -> `family` to read as their un-annotated twins already did.
#
# Keyed on the four names by literal rather than by shape. The shape
# is "a title, one name word, and an annotation" -- a parse tree, not
# a string -- and a fields-only rule standing in for it would classify
# every future given/family swap in this corpus.
#
# `fields` is exactly the pair that moves: no annotation changes hands
# here, which is the whole point of the fix, so a diff in `nickname`,
# `maiden` or `suffix` on these names stays loud.
#
# FIVE corpus names change reading under #410. These four are the ones
# that arrive as new diffs and so need classifying here. The fifth,
# 'Freiherr von Richthofen V', was already classified by the fix(#424)
# rule below and stays there: #410 narrows its diff from three fields
# to two, and that rule's declared fields are a superset either way, so
# nothing ever reported it. A real movement behind a green gate.
#
# So the claim is not "the only names of this shape" -- it is the only
# ones not already spoken for. Of the four, two carry a nickname, one a
# maiden clause, one a nickname leading the name. The suffix flavor is
# NOT absent from the corpus: that fifth name is a title, one name word
# and a suffix. What no corpus carries
# is the plain spelling 'Dr. Smith PhD', pinned by
# tests/v2/cases.py::suffix_stays_suffix_title instead.
name_regex = "(?i)^(?:Senator \"Rick\" Edmonds|Xyz\\. \\(Bud\\) Smith|Dr\\. Smith n[ée]e Jones|'Smitty' Dr\\. Jones)$"
fields = ["given", "family"]

[[change]]
issue = "fix(#434) a multi-word maiden marker takes the maiden name"
# 'Maria Kowalska z domu Nowak': maiden_markers gained PHRASE entries
# and the Polish "z domu" is the first one any shipped set holds, so
# rules.md#M2's take fires on a marker that spans two tokens. Every
# earlier version read the marker as name text -- middle 'Kowalska z
# domu', family 'Nowak' -- because neither z nor domu is a marker
# alone and nothing looked at the pair.
#
# `fields` is the three the diff moves and no more. The marker leaves
# the name, so `middle` empties and `family` moves back one word,
# which is why this cannot share a rule with the bracketed name below:
# there the clause changes role and the name words around it do not
# move at all. One rule over both would have to declare the union and
# would pre-excuse a middle/family regression on the bracketed
# spelling -- the #444 failure the fix(#335) rules above spell out.
#
# Keyed on the literal, like those rules and for their reason: the
# shape is "a marker phrase inside a name", a question about the
# parse, and a fields-only rule standing in for it would pre-excuse
# every future middle/family/maiden confusion in the corpus.
name_regex = "(?i)^Maria Kowalska z domu Nowak$"
fields = ["middle", "family", "maiden"]

[[change]]
issue = "fix(#434) a multi-word marker leads a bracketed clause to the maiden name"
# 'Maria Kowalska (z domu Nowak)': the same vocabulary change at the
# other site. rules.md#M3 reads a marker-led clause as the maiden name
# whatever pair encloses it, and #335 gave it that reach in 2.2 -- but
# the reach alone leaves this name a nickname, since M3 asks whether
# the content opens with a recognized marker and through 2.1 no
# vocabulary answered yes here. The phrase entry is what moves it, so
# it is #434's diff and not #335's, and it is deliberately NOT a
# seventh alternative in that rule's six literals.
#
# `fields` is the pair that moves. The clause changes role; the name
# words keep their readings, so a `given`, `middle` or `family`
# movement here is a regression and stays loud.
name_regex = "(?i)^Maria Kowalska \\(z domu Nowak\\)$"
fields = ["nickname", "maiden"]

[[change]]
issue = "fix(#335) a marker-led bracketed clause reads as the maiden name whatever pair encloses it"
# 'Jane Smith (née Jones)', 'Jane (née Jones) Smith', 'Jane Smith
# (née V)', 'Anna Müller (geb. Schmidt)', 'Ursula von der Leyen
# (geb. Albrecht)', '山田 花子（旧姓 佐藤）': rules.md#M3 reads a bracketed
# clause whose content opens with a marker word and carries a word
# after it as the maiden name, whichever bucket the enclosing pair
# sits in. Through 2.1 the parenthesis pairs -- ASCII and fullwidth
# alike -- were NICKNAME delimiters by default and nothing looked
# inside them, so all six clauses came back as nicknames.
#
# `fields` is exactly the pair that moves and not one field more. The
# clause changes ROLE and nothing else here: the name words around it
# keep their readings, so a `given`, `middle` or `family` movement on
# any of these six is a regression and stays loud. Worth stating
# because the convenient thing is to declare the union of what the
# same six names move against OTHER baselines -- against 2.0.0 the
# CJK name also flips given/family -- and PR #444 is what that costs:
# fix(#424) there declared a field its diff had stopped moving, and a
# real movement was absorbed silently behind it until #444 narrowed
# the rule.
#
# Keyed on the six names by literal, like the #410 rule above. The
# shape is "a bracketed clause whose first word is a marker", which is
# a question about the parse rather than about the string, and a
# fields-only rule standing in for it would pre-excuse every future
# nickname/maiden confusion in the corpus.
name_regex = "(?i)^(?:Jane Smith \\(n[ée]e Jones\\)|Jane \\(n[ée]e Jones\\) Smith|Jane Smith \\(n[ée]e V\\)|Anna Müller \\(geb\\. Schmidt\\)|Ursula von der Leyen \\(geb\\. Albrecht\\)|山田 花子（旧姓 佐藤）)$"
fields = ["nickname", "maiden"]

[[change]]
issue = "fix(#335) a marker-led clause leaves the one name word its bare reading"
# 'Smith (née Jones)', which rules.md#N3 carries as an Accepted line.
# N3 reads a name that is only a nickname plus one name word as "that
# word is the family name", and a marker-led clause is not a nickname
# clause, so N3 no longer reaches this shape: the word keeps the
# reading the bare "Smith née Jones" gives it -- `given` when this
# rule was written, and `family` since #445 gave the bare spelling
# the same reading from the other side.
#
# Its own rule rather than a seventh alternative in the fix(#335)
# rule above: one rule holding both would have to declare the union of
# two different diffs and would pre-excuse whatever else landed inside
# it. (The two now move the same two fields, but for different
# reasons -- that rule's names keep a family name throughout, while
# this one's gained one back from #445 -- and merging them would
# re-declare `given` over both.)
#
# The revisit note this block carried was answered on 2026-08-27 and
# answered WRONG, which the review round caught and this text
# records. The first answer said the diff was unchanged at this
# baseline "because the baseline is what read `given`". It did not:
# 2.0.0 and 2.1.0 both read 'Smith (née Jones)' as family 'Smith',
# nickname 'née Jones' (measured on the wheels, 2026-08-27) -- only
# the BARE spelling ever read `given`, and this rule is the
# bracketed one. So `given` is empty on both sides, `family` agrees
# again since #445, and the diff here shrank to {nickname, maiden}
# exactly as it did at 1.4.0.
#
# Narrowed to those two fields, which is what the revisit note asked
# for. Left at four, this rule stood over a two-field diff and
# classify's subset test would have explained a `given`/`family`
# regression on this name in silence -- the absorption the note was
# written to prevent, surviving the round that answered it. Verified
# after narrowing: the name is still explained, and a {given, family}
# diff on it is now UNEXPLAINED.
name_regex = "(?i)^Smith \\(n[ée]e Jones\\)$"
fields = ["nickname", "maiden"]

[[change]]
issue = "fix(#445) a maiden marker makes the lone name word the family"
# rules.md#M4 -- "a maiden name standing beside exactly one name word
# makes that word the family name". A maiden name is a FORMER family
# name, which only means something beside a current one, so the word
# left standing beside it is the surname the bearer uses now:
# 'Smith née Jones' read given 'Smith' with an
# empty family on this baseline and reads family 'Smith' here.
#
# Two fields and no more. The marker consumption these names also
# carry is this baseline's reading already, so `given` and `family`
# are the whole diff -- which is what makes them one rule, and what
# keeps out the two names whose diffs are compounds (the connective
# join below, the trailing numeral above).
#
# Anchored, and spelled out one name per alternative, for the reason
# M4 itself gives. The shape regex a reader would write first -- one
# word, then a marker -- also matches M4's two carve-outs
# ('abd née Jones', 'J. née Jones Smith V', both corpus names and
# neither moving), and a rule declaring `given` over those two would
# stand ready to explain the very given -> family move the carve-outs
# exist to prevent.
#
# 'Smith née Jones' and 'Smith née Jones PhD' are corpus rows this
# change itself added, being M4's own example lines.
# 'John née Jones Smith Ma' sits here rather than with an acronym
# rule of its own: this baseline already reads it maiden 'Jones Smith
# Ma', so the acronym is no part of the diff. At 1.4.0, where v1 read
# suffix 'Ma', it is the one name of this class that needs one.
# 2026-09-19, #533: `_ambiguities` joins the two, and no name
# leaves or enters. The roles are unchanged by that change --
# 'John née Jones Smith Ma' has its Title-cased member declined
# by its own writing, exactly as the count declined it before --
# but the fork is now CONSULTED at the end of the clause and
# REPORTED, and the gate compares `_ambiguities` as a field. The
# other five names carry no member and contribute nothing to the
# union, which is why this widening is one field and not a rule.
name_regex = "(?i)^(?:Janey n[ée]e Jones|Jane n[ée]e Jones J\\. V|Jane n[ée]e Jones Smith|John n[ée]e Jones Smith Ma|Smith n[ée]e Jones|Smith n[ée]e Jones PhD)$"
fields = ["given", "family", "_ambiguities"]

[[change]]
issue = "fix(#445) the lone name word beside a marker a connective join no longer absorbs"
# 'Jane née and Jones Smith', whose diff is a compound of #412 and
# #445 and so cannot sit in either's plain rule. #412 stopped the
# connective join from swallowing the marker, so the marker is taken
# and 'and Jones Smith' is the maiden name; what that leaves is one
# name word, and rules.md#M4 makes it the family. middle
# 'née and Jones', family 'Smith' -> family 'Jane', maiden
# 'and Jones Smith'.
#
# Its own rule rather than a widening of the fix(#412) rule above,
# whose regex reaches this name too: the OTHER name it claims -- the
# one it explains, 'Jane van der Berg née y Jones' -- keeps a given
# name, and one rule holding both would have to declare `given` for
# both and pre-excuse its loss where losing it would be a regression. At 1.4.0
# the fix(#445) rule carries this name with the same four fields, v1
# having read the marker as a middle word.
name_regex = "(?i)^Jane n[ée]e and Jones Smith$"
fields = ["given", "middle", "family", "maiden"]

[[change]]
issue = "fix(#371) a suffix never begins a name: the Ph./D. merge declines at the head"
# 'Ph. D. Van Johnson', 'Ph. D. John Smith', 'Ph. D.', 'Ph. D., Jr.':
# rules.md#S2 -- "A suffix never BEGINS a name: position outranks the
# vocabulary match". The v1 fix_phd merge joined the pair wherever it
# stood, which is what made a leading credential possible at all, and
# it emptied the family doing it: 'Ph. D. Van Johnson' read given
# 'Van Johnson' with no surname. Declining at the head of segment 0
# leaves 'Ph.' to H2's abbreviation clause (title) and 'D.' to the
# positional read.
#
# RESTORES 1.4.0 on THREE of the four, exactly, which is why this
# ledger gains a rule while expected_since_1.4.0 loses three names:
# v1 matched the pair by regex mid-string and never merged it at the
# head either, so what shipped in 2.0 was a regression rather than a
# reading. Measured
# on the released 1.4.0 wheel: 'Ph. D. Van Johnson' -> title 'Ph.',
# first 'D.', last 'Van Johnson'; 'Ph. D. John Smith' -> title 'Ph.',
# first 'D.', middle 'John', last 'Smith'; 'Ph. D.' -> title 'Ph.',
# last 'D.'; 'Ph. D., Jr.' -> title 'Ph.', first 'D.', suffix 'Jr.'
# -- and that fourth name is NOT restored: v1 read first 'D.' where
# the pre-comma run now reads family 'D.', two roles apart. The 'D.'
# relocated rather than vanished, which is why the residual diff
# rides under `fix(comma-precomma-family)` (fields given+family) and
# not under this rule. That reading predates this change.
#
# `fields` is the union over the four names and nothing wider: title
# and suffix move on all four, given on two, family on three, middle
# on one.
name_regex = "(?i)^Ph\\. D\\.( John Smith| Van Johnson|, Jr\\.)?$"
fields = ["title", "given", "middle", "family", "suffix"]

# -- the four rules below are the shape-tagged contract corpus's
# arrival (#468): corpus_shapes.jsonl compares each tagged name under
# its shape's declared order from baseline 2.0.0 up, so these are
# comparisons no run before it made, and every one of them reads
# [order: ...] in the report. The same four stand in
# expected_since_2.0.0.toml -- both baselines predate the 2.2 cycle
# where #395 and #399 landed, and a ledger's rules are its own
# baseline's history.

[[change]]
issue = "feat(#395) a leading never-given particle bounds the family under a declared family-first order"
# 'de la Cruz Juan Carlos', compared under FAMILY_FIRST and under
# FAMILY_FIRST_GIVEN_LAST -- one rule for both, since the fold moves
# the same three roles either way. This baseline read family 'de',
# given 'la Cruz Juan Carlos': the leading chain took the particle
# alone and everything after it was one given name. #395 lets the
# chain reach 'Cruz' THROUGH ambiguous 'la' and stop there, because a
# declared family-first order says what follows the family is not more
# surname; the leftovers then distribute by the order -- given 'Juan'
# middle 'Carlos' under FAMILY_FIRST, the reverse under
# FAMILY_FIRST_GIVEN_LAST. The DEFAULT order is untouched, which is
# why the untagged sibling case row reads family 'de la Cruz Juan
# Carlos' at every baseline: with no order declared, 'Juan Carlos'
# really can be more surname.
name_regex = "^de la Cruz Juan Carlos$"
fields = ["family", "given", "middle"]
# Scoped, and this is the rule the key exists for: the same string is
# also compared under the DEFAULT order (corpus_rules.jsonl carries
# it), where the fold must NOT fire -- and if it leaked there it would
# move these same three roles. Order-blind, this rule would absorb
# that regression and call it intentional.
orders = ["FAMILY_FIRST", "FAMILY_FIRST_GIVEN_LAST"]

[[change]]
issue = "fix(#399)/feat(#395) a consumed maiden marker leaves the family-first fold no given name"
# 'de la Cruz née Vega' under both family-first orders. Two changes
# compound: #395 bounds the family at 'Cruz' (this baseline read
# family 'de'), and #399 consumes the marker before anything can place
# it, so 'Vega' is the maiden name rather than a leftover competing
# for the given slot. What is left is no given name at all, the right
# answer for family-plus-maiden input -- and the two orders AGREE
# after it, having nothing to distribute.
#
# Its own rule rather than a widening of `fix(#399) a maiden marker
# bounds the particle chain that swallowed it` above: that rule
# already reaches this name by regex and declines it on `fields`
# (family+maiden, no `given`), and widening it would pre-excuse a lost
# given name on the names it explains today.
name_regex = "^de la Cruz née Vega$"
fields = ["family", "given", "maiden"]
# both family-first orders diff identically here, the marker having
# left them nothing to distribute; the default-order reading of this
# string is another rule's business
orders = ["FAMILY_FIRST", "FAMILY_FIRST_GIVEN_LAST"]

[[change]]
issue = "feat(#395)/fix(#296) a comma followed only by a title leaves the pre-comma name to the declared order's fold"
# 'de Mesnil Jean, Dr.' under FAMILY_FIRST. Two changes compound, and
# the case row carries no tag of its own (cases.py's default), so the
# rule names them: with 'dr' out of the suffix vocabulary (#296) the
# comma is followed by nothing but titles, so the pre-comma run is
# read as a name under the declared order -- and #395's fold then
# takes it. suffix 'Dr.' -> title 'Dr.', family 'de' -> 'de Mesnil',
# given 'Mesnil' middle 'Jean' -> given 'Jean'.
#
# The default-order sibling 'John Smith, Dr.' is NOT here: no
# particle, so nothing folds, and its title/suffix move rides under
# `fix(#296) ... keeps its split and its title` above, whose block now
# lists that name twice -- once tagged [order: FAMILY_FIRST].
name_regex = "^de Mesnil Jean, Dr\\.$"
fields = ["title", "given", "middle", "family", "suffix"]
orders = ["FAMILY_FIRST"]

[[change]]
issue = "feat(#395)/fix(#296) a comma followed only by a title leaves the pre-comma name to the declared order's fold, the given-last spelling"
# 'de la Cruz Juan Carlos, Dr.' under FAMILY_FIRST_GIVEN_LAST: the
# rule above's story with two leftovers instead of one, which is the
# only shape in which the two family-first orders can disagree about
# the distribution. suffix 'Dr.' -> title 'Dr.', family 'de' -> 'de la
# Cruz', given 'la Cruz Juan Carlos' -> middle 'Juan' given 'Carlos'.
#
# A separate rule rather than an alternation with the one above: these
# are two chosen names, and a literal-anchored regex per name is what
# keeps a rule from reaching a string nobody wrote down.
name_regex = "^de la Cruz Juan Carlos, Dr\\.$"
fields = ["title", "given", "middle", "family", "suffix"]
orders = ["FAMILY_FIRST_GIVEN_LAST"]

# ---------------------------------------------------------------------
# The `_initials` rules (#484) -- see the block of the same name at the
# end of expected_since_1.4.0.toml for what the pseudo-field is. Only
# view changes AFTER this baseline are visible from it: the per-word
# grouping predates it (2.0.0) and is classified at 1.4.0 alone.
# fix(#462), below, is the 2.3 facade fix, visible from every 2.x
# baseline.

[[change]]
issue = "fix(#385/#402) an all-particle name part initials its words (R2)"
# 'Anh Do' -> 'A. D.', 'Juan van der' -> 'J. v. d.': rules.md#R2/#R3,
# shipped in 2.2.0, decisions.md#R2. Fields identical at this
# baseline; only the view moved. The same 28-name literal list as the
# 1.4.0 rule, for the same reason.
name_regex = "(?i)^(?:anh do|smith van der|yin le|yin a le|vai la|jong van der|jong, van der|juan van der|mesnil garcia de|mesnil garcia van|mesnil de|sander van|van ma van|anh van do|anh van mc|beethoven ludwig van|berg jan de jr\\.|john van mc|jong anke de|juan de|ménil christophe de|ménil de|nguyen thi van|nguyen, van le|van berg jan de)$"
fields = ["_initials"]
orders = ["DEFAULT"]

[[change]]
issue = "fix(#360) los joined the particles, so it no longer initials"
# 'de los Santos': 'l. S.' -> 'S.' once #360 (2.2) made 'los' a
# particle. One name, literal.
name_regex = "(?i)^de los santos$"
fields = ["_initials"]
orders = ["DEFAULT"]

[[change]]
issue = "fix(#462) the facade keeps an initial-shaped conjunction letter"
# 'Scott E. Werner', 'Amy E Maid', 'Jose E. Maria Santos':
# HumanName.initials() dropped a dotted or bare-capital E/Y in the
# middle or family group because the 2.0 facade tested conjunction
# membership alone, where 1.4.0's is_conjunction also required "NOT
# is_an_initial". 'S. W.' -> 'S. E. W.', restoring 1.4.0; the core's
# initials() was already right. Fields identical -- the parse never
# read E as a conjunction, only the facade's render did -- so this is
# `_initials` alone (#484). The shape: a bare capital E or Y, or a
# dotted E./Y. of either case, standing as its own word. Lowercase
# bare e/y is the connective and does not move. The regex reaches 22
# corpus names -- 18 until #383/#479's case rows and rules.md#P3
# examples arrived on 2026-09-13 -- of which 14 diffed when the rule
# was written (2026-09-02); _CORPUS_CLAIMS in
# tests/v2/test_ledger_guards.py pins that reach as _Claim(22, ...)
# and fails if it moves, so the REACH digit is checked rather than
# remembered. The 14 is not: it is a
# dated snapshot of what diffed that day and nothing re-runs it.
# The names it reaches and does not move are
# what the gap IS, and the invariant behind it is a GROUP rather than
# a count:
# they carry the E/Y in the GIVEN group, which has always initialed
# every word it holds whatever the vocabulary says, so there was
# nothing for the fix to restore.
#
# 2026-09-13, #383/#479 then #528: 'JUAN Y GARCIA' diffed here for
# TWO reasons at once that morning -- the facade's, which is this
# rule's own, and the core's, which was new -- and #528 closed the
# facade's half the same day, the facade now reading the parse's tags
# and agreeing with this baseline's 'J. G.' again. The core's half
# remains and this rule still explains it, one `_initials` move.
# expected_since_2.0.0.toml's copy of this rule carries the account;
# it is the same at all three baselines.
name_regex = "(?:^|[\\s,])(?:[EY]|[EeYy]\\.)(?=[\\s,]|$)"
fields = ["_initials"]
orders = ["DEFAULT"]

# ---------------------------------------------------------------
# THE 2.3 TITLE-RUN BUNDLE: #489 (a title run addresses by its last
# title), #316 (a trailing period-marked title word reads as a
# title), the leading peel's name-word floor, and the `esq` acronym
# drop that shipped beside them. Five rules, four of them one per
# ARGUMENT rather
# than one per name, plus a fifth that is #316's argument again on
# the one name a script-classified alternation cannot hold. Over
# twenty-four corpus names.
#
# LAST in the file, and that is narrow-first rather than a
# preference: every rule already here that REACHES one of the
# twenty-four declares `fields` that are a strict subset of the bundle
# rule claiming that name, and a wide rule sitting AHEAD of a
# narrower one it shares a corpus name with is an order-decided
# contest the run refuses (#382). Measured 2026-09-08, all four
# ledgers: at 1.4.0 fix(#296)'s trailing `dr` reaches 'John Smith
# Dr.' and 'John Smith Prof. Dr.', the two comma routings reach
# 'Smith, John Prof.', and the two-token `jr` rule reaches 'Dr Jr'
# and 'Sir Jr'; at 2.0.0 and 2.1.0 only fix(#296) reaches any of
# them; at 2.2.0 none does. Not one of those rules ADMITS the diff
# it reaches -- every shape is outside its field list, measured --
# so nothing below takes a name off a rule that was explaining it,
# and no [[change.precedes_narrower]] block is needed anywhere.
#
# `_initials` appears in none of the four field lists although the
# initials of several of the twenty-four do move. The derived view
# enters a diff only where every ROLE and every ambiguity kind
# agrees (compare.py's _RULE_FIELDS, main()'s roles-identical
# guard), and all twenty-four move roles -- so no run can produce a
# shape here carrying it, and validate_rules refuses it beside
# another field in any case.
# ---------------------------------------------------------------

[[change]]
issue = "fix(#489) a title run addresses by its last title"
# 'Her Majesty Queen Elizabeth' and 'Dr. Sir John': the
# given_name_titles lookup was keyed on the WHOLE run, and 'her
# majesty queen' is in no vocabulary and never could be, so the one
# name word behind the run stayed the family. Both sites that ask --
# rules.md#H1's retag and rules.md#P5's licence -- now test the whole
# run's key OR the last word's, and 'queen' and 'sir' are
# GIVEN_NAME_TITLES entries. The name word behind the run becomes the
# GIVEN name and the family empties, which is H1's Accepted outcome.
# Both roles move together and `fields` declares both. `title` is
# deliberately OUT: the run itself is unchanged, only what it
# addresses as, so a name whose TITLE moved arrives UNEXPLAINED, as
# it should.
#
# 'Reverend Mother Teresa', 'Mr Sir John', 'Xyz. Sir John' and 'Sir
# Sheikh abdul rahman' move the same way and are NOT members: none of
# them is in any corpus file, so a member for one would be a rule
# reaching nothing.
#
# An anchored alternation of the two NAMES rather than a shape. What
# selects them is a SHAPE -- a multi-word title run whose LAST word
# is a given-name title -- and a member copying GIVEN_NAME_TITLES
# would reach 'Sir John Smith' and 'Dr. Smith', which do not move.
# The members are a list of names and copy no wordlist, which is what
# _NOT_A_VOCABULARY_COPY in tests/v2/test_ledger_guards.py records;
# _CORPUS_CLAIMS pins the reach at 2 with its digest, and
# _MUST_NOT_MATCH carries three boundaries: a ONE-word run ('Sir John
# Smith'), and two runs whose last word is title vocabulary that is
# not given-name vocabulary ('His Excellency Lord Duncan', 'Her Royal
# Highness Princess Anne' -- the open vocabulary question, #519). One
# set, identical in all four ledgers.
name_regex = "^(?:Dr\\. Sir John|Her Majesty Queen Elizabeth)$"
fields = ["family", "given"]

[[change]]
issue = "change(suffix-acronym-collisions) esq leaves the acronym set"
# 'John Smith E.S.Q.': 'esq' left SUFFIX_ACRONYMS, where the 2019 bulk
# post-nominal import put it (af5bdab, #93) -- esquire is a
# contraction, not an initialism -- so the multi-dot spelling stops
# being credential vocabulary and falls to the positional read: given
# 'John', middle 'Smith', family 'E.S.Q.', where every release since
# 1.4.0 read family 'Smith', suffix 'E.S.Q.'.
#
# A BEHAVIOR CHANGE rather than a fix, which is what the `change` tag
# says: this is a deliberate parity break at all four baselines, and
# the entry that argues it is decisions.md#suffix-acronym-collisions
# -- there is no issue number to cite, and the release-log bullet
# carries none either. It is not NOT WANTED: that spelling is for a
# reading nobody wants, and this reading is the one the decision
# chose.
#
# 2026-09-18 (#516): this rule stopped explaining anything, and the
# reason is not a revert. The by-shape credential class reads a word
# of two or more period-separated chunks that no vocabulary claims by
# POSITION (rules.md#S3), so 'John Smith E.S.Q.' is a credential again
# with no wordlist entry behind it at all -- the reading this baseline
# has, recovered by a different route than the acronym entry gave it.
# The vocabulary decision the `change` tag records still stands and is
# still the history of that entry; what is gone is its ROLE diff. The
# name still diffs here, on the `suffix-or-name` report the positional
# reading brings with it -- `_ambiguities` is a compared surface from
# 2.0 on -- and fix(#516) classifies that, which is why this rule is
# dormant rather than explaining anything: `dormant` means "explained
# no diff", not "the name stopped moving". Only the 1.4.0 copy can say
# the diff is gone outright, that baseline comparing no ambiguities.
# Declared
# `dormant` rather than deleted, so the harness says so out loud if a
# future change takes the positional reading away again.
#
# Literal, no alternation, and exactly as wide as the diff: 'esq'
# keeps its SUFFIX_WORDS membership, so the acronym entry's only
# unique coverage was this one spelling and this one corpus name.
# _MUST_NOT_MATCH carries the three spellings that did NOT move --
# 'John Smith Esq' (the word list still reads it), 'Esq. Smith'
# (rules.md#H2's leading inference) and 'Smith, Esq.' (the lone
# post-comma credential).
dormant = "'John Smith E.S.Q.' no longer moves any role this rule declares: #516's by-shape credential class reads the multi-dot spelling as a credential by position, with no wordlist entry, which is the reading this baseline already had. Its remaining diff here is the `suffix-or-name` report, which fix(#516) classifies. Kept because the vocabulary change it records is real history and the rule wakes if that reading is lost again"
name_regex = "^John Smith E\\.S\\.Q\\.$"
fields = ["family", "middle", "suffix"]

[[change]]
issue = "fix(#489) the title peel leaves a name word a suffix cannot be"
# 'Dr King Jr', 'Dr. King MD', 'Dr Jr' and 'Sir Jr': the leading title
# peel's only floor was "leave one piece", so it peeled 'Dr King'
# whole and left the post-nominal to be the name -- title 'Dr King',
# family 'Jr', no suffix at all. leading_titles now also refuses to
# leave a word that is nothing but suffix vocabulary standing as the
# name and gives the run's last word back (rules.md#H3,
# decisions.md#H3), so 'Dr King Jr' reads title 'Dr', family 'King',
# suffix 'Jr' -- what the comma spelling 'King, Dr Jr' always read.
#
# FOUR roles, and no single name moves all four. The two three-word
# names move `title`, `family` and `suffix`; 'Dr Jr' and 'Sir Jr'
# move `given` as well, or instead of `family`, the word given back
# standing alone with the credential peeled off it. At the 2.x
# baselines `_ambiguities` joins the list -- with the title given
# back there is no title left to make the reading H1's, so all four
# report title-or-name through rules.md#H4 -- and it is absent at
# 1.4.0, which has no ambiguity surface to compare (compare.py's
# _RULE_FIELDS).
#
# An anchored alternation of the four NAMES rather than a shape. What
# selects them is a SHAPE -- a title run with nothing but post-nominal
# pieces behind it, whose own last word is not one of those -- and a
# member copying TITLES or SUFFIX_WORDS would reach 'MD DDS', 'Jr.
# Ph. D.' and 'Marquess of Bath', every one of which the floor
# declines and every one of which is a _MUST_NOT_MATCH probe, with
# 'Dr Smith Jr' beside them for the ordinary titled name the floor
# never sees. The members are a list of names and copy no wordlist,
# which is what _NOT_A_VOCABULARY_COPY records. THREE of the four are
# corpus names, not four: 'Sir Jr' left corpus_rules.jsonl on
# 2026-09-09, when the rules.md example pinning it was dropped as a
# duplicate of 'Dr Jr' (decisions.md#H5), and it stays in the
# alternation because a name_regex names INPUTS rather than corpus
# rows. _CORPUS_CLAIMS pins the reach at 3 with its digest. One set,
# identical in all four ledgers; only the `fields` differ, as the
# paragraph above says.
name_regex = "^(?:Dr Jr|Dr King Jr|Dr\\. King MD|Sir Jr)$"
fields = ["_ambiguities", "family", "given", "suffix", "title"]

[[change]]
issue = "fix(#316) a trailing period-marked title word reads as a title"
# 'John Smith Prof.' and thirteen more: a trailing run of period-marked
# LISTED title words is peeled as a title, so the surname behind it
# stops being lost -- title 'Prof.', given 'John', family 'Smith',
# where every baseline read middle 'Smith', family 'Prof.'. A RUN,
# mirroring the leading peel: 'John Smith Prof. Dr.' gives title
# 'Prof. Dr.' and 'Dr. John Smith Prof.' gives 'Dr. Prof.' in input
# order. The family-comma segment takes the same walk, so 'Smith,
# John Prof.' agrees with the bare spelling at last. And the trailing
# title is TRANSPARENT to the post-nominal peel that follows it:
# 'John Smith Jr. Prof.' keeps suffix 'Jr.' rather than promoting the
# generational suffix to the family name, and 'John Prof. MA' reads
# family 'MA' by rules.md#S2's reserve.
#
# 2026-09-18 (#289): the last clause is retracted. S2's reserve is no
# longer what decides 'John Prof. MA': written capitals in a
# mixed-case name lean credential with nothing to spare, so the name
# reads title 'Prof.', family 'John', suffix 'MA' -- the transparency
# this rule is about is unchanged and now shows a DIFFERENT reading
# through it, which is the point of transparency. This rule keeps the
# name at every baseline where it already had it; the fix(#289) rule
# at the bottom of each file carries the names whose reading moved and
# that nothing else claims.
#
# Five roles, the union of what the sixteen move; no name moves all
# five (four is the most, 'John Smith Jr. Prof.'), and two move only
# two at every baseline -- 'Smith, John Prof.' {title, middle} and
# 'Smith Sir.' {title, family} -- with 'Mary Jane King.' moving three.
# A third joins them at 1.4.0, 2.0.0 and 2.1.0, 'John Smith Dr.'
# {title, suffix}, which moves {title, middle, family} at 2.2.0
# instead: 'dr' was suffix vocabulary until 2.2, so the role it
# vacates differs by baseline (measured 2026-09-09 against all four
# wheels). `_ambiguities` is not among the five, and it is not
# because no name reports one: 'John Prof. MA' reports
# `suffix-or-name`, which is S2's bare-acronym reserve and not this
# rule. None of the sixteen reports `title-or-name` -- the walk
# leaves a title standing, so H4's title half never fires -- and the
# derived view cannot enter a diff here in any case, every one of the
# sixteen moving roles (compare.py's _RULE_FIELDS).
#
# TWO of the sixteen end in ' Dr.' and are also reached by
# fix(#296)'s trailing-`dr` rule above -- 'John Smith Dr.', which
# that rule used to explain, and 'John Smith Prof. Dr.'. That rule
# declares {middle, family, suffix} and neither diff fits it now, so
# both fall through to here; its comment records the handover, and
# narrow-first placement is what keeps the pair out of contest. The
# BARE trailing spelling stays with fix(#296): 'Smith Dr' and the 'dr
# ... dr' names wear no abbreviation period and the walk never sees
# them (#316(b), left open).
#
# The last two members arrived with the 2026-09-09 review of the
# docs commit, which added two rules.md examples: 'Mary Jane King.',
# the H5 Accepted clause's collision example (title 'King.', given
# 'Mary', family 'Jane', where every baseline read family 'King.'
# behind middle 'Jane'), and 'Smith Sir.', which is an H1 example.
# 'Smith Sir.' is HERE and not on the fix(#489) run rule above
# because the DIFF decides: it moves {title, family}, the walk
# taking 'Sir.' out of the name, while its given/family reading is
# what every baseline already gave ('Smith' stays the given name on
# both sides). The #489 rule declares {family, given} and does not
# reach a title role at all, so it could not claim the diff even
# placed ahead of this one.
#
# An anchored alternation of the sixteen NAMES rather than a shape.
# What selects them is a SHAPE -- period-marked, listed, trailing --
# and a member copying TITLES would reach the BARE 'Mary Jane King'
# and 'John Smith Sir', which do not move; the period-marked
# 'Mary Jane King.' is a member precisely because it does, which is
# the line the period draws and the whole of what it draws. A member
# spelled as the shape (a trailing dotted word) would reach 'John
# Smith Xyz.', which is the boundary the leading slot's H2 inference
# is deliberately NOT given here. Those three and 'Smith, Prof.' --
# the comma shape whose segment holds no name word and which reads
# by a different gate -- are the _MUST_NOT_MATCH probes. The members
# are a list of names and copy no wordlist, which is what
# _NOT_A_VOCABULARY_COPY records; _CORPUS_CLAIMS pins the reach at
# 14 with its digest.
#
# 'Andrew Perkins (Mgr.)' is spelled with \\x28 and \\x29 rather than
# the \\( and \\) the paren-bearing rules above use. Escaped or not, a
# literal parenthesis inside an alternation body hides the WHOLE
# group from test_ledger_guards._alternations -- its member pattern
# excludes '(' and ')' -- and a sixteen-member alternation should not
# be invisible to the discovery pass that demands every alternation
# declare what it copies. The two spellings match the same string.
# One set, identical in all four ledgers.
#
# 2026-09-18 (#289/#516): a SEVENTEENTH member, 'JOHN PROF. MA'. It
# arrived in the rules corpus as rules.md#H5's one-case witness that
# the suffix reading is taken over what STANDS once the title chain
# has run, not over what stood -- the reading the mixed-case spelling
# stopped demonstrating when the caps lean started deciding it. The
# name is wholly one case, so no lean fires and nothing about it is
# this arc's: what moves is exactly this rule's trailing-title chain
# ({title, family, suffix}, inside the five roles already declared),
# and it stops diffing at 2.3.0 for the same reason its sixteen
# siblings do.
name_regex = "^(?:Andrew Perkins \\x28Mgr\\.\\x29|Dr\\. John Smith Prof\\.|Dr\\. Smith Sir\\.|JOHN PROF\\. MA|John Prof\\. MA|John Smith Dr\\.|John Smith Jr\\. Prof\\.|John Smith Mr\\.|John Smith Prof\\.|John Smith Prof\\. Dr\\.|John Smith Prof\\. Jr\\.|John Smith Rev\\.|Mary Jane King\\.|Sir John Prof\\.|Smith Prof\\.|Smith Sir\\.|Smith, John Prof\\.)$"
fields = ["family", "given", "middle", "suffix", "title"]

[[change]]
issue = "fix(#316) a trailing Latin title on a native-script name is a title"
# '毛 泽东 Dr.': the rule above's walk, on the one corpus name it
# reaches that is not Latin-only. The walk runs BEFORE the positional
# read, so the pieces the script test sees are all Han and the
# family-first order stands -- this is '毛 泽东' plus a title, and
# it reads title 'Dr.', given '泽东', family '毛'. A Latin title at
# the back of a wholly-Han name is the one piece that would make the
# piece set look mixed-script, which is what the ordering of the two
# buys.
#
# ITS OWN rule rather than a seventeenth alternative above, and not by
# preference: an UNDECLARED alternation holding a script-classified
# member is claimed by the honorific pin in
# tests/v2/test_ledger_guards.py, which requires such an
# alternation's members to BE the config's CJK honorific entries --
# and until #322/#323 taught that pin to ask whether the members FOLD
# into that vocabulary, that was every such alternation. So this
# stands alone, literal-anchored,
# reaching exactly one corpus name (_CORPUS_CLAIMS carries the 1)
# with _MUST_NOT_MATCH probes for the boundary -- the same shape the
# four #436/#437 CJK rules above take, and for the same reason.
#
# Classified 2026-09-09, in the review round that fixed which title
# run H1 addresses by; the reading itself is untouched by that fix.
# The name is RADAR tier (corpus_cjk_tolerated.jsonl, tolerated since
# the 2026-09-01 CJK demotion) and it had been printing UNCLASSIFIED
# at all four gates since the trailing walk landed. Radar never
# blocks, so nothing failed -- and this bundle's convention is that
# every gate line reads `radar unclassified: 0`, which is the whole
# reason the row is here rather than left to print.
#
# TWO roles here, the fewest at any baseline, and NOT the same set as
# elsewhere -- this is the one bundle rule whose `fields` differ per
# ledger. 2.1.0 shipped the Han family-first order, so it already read
# first '泽东', last '毛'; only the Latin word moves, out of
# `suffix` and into `title`.
#
# Literal and anchored, so the reach cannot widen into the other
# forty-six tolerated CJK names (twenty-nine until this bundle's
# seventeen rows joined the file). _MUST_NOT_MATCH carries three of
# them as probes: '王先生, V.' (a Latin post-nominal behind a
# comma, which the trailing walk never sees), '田中さん, Dr.' (the
# comma spelling of this very shape, routed by the segment gate) and
# '田中さん II' (a spaced Latin post-nominal that is not title
# vocabulary).
name_regex = "^毛 泽东 Dr\\.$"
fields = ["suffix", "title"]

# #322/#323, LAST in the file. The parser knew ONE full stop --
# the ASCII period -- and knew it at ONE site, the lexicon's edge
# strip. It now reads four: the ASCII period, the fullwidth '．',
# the ideographic '。' and its halfwidth '｡'. A full stop glued
# AFTER a script-written word is punctuation and not part of the
# word -- invisible to the script reading and to the vocabulary,
# and left in the text on the word it arrived with -- because no
# East Asian script writes an initial or an abbreviation with a
# period. A leading stop folds away for the vocabulary lookup,
# which reads both edges; the classification fold that feeds the
# surname site reads the TRAILING edge only, so a word wearing a
# leading stop is given no script and never becomes a surname
# site: '.김민준' stays one whole word, given. The honorific peel
# is not gated by that fold -- the tail alone licenses it -- so a
# leading stop does not stop it: '.김민준씨' peels to '.김민준'
# and '씨' (rules.md's W Background, decisions.md#cjk-full-stops).
#
# SEVENTEEN members here where the 1.4.0 and 2.0.0 ledgers carry
# eleven -- twelve CJK, the katakana 'マイケル.' (a #323 mover added
# 2026-09-10 in the whole-branch review), and four the review round
# after that added: the three stop-bearing FAMILY_COMMA rows
# ('田中さん., V.', '김민준씨., J.씨', '이, J.씨.') and the bracketed
# '(김민준.) John Smith', which is the one of the four the older
# ledgers carry too. 2.1.0 is the release that shipped the hangul
# segmentation and the script order rule, so from here '김. 민준',
# '양 지훈.' and '양. 지훈' are diffs of this bundle rather than of
# that one: the older ledgers hand them to their native-script CJK
# rule, which does not exist at this baseline. The three comma rows
# are absent there for a different reason -- at 2.0.0 none of them
# diffs at all, and at 1.4.0 two are claimed by that ledger's broad
# comma rules.
#
# No earlier rule in this file reaches any of the seventeen, so LAST
# is uniformity with the other three ledgers rather than a
# narrow-first ordering (#382) against anything: order_contests
# reports no pair here in either arrangement.
#
# An anchored alternation of the NAMES rather than a shape, and the
# two criteria a shape could be written on both reach names this
# rule must not claim. "An edge full stop on a word carrying a
# classified character" reaches 22 corpus names, measured
# 2026-09-10: the bundle's seventeen movers and FIVE that do not
# move ('田中さん 様.', '田中さん, 様.', '김민준 씨.', '김민준 양.',
# '김민준, 씨.'). Measured with the TOKENIZER and not a whitespace
# split -- two of the movers wear their stop before a comma
# ('김민준씨.,', '田中さん.,'), which a whitespace split does not
# see -- plus the bracketed '(김민준.) John Smith' by hand, its stop
# sitting inside the clause until rules.md#S1 unwraps it; an 18
# recorded earlier the same day came from the split, over a corpus
# four names smaller. A character class of the four stops would be a hand
# copy of nameparser._lexicon.FULL_STOPS besides, and would reach
# the looser population of "an ASCII period anywhere in a CJK-
# bearing name" -- 20 distinct names on 21 corpus rows before this
# bundle ('Dr 김민준씨, Jr.' being the name on two of them), wider
# because it sweeps in periods sitting on LATIN tokens inside a CJK
# name ('毛 泽东 Dr.', '田中さん, V.'). None of the five or the
# twenty is moved BY THIS BUNDLE, so a shape spelling would
# reach names whose diffs belong to other rules (most of them
# do diff against the older baselines -- 19 of the twenty at
# 1.4.0) or to no rule at all; decisions.md#cjk-full-stops
# carries both counts and the recompute. The members copy no wordlist,
# which the honorific pin in tests/v2/test_ledger_guards.py DERIVES
# rather than taking on trust -- no member of this alternation folds
# into the CJK honorific vocabulary, bare or wearing a full stop;
# _CORPUS_CLAIMS pins the reach at 17 with its digest, and
# _MUST_NOT_MATCH pins the four readings the bundle left alone.
[[change]]
issue = "fix(#322/#323) a full stop on a CJK token is read as punctuation and stays on its token"
name_regex = "^(?:\\x28김민준\\.\\x29 John Smith|マイケル\\.|田中\\.|田中\\. 太郎|田中さん\\.|田中さん\\., V\\.|김\\. 민준|김민준 씨。|김민준 씨．|김민준 씨｡|김민준\\.|김민준\\. 지훈|김민준씨\\.|김민준씨\\., J\\.씨|양 지훈\\.|양\\. 지훈|이, J\\.씨\\.)$"
fields = ["_ambiguities", "family", "given", "middle", "suffix", "title"]

# ---------------------------------------------------------------
# #383/#479: A SINGLE-LETTER CONNECTIVE JOINS ONLY ON CASE EVIDENCE.
# Two rules where 1.4.0 needs one, and the split is the pseudo-field
# rule (#484) rather than two behaviors: from 2.0 on the v2 surface
# is compared, so the new CONJUNCTION_OR_INITIAL report enters the
# diff -- on one of the two names whose roles move ('JUAN GARCIA Y
# LOPEZ' reports nothing, nothing about 'y' having been in doubt)
# and on six more whose roles do not -- and a role move and a
# report can co-occur while a role move and `_initials` cannot.
#
# The derived view is deliberately absent from both rules. The core's
# initials() DOES move for 'john e smith', 'john e jones' and
# 'jones, john e' ('j. j.' -> 'j. e. j.'), but `_initials` enters a
# diff only where every role AND every ambiguity kind agrees (#484,
# compare.py main()), and the report moved on each of them -- so at
# this baseline those names classify on the report alone. 'JUAN Y
# GARCIA' is the one name of the population whose view moves with no
# report beside it, and at this baseline it is already claimed:
# fix(#462) reaches it and admits `_initials`. That rule's comment
# records what moved and when: the FACADE's view moved there too on
# the morning #383/#479 landed, the 2.3 facade fix not having shipped
# at 2.1.0, and #528 closed the facade's half the same day
# (2026-09-13), leaving the core's as the whole diff. A competing
# rule here would be an equal-`fields` contest decided by file order,
# which is what _CROSS_RULE_WINNERS exists to stop rather than to
# create. It is classified on its own at 2.3.0, where BOTH surfaces
# now move, and the same way.
#
# LAST in the file: every diff these two claim reported UNEXPLAINED
# on the run that preceded them (measured 2026-09-13), so no rule
# above already claims one.
# ---------------------------------------------------------------

[[change]]
issue = "fix(#383/#479) a single-letter connective joins only on case evidence"
# The 2.x view of the 1.4.0 rule of the same name: 'jose e maria
# santos' reads given 'jose', middle 'e maria' where 2.1.0 joined,
# and 'JUAN GARCIA Y LOPEZ' reads family 'GARCIA Y LOPEZ' where
# 2.1.0's bare-Latin-capital veto gave middle 'GARCIA Y'. A name
# written wholly in one case carries no case evidence about any
# letter in it, so the vocabulary decides: 'e' is marked as reading
# both ways and reads as an initial, 'y' is not and joins. Both are
# rules.md#P3 examples; see the 2026-09-13 entry of decisions.md#P3.
#
# `_ambiguities` is in the fields here and cannot be at 1.4.0 -- the
# report is a v2 surface -- and only ONE of the two names carries it:
# 'jose e maria santos' reports conjunction-or-initial, 'JUAN GARCIA
# Y LOPEZ' reports nothing, because nothing about 'y' was ever in
# doubt. The declaration is the union of the two diffs and #452's
# over-declaration check recomputes it every run.
#
# Literal-anchored to the two names, as at 1.4.0: the class is every
# one-case name carrying a cased single-letter connective, seventeen
# corpus names, and fifteen of them do not move a role.
# _MUST_NOT_MATCH carries the mixed-case probes.
name_regex = "^(?:jose e maria santos|JUAN GARCIA Y LOPEZ)$"
fields = ["given", "middle", "family", "_ambiguities"]
orders = ["DEFAULT"]

[[change]]
issue = "fix(#383/#479) a marked connective letter in a one-case name is reported"
# 'JOSE E MARIA SANTOS', 'JOHN E SMITH', 'john e smith', 'john e
# jones', 'jones, john e', 'e j smith': every role is identical --
# the letter was already read as an initial, or rules.md#P3's
# three-word carve-out keeps it a name word either way -- and what is
# new is that the CALL is reported as conjunction-or-initial, because
# a one-case name gives the reader nothing to decide it by.
#
# The initials of 'john e smith' ('j. s.' -> 'j. e. s.'), 'john e
# jones' and 'jones, john e' (both 'j. j.' -> 'j. e. j.') move as
# well, and the view is deliberately not in the fields: see the
# section comment above for why no run can produce it here.
#
# 'e and e' is NOT in the alternation although it is in the same
# population and its report moves too (it LOSES given-or-family and
# gains conjunction-or-initial, both inside `_ambiguities`). At this
# baseline `feat(#449) a lone name word reports given-or-family`
# names it literally and admits the diff, so adding it here would
# create an equal-`fields` contest that only file order decides --
# the class `precedes_narrower` cannot express and _CROSS_RULE_WINNERS
# has to pin. The name is radar tier, so nothing is hidden by leaving
# it where it is; 2.3.0's copy of this rule does claim it, that
# ledger carrying no #449 rule.
name_regex = "^(?:JOSE E MARIA SANTOS|JOHN E SMITH|john e smith|john e jones|jones, john e|e j smith)$"
fields = ["_ambiguities"]
orders = ["DEFAULT"]

[[change]]
issue = "fix(#289) a written case contrast decides a bare ambiguous acronym"
# A member of suffix_acronyms_ambiguous written in CAPITALS inside a
# mixed-case name is written the way a credential is written, and is
# taken as one with nothing to spare ('Jack MA' -> given 'Jack',
# suffix 'MA'); one written in any other cased form is written the way
# a surname is written and stays one even with words to spare ('John
# Smith Ma' -> middle 'Smith', family 'Ma'). The same lean reaches the
# post-comma given slot ('Smith, MA' -> family 'Smith', suffix 'MA';
# 'Smith, Ma' keeps its given), and the comma form's words-to-spare
# test becomes a count of NAME words, which is case-blind -- so
# 'John Smith, MA', 'John Smith, Ed', 'JOHN SMITH, MA' and
# 'john smith, ma' all read the credential where the token count read
# a given name. See rules.md#S2, rules.md#C1 and rules.md#P2.
#
# A name written wholly in one case carries no contrast and does not
# move on the LEAN at all -- 'JOHN SMITH MA', 'ANH DO', 'anh van do'
# and 'Jack Ma' are _MUST_NOT_MATCH probes in
# tests/v2/test_ledger_guards.py. The one-case comma forms in the list
# above are here on the NAME-word count instead, which asks nothing
# about case; that is why they sit beside the lean's own names rather
# than in a rule of their own.
#
# Accepted costs, both recorded rather than repaired: the walk stops
# at a declined pick instead of continuing past it, so a genuine
# suffix standing in front of a name-leaning acronym is never reached
# ('abdul Smith Jr Ma' reads middle 'Jr'), and the lean ends P2's
# particle chain with no words to spare where the count would not
# ('Freiherr von Berg MA', whose own rule further up this file carries
# the reading at 1.4.0).
#
# The Title-case half is witnessed at the comma by two minimal pairs
# rather than argued: 'John Smith, MA'/'John Smith, Ma' both read the
# credential, because two NAME words before the comma decide before
# the case is looked at, and 'Smith Jr., MA'/'Smith Jr., Ma' split,
# because one name word leaves the case to decide and Title-case
# declines. 'Smith Jr., Ma' diffs here for a reading this change did
# NOT move -- the pre-comma restructure v2 has done since 2.0, at
# 1.4.0, and the fork's new report at the 2.x baselines -- while
# 'John Smith, Ma' moves on the COUNT, as its all-caps twin does, and
# has no 1.4.0 diff at all, v1 having read the credential there too.
# Both sit on this rule because the rule is what states which way
# each member of a pair goes.
#
# 2026-09-19, #531: three names join, all of them lone post-comma
# credentials this rule's own second sentence already describes.
# 'Doe, MA' and 'Doe, MA PhD' are 'Smith, MA's family-word twins and
# 'Doe, Dr. MA' is the same slot behind a title; each reads family
# 'Doe' with the credential run in `suffix` -- 'MA', and 'MA PhD'
# on the one that has a run -- where the baseline read given 'MA'.
# They
# entered the corpora with #531's control rows and are NOT #531's
# doing -- verified byte-identical at cc78c960, the #530 merge
# (2026-09-19). No role joined the field list: the three move
# {given, suffix} and, on two of them, `_ambiguities`.
#
# 2026-09-19, #531 review round: 'Doe, Mr. MA PhD' joins them. It is
# 'Doe, Dr. MA' with a credential run behind the member -- the gate
# reads the segment whole, so the member joins the run rather than
# taking the given slot -- and it moves {given, suffix}, both already
# in the field list. It entered the corpora with that round's control
# rows and is NOT its doing: byte-identical at cc78c960 (measured
# 2026-09-19).
#
# Literal-anchored to the measured movers, and ONE SET FOR THE FOUR
# 2.x LEDGERS so the rule says the same thing at each of them. The
# 1.4.0 copy differs by FOUR members now. It holds 'John Prof. MA'
# out: 1.4.0 read a trailing period-marked title as a title itself,
# so that name's diff there belongs to fix(#316)'s rule and not to
# this one. "One set for all five" was written before that carve-out
# existed and was false in these four copies from the day it did
# (2026-09-18). And it holds the three names above out for a
# different reason: at 1.4.0 their diff is already claimed by
# `fix(comma-family) lone post-comma piece routes to suffix/title,
# not first`, which stands far earlier in that file, so adding them
# there would reach a name without explaining it and would put two
# rules on one diff with nothing to arbitrate between them
# (2026-09-19). The set is literal because the class is
# wide (every mixed-case name whose trailing piece is a listed
# ambiguous acronym, plus every comma form with two name words before
# the comma) and a regex for the class would claim the one-case
# spellings that do not move. A name here that does not diff at a
# given baseline is simply one the reading already agreed with there.
# `fields` is per-baseline, the union the run at THAT baseline
# measures (#452).
name_regex = "^(?:Davis Royce, Ed|Doe, Dr\\. MA|Doe, MA|Doe, MA PhD|Doe, Mr\\. MA PhD|Freiherr von Berg MA|JOHN SMITH, MA|Jack MA|Jack MA\\.|Jack Wei Ma|John Prof\\. MA|John Smith Ma|John Smith, Ed|John Smith, MA|John Smith, Ma|John de Ma|John van der Berg Ma|Smith Jr\\., MA|Smith Jr\\., Ma|Smith, MA|abdul Smith Berg Ma|abdul Smith Jr Ma|abdul Smith Ma|john smith, ma)$"
fields = ["family", "given", "middle", "suffix", "_ambiguities"]
orders = ["DEFAULT"]

[[change]]
issue = "fix(#516) an unlisted dotted acronym is read by position"
# A token of two or more period-separated chunks that no vocabulary
# claims joins the ambiguous credential class by SHAPE and is read by
# POSITION, exactly as a bare listed acronym is: a credential where
# the name has words to spare, a name word where it does not, either
# reading reported (rules.md#S3). Case says nothing here -- the
# periods are the evidence -- which is why 'john smith x.y.z.' moves
# with 'John Smith X.Y.Z.'. The same admission reaches the comma form,
# where the NAME-word count decides ('John Smith, A.B.' -> suffix
# 'A.B.'; 'Smith, A.B.' keeps its given and only reports).
#
# Two names here restore a reading a PRIOR bundle's vocabulary change
# took away, by a different route than it lost it: 'John Smith E.S.Q.'
# and 'John Smith C.H.A.' fell to a bare positional read when 'esq'
# and 'cha' left SUFFIX_ACRONYMS
# (decisions.md#suffix-acronym-collisions), and the shape class reads
# them as the credentials they always were with no wordlist entry.
# At the baselines where
# that restoration lands on the baseline's own reading, only the new
# report is left and `fields` says so.
#
# The narrow half of the same change: a chunk match no longer makes a
# dotted token a suffix where EVERY matched chunk is a single ASCII
# character, which reaches only the roman numerals -- 'Jack X.Y.I.'
# moves to family for that reason and not for the shape one.
#
# The shapes the vocabulary settles are untouched and are
# _MUST_NOT_MATCH probes in tests/v2/test_ledger_guards.py: a
# whole-token match ('Jack M.A.', 'John Smith Ph.D.', 'Smith,
# A.B.C.'), a surviving chunk claim ('Doe, John Msc.Ed.'), a leading
# dotted run ('X.Y.Z. Smith', 'J.R.R. Tolkien', 'A.B. Vajpayee'), the
# single trailing period that is no shape at all ('John Smith Xyz.'),
# and a digit chunk, which the alphabetic gate refuses ('Bridge (1.4)').
#
# Literal-anchored to the measured movers, one set for all five
# ledgers, for the reason the fix(#289) rule above gives: the class is
# a SHAPE, and a regex for the shape would claim every dotted token
# the vocabulary already answers for.
name_regex = "^(?:Jack X\\.Y\\.I\\.|John Smith B\\.Tech\\.|John Smith C\\.H\\.A\\.|John Smith E\\.S\\.Q\\.|John Smith Q\\.W\\.E\\.R\\.T\\.|John Smith X\\.Y\\.Z\\.|John Smith, A\\.B\\.|Smith, E\\.S\\.Q\\.|john smith x\\.y\\.z\\.)$"
fields = ["family", "given", "middle", "suffix", "_ambiguities"]
orders = ["DEFAULT"]

[[change]]
issue = "fix(#289/#516) the ambiguous credential class reports at slots that were silent"
# Every decision at the trailing suffix slot, the post-comma given
# slot and a tail segment now reports the EXISTING SUFFIX_OR_NAME --
# no new kind, and the report tracks the FORK BEING CONSULTED rather
# than which way it went, as the trailing slot always has. These names
# gain it with no role moving at any baseline: the fork was there all
# along and was called silently. It is the first time the comma's
# OWN decision is reported (rules.md#C1); P6's attachment fork has
# reported on a family-comma path since 2.3 ('Berg, Jan vd'). C2's
# structural flag was already the first comma-path report of a shape.
#
# 'Steven Hardman, MD, DO, DDS' goes the other way and LOSES its
# comma-structure flag: its third segment now reads as the credential
# run it is, because 'DO' leans credential in a mixed-case name. That
# is the one place this arc quiets a report rather than adding one.
#
# 2026-09-19, #531 review round: 'Doe, MA Smith' joins, and it is the
# post-comma given slot with a NAME WORD behind the member: no role
# moves at any baseline -- the member is the given name here as it
# always was -- and what is new is only the report that emitter makes.
# Its silent twin 'Doe, Dr. MA Smith' puts a title in that first piece
# instead, which the emitter reads rather than the member, and agrees
# with every baseline on every field, so it is in no ledger at all.
#
# `_ambiguities` alone, which keeps `_initials` out of these rows as
# always (#484), and the rule cannot absorb a role diff on any of
# these names for the same reason. Literal-anchored, one set for all
# the 2.x ledgers; the 1.4.0 ledger has no twin, `_ambiguities` being
# a v2 surface that cannot enter a diff below baseline 2.0.
#
# 'Steven Hardman, MD, DO, DDS' is held OUT of the set at THIS
# baseline: `fix(#296) a dropped prenominal takes the name position it
# occupies` reaches it through its own comma anchor, declares the
# three roles this rule does not, and stands first -- so the name is
# narrowed out rather than left to file order. The comma-structure
# flag it loses is a 2.2-era report in any case, and the 2.2.0 and
# 2.3.0 ledgers are where the loss is recorded.
name_regex = "^(?:Doe, MA Smith|J\\.A\\. K\\.D\\.|Jack X\\.Y\\.Z\\.|John Smith J\\.u\\.n\\.i\\.o\\.r\\.|John Smith R\\.A\\.I\\.|Royce, Ed|Smith Jr\\., A\\.B\\.|Smith, A\\.B\\.|Smith, Ma)$"
fields = ["_ambiguities"]
orders = ["DEFAULT"]

[[change]]
issue = "fix(#289/#516) the glued CJK honorific peel reads the case lean"
# The suffix-run predicate the peel uses to decline a post-comma run
# (rules.md#W3, asking C1's own vocabulary question) now reads the
# same written-case evidence rule S2 reads, because `one_case` is
# passed to it. Before, one name written with two credentials divided
# two ways: a Kim-prefixed 김민준씨 input peeled its honorific when the
# credential was 'PhD' and did not when it was 'MA', the only
# difference being that 'MA' is an ambiguous acronym whose case lean
# the predicate was not given.
#
# Every name here is a COMPOSED form -- a Latin wrapper and a family
# comma around a CJK name -- which no East Asian writing system
# produces, so all three are `tolerated` case rows on the radar tier
# (decisions.md#cjk-comma-demotion). They are classified all the same:
# a radar diff this arc INTENDED is one a release note may be written
# from, and an unclassified one is not.
#
# `title` is in `fields` because 'Dr. 김민준씨, MA' had the whole
# string for its family at these baselines, the title included; at
# 2.0.0 and 2.1.0 'Jo김민준씨, DO' moves `title` instead of `given`,
# and the union is what a per-baseline `fields` records (#452).
name_regex = "^(?:Dr\\. 김민준씨, MA|Jo김민준씨, DO|Kim김민준씨, MA)$"
fields = ["title", "given", "family", "suffix", "_ambiguities"]
orders = ["DEFAULT"]

# ---------------------------------------------------------------
# #531: THE GIVEN PART'S TRAILING SLOT. Four rules -- the thirteen
# the credential reading takes, the four the writing declines and that
# gain a REPORT alone, the one `do` spelling the capitals take from
# P6, and the two caseless comma forms on the radar tier. The decision is
# decisions.md#S2's 2026-09-18 pair; rules.md#S2, #S3, #C1 and #P6
# carry the statements.
# ---------------------------------------------------------------

[[change]]
issue = "fix(#531) a credential ending the given part of a family-comma listing reads as a credential"
# After a family comma, a word of the ambiguous credential class
# ending the given part is now read by the same rule the comma-less
# spelling uses for a word ending the name. The comma has already
# named the family and the first word after it is the given name, so
# the words to spare are there by construction and the count says
# nothing: the word reads as the credential unless its WRITING says
# otherwise. rules.md#S2 states it, rules.md#S3 carries the by-shape
# spelling, and decisions.md#S2 records the decision.
#
# Thirteen names, and they are the class read from every side the
# corpora reach it: the bare member ('Doe, John MA', 'Doe, John BA');
# its one-case spellings, where the lean is inert and the POSITIONAL
# reading is not ('DOE, JOHN MA', 'doe, john ma', 'DOE, MARY JO MA');
# the slot behind a title ('Doe, Dr. John MA') and behind an initial
# ('Doe, J. MA'); a run of two members, where the credential the
# member joins was already a suffix so `suffix` GROWS rather than
# filling ('Doe, John MA JD', 'Doe, John MA PhD', 'Doe, John PhD MA',
# 'Doe, John MA Jr'); the slot reached past a middle initial, which
# keeps its own middle ('Doe, John Q. MA', 'DOE, MARY JO MA'); and the
# by-shape member, whose lean is always None so the positional reading
# takes it outright ('Doe, John X.Y.Z.').
#
# Do not read "thirteen role movers" off that list at every baseline:
# `fields` is the union the run at THIS baseline measures (#452), and
# a name here whose roles the baseline already agreed with contributes
# only its report. 'Doe, John BA' is that name at 2.1.0 and 2.2.0, and
# 'Doe, John MA JD' is the other end of the range, gaining TWO reports
# for its two members.
#
# `_ambiguities` is in the fields because every one of the thirteen
# gains the existing SUFFIX_OR_NAME -- no new kind, and the report
# tracks the FORK CONSULTED rather than which way it went, which is
# the rule fix(#289/#516) above already states for the other slots.
# #452's over-declaration check recomputes the union on every run.
#
# Literal-anchored for the reason the two rules above give, and it is
# sharper here: the class is a SLOT, so a regex for it would claim
# every family-comma name whose given part ends in an ambiguous
# acronym -- including the four the WRITING declines, which keep their
# name reading and have the rule below, and 'Doe, John MA Smith',
# where a name word behind the member ends the run so nothing moves
# and nothing reports. _MUST_NOT_MATCH carries both, with the `do`
# spellings P6 keeps and the third-comma-part name #144's restriction
# still owns.
# 2026-09-19, #533: TWO names join the alternation and the rule does
# not change. 'Doe, J. ba' and 'Smith nee Jones, Jane MA' are this
# slot read exactly as the thirteen above are -- a lower-case member
# ending the given part after an initial, and the same member behind
# a maiden clause that sits in the FAMILY segment, where no trailing
# rule reads the clause's own tail and the given part's slot is
# reached as usual. Both read the same way at 2f57ff21, before #533,
# measured name by name: what grew is the CORPUS, not the rule, and
# a `fix(#533)` rule for them would attribute a #531 reading to the
# wrong change.
name_regex = "^(?:DOE, JOHN MA|DOE, MARY JO MA|Doe, Dr\\. John MA|Doe, J\\. MA|Doe, J\\. ba|Doe, John BA|Doe, John MA|Doe, John MA JD|Doe, John MA Jr|Doe, John MA PhD|Doe, John PhD MA|Doe, John Q\\. MA|Doe, John X\\.Y\\.Z\\.|Smith nee Jones, Jane MA|doe, john ma)$"
fields = ["_ambiguities", "middle", "suffix"]
orders = ["DEFAULT"]

[[change]]
issue = "fix(#531) a member the writing declines keeps its name reading and reports the fork"
# The other direction of the same fork, and the whole of what these
# four names do: no role moves at any 2.x baseline and the decision
# starts being REPORTED. 'Doe, John Ma', 'Doe, John Ed' and
# 'Doe, Mary Jo Ma' carry a Title-cased member in a mixed-case name,
# which is written the way a name is written, so the member stays a
# middle name; 'Doe, John MA Ma' is a two-member run whose last member
# is Title-cased, so the walk declines there and the run stays middle
# text whole.
#
# Reporting a DECLINED fork is #530's stated rule -- the report tracks
# the fork consulted, not the lean -- and rules.md#A1's "a kind is
# worth adding only if a reader would hesitate too" is the standing
# objection it answers. It is also the only part of #531 that adds a
# report without moving a field, which is why it is a rule of its own
# rather than a widening of the one above: `fields` is
# `_ambiguities` alone, so this rule cannot absorb a role diff on any
# of the four.
#
# At 1.4.0 these same four DO move roles -- v1 read all four members
# as post-nominals -- and that divergence is carried there by
# fix(given-part-trailing-slot), whose comment records that #531
# changed which names it holds rather than retiring it.
#
# Literal-anchored: the class is the slot's declining half, and a
# regex for it would claim the thirteen movers above.
name_regex = "^(?:Doe, John Ed|Doe, John MA Ma|Doe, John Ma|Doe, Mary Jo Ma)$"
fields = ["_ambiguities"]
orders = ["DEFAULT"]

[[change]]
issue = "fix(#531) capitals take the do collision from the family-comma particle attachment"
# 'Doe, John DO', alone, because the word is alone in the class: `do`
# is the one ambiguous credential that is also particle vocabulary, so
# this slot and P6's attachment (rules.md#P6) want the same word.
# Derek's decision, recorded at decisions.md#S2: CAPITALS DECIDE, AND
# THE PARTICLE RULE KEEPS EVERY OTHER SPELLING. An all-caps member in
# a name written in more than one case carries a positive credential
# lean, so the credential reading wins and P6 stands down; every other
# spelling attaches exactly as it did, with P6's own
# `particle-or-given` and no second report.
#
# THE PAIRING IS THE ARGUMENT and the accepted cost is half of it. In
# ONE CASE the rule cannot tell 'NASCIMENTO, EDSON ARANTES DO' from
# 'SMITH, JOHN DO' and reads both as the particle -- right about the
# Brazilian record, wrong about the osteopath. Those two, and
# 'Doe, John Do', 'DOE, JOHN DO', 'doe, john do' and
# 'Nascimento, Edson Arantes do', are _MUST_NOT_MATCH probes: this
# rule has no business claiming a single one of them, and each is a
# name #531 measured to be byte-identical before and after.
#
# `fields` is per-baseline and the two halves of this file's set
# differ by which role the particle came OUT of, which is P6's own
# history: {middle, suffix} at 2.0.0 and 2.1.0, where the
# baseline read middle 'DO' because P6's family-comma attachment had
# not shipped, and {family, suffix} at 2.2.0 and 2.3.0, where it had
# and the baseline reads family 'DO Doe'.
name_regex = "^Doe, John DO$"
fields = ["_ambiguities", "middle", "suffix"]
orders = ["DEFAULT"]

[[change]]
issue = "fix(#531) the trailing slot's positional reading reaches a caseless script"
# '田中, 太郎 MA' and '김, 민준 MA': middle 'MA' -> suffix 'MA', one
# report each. A caseless script answers True to the one-case test, so
# the lean is None -- and at this slot a None lean is not inert,
# because the POSITIONAL reading the lean would have overridden is
# itself the credential. "Caseless is inert" holds for the LEAN and
# not for the outcome, which is the sentence tests/v2/cases.py's two
# rows carry.
#
# Both are COMPOSED forms -- a family comma between a CJK family and a
# CJK given name, which no East Asian writing system produces -- so
# both are `tolerated` case rows on the radar tier
# (decisions.md#cjk-comma-demotion), and their diffs print under
# UNCLASSIFIED (radar) rather than blocking. They are classified all
# the same, on fix(#289/#516)'s stated ground: a radar diff an arc
# INTENDED is one a release note may be written from, and an
# unclassified one is not.
#
# Literal-anchored, and the probes are the CJK comma names that do NOT
# move at this slot: '田中 太郎, MA', '毛泽东, MA' and '마틴 킹, MA' put
# their member in the FIRST post-comma piece, which is #289's slot and
# not this one.
name_regex = "^(?:田中, 太郎 MA|김, 민준 MA)$"
fields = ["_ambiguities", "middle", "suffix"]
orders = ["DEFAULT"]

[[change]]
issue = "fix(#380) a trailing mc after a family comma is the tussenvoegsel, not a post-nominal"
# THE SAME DECISION AS THE fix(#380) RULE ABOVE, over the other word
# that carries the collision it names. 'Berg, Jan mc' entered the
# corpora with #531's case rows (2026-09-18) as the negative control
# for the `do` carve-out -- 'mc' is unambiguous suffix vocabulary AND
# a never-given particle, so P6's run claims it whatever role assign
# gave it, and #531 left it byte-identical (verified against the tree
# at cc78c960, 2026-09-19).
#
# The diff is against these two baselines only: `mc` joined the
# never-given particles in 2.2 (decisions.md#suffix-acronym-
# collisions) and P6's family-comma attachment shipped in 2.3, so
# 2.2.0 and 2.3.0 already read family 'mc Berg' and carry no rule for
# it. `_ambiguities` is in the fields because the name also gains
# #530's report at these baselines, which is #289/#516's doing and
# not this rule's subject; the rule claims the union the run measures
# (#452) and the roles are P6's.
#
# Literal, one name. A regex over the trailing word would claim every
# Mc* surname in the corpora, which is the widening the vd rule's own
# _MUST_NOT_MATCH probes already refuse.
name_regex = "^Berg, Jan mc$"
fields = ["_ambiguities", "family", "suffix"]
orders = ["DEFAULT"]

[[change]]
issue = "fix(#533) a credential ending a maiden clause reads as a credential"
# The PR review added one: 'Jane Doe nee Smith V MA', where a
# trailing roman numeral stands between the clause and the member.
# Both stops read the TRAILING word, so the numeral is not the word
# either fork asks about -- the acronym fork stops at 'MA' and the
# 'V' stays maiden text behind it.
# The words a maiden marker takes now end where a trailing credential
# begins, where the rule that reads the name left standing reads the
# word as one -- both as the name is written and as the take would
# leave it (rules.md#M2, decisions.md#M2). `suffix` fills as `maiden`
# shortens, and the fork is reported: the end of a maiden clause was
# the last trailing position in the library where a member of the
# ambiguous credential class was read in silence.
#
# Fourteen names here, three fewer than the same rule carries at
# 2.2.0 and 2.3.0, and the three are a fact about THIS baseline
# rather than about the change. 'Maria Kowalska z domu Nowak MA' and
# 'John née Jones Smith MA' move roles this baseline has never read,
# so each needs a rule that explains the whole of its diff; 'Doe, J.
# nee MA ba' moves no role from here at all and is with the reports
# below. Width is baseline-relative, and so is membership.
#
# What is left is the class read from every side the corpora reach
# it: the bare member ('Jane Doe nee Smith MA', 'Doe, Jane nee Smith
# MA'); its one-case spellings, where the lean is inert and the
# POSITIONAL reading is not ('JANE DOE NEE SMITH MA', 'JANE DOE NEE
# YO-YO MA', 'jane doe nee smith ma', 'Doe, Jane nee Smith ma'); the
# German abbreviation ('Jane Doe geb. Smith MA'); a member beside
# another credential, where `suffix` GROWS rather than filling ('Jane
# Doe nee Smith MA JD', 'Jane Doe nee Smith MA PhD', 'Jane Doe nee
# Smith Ma JD' -- whose Title-cased Ma stays in the clause while the
# JD behind it leaves); past a trailing title, which the peel steps
# over ('Jane Doe nee Smith Prof. MA'); the slot reached past a
# middle initial ('Doe, Jane Q. nee Smith MA'); and the `do`
# collision, where the capitals decide ('Doe, Jane nee Smith DO'
# beside 'Jane Doe nee Smith do').
#
# Literal-anchored for the reason fix(#531)'s rules give: the subject
# is a SLOT, so a regex for it would claim the names whose WRITING
# declines the word as readily as the ones it takes.
name_regex = "^(?:Doe, Jane Q\\. nee Smith MA|Doe, Jane nee Smith DO|Doe, Jane nee Smith MA|Doe, Jane nee Smith ma|JANE DOE NEE SMITH MA|JANE DOE NEE YO-YO MA|Jane Doe geb\\. Smith MA|Jane Doe nee Smith MA|Jane Doe nee Smith MA JD|Jane Doe nee Smith MA PhD|Jane Doe nee Smith Ma JD|Jane Doe nee Smith Prof\\. MA|Jane Doe nee Smith V MA|Jane Doe nee Smith do|jane doe nee smith ma)$"
fields = ["_ambiguities", "maiden", "suffix"]

[[change]]
issue = "fix(#533) the maiden clause reports the credential it keeps"
# The PR review added more, and they are the same declining half
# reached by four further routes -- each a shape where the clause
# CANNOT promise the word a credential reading, so rules.md#M2 keeps
# it. No name word is left AHEAD of the member for a given part's
# trailing slot to be the end of ('Doe, Dr. nee Smith MA'); a
# particle chain below the marker pass would absorb it into the
# family ('Berg, Jane van der nee Smith DO', and 'Jane Doe nee Smith
# DO DO' where the other released member is what would do the
# joining); P5's bound-given join would swallow it into the pair
# ('Berg, abdul nee Jones MA'); the FIRST-WORD FLOOR spares it and
# only an unambiguous credential behind it leaves ('Jane Doe nee MA
# PhD'); and the lean declines it after a comma ('Doe, Jane nee
# Smith Do'). Those first four READ as 2f57ff21 read them and gain
# only the report: an earlier round of this branch released all four
# and moved them in silence, which is what the review measured and
# reversed.
# The other direction of the same fork, and the whole of what these
# five names do at this baseline: no role moves and the decision
# starts being REPORTED. A Title-cased member in a mixed-case name is
# written the way a name is written, so the clause keeps it ('Jane
# Doe nee Smith Ma', 'Jane Doe nee Yo-Yo Ma', 'Doe, Jane nee Smith
# Ma'); a member that is the ONLY word after the marker stays the
# maiden name whatever its writing says ('Jane Doe nee MA'); and
# 'Doe, J. nee MA ba' is the CLAMP, whose roles this baseline already
# reads the way the tree does -- maiden 'MA', suffix 'ba' -- so from
# here the clamp is visible only as the report it raises.
#
# Reporting a DECLINED fork is #530's stated rule -- the report
# tracks the fork consulted, not the lean -- and it is why this is a
# rule of its own rather than a widening of the one above: `fields`
# is `_ambiguities` alone, so it cannot absorb a role diff on any of
# the five.
name_regex = "^(?:Doe, Dr\\. nee Smith MA|Doe, J\\. nee MA ba|Doe, Jane nee Smith Ma|Jane Doe nee MA|Jane Doe nee MA PhD|Jane Doe nee Smith DO DO|Jane Doe nee Smith Ma|Jane Doe nee Yo-Yo Ma)$"
fields = ["_ambiguities"]

[[change]]
issue = "fix(#411/#533) the bound-given pair after a comma, and the clause it keeps its credential in"
# 'Berg, abdul nee Jones MA'. Two changes in one name and neither is
# enough on its own, which is why it is a rule rather than an
# alternative in either. The clause consumption (#274) and the
# reserve that stops counting the words it takes (#411) are what move
# `given`, `middle` and `maiden` against this baseline; the report is
# #533's.
#
# What #533 does here is NOT a role move, and the comment is the only
# place that can say so: an earlier round of this branch released the
# 'MA' from the clause and let P5's lenient post-comma join swallow
# it into the pair, reading given 'abdul MA' in silence. The review
# measured that as M2's invariant broken -- a word the clause gave up
# landing in a NAME part -- so the stop is declined, the clause keeps
# 'Jones MA', and the fork is reported instead.
name_regex = "^Berg, abdul nee Jones MA$"
fields = ["_ambiguities", "given", "maiden", "middle"]

[[change]]
issue = "fix(#399/#533) a maiden marker bounds the particle chain, and the clause keeps the credential the chain would have taken"
# 'Berg, Jane van der nee Smith DO'. The marker bounds the particle
# join arriving from its left (#399, rules.md#M2), which is what
# moves `middle`, `family` and `maiden` against this baseline, and
# the chain still reports its own PARTICLE_OR_GIVEN.
#
# The SUFFIX_OR_NAME beside it is #533's, and it is a report without
# a role move on purpose. 'DO' is particle vocabulary, so releasing
# it from the clause would put it back in reach of the very chain the
# marker just bounded -- family 'van der DO Berg', a word crossing
# from the birth name into the current one, which an earlier round of
# this branch did in silence. rules.md#M2's invariant declines the
# stop, the clause keeps 'Smith DO', and the fork is reported.
name_regex = "^Berg, Jane van der nee Smith DO$"
fields = ["_ambiguities", "family", "maiden", "middle"]

[[change]]
issue = "fix(#335/#533) a marker-led bracketed clause is the maiden name whatever its last word is"
# 'Jane Doe (nee Smith MA)', 'Jane Doe (nee Smith Ma)', 'Jane Doe
# (nee Smith) MA'. The role move is fix(#335)'s, one rule above: this
# baseline read the parenthesis pair as a nickname delimiter and
# looked no further. These three are separate because the FIRST TWO
# also lose a report -- the clause came back a nickname ending in a
# credential-class word, so the nickname reading raised its own
# SUFFIX_OR_NICKNAME, and consuming the clause as a maiden name
# retires it.
#
# They are here rather than as three more alternatives up there for
# the reason that rule's own comment gives about declaring a field a
# diff does not move: adding `_ambiguities` to it would let a report
# change hide on the five Latin names it already holds.
#
# What #533 does to them is NOTHING, and that is the point of
# recording them: the delimiters outrank every reading inside the
# span, so the whole span is the maiden name whatever its last word
# is and no fork is called (decisions.md#M2, rules.md#M2). 'Jane Doe
# (nee Smith) MA' is the control -- the member the writer left
# OUTSIDE the span is an ordinary trailing credential and reports.
name_regex = "^(?:Jane Doe \\(nee Smith MA\\)|Jane Doe \\(nee Smith Ma\\)|Jane Doe \\(nee Smith\\) MA)$"
fields = ["_ambiguities", "maiden", "nickname"]

[[change]]
issue = "fix(#533) accepted: an unlisted dotted acronym ending a maiden clause is read by position"
# 'Jane Doe nee Smith X.Y.Z.'. A by-shape member carries no writing
# convention to read -- `listed_lean` returns None where the switch
# made the token credential-SHAPED and the vocabulary did not list it
# -- so the positional reading decides alone and the clause gives the
# word up. The same trade #516 recorded at its own slot and #531 at
# the given part's, taken to agree with the comma-less 'John Doe
# X.Y.Z.' and rules.md#S3's shape rule rather than to restore
# anything.
#
# Its own rule rather than one of the movers above, because the
# ARGUMENT is different: every name up there has a writing the lean
# could have read, and this one has none.
name_regex = "^Jane Doe nee Smith X\\.Y\\.Z\\.$"
fields = ["_ambiguities", "maiden", "suffix"]

[[change]]
issue = "fix(#533) restores the suffix reading a 2.4 retag had moved into the maiden name"
# 'John Smith nee Jones R.A.I.', and it is a RESTORATION rather than
# a change: this baseline reads suffix 'R.A.I.' with maiden 'Jones',
# and so does the tree, so only the report diffs here. What moved in
# between was this unreleased 2.4 cycle. At 2.3.0 the token carried
# `vocab:suffix` and the maiden walk's suffix-piece test stopped at
# it; #516 retags it `shape:acronym` plus `vocab:suffix-ambiguous`,
# it stops being a suffix piece, and the walk took it -- maiden
# 'Jones R.A.I.' on this tree at 2f57ff21, measured. The name was in
# no corpus file, so no gate ever compared it and no 2.4.0 release
# bullet records the move.
name_regex = "^John Smith nee Jones R\\.A\\.I\\.$"
fields = ["_ambiguities"]

[[change]]
issue = "fix(#445/#533) the clause gives the credential up, and the one name word it leaves is the family"
# 'John née Jones Smith MA', whose diff has TWO causes from here and
# one rule has to explain the whole of it -- the shape the
# fix(#424/#445) rules above already record for the numeral and for
# the Title-cased acronym. #445 moves the one name word the clause
# leaves into the family (given 'John' -> family 'John'), which this
# baseline has never read, and #533 takes the MA out of the maiden
# name and into `suffix`. Attributing either to the other would be
# false, and a rule declaring only one pair of fields would explain
# nothing while the name went UNEXPLAINED.
#
# Case-SENSITIVE, unlike the fix(#445) rule above, and measured: the
# capitals are what decide here, so 'John née Jones Smith Ma' keeps
# its member in the clause and 'John née Jones Smith MA' gives it up.
# An (?i) anchor would stand ready to explain either name's diff with
# the other's reasoning.
name_regex = "^John née Jones Smith MA$"
fields = ["_ambiguities", "family", "given", "maiden", "suffix"]

[[change]]
issue = "fix(#445/#533) a one-case clause keeps the credential, and the one name word it leaves is the family"
# 'JOHN NEE JONES SMITH MA PHD'. One case, so no lean; a suffix word
# BEHIND the member ends the peel before it can reach the member, so
# the clause KEEPS the MA and only the clause's own emitter speaks.
# The role move is #445's -- the lone name word the clause leaves
# becomes the family -- and this baseline has not read it, so the
# diff is that move plus the new report.
#
# Its own rule rather than an alternative in the fix(#445) rule
# above, and case-sensitivity is the reason: that rule is (?i), and
# the mixed-case spelling of these words reads the other way. 'John
# nee Jones Smith MA PHD' gives the MA up and reads suffix 'MA PHD',
# measured 2026-09-19, so an (?i) alternative here would stand ready
# to explain a regression on a name whose reading is the opposite of
# this one's.
name_regex = "^JOHN NEE JONES SMITH MA PHD$"
fields = ["_ambiguities", "family", "given"]

[[change]]
issue = "fix(#434/#533) a marker PHRASE takes the maiden name, and its clause ends at the credential"
# 'Maria Kowalska z domu Nowak MA'. The marker PHRASE is what moves
# the roles from here -- this baseline had no `z domu` entry, so it
# read middle 'Kowalska z domu', family 'Nowak' -- and the tree reads
# given 'Maria', family 'Kowalska', maiden 'Nowak'. #533's own effect
# on the name is invisible at this baseline: the trailing MA is a
# suffix on both sides, and both sides report it. What #533 changed
# is which words the maiden name holds, and `maiden` is already in
# the diff for the phrase's sake.
#
# Named for both changes because the maiden TEXT is the compound: at
# 2f57ff21 the same three fields moved and `maiden` read 'Nowak MA'.
# A rule naming only #434 would attribute this change's stop to the
# vocabulary addition; one naming only #533 would attribute the
# phrase to it.
name_regex = "^Maria Kowalska z domu Nowak MA$"
fields = ["family", "maiden", "middle"]

[[change]]
issue = "fix(#424) the maiden walk stops before the trailing numeral, with the family name left standing"
# 'Jane Doe nee Smith V', and #533 has nothing to do with it: the
# name reads the same on this tree as it did at 2f57ff21, measured.
# The walk stops before the trailing roman numeral assign reads as
# the suffix, asked over the pieces as they stand and again over the
# view the take would leave -- #424's reading, stated at rules.md#M2.
# maiden 'Smith V' -> maiden 'Smith', suffix 'V', with the report
# #516 added at that slot.
#
# A rule of its own rather than an alternative in 'fix(#424/#445) the
# maiden walk stops before the trailing numeral, and the lone name
# word is the family' above: that rule's second half is the #445 move
# and this name has none -- family 'Doe' stands either way. What grew
# is the CORPUS: this change's rows put the numeral's clause shape in
# front of the gate for the first time at a baseline that can see it.
name_regex = "^Jane Doe nee Smith V$"
fields = ["_ambiguities", "maiden", "suffix"]

[[change]]
issue = "fix(#533) the maiden clause ends at the credential in a native-script name too"
# '田中 太郎 旧姓 佐藤 MA': maiden '佐藤 MA' -> maiden '佐藤', suffix
# 'MA', one report. The walk reads the same rule whatever script the
# clause is written in -- the marker is 旧姓, the member is Latin, and
# neither fact reaches the stop -- so this is the movers' rule above
# with a CJK marker in front of it.
#
# A COMPOSED form, so the name is a `tolerated` row on the radar tier
# (decisions.md#cjk-comma-demotion) and its diff prints under
# UNCLASSIFIED (radar) rather than blocking. It is classified all the
# same, on fix(#289/#516)'s stated ground and the one #531's caseless
# rule follows: a radar diff an arc INTENDED is one a release note
# may be written from, and an unclassified one is not.
#
# Its own rule rather than an alternative in the movers' regex: a CJK
# member in an alternation is claimed by the honorific pin, which
# would demand that alternation be a copy of GLUED_HONORIFICS. A lone
# literal has no alternation to pin. At 1.4.0 and 2.0.0 the marker's
# own rule carries this name instead, the 旧姓 consumption being the
# larger diff from those baselines.
name_regex = "^田中 太郎 旧姓 佐藤 MA$"
fields = ["_ambiguities", "maiden", "suffix"]
