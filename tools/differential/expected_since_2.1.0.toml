# Ledger for baseline 2.1.0 -- what changes for a user upgrading from
# the previous minor. Same rule grammar as the other ledgers: every rule
# needs `issue`; optional `name_regex` and `fields` narrow it, and
# compare.py sorts name_regex rules ahead of fields-only ones.
#
# This file was opened empty the day 2.1.0 shipped (AGENTS.md release
# step 8) and stayed that way through #354, #358 and #361, none of
# which moved the default-order corpus. #367 is the first 2.2 change
# that does, and its rule below is the first entry here.
#
# The ledger is opened before it has anything to say because
# DEFAULT_BASELINE and the ledger are coupled: _allowlist_for treats a
# missing file as a hard error, on the reasoning that an absent ledger
# classifies nothing and would make every diff report as unexplained.
# So the baseline could not advance to 2.1.0 without this file.
#
# Do not copy rules across from expected_since_2.0.0.toml: that ledger
# classifies what 2.1 changed on top of 2.0, and a rule copied without
# checking either over-matches -- hiding a real 2.2 regression behind a
# 2.1-era label -- or never fires at all. The #367 rule below IS shared
# with the other two ledgers, and that is not an exception to this: the
# change is in the 2.2 cycle, so every baseline before it sees the same
# diff, and each copy was checked against its own run rather than
# assumed.
#
# tests/v2/test_differential.py permits exactly one empty ledger, the
# one DEFAULT_BASELINE names -- a permission this file no longer needs.
#
# tests/v2/test_ledger_guards.py's _SPAN_BEARING_RULES records this
# file with an empty set: no rule here hand-copies _SCRIPT_RANGES, and
# the first one that does has to be recorded there or the sweep fails.
# #367's rule is Latin-only and declares no script span.
#
# There is deliberately no `change = []` line. TOML forbids appending a
# [[change]] table to a statically defined array, so that line would
# have blocked the entry below -- and every reader uses
# .get("change", []) -- four call sites across three files -- so the
# key's absence was already the empty ledger.
# tests/v2/test_differential.py checks that nothing else is defined at
# the top level here, since a mistyped table name would otherwise read
# as an empty ledger rather than as a broken one.

[[change]]
issue = "fix(#367) a title no longer displaces a leading particle out of the leading position"
# 'Mr. Van Nguyen': a leading particle deliberately does not chain --
# that is what makes 'Van Nguyen' read as given Van, family Nguyen.
# Through 2.1 the exception was keyed on piece index 0, so a TITLE
# displaced the particle and the chain fired, giving family
# 'Van Nguyen' (v1's reading, which is why this name is parity with
# 1.4.0 until now). 2.2 keys it on the first piece of the NAME, so a
# titled name reads as the same text reads untitled.
#
# The wider class is any title followed by a particle -- 'Dr. Van
# Johnson', 'Sir de Mesnil', 'Sheik Abu Bakar' all move -- and this
# regex names one title and one particle because 'Mr. Van Nguyen' is
# the one name in the corpora that moves. Deliberately narrower than
# the class: a corpus name that joins it later should arrive
# UNEXPLAINED and be read once, not be absorbed silently. Widen the
# literals then, and record the new count.
#
# The title slot is a LITERAL for that reason and not by accident.
# Nothing in a regex over the raw string can ask whether a word is a
# title, so the `(?i)^\S+\.?\s+van\b` this rule shipped with matched
# ANY first word: it reached 11 corpus names and explained 1. The
# other ten include 'Vincent van Gogh', 'VINCENT VAN GOGH' and
# 'Alex van Johnson' -- the "Van Johnson" family AGENTS.md names as a
# standard regression canary. name_regex rules sort ahead of
# fields-only ones and `fields` matches by subset, so a future
# regression on any of those would have been labelled fix(#367) and
# exited 0 -- a strict loss at this baseline, whose ledger was empty
# before. (`\.?` was inert into the bargain: `\S+` is greedy, so it
# had already taken the period.)
#
# `fields` is what carries the rest of the tightness -- and it is narrower
# than the change rather than a description of it. The change moves
# `title` as well: a word in BOTH vocabularies stops the transparency
# scan and stays a title piece instead of being chained onto the name,
# so 'Dr. St John Smith' goes from title 'Dr.', family 'St John Smith'
# to title 'Dr. St', given 'John', family 'Smith'. It moves `maiden`
# as well: un-chaining lets a marker standing behind the particle be
# seen at all, so 'Mr. Van Johnson nee Brown' goes from family
# 'Van Johnson nee Brown' with no maiden name to given 'Van', family
# 'Johnson', maiden 'Brown'. `suffix` and `nickname` are the two that
# genuinely never move. Naming three roles anyway is deliberate, for
# the reason the regex names only `van`: a corpus name that moves
# `title` or `maiden` should arrive UNEXPLAINED and be read once,
# rather than be absorbed here.
#
# The 1.4 ledger carries the same rule, where it also has a second job:
# there the diff was already being absorbed by that file's fields-only
# fix(suffix-routing), a rule about a trailing credential whose
# ["given", "family", "suffix"] is a superset of this diff's fields. No
# fields-only rule exists here, so this file's copy is the plain
# classification.
name_regex = "(?i)^mr\\.\\s+van\\b"
fields = ["given", "middle", "family"]

[[change]]
issue = "fix(#379) a tussenvoegsel after a family comma attaches to the family"
# 'Vega, Juan de la': the Dutch alphabetized listing moves the
# tussenvoegsel behind the given name -- "Beethoven, Ludwig van" is how
# "Ludwig van Beethoven" is filed -- and 1.4 read the trailing particle
# run as a middle name. 2.2 attaches it to the family already named by
# the comma and renders it before the base, so `middle` empties and
# `family` grows. rules.md#P6 states it; the derived views move with it
# (family_particles 'de la', family_base 'Vega').
#
# Fields are {middle, family}: the given name does not move. `suffix`
# is deliberately NOT here, though the #380 half of the change does
# move a token out of it ('Berg, Jan vd' was suffix 'vd' at every
# baseline and is now family 'vd Berg'). No corpus name exercises that
# shape, and adding `suffix` to claim it costs three shapes this rule
# has no business explaining -- {family,suffix} taken from
# fix(suffix-routing), and {middle,suffix} and {middle,family,suffix}
# taken from UNEXPLAINED, the last two being diffs in which `family`
# does not move at all. A rule that pre-claims shapes it has never seen
# is the #372 failure mode. If a vd-shaped name ever enters the corpus
# it should arrive unexplained and be read once.
#
# Latin-anchored over the WHOLE name, not just the trailing word: with
# a leading .* this absorbed non-Latin comma names whose diff has
# another cause -- a Cyrillic 'Smith, de la' moves {family} because the
# particle's RENDERING ORDER inside the family changed, which no rule
# in this ledger names, and it classified here. (It now falls to the
# fields-only catch-all, so the absorption moved rather than vanished;
# worth a narrower rule if such a name ever appears.) The class is the
# neighbours' and compare.py's own: U+0000-U+024F, which stops at
# Latin Extended-B, so a diacritic-bearing 'Nguyen, Van de la' in NFD
# or Latin Extended Additional is outside it.
#
# What the rule still over-claims is vocabulary, not script: any Latin
# comma name ending in an alternation member is claimed whatever the
# naming tradition, so a future {middle,family} regression on
# 'Nguyen, Van' -- one of the two corpus names it reaches, and the one
# that does NOT move -- would classify as intended.
name_regex = "(?i)^[\\u0000-\\u024f]*,[\\u0000-\\u024f]*\\s(de|del|den|der|di|do|dos|du|la|le|los|mc|van|vd|von|zu)(\\s+(de|del|den|der|di|do|dos|du|la|le|los|mc|van|vd|von|zu))*\\s*$"
fields = ["middle", "family"]
