# Words deliberately shared across languages.

schema = 1

[[word]]
text = "docent"
academic = { expands = "the academic rank, spelled alike in Dutch, Swedish, Danish, Norwegian, Polish and Czech" }

[[word]]
text = "doctor"
academic = { expands = "spelled alike in English, Spanish, Catalan and Romanian" }

[[word]]
text = "dr"
academic = { expands = "Doctor, abbreviated alike across the European languages" }

[[word]]
text = "ing"
excluded = { academic = { reason = "Ing is borne as a given name (nam_dict band 5 in Sweden, Wikidata 10+ given) and as a surname (US Census 1,814), measured 2026-10-22 with tools/name_usage.py; with its period, 'Ing.' (Ingegnere, Ingenieur) already reads as a title by its shape (rules/H2). Not decided here: ClinicalTrials.gov officials write a bare Ing after a comma as a credential (43 of 52), and 9 of those names reverse ('Viera Sevcikova, Ing' gives given 'Ing'), a suffix question, #848", issue = 840 } }

[[word]]
