# Words deliberately shared across languages: a word that harms no
# language and would otherwise be copied into every language's file.
# Every choice reads this file, a strict one included (#1005).

schema = 1

[[word]]
text = "mr"
salutation = { gender = "m", after_given = true, note = "US SSA counts 5 births named Mr (2026-10-24), too few to read the word as a name anywhere, so the count stays in this note rather than as a `given` reading, which would make the title one only inside a title phrase (rules/H9); kept for after_given (decisions/H8). In mul.toml (#1005): no `Mr` as a name word and no `MR` as initials in the ORCID, PatentsView or PSC boxes (2026-11-02, 3.5M records)", issue = 1005 }

[[word]]
text = "mrs"
salutation = { gender = "f", after_given = true, note = "the English form of address, written before names in English-context data from every country; no `Mrs` as a name word and no `MRS` as initials in the ORCID, PatentsView or PSC boxes (2026-11-02, 3.5M records)", issue = 1005 }

