[[word]]
text = "dis"
credential = { issue = 969, expands = "diplomovaný specialista, the Czech tertiary professional diploma, written after the name", note = "cz-candidates: 3,248 of 170,181 Czech election candidates' records hold it in the box after the name (2026-10-30), 3,232 of them read as a title behind the comma; NPPES 2 (written DIS); ClinicalTrials.gov 1 official, after a comma (data 2026-11-18). The surname Dis is mul.toml's family reading, which gates the credential (rules/S4). No case mask (decided 2026-11-20): a mask applies in every role and would repair the surname to DiS (JAN DIS → Jan DiS), so a mixed-case spelling is left as written, and case repair of a name written in one case, like capitalized(force=True), writes DIS" }

[[word]]
text = "drsc"
credential = { cased = "DrSc", issue = [753, 848, 969], expands = "doktor věd, Doctor scientiarum, written after the name", note = "on by default since 2026-11-20 (#969): no name reading (ORCID boxes hold it 5 times, the credential typed into a name box; no Census, SSA or PatentsView bearer), and Czech candidates write it after a comma, where unlisted it read as a title (12 records under the default, 2026-10-30); 16 of ClinicalTrials.gov's 536,981 officials write it, all after a comma (data 2026-10-21)" }

[[word]]
text = "ien"
excluded = { credential = { reason = "IEn., written after the name by 3 Czech election candidates (cz-candidates, 2026-10-30), is the given name Ien: US SSA 16 births since 1880, a lower bound, years under 5 unrecorded (2026-11-20), so a credential reading would take a given name ending a name", issue = 969, decided = 2026-11-20 } }

[[word]]
text = "et"
conjunction = { issue = 970, note = "Latin 'and', which Czech writes between two degrees of the same rank (Ing. et Ing., Mgr. et Mgr.); fr.toml's conjunction already reads it by default, so this copy moves no field but under a strict choice of cs, which drops fr.toml and read Ing. et Ing. Jan Novák as title 'Ing.', given 'et'; there et now joins any two words, as by default (Pierre et Marie Curie gives given 'Pierre et Marie'), and the word's Reading.languages gains cs (#970)" }

[[word]]
text = "roz"
[word.birth_marker]
default = false
issue = [274, 753]
expands = "rozená or rozený, née or né, abbreviated"
note = "off by default: Roz, the English diminutive of Rosalind (US SSA 64 female births; US Census 2010 154 surnames), stands exactly where a marker acts, so with it read 'Rosalind Roz Smith' reads maiden 'Smith' and takes the given name Rosalind for the family (measured 2026-10-20); the Czech choice accepts that, and the full rozená ships"

[[word]]
text = "rozená"
[word.birth_marker]
issue = 274
gender = "f"
note = "the masculine rozený awaits its own vetting; the abbreviation roz., shared by both, is a reading off by default beside it"

