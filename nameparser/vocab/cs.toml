schema = 1

# locales.CS reads its names with two family names (rules/O6), the
# married double surname written without a hyphen (decisions/vocabulary-model,
# the 2026-10-30 phase 3f amended entry)
[rules]
two_family_names = true

[[word]]
text = "pan"
salutation = { default = false, issue = [606, 753], gender = "m", note = "Czech and Polish Mr., off by default because Pan is the Chinese surname 潘, which leads (US Census 2010 12,664 bearers; 285 of ClinicalTrials.gov's 536,981 officials write the word and 488 of ORCID's 1,831,533 records, data 2026-10-21 and 2025-10-17, nearly all of them the surname): under a Czech or Polish choice Pan Wei reads title 'Pan'. The accented paní ships" }

[[word]]
text = "paní"
salutation = { issue = 606, gender = "f", note = "keeps its accent, so the name Pani (~76,000 surnames and ~65,000 given names, India and Indonesia) is untouched, and the unaccented pani is not shipped; the lexicon folds no accent (decisions/salutation-titles)", excluded = { after_given = "spelled PANI, a surname (Census 2010), and middle names are drawn from surnames" } }
family = { us_census_2010 = 403, as_of = 2026-10-24, note = "counted as PANI, the Census writing no diacritics" }

[[word]]
text = "rodina"
excluded = { salutation = { reason = "Czech 'family', and a Russian surname, often written surname-first; familie ships", issue = 606, decided = 2026-10-04 } }

[[word]]
text = "slečna"
salutation = { issue = 606, gender = "f", after_given = true }

[[word]]
text = "bc"
academic = { default = false, issue = [753, 970], expands = "bakalář, Bachelor", note = "bakalář, the Czech and Slovak Bachelor. Excluded on 2026-10-30 because as a title under a Czech choice it moved 23 of ClinicalTrials.gov's 536,981 officials, one a Czech Bc and the rest the US nursing credential Board Certified (APRN, BC) or initials; re-weighed on 2026-11-21 by the rule that a choice is optimised for its language's names, those 23 being a US register read under a Czech choice. Under locales.CS it moves 51 of cz-candidates' 170,181 records to agreement and none away, the Bc. et Bc. pair most, and of every local corpus's names holding the word, 80 read differently (bc alone, measured 2026-11-21 against master 1e920d6f; recipe in the decisions entry): 59 Czech degrees now right, 5 names a trailing BC had reversed now right, and 16 costs, 9 initials B.C. (MOSS, BC reads title 'BC', no given name) and 7 the credential BC moved from suffix to title, 6 of them the nursing credential and 1 the BC of MB BC. No case mask: cased = 'Bc' recased ACNP-BC as ACNP-Bc under capitalized(force=True), and title case writes Bc. without one (decisions/vocabulary-model, the 2026-11-21 #970 entry)" }

[[word]]
text = "bca"
academic = { default = false, cased = "BcA", issue = [753, 848], expands = "bakalář umění, Bachelor of Arts" }

[[word]]
text = "ing"
academic = { default = false, issue = 970, expands = "inženýr, the engineering degree", note = "inženýr, the engineering degree, written before the name. Its given reading in mul.toml (Ing, a Chinese, Malaysian and Swedish given name) would make it a title only inside a title phrase (rules/H9), and a choice never drops a name reading, so locales.CS's fragment removes that reading; the family reading stays, keeping mul.toml's credential gated (Mr Tom Ing keeps family Ing). Under locales.CS, with bc, it moves 165 of cz-candidates' 170,181 records to agreement and 4 away (measured 2026-11-21 against master efdf0e16), the records whose Ing et Ing pair stood outside the title falling from 107 to 1, and the cost an Ing.Paed.IGIP or EUR ING written after the name read as a title. Among every local corpus's names holding the word, about 162 are the degree now read (140 written with its period or in a pair, about 22 bare) and about 19 open with Ing the given name, which reads title 'Ing' (Ing Wei Lim); Ing alone after a family comma (Lim, Ing) and Ing the surname at the head of a family comma (Ing Ho, Mei) read the title too (decisions/vocabulary-model, the 2026-11-21 #970 entry)" }

