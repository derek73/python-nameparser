schema = 1

# Thai academic and professional titles (#1166): Thai script writes only
# Thai, so a listed title collides with no other language's name. Each was
# checked with tools/name_usage.py on 2026-11-10: the Census, SSA and
# nam_dict cannot spell Thai, Wikidata's few given-name statements are the
# title typed in, and the Thai Wikipedia people index (39,858 people) holds
# none in a name but the two articles titled with ดร. in front.
# The salutations นาย, นาง and นางสาว (#317) and the spelled-out titles
# are written `attached` in front: rules/W6 splits one glued to the start
# of the name. The short forms are not, each opening real given names
# (นพพร, ศิรินภา).
# Every title here addresses the given name (addresses = "given"): Thai
# addresses a person by the given name after any title, so a title and
# one name word read the word as given (decisions/W6).

[[word]]
text = "นาง"
salutation = { addresses = "given", gender = "f", issue = 317, attached = { side = "before", issue = 317 }, expands = "Mrs., a married woman", note = "no Thai given name opens with it among 12,880 (PyThaiNLP's lists and 2019's election candidates, 2026-11-10); the Thai Wikipedia names opening with it glued are the honorific (นางวิสาขา), the Japanese ones (นางิ, นางาเซะ) kept whole by the syllable guard; 1,428 of the 14,098 2019 candidates" }

[[word]]
text = "นางสาว"
salutation = { addresses = "given", gender = "f", issue = 317, attached = { side = "before", issue = 317 }, expands = "Miss, an unmarried woman", note = "no Thai given name opens with it among 12,880 (2026-11-10); 1,676 of the 14,098 2019 candidates; glued to the given name by 8 ORCID filers, written apart by 2" }

