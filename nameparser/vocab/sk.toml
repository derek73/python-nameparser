[[word]]
text = "et"
conjunction = { issue = 970, note = "Latin 'and', which Slovak writes between two degrees of the same rank (Mgr. et Mgr.); fr.toml's conjunction already reads it by default, so this copy moves no field but under a strict choice of sk, which drops fr.toml; there et now joins any two words, as by default, and the word's Reading.languages gains sk (#970)" }

