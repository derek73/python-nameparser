[[word]]
text = "dom"
excluded = { salutation = { reason = "Dom, the title of a bishop, abbot or prince, is a given name: it opens 20 FEC given parts after the family comma (CAGLIOTI, DOM), 5 nepal-candidates names (Dom Bahadur Thapa), 2 ClinicalTrials.gov officials' and 4 more in ORCID, PatentsView and PSC, against jrc-names' 117 openers, many the Polish word for house (DOM MAKLERSKI) (2026-10-30); US SSA 424 births", issue = 753, decided = 2026-10-30 } }

[[word]]
text = "dona"
excluded = { salutation = { reason = "Dona, the courtesy title, is a given name: it opens 25 ORCID names (Dona Banerjee), 2 PatentsView, 2 PSC and 2 ClinicalTrials.gov ones, and 158 FEC given parts after the family comma (ABBOTT, DONA), against jrc-names' 49 openers, the title and the name mixed (Dona Amélia, Dona Abbott), and none in tse-donors (2026-10-30); US SSA 19,032 births. Counted in persons, names open with it more often than it opens one as the title (decisions/vocabulary-model's phase 3e criterion)", issue = 753, decided = 2026-10-30 } }

