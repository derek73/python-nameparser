excluded = { salutation = { reason = "M., Monsieur abbreviated (M. Jean Dupont), but written exactly as an initial is (rules/T5), and in names nearly always one: 782 ORCID records and 168 PatentsView inventors open with M. before two or more name words (M. Ali Khan), every one an initial, and no local corpus writes the salutation; under any choice it would take the given initial of every M. Smith. No writing tells the two apart, so no pack reads it", issue = 658, decided = 2026-11-03 } }

