family = { wikidata = 3, as_of = 2026-11-03, note = "a French surname: Wikidata is a lower bound; ORCID's family box 1 record in France and 1 in Belgium, and jrc-names and orcid-researchers each hold a name ending in it (Olivier Père); US Census 2010 616 bearers of PERE, which writes no accent, so they may be the Catalan Pere" }

[[word]]
text = "d'"
[word.preposition]
may_be_given = false
issue = 700
expands = "of, elided de"
note = "Written apart mostly where an index form moves it behind the given name (\"Ivoi, Paul d'\"); glued (\"d'Ivoi\") it stays one word."

[[word]]
text = "d’"
[word.preposition]
