[[word]]
text = "pr"
academic = { same_as = "professeur", issue = 804, expands = "Pr, Professeur abbreviated, as Dr is Docteur: written bare, without a period", note = "ClinicalTrials.gov's officials write it 1,551 times, bare or with a period (Pr 1,335, Pr. 138, PR 70 the commonest spellings), 1,454 after a comma (Patrick Mercier, Pr), and 56 ORCID records hold it, mostly opening the name (Pr Roger Noun); US Census 2010 under 100, US SSA under 5 births a year, no Wikidata bearer (2026-11-03). As a title it takes the paired initials PR where they are the whole given part (Hills, PR, 5 names of every local corpus) or open the name (PR Narayanan, 4), as DR does, and the given name glued behind it (Pr.Brahim Benzougagh, 4), as Dr. does: accepted against the other 1,234 of the 1,247 names it moves, which it gives the title back to (decisions/salutation-titles' 2026-11-03 #804 entry)" }

