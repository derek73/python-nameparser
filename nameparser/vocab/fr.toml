[[word]]
text = "d'"
[word.preposition]
may_be_given = false
issue = 700
expands = "of, elided de"
note = "Written apart mostly where an index form moves it behind the given name (\"Ivoi, Paul d'\"); glued (\"d'Ivoi\") it stays one word."

[[word]]
