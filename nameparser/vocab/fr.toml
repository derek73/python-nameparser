[[word]]
text = "de"
[word.preposition]
may_be_given = false
expands = "of"
note = "\"De\" IS a borne Bengali and Odia surname -- trailing, so it never reaches this rule. The case that forced C-i's positional qualifier."

[[word]]
text = "du"
