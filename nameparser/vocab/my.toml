salutation = { default = false, gender = "f", native = "ဒေါ်", issue = 1231, expands = "Daw, the honorific written before a woman's name (Mrs.)", note = "Burmese names have no family name and an honorific opens them, so the default reads Daw as the given name; on by default it would take the given name of the people who bear it: US Census 2010 2,670 as a surname, Wikidata 3 given (Sudan 1) and 20 family; ORCID's given box 29, MM 2, family box 118; PatentsView 9 given, 54 family (tools/name_usage.py, 2026-11-19). Written bare as a word of its own; written Daw. it is a title by its shape by default already (rules/H2)" }

[[word]]
