family = { us_census_2010 = 3363, wikidata = 106, as_of = 2026-10-26, note = "Wikidata: Ottoman Empire 26, the title written after the name, which reads as a name word" }

[[word]]
text = "baba"
[word.excluded.generation]
reason = "collides inside Turkish, and Turkish puts the junior word before the name"
issue = 679

[[word]]
text = "kıdemli"
[word.excluded.generation]
reason = "a rank word (Kıdemli onbaşı); Turkish writes Jr. or a parenthesis, (oğul)"
issue = 661

