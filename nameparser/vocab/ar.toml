[[word]]
text = "و"
[word.conjunction]
issue = 269
note = "formal script attaches و to the following word (وفاطمة), so a standalone و is informal spacing, common in real data; single-character, so the single-letter carve-out protects short names"

[[word]]
text = "abd"
[word.bound_given]
expands = "servant of"
note = "the bare transliteration, which abdul/abdel/abdal do not match: 'abd Allah Smith' and 'Abd al-Rahman Smith' read given 'abd Allah' and 'Abd al-Rahman'; the three-token 'abd al rahman smith' is not joined, al being a particle that chains forward. Also the credential ABD in en.toml; position decides at the two ends but not in a family comma's given slot (decisions/P5)"

