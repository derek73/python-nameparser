note = "\"abd\" (servant of): the script writes Abdul Rahman as two words, عبد + الرحمن, the article attaching to the word after it, so عبد alone covers the abdul/abdel/abdal spellings -- عبد الرحمن -> given \"عبد الرحمن\". completed_by lists the words that make it one name unit past the first name word (rules/P12): the 97 one-word names of God, الله, 27 other divine epithets and 14 devotional completions (المطلب, النبي, الحسين, المسيح) found after it in ORCID and JRC-Names, each with its hamza-less and Persian spellings -- سعيد عبد الله -> family \"عبد الله\". An unlisted word after it is left alone: a short given name stands alone there (نوال عبد هاشم), and a nisba surname opens with the article too (عبد القريشي; 2026-11-04, #694, decisions/P12). The Latin abdul lists none: there the pair is a middle name as often as a family (decisions/P12)"
issue = [269, 694]
