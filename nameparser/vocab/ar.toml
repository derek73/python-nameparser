[[word]]
text = "بن"
[word.patronymic]
may_be_given = false
issue = 269
expands = "son of: bin, ibn"
gender = "m"
note = "Never a bare given name. Latin 'bin' may be given; that judgment is unchanged by adding the Arabic-script form. Unlike their Latin transliterations, the native-script particles have no collision with an unrelated Latin given name, so each is judged on its own semantics rather than mirrored blindly."

[[word]]
text = "بنت"
[word.patronymic]
may_be_given = false
issue = 269
expands = "daughter of: bint"
gender = "f"
note = "mirrors Latin 'bint'"

[[word]]
text = "ابن"
[word.patronymic]
may_be_given = false
issue = 269
expands = "son of: ibn, alternate spelling"
gender = "m"
note = "mirrors Latin 'ibn'"

[[word]]
text = "آل"
[word.clan]
may_be_given = false
issue = 269
expands = "family of: \"Al Saud\""
note = "Distinct from the article ال, excluded beside it in this file; a clan prefix, never a bare given name."

[[word]]
text = "abu"
[word.teknonymic]
may_be_given = true
issue = 269
expands = "father of"
gender = "m"
note = "\"Abu Bakr\" -- Abu reads as the given name; also a bound given-name word, so it joins forward (P5)"

[[word]]
text = "al"
[word.article]
may_be_given = true
expands = "the"
note = "Al Gore: 'Al' is an ordinary English given name. Also the Arabic definite article, which is the particle reading"

[[word]]
text = "bin"
[word.patronymic]
may_be_given = true
expands = "son of"
gender = "m"
note = "Kept ambiguous deliberately: #269 judged the Latin transliteration separately from the native-script بن, which IS never-given"

[[word]]
text = "أبو"
[word.teknonymic]
may_be_given = true
issue = 269
expands = "father of: abu, hamza spelling"
gender = "m"
note = "Left ambiguous like its Latin transliteration 'abu': \"Abu Bakr\" reads Abu as a given name"

[[word]]
text = "ابو"
[word.teknonymic]
may_be_given = true
issue = 269
expands = "father of: abu, hamza-less spelling"
same_as = "أبو"
gender = "m"

[[word]]
text = "ben"
[word.excluded.patronymic]
reason = "Ben is a common given name standing exactly where a forward-joining particle claim acts: \"Ahmad Ben Husain\" reads middle 'Ben', and admitting it would take that token into the family. Removed in v0.2.5 and re-affirmed 2026-09-01 (decisions/v1-xfail-triage); a caller who needs the patronymic reading adds it to their own Lexicon. The pressure to re-add is real and recurring: 'Ahmad ben Husain' wants family 'ben Husain', the v1 suite carried that as an xfail for years, and a sweep of Arabic and Hebrew patronymic particles is exactly how it comes back"

[[word]]
text = "ال"
[word.excluded.article]
reason = "normally attached to the word it determines, and too ambiguous standing alone (#269)"
issue = 269
