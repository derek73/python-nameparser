[[word]]
text = "al"
[word.article]
may_be_given = true
expands = "the"
note = "Al Gore: 'Al' is an ordinary English given name. Also the Arabic definite article, which is the particle reading"

[[word]]
text = "al-"
[word.article]
may_be_given = false
issue = 700
expands = "the"
note = "the Arabic article as an index form writes it, hyphen attached and set behind the given name (\"Rashid, Harun al-\", \"Zaʿīm, Ḥusnī az-\"). Written apart with its hyphen the word is the article and nothing else, so it and its assimilated spellings are never-given where the bare 'al' (Al Gore) may be given. A closed list rather than a shape rule, by decision on #700; ASCII hyphen-minus only"

