[[word]]
text = "tho"
preposition = { may_be_given = true, issue = 18, expands = "to, Low German zu" }

[[word]]
text = "vom"
preposition = { may_be_given = false, expands = "from the, von dem contracted" }

[[word]]
text = "von"
[word.preposition]
may_be_given = true
expands = "of, from"
note = "Von Miller: a real given name, so this stays ambiguous even though \"von Braun\" is misparsed today. The case that shows a word can look like a pure particle, BE misparsed as one, and still have a bearer"

[[word]]
text = "zu"
preposition = { may_be_given = false, expands = "at, to; nobiliary: \"zu Guttenberg\"" }

[[word]]
text = "dem"
article = { may_be_given = false, issue = 18, expands = "the, dative" }

[[word]]
text = "den"
article = { may_be_given = true, expands = "the: \"von den Steinen\"" }

[[word]]
text = "der"
article = { may_be_given = false, expands = "the: \"von der Leyen\"" }

[[word]]
text = "freiherr"
[word.rank]
may_be_given = true
issue = 18
expands = "baron"
gender = "m"
note = "Since 1919 a former noble title is part of the legal surname, written before the particle (\"Karl-Theodor Freiherr von und zu Guttenberg\"), so it chains like one. Also in TITLES, load-bearing"

[[word]]
text = "freiherrin"
[word.rank]
may_be_given = true
issue = 18
expands = "baroness"
gender = "f"
note = "the feminine of freiherr, written and chained the same way (see its note); unlike freiherr it is not in TITLES"
