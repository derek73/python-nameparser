preposition = { issue = 18, expands = "to, Low German zu" }

[[word]]
text = "vom"
preposition = { may_be_given = false, expands = "from the, von dem contracted" }

[[word]]
text = "von"
given = { us_ssa = 6011, wikidata = 46, as_of = 2026-10-25, note = "US SSA births summed over both sexes; Wikidata is a lower bound" }
[word.preposition]
expands = "of, from"
note = "Von Miller: a real given name, so this stays ambiguous even though \"von Braun\" is misparsed today. The case that shows a word can look like a pure particle, BE misparsed as one, and still have a bearer"

[[word]]
