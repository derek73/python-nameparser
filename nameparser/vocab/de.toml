schema = 1

[[word]]
text = "familie"
salutation = { issue = 606, expands = "the family addressed, 'Familie Hansen'", after_given = true }

[[word]]
text = "frau"
salutation = { gender = "f", after_given = true }
family = { wikidata = 42, as_of = 2026-10-24, note = "kept for after_given (decisions/H8)" }

[[word]]
text = "fräulein"
salutation = { gender = "f", after_given = true }

[[word]]
text = "herr"
salutation = { gender = "m", excluded = { after_given = "a surname (Census 2010 HERR), and middle names are drawn from surnames" }, note = "borne as a given name: Wikidata 3 people (2026-10-24); kept here, not as a `given` reading, which would make the title one only inside a title phrase (rules/H9)" }
family = { us_census_2010 = 11980, wikidata = 135, as_of = 2026-10-24 }

[[word]]
text = "herrn"
salutation = { gender = "m", same_as = "herr", expands = "Herr, inflected (an Herrn Müller)", after_given = true }

[[word]]
text = "hr"
salutation = { gender = "m", same_as = "herr", excluded = { after_given = "ending a given part in US data, more likely two initials run together than the abbreviation of Herr: one of three such fec-individuals names has a woman's given name (2026-10-24)" } }

[[word]]
text = "herren"
family = { us_census_2010 = 4466, wikidata = 37, as_of = 2026-10-27, note = "Wikidata bearers by citizenship: Switzerland 9, the United States 5, Germany 4" }
excluded = { salutation = { reason = "the plural of Herr: a plural addresses several people (Herren Müller und Schmidt) and never stands before one person's name, so as a title it only took the first word of a surname-first name (Herren Hans read title 'Herren', family 'Hans'); borne as a surname by more than any word shipped under the graf class, decisions/salutation-titles (the counts on its family reading)", issue = 766 } }

