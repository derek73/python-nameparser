religious = { expands = "prince-archbishop" }

[[word]]
text = "baron"
nobility = { gender = "m" }

[[word]]
text = "edler"
nobility = { gender = "m", expands = "the lowest German noble rank, 'Edler von'" }

[[word]]
text = "freifrau"
nobility = { gender = "f", expands = "baroness" }

[[word]]
text = "freiherr"
given = { note = "carries the particle's may-be-given reading, the C-i default (the particle's note argues the chain, not a given name); no source counts it as a given name (2026-10-25)" }
nobility = { gender = "m", expands = "baron" }
[word.rank]
issue = 18
expands = "baron"
gender = "m"
note = "Since 1919 a former noble title is part of the legal surname, written before the particle (\"Karl-Theodor Freiherr von und zu Guttenberg\"), so it chains like one. Also in TITLES, load-bearing"

[[word]]
text = "fürst"
given = { note = "carries the particle's may-be-given reading, as freiherr's does; borne as a given name: US SSA 0, Wikidata 0 (2026-10-17, #709)" }
nobility = { gender = "m", expands = "prince" }
rank = { issue = 709, expands = "prince", gender = "m", note = "since 1919 part of the legal surname, written before the particle (`Johannes Fürst von Thurn und Taxis`), so it chains as freiherr does; in TITLES too, so it is still a title opening a name. A common surname (US Census 2,521), which a family comma's trailing particle attachment (rules/P6) can take into the family ('Smith, Steffi Graf' reads family 'Graf Smith'), accepted on the corpus counts (decisions/vocabulary-collisions, 2026-11-04 #709)" }

[[word]]
text = "graf"
given = { note = "carries the particle's may-be-given reading, as freiherr's does; borne as a given name: US SSA 0, Wikidata 0 (2026-10-17, #709)" }
nobility = { gender = "m", expands = "count" }
rank = { issue = 709, expands = "count", gender = "m", note = "since 1919 part of the legal surname, written before the particle (`Otto Graf Lambsdorff`), so it chains as freiherr does; in TITLES too, so it is still a title opening a name. A common surname (US Census 13,301), which a family comma's trailing particle attachment (rules/P6) can take into the family ('Smith, Steffi Graf' reads family 'Graf Smith'), accepted on the corpus counts (decisions/vocabulary-collisions, 2026-11-04 #709)" }

