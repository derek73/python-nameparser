# (SUFFIX_ACRONYMS_AMBIGUOUS)
# Suffix acronyms that also commonly work as given-name nicknames on
# their own (e.g. "Ed", "JD"). Read wherever the pipeline decides an
# acronym's bare reading (rules/S4) and by the delimited-content
# escape (content matching one of these stays a nickname, the more
# common reading in ambiguous, delimiter-only context). _classify
# also tags membership as "vocab:suffix-ambiguous".
#
# When adding a credential acronym, set may_be_name = true on its
# reading only if the exact letter sequence could plausibly be someone's name on its
# own -- a given name or nickname (e.g. 'jd', 'ed') or a common
# surname (e.g. 'ma', 'do'). Unambiguous certifications/degrees
# (e.g. 'mba', 'cpa', 'phd') don't need the flag. In 2.0 the flag
# also gates bare recognition: a bare ambiguous acronym reads as
# the credential only with words to spare in front of it, or
# written in capitals inside a mixed-case name; inside a
# mixed-case name any other cased form that is not wholly lower
# ('Ma', 'MEng') reads as the name even with words to spare --
# rules/S4 and rules/S6. The parse reports the fork where it decides one,
# so 'Jack Ma' keeps its family name.
#
# The other half of the criterion, added 2026-09-07 with #342.
# Being borne at all is only the entry ticket; what decides among
# the three answers is a comparison of FREQUENCIES -- how common
# the word is as a borne name in the TRAILING position against how
# common it is as a credential. Roughly balanced earns the marking
# here, and the parse reports the fork: 'ba' is the entry that
# earned it that day, BA being a common credential and Ba a real
# surname (Vietnamese; Senegalese Fula) about as common as the
# credential, which is the ma/Ma shape exactly. Where the NAME
# reading dominates, the entry is REMOVED from SUFFIX_ACRONYMS
# instead of marked: 'rai' and 'cha' left the set that day, both
# far more common as surnames than their credentials are as
# credentials (RAI is "RETA Authorized Instructor", CHA is
# Certified Hotel Administrator or Certified Healthcare Auditor,
# both tenuous or specialized; Rai is a common surname across
# Hindi- and Bengali-speaking regions and Cha the Korean 차).
# Where the CREDENTIAL dominates, the entry stays unambiguous.
# LENGTH is a correlate and not the test -- a short acronym is
# more often a common credential AND more often a name -- so do
# not read the letter counts here as a rule. #540 (2026-09-25)
# marked 'lac' and 'meng', the first entries here longer than
# two letters: MEng and LAc are credentials people write after
# their names, and Meng and Lac are borne in the trailing slot
# by real people, and neither reading is rare enough to give the
# word to the other -- so the marking, whatever the letter
# count.
#
# Removal does not take the DOTTED spelling with it: since 2.4 an
# unlisted word of two or more period-separated chunks is a suffix
# by position, with words to spare in front (rules/S3,
# Policy.unlisted_dotted_suffixes, default on), so "John Smith
# R.A.I.", "John Smith R.A.X." and "John Smith C.H.A." all read
# suffix, the vocabulary playing no part (checked 2026-10-19). A caller who needs an entry back
# adds it -- Lexicon.default().add(suffix_acronyms={"cha"}) --
# which is the answer this library gives for every
# locale-specific vocabulary. The cost is stated and accepted:
# with the entry gone, "John Smith RAI" reads family 'RAI'. See
# decisions/suffix-acronym-collisions.
#
# NOT 'ms' or 'sa', though #296's audit table put them here for the
# leading-title collision (bare "Ms" the honorific, "M.S." the
# degree): the gate is position-blind and the collision is not.
# Gated, 'John Smith, MS' lost its suffix-comma route and read
# title 'MS', and 'Smith, Ms.' passed the gate on its one period
# and read as a credential anyway. Both words are genuine duals --
# title and unambiguous suffix -- and position decides, as for
# 'sr' and 'lt' (decisions/C8).
#
# NOT 'se' or 'om' either, weighed 2026-09-07 with #342 and left
# alone: no surname evidence worth standing behind, and OM is the
# Order of Merit. And NOT 'mc' or 'vd', which are also PARTICLES:
# #454 closed by design -- neither is a borne name, so a bare
# trailing one is the decoration, and rules/P6's Accepted
# clause names them as the two words whose positional reading
# does not hold.
[[word]]
text = "ba"
credential = { may_be_name = true, expands = "Bachelor of Arts", issue = 342 }

