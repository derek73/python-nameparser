# Words not yet assigned a language. Every category but the suffix
# words was converted here mechanically from nameparser/config/*.py,
# in source order, and the comments above an entry are the vetting
# notes that stood above it there. Moving a word to a language file
# changes no compiled set.

schema = 1

# ---- the other readings of words whose particle reading has a language ----
# (#749 moved each particle reading to the files of the languages whose
# names it occurs in; `uv run python tools/vocab/query.py --word <text>`
# shows both halves)
[[word]]
text = "abu"
bound_given = {}

[[word]]
text = "أبو"
bound_given = { note = "\"abu\" (father of), hamza spelling" }

[[word]]
text = "ابو"
bound_given = { note = "\"abu\", hamza-less spelling" }

# ---- particles of unrecorded origin ----
# In the prefix list since the earliest history (bon in the 2011 svn
# import, 45a15394; dí since fc2ea899, 2012) with no record of which
# language's names they come from, so #749 could give them neither a file nor a kind.

[[word]]
text = "bon"
particle = { may_be_given = true, note = "no particle use found; borne as a given name and as a surname (the counts below), so removal is proposed" }
given = { us_ssa = 274, wikidata = 9, as_of = 2026-10-19, note = "male births only" }
family = { us_census_2010 = 1123, wikidata = 102, as_of = 2026-10-19, note = "Wikidata bearers mostly French and Italian" }

[[word]]
text = "dí"
particle = { may_be_given = true, note = "no particle use found; the Wikidata bearers are Chinese given names (romanized Dí), so removal is proposed" }
given = { wikidata = 7, as_of = 2026-10-19, note = "5 of 7 PRC citizens; the US sources fold the accent to Di, so their counts are not this spelling's" }

# ---- conjunctions ----

[[word]]
text = "&"
conjunction = {}

[[word]]
text = "and"
conjunction = {}

[[word]]
text = "et"
conjunction = {}

# (CONJUNCTIONS_AMBIGUOUS)
# #383/#479: single letters that read as an INITIAL rather than a
# connective when the input carries no case evidence -- a name
# written wholly in one case, upper or lower alike. A letter
# outside this set joins there, bare capital included.
#
# 'e' and not 'y', measured: a bare E initial is common (Edward,
# Elizabeth) and an 'e' between two surnames is rare outside couple
# listings; a bare Y initial is rare and 'y' between two surnames is
# the commonest Hispanic compound and this library's oldest fixture
# ('Velasquez y Garcia'). Cyrillic и/і/й follow y, not e: #267
# blessed their joining and nothing here narrows it.
#
# 'i' (Catalan/Polish) ships here beside 'e' for the same reason
# (#397): a bare I initial is as common as a bare E, so a name
# written wholly in one case reads the letter as an initial and
# reports the fork rather than joining in silence -- where a name
# word follows it in its part, there being nothing to join
# otherwise (#721).
#
# A caller edits the vocabulary rather than a switch: remove 'e' to
# restore joining for Portuguese data, remove 'i' for Catalan or
# Polish data, add 'y' for a Dutch-style "every single letter is an
# initial".
[[word]]
text = "e"
conjunction = { may_be_initial = true }

[[word]]
text = "of"
conjunction = {}

[[word]]
text = "the"
conjunction = {}

[[word]]
text = "und"
conjunction = {}

[[word]]
text = "y"
conjunction = {}

# #397: the Catalan/Polish surname link ("Carod i Rovira",
# "Kowalski i Nowak"). Single-letter like 'y'/'и'/'e', and the one
# entry that is ALSO generational vocabulary -- 'i' is the roman
# numeral I, a bare entry of SUFFIX_WORDS -- so the carve-out
# counts it as a name word for its own sake and it joins only
# with a name word on each side (rules/P3).
[[word]]
text = "i"
conjunction = { may_be_initial = true }

# #269: Cyrillic (ru/uk/bg) "and": и, і, та. Ukrainian writes і and
# й for the same conjunction, alternating on the surrounding
# vowel/consonant for euphony ("Олесь і Олена", "Марія й Петро"),
# so real data carries both spellings and neither alone suffices.
[[word]]
text = "и"
conjunction = {}

[[word]]
text = "і"
conjunction = {}

[[word]]
text = "й"
conjunction = {}

[[word]]
text = "та"
conjunction = {}

# #269: Greek "and": και.
[[word]]
text = "και"
conjunction = {}

# #269 follow-up: Arabic "and". Formal script attaches و to the
# following word (وفاطمة), so a standalone و token appears only in
# informal spacing -- common in real data. Single-character like
# 'y'/'и': the single-letter carve-out (Google Code issue 11,
# the "john e smith" bug) protects short names (joins
# only with enough rootname pieces).
[[word]]
text = "و"
conjunction = {}

# ---- bound given-name prefixes ----

[[word]]
text = "abdul"
bound_given = {}

[[word]]
text = "abdel"
bound_given = {}

[[word]]
text = "abdal"
bound_given = {}

# The bare transliteration, which abdul/abdel/abdal do not match:
# "abd Allah Smith" -> given "abd Allah", and "Abd al-Rahman
# Smith" likewise, al-Rahman being ONE token. The three-token
# spelling "abd al rahman smith" is still not joined -- `al` is a
# particle and chains forward -- and stays deferred, as it was
# when this word was excluded. Same word as عبد below, which has
# covered the Arabic-script side since #269 (shipped in 2.0).
#
# Collides with the postnominal ABD ("All But Dissertation"),
# a credential in en.toml. Position decides at the two ends
# -- a leading `abd` reads as a name, a trailing one as the
# credential -- but not everywhere: in the given slot of a
# family-comma name the credential still wins, so "Smith, Abd"
# reports suffix 'Abd' and no given name, where "Smith, Abdul"
# reports the given name. Recorded at decisions/P5.
[[word]]
text = "abd"
bound_given = {}

[[word]]
text = "abou"
bound_given = {}

[[word]]
text = "umm"
bound_given = {}

# #269 follow-up: the Arabic-script originals of the entries above.
# Script writes "Abdul Rahman" as two words (عبد + الرحمن -- the
# article attaches to the following word), so عبد alone covers the
# abdul/abdel/abdal variants. Both kunya spellings ship, matching
# the أبو/ابو prefix pair.
[[word]]
text = "عبد"
bound_given = { note = "\"abd\" (servant of) -- عبد الرحمن -> given \"عبد الرحمن\"" }

[[word]]
text = "أم"
bound_given = { note = "\"umm\" (mother of), hamza spelling" }

[[word]]
text = "ام"
bound_given = { note = "\"umm\", hamza-less spelling" }

