# Words not yet assigned a language. Every category but the suffix
# words was converted here mechanically from nameparser/config/*.py,
# in source order -- with generic kinds, except the credential
# acronyms, which already have their classified kind -- and the
# comments above an entry are the vetting notes that stood above it
# there. A comment headed by a constant's name in parentheses, as
# "# (SUFFIX_ACRONYMS_AMBIGUOUS)", came from that constant's block,
# where the entry's own reading came from another. Moving a word to a
# language file changes no compiled set.

schema = 1

