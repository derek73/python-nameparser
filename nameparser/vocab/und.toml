# #269: Arabic -- "الشيخ" ("the sheikh") is the native-script form of
# the transliterated sheikh/sheik/... cluster above; same
# single-first-name-follows convention ("Sheikh Mohammed").
[[word]]
text = "الشيخ"
title = { addresses = "given" }

# #269 follow-up: Arabic honorifics precede the GIVEN name, so all
# belong here rather than in plain TITLES. Article forms are never
# given names; the bare doctor/professor/engineer forms are not
# used as given names either. Deferred under the collision rule
# (as мл/ст, the junior/senior words, were deferred at the time): bare سيد (Sayyid is a common given
# name), bare شيخ (Shaikha is a common female given name), أمير
# and سلطان (Amir/Sultan, common given names), and the 'د.'
# abbreviation -- edge-period normalization would leave bare 'د',
# which swallows single-letter initials (the bare-κ trap above).
[[word]]
text = "الدكتور"
title = { addresses = "given", note = "\"the doctor\" (m)" }

[[word]]
text = "الدكتورة"
title = { addresses = "given", note = "\"the doctor\" (f)" }

[[word]]
text = "دكتور"
title = { addresses = "given", note = "doctor (m), article-less" }

[[word]]
text = "دكتورة"
title = { addresses = "given", note = "doctor (f), article-less" }

[[word]]
text = "الأستاذ"
title = { addresses = "given", note = "\"the professor\"/Mr. honorific (m)" }

[[word]]
text = "الأستاذة"
title = { addresses = "given", note = "professor/Mrs. honorific (f)" }

[[word]]
text = "أستاذ"
title = { addresses = "given", note = "professor (m), article-less" }

[[word]]
text = "أستاذة"
title = { addresses = "given", note = "professor (f), article-less" }

[[word]]
text = "الحاج"
title = { addresses = "given", note = "hajj honorific (m)" }

[[word]]
text = "الحاجة"
title = { addresses = "given", note = "hajj honorific (f)" }

[[word]]
text = "الشيخة"
title = { addresses = "given", note = "female counterpart of الشيخ" }

[[word]]
text = "مهندس"
title = { addresses = "given", note = "engineer (a genuine title in Egyptian usage)" }

# #344: Devanagari renunciate titles, the native-script twins of
# baba/guru/swami above. NO Latin twins for संत on purpose. No NEW
# Latin transliterations here: Sri and Sant collide with real
# given names (and Pandit, in the civil block below, with a
# surname) where the native script cannot (the sri/shri
# precedent in the TITLES block below); baba/guru/swami/lama are
# the pre-existing Latin entries above. A title reading with
# addresses = "given" puts a word in both GIVEN_NAME_TITLES and TITLES,
# which is what makes them titles at all -- Lexicon does not validate
# one set against the other.
[[word]]
text = "स्वामी"
title = { addresses = "given", note = "Swami" }

[[word]]
text = "गुरु"
title = { addresses = "given", note = "Guru" }

[[word]]
text = "बाबा"
title = { addresses = "given", note = "Baba" }

[[word]]
text = "संत"
title = { addresses = "given", note = "Sant" }

# #343: Bengali renunciate titles. Same two criteria as the Latin
# and Devanagari sets (rules/H Background), and no NEW Latin
# transliterations -- srila has none; baba/guru/swami already ship
# above. শ্রীল is the Vaishnava honorific (শ্রীল প্রভুপাদ);
# unprefixed শ্রী is civil and sits in TITLES below.
[[word]]
text = "স্বামী"
title = { addresses = "given", note = "Swami" }

[[word]]
text = "শ্রীল"
title = { addresses = "given", note = "Srila" }

[[word]]
text = "গুরু"
title = { addresses = "given", note = "Guru" }

[[word]]
text = "বাবা"
title = { addresses = "given", note = "Baba" }

